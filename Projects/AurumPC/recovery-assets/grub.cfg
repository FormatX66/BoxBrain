set default=0
set timeout=0

source /boot/grub/config.cfg

menuentry "Aurum Hopper one-shot seed recovery" {
    linux @KERNEL_LIVE@ boot=live components quiet splash findiso=${iso_path} noeject nopersistence noswap noautomount console=tty0 systemd.unit=aurum-hopper-seed-recovery.target aurum_hopper_recovery=1
    initrd @INITRD_LIVE@
}
