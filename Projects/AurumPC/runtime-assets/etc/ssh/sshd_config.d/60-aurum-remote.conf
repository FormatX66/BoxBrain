# Aurum Hopper restricted remote transport. No interactive shell is permitted.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers aurum-remote

Match User aurum-remote
    AuthorizedKeysFile /var/lib/aurum/remote/.ssh/authorized_keys
    AuthenticationMethods publickey
    ForceCommand /usr/bin/python3 /opt/aurum/aurum_remote_command.py
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:5900 127.0.0.1:6080 127.0.0.1:8765
    GatewayPorts no
