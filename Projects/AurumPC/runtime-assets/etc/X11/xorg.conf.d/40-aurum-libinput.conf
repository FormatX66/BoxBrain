Section "ServerFlags"
    Option "DontVTSwitch" "false"
    Option "DontZap" "false"
EndSection

Section "InputClass"
    Identifier "Aurum libinput keyboard"
    MatchIsKeyboard "on"
    Driver "libinput"
EndSection

Section "InputClass"
    Identifier "Aurum libinput pointer"
    MatchIsPointer "on"
    Driver "libinput"
    Option "AccelProfile" "adaptive"
EndSection

Section "InputClass"
    Identifier "Aurum libinput touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "DisableWhileTyping" "on"
    Option "NaturalScrolling" "false"
EndSection
