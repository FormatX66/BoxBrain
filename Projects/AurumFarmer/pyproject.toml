[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurum-farmer"
version = "0.1.0"
description = "Aurum durable execution and shared Future Branch decision engine"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["aurum_farmer*"]
