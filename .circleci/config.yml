version: 2.1

jobs:
  repository-integrity:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Validate repository structure and links
          command: python Admin/validate_repository.py
      - run:
          name: Test repository validator and Aurum canonical state sync
          command: python -m unittest Admin.tests.test_validate_repository Admin.tests.test_sync_aurum_release_status Admin.tests.test_sync_aurum_future_branch_evidence Admin.tests.test_sync_aurum_fallback_evidence Admin.tests.test_materialize_aurum_next_interaction Admin.tests.test_reconstruct_aurum_state

  codelation:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    steps:
      - checkout
      - run:
          name: Run Codelation seed suite
          command: python -m unittest discover -s Projects/Codelation/tests -v

  backend:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install controller test dependencies
          command: |
            cd controller
            python -m pip install -e ".[dev]"
      - run:
          name: Run controller tests
          command: |
            cd controller
            python -m pytest -q
      - run:
          name: Run Kali Pi edge-agent tests
          command: |
            cd edge/kali-pi-agent
            python -m unittest discover -s tests -v

  future-branch-projects:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    steps:
      - checkout
      - run:
          name: Test StateWeave branch records
          command: python -m unittest discover -s Projects/StateWeave/tests -v
      - run:
          name: Test Adaptive Kernel branch proposals
          command: python -m unittest discover -s Projects/AdaptiveKernel/tests -v
      - run:
          name: Test combined StateWeave and kernel bridge
          command: python -m unittest discover -s Projects/StateWeaveKernel/tests -v
      - run:
          name: Test all Aurum Future Branch and parallel experiments
          command: |
            cd Projects/Aurum/Experiments
            python -m unittest discover -p 'test_*.py' -v
      - run:
          name: Test seed recovery branch manifest
          command: python -m unittest discover -s installer/tests -p 'test_future_branch_recovery.py' -v
      - run:
          name: Test Tiny Seed physical preflight states
          command: |
            cd Projects/Aurum/Germ
            python -m unittest test_physical_handoff_preflight -v

  germ-safety:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Require recovery crypto verifier
          command: openssl version
      - run:
          name: Compile protected Germ
          command: python -m py_compile Projects/Aurum/Germ/*.py
      - run:
          name: Run protected Germ safety contract
          command: |
            cd Projects/Aurum/Germ
            python -m unittest -v \
              test_reseed \
              test_guardian \
              test_proof \
              test_rollback_drill \
              test_recovery_control \
              test_recovery_poller \
              test_physical_handoff_preflight \
              test_tinyseed
      - run:
          name: Validate current genetics manifest
          command: python -c "import sys; from pathlib import Path; sys.path.insert(0, str(Path('Projects/Aurum/Germ').resolve())); import reseed; verified = reseed.verify_candidate(Path('.').resolve()); print('AURUM_GERM_CONTRACT_OK commit=' + verified['commit'])"

workflows:
  boxbrain-circleci:
    jobs:
      - repository-integrity
      - codelation
      - backend
      - future-branch-projects
      - germ-safety
