<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurum Proof View</title>
<style>
:root{color-scheme:dark;background:#080b10;color:#eef3f8;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--gold:#e0bd62;--green:#62d990;--red:#ff7b7b;--blue:#82b9ff;--muted:#91a5b9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#1b2738 0,transparent 38%),#080b10}.wrap{width:min(1180px,94vw);margin:0 auto;padding:28px 0 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:14px}.orb{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff7cf 0,#d8b85b 22%,#6d5120 55%,#17140c 76%);box-shadow:0 0 34px #d9b65a55}.brand h1{font-size:26px;margin:0;letter-spacing:.08em}.brand small{display:block;color:var(--muted);margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-block;text-decoration:none;border-radius:10px;padding:9px 12px;background:#1d2938;color:#dce7f2;border:1px solid #35465d;font-weight:700;font-size:13px}.btn.gold{background:var(--gold);color:#171309;border-color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.metric,.card{background:#101720df;border:1px solid #253246;border-radius:16px;box-shadow:0 18px 60px #0006}.metric{padding:15px}.metric b{display:block;font-size:25px;margin-top:5px}.metric span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.card{padding:18px;margin-bottom:14px}.card h2{font-size:18px;margin:0 0 10px}.state{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800;background:#183425;color:#98edb8}.state.fail{background:#3a1e24;color:#ffaaaa}.state.boundary{background:#352f1b;color:#f0d885}.dot{width:8px;height:8px;border-radius:50%;background:currentColor}.muted{color:var(--muted)}.mono{font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all}.kv{display:grid;grid-template-columns:185px 1fr;gap:7px 12px;margin-top:12px}.kv div:nth-child(odd){color:var(--muted);font-size:12px}.gen{border-top:1px solid #253246;padding:16px 0}.gen:first-of-type{border-top:0}.genhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.genhead h3{margin:0;font-size:16px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}.mini{background:#0b1118;border:1px solid #202e40;border-radius:10px;padding:10px}.mini span{display:block;color:var(--muted);font-size:11px}.mini b{display:block;margin-top:3px}.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.flag{font-size:11px;padding:3px 7px;border-radius:999px;background:#172334;color:#b7c9da}.flag.no{background:#173126;color:#90dfad}.warn{background:#34291a;border:1px solid #5d4928;color:#f2d38a;border-radius:12px;padding:12px;margin-top:12px}.error{background:#361d23;border:1px solid #5e2b35;color:#ffb4be;border-radius:12px;padding:12px}.code{background:#080d13;border:1px solid #26364b;border-radius:11px;padding:12px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto;white-space:pre-wrap;word-break:break-all}.footer{font-size:12px;color:#75899e;margin-top:16px}.loading{padding:30px;text-align:center;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.wrap{padding-top:18px}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div class="brand"><div class="orb"></div><div><h1>AURUM PROOF VIEW</h1><small>Evidence, not claims</small></div></div><div class="actions"><a class="btn" href="/portal.html">Portal</a><a class="btn" target="_blank" rel="noopener" href="https://github.com/FormatX66/BoxBrain/tree/aurum/capacity-mesh-v0">Git branch</a><a class="btn gold" target="_blank" rel="noopener" href="https://github.com/FormatX66/BoxBrain/actions/workflows/aurum-autobuild.yml">Actions</a></div></div>
<div id="app"><div class="card loading">Loading durable Aurum evidence from Git…</div></div>
</main>
<script>
const STATE='https://raw.githubusercontent.com/FormatX66/BoxBrain/aurum/capacity-mesh-v0/Projects/Codelation/autobuild/native_chain_state.json';
const app=document.querySelector('#app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=v=>v?`${esc(String(v).slice(0,12))}…`:'—';
const boolFlag=(name,value)=>`<span class="flag ${value?'':'no'}">${esc(name)}: ${value?'YES':'NO'}</span>`;
function renderGeneration(g){
 const ok=g.state==='verified';
 const reuse=(g.reusable_native_capabilities_after_build||[]).join(', ')||'none';
 return `<div class="gen"><div class="genhead"><h3>Generation ${esc(g.generation)} · ${esc(g.gap)}</h3><span class="state ${ok?'':'fail'}"><span class="dot"></span>${esc((g.state||'unknown').toUpperCase())}</span></div>
 <div class="three"><div class="mini"><span>Candidates evaluated</span><b>${Number(g.candidates_evaluated||0).toLocaleString()}</b></div><div class="mini"><span>Synthesis cost</span><b>${esc(g.synthesis_cost??'—')}</b></div><div class="mini"><span>Invocation output</span><b>${esc(g.invocation_output??'—')}</b></div></div>
 <div class="kv"><div>Artifact identity</div><div class="mono" title="${esc(g.artifact_identity)}">${short(g.artifact_identity)}</div><div>Local variant identity</div><div class="mono" title="${esc(g.local_variant_identity)}">${short(g.local_variant_identity)}</div><div>Carrier SHA-256</div><div class="mono" title="${esc(g.carrier_sha256)}">${short(g.carrier_sha256)}</div><div>Carrier Field ID</div><div class="mono" title="${esc(g.carrier_field_id)}">${short(g.carrier_field_id)}</div><div>Verification identity</div><div class="mono" title="${esc(g.verification_identity)}">${short(g.verification_identity)}</div><div>Synthesis proof</div><div class="mono" title="${esc(g.synthesis_proof_identity)}">${short(g.synthesis_proof_identity)}</div><div>Next gap</div><div>${esc(g.next_gap||'—')}</div><div>Reusable capabilities after build</div><div>${esc(reuse)}</div></div>
 <div class="flags">${boolFlag('model reasoning',g.model_reasoning_used)}${boolFlag('source generation',g.source_generation_used)}${boolFlag('filesystem build',g.filesystem_build_used)}${boolFlag('subprocess test',g.subprocess_test_used)}${boolFlag('promotion',g.promotion_performed)}</div></div>`;
}
function render(s){
 const gens=s.generations||[];const verified=gens.filter(g=>g.state==='verified').length;const candidates=gens.reduce((n,g)=>n+(Number(g.candidates_evaluated)||0),0)+(Number(s.failed_attempt?.synthesis?.candidates_evaluated)||0);const trusted=!!s.workflow_verification?.trusted_for_continuation;
 let failed='';if(s.failed_attempt){const f=s.failed_attempt;failed=`<div class="card"><h2>Current falsification boundary</h2><span class="state boundary"><span class="dot"></span>NOT VERIFIED</span><div class="kv"><div>Gap</div><div>${esc(f.gap)}</div><div>Reason</div><div>${esc(s.blocked_reason||'unknown')}</div><div>Candidates attempted</div><div>${Number(f.synthesis?.candidates_evaluated||0).toLocaleString()}</div><div>Signatures retained</div><div>${Number(f.synthesis?.signatures_retained||0).toLocaleString()}</div><div>Proof identity</div><div class="mono">${esc(f.synthesis?.proof_identity||'—')}</div></div><div class="warn">Aurum did not claim success here. This boundary is retained as evidence of what the current builder cannot yet derive.</div></div>`}
 app.innerHTML=`<div class="grid"><div class="metric"><span>Verified capabilities</span><b>${verified}</b></div><div class="metric"><span>Candidate evaluations</span><b>${candidates.toLocaleString()}</b></div><div class="metric"><span>Workflow trust</span><b>${trusted?'PASS':'FAIL'}</b></div><div class="metric"><span>Timer dependency</span><b>${s.timer_dependency?'YES':'NO'}</b></div></div>
 <div class="card"><h2>Current proof state</h2><span class="state ${trusted?'':'fail'}"><span class="dot"></span>${trusted?'TRUSTED CHECKPOINT':'UNTRUSTED CHECKPOINT'}</span><div class="kv"><div>Schema</div><div>${esc(s.schema)}</div><div>Synthesis revision</div><div>${esc(s.synthesis_revision)}</div><div>Latest completed gap</div><div>${esc(s.latest_completed_gap||'—')}</div><div>Next gap</div><div>${esc(s.next_gap||'—')}</div><div>Blocked reason</div><div>${esc(s.blocked_reason||'none')}</div><div>Reasoning required</div><div>${s.reasoning_required?'yes':'no'}</div><div>Verification outcome</div><div>${esc(s.workflow_verification?.outcome||'unknown')}</div></div></div>
 <div class="card"><h2>Verified growth chain</h2>${gens.map(renderGeneration).join('')||'<div class="muted">No verified generations.</div>'}</div>${failed}
 <div class="card"><h2>Independent reproduction</h2><div class="code">git clone -b aurum/capacity-mesh-v0 https://github.com/FormatX66/BoxBrain.git\ncd BoxBrain\npython Projects/Codelation/run_native_autonomous_chain.py\npython -m unittest Projects.Codelation.tests.test_native_program_synthesis Projects.Codelation.tests.test_field_native_vm Projects.Codelation.tests.test_field_native_batch Projects.Codelation.tests.test_field_native_cache -v</div><div class="footer">This view proves only what the referenced Git evidence and reproducible tests prove. It does not claim consciousness, AGI, physical I/O operation, or promotion where those have not been independently demonstrated.</div></div>`;
}
fetch(`${STATE}?t=${Date.now()}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}).then(render).catch(e=>{app.innerHTML=`<div class="card error"><b>Proof data unavailable.</b><br>${esc(e.message)}<br><br><a class="btn" href="${STATE}" target="_blank" rel="noopener">Open raw evidence</a></div>`});
</script></body></html>
