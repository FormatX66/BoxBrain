<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c0f16">
<title>Aurum Voice Status</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0c0f16;color:#eef1f7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 18% -5%,#312d7438 0,transparent 34%),#0c0f16}.wrap{width:min(920px,94vw);margin:0 auto;padding:24px 0 60px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#9299aa;font-weight:800;margin:0 0 5px}h1{margin:0;font-size:clamp(26px,5vw,42px);letter-spacing:-.04em}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{color:#fff;text-decoration:none;border:1px solid #363c4c;background:#171b25;border-radius:11px;padding:9px 12px;font-size:12px;font-weight:750}.status{border:1px solid #2c3140;border-radius:18px;background:linear-gradient(180deg,#171a24e8,#12151ee8);padding:16px}.status-line{display:flex;gap:9px;align-items:center;font-weight:800;font-size:13px;margin-bottom:12px}.dot{width:9px;height:9px;border-radius:50%;background:#6c63ff;box-shadow:0 0 16px #6c63ffaa}pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12px/1.58 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#d8dced}.note{margin-top:12px;color:#8f9bad;font-size:10.5px;line-height:1.5}.error{color:#ff9da6}
</style>
</head>
<body>
<main class="wrap">
  <div class="head"><div><p class="eyebrow">Aurum / BoxBrain</p><h1>Voice Status</h1></div><div class="links"><a href="../dashboard.html">Dashboard</a><a href="../voice-status.json">JSON</a><a href="https://github.com/FormatX66/BoxBrain/blob/main/AURUM_VOICE_STATUS.md">Repository fallback</a></div></div>
  <section class="status"><div class="status-line"><span class="dot"></span><span id="state">Loading the shared status mirror…</span></div><pre id="content">AURUM VOICE STATUS</pre><div class="note">Voice cue: say “Read Aurum Voice Status.” The answer should use this evidence without upgrading a stage unless its proof is present.</div></section>
</main>
<script>
(async()=>{const state=document.querySelector('#state'),content=document.querySelector('#content');try{const response=await fetch('../voice-status.txt',{cache:'no-store'});if(!response.ok)throw new Error(`${response.status} ${response.statusText}`);content.textContent=await response.text();state.textContent='Repository status mirror loaded';}catch(error){state.textContent='Status mirror unavailable';state.classList.add('error');content.textContent=`AURUM VOICE STATUS\nUnable to load the static mirror: ${error.message}`;}})();
</script>
</body>
</html>
