name: Aurum Pi3 smsc95xx Nonbinding Candidate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aurum-pi3-smsc95xx-nonbinding-candidate.yml'
      - 'Projects/AdaptiveKernel/pi3_smsc95xx_candidate_synth.py'
      - 'Projects/AdaptiveKernel/pi3_smsc95xx_candidate_differential.py'
      - 'Projects/AdaptiveKernel/pi3_smsc95xx_candidate_cloud.py'
      - 'Projects/AdaptiveKernel/tests/test_pi3_smsc95xx_candidate_synth.py'
      - 'Projects/AdaptiveKernel/tests/test_pi3_smsc95xx_candidate_differential.py'
      - 'Projects/AdaptiveKernel/tests/test_pi3_smsc95xx_candidate_cloud.py'
      - 'Projects/AdaptiveKernel/results/pi3-smsc95xx-functional-model-latest.json'
      - 'Projects/AdaptiveKernel/references/pi3_hardware/qpu-routing-model-32924126448.json'

permissions:
  contents: write

concurrency:
  group: aurum-pi3-smsc95xx-nonbinding-candidate
  cancel-in-progress: false

jobs:
  verify-nonbinding-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Run host synthesis and differential tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            Projects.AdaptiveKernel.tests.test_pi3_smsc95xx_candidate_synth \
            Projects.AdaptiveKernel.tests.test_pi3_smsc95xx_candidate_differential \
            Projects.AdaptiveKernel.tests.test_pi3_smsc95xx_candidate_cloud

      - name: Synthesize and host-verify candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-evidence
          python -m Projects.AdaptiveKernel.pi3_smsc95xx_candidate_synth \
            --model Projects/AdaptiveKernel/results/pi3-smsc95xx-functional-model-latest.json \
            --source-output candidate-evidence/pi3-smsc95xx-nonbinding-candidate.c \
            --receipt-output candidate-evidence/pi3-smsc95xx-nonbinding-candidate.json

      - name: Differentially verify candidate against sealed model
        shell: bash
        run: |
          set -euo pipefail
          python -m Projects.AdaptiveKernel.pi3_smsc95xx_candidate_differential \
            --model Projects/AdaptiveKernel/results/pi3-smsc95xx-functional-model-latest.json \
            --output candidate-evidence/pi3-smsc95xx-candidate-differential.json

      - name: Cross-compile deterministic candidate for AArch64
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross
          aarch64-linux-gnu-gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -c candidate-evidence/pi3-smsc95xx-nonbinding-candidate.c \
            -o candidate-evidence/pi3-smsc95xx-nonbinding-candidate.aarch64.o
          aarch64-linux-gnu-readelf -h \
            candidate-evidence/pi3-smsc95xx-nonbinding-candidate.aarch64.o \
            | tee candidate-evidence/arm64-readelf.txt
          aarch64-linux-gnu-nm -u \
            candidate-evidence/pi3-smsc95xx-nonbinding-candidate.aarch64.o \
            | tee candidate-evidence/arm64-undefined.txt
          grep -F 'Type:                              REL' candidate-evidence/arm64-readelf.txt
          grep -F 'Machine:                           AArch64' candidate-evidence/arm64-readelf.txt
          test ! -s candidate-evidence/arm64-undefined.txt

      - name: Seal complete cloud candidate verification
        shell: bash
        run: |
          set -euo pipefail
          python -m Projects.AdaptiveKernel.pi3_smsc95xx_candidate_cloud \
            --candidate candidate-evidence/pi3-smsc95xx-nonbinding-candidate.json \
            --differential candidate-evidence/pi3-smsc95xx-candidate-differential.json \
            --qpu Projects/AdaptiveKernel/references/pi3_hardware/qpu-routing-model-32924126448.json \
            --source candidate-evidence/pi3-smsc95xx-nonbinding-candidate.c \
            --arm64-object candidate-evidence/pi3-smsc95xx-nonbinding-candidate.aarch64.o \
            --arm64-readelf candidate-evidence/arm64-readelf.txt \
            --arm64-undefined candidate-evidence/arm64-undefined.txt \
            --output candidate-evidence/pi3-smsc95xx-candidate-cloud.json

      - name: Verify zero-authority result and publish summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from Projects.AdaptiveKernel.pi3_smsc95xx_candidate_cloud import _verify_sealed

          receipt = json.loads(Path('candidate-evidence/pi3-smsc95xx-candidate-cloud.json').read_text())
          if receipt.get('state') != 'verified-cloud-arm64-nonbinding-candidate':
              raise SystemExit('cloud candidate verification did not pass')
          if not _verify_sealed(receipt):
              raise SystemExit('cloud candidate receipt seal failed')
          if receipt['verification']['candidate_vs_model_agreements'] != 18:
              raise SystemExit('candidate/model differential matrix is incomplete')
          if receipt['qpu']['used'] or receipt['qpu']['hardware_submission_performed']:
              raise SystemExit('bounded candidate lane unexpectedly used QPU hardware')
          invariants = receipt['invariants']
          if invariants['live_pi_contacted'] or invariants['kernel_module_built']:
              raise SystemExit('candidate lane crossed its cloud-only boundary')
          summary = [
              '# Pi3 smsc95xx Nonbinding Candidate',
              '',
              f"- State: {receipt['state']}",
              '- Candidate/model agreements: 18/18',
              '- AArch64 cross-compile: passed',
              '- Undefined external symbols: 0',
              '- Kernel module / device binding: none',
              '- Live Pi contacted: false',
              '- QPU hardware used: false',
              '- Mutation or promotion authority: false',
              '',
              receipt['strongest_claim'],
          ]
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as handle:
              handle.write('\n'.join(summary) + '\n')
          PY

      - name: Publish sealed candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aurum-pi3-smsc95xx-nonbinding-candidate-${{ github.run_id }}
          path: candidate-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Persist candidate source and receipts into durable lineage
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Projects/AdaptiveKernel/driver_candidates/generated
          cp candidate-evidence/pi3-smsc95xx-nonbinding-candidate.c \
            Projects/AdaptiveKernel/driver_candidates/generated/pi3-smsc95xx-nonbinding-candidate.c
          cp candidate-evidence/pi3-smsc95xx-nonbinding-candidate.json \
            Projects/AdaptiveKernel/results/pi3-smsc95xx-nonbinding-candidate-latest.json
          cp candidate-evidence/pi3-smsc95xx-candidate-differential.json \
            Projects/AdaptiveKernel/results/pi3-smsc95xx-candidate-differential-latest.json
          cp candidate-evidence/pi3-smsc95xx-candidate-cloud.json \
            Projects/AdaptiveKernel/results/pi3-smsc95xx-candidate-cloud-latest.json
          git config user.name 'aurum-pi3-smsc95xx-candidate[bot]'
          git config user.email 'aurum-pi3-smsc95xx-candidate@users.noreply.github.com'
          git add \
            Projects/AdaptiveKernel/driver_candidates/generated/pi3-smsc95xx-nonbinding-candidate.c \
            Projects/AdaptiveKernel/results/pi3-smsc95xx-nonbinding-candidate-latest.json \
            Projects/AdaptiveKernel/results/pi3-smsc95xx-candidate-differential-latest.json \
            Projects/AdaptiveKernel/results/pi3-smsc95xx-candidate-cloud-latest.json
          if git diff --cached --quiet; then
            echo 'AURUM_PI3_SMSC95XX_CANDIDATE_RECEIPT unchanged=true'
            exit 0
          fi
          git commit -m 'Record Pi3 smsc95xx nonbinding candidate [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'AURUM_PI3_SMSC95XX_CANDIDATE_RECEIPT persisted=true'
