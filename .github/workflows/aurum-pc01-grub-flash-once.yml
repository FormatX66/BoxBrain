name: Aurum PC-01 One-Time Verified GRUB Flash

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aurum-pc01-grub-flash-once.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: aurum-pc01-one-time-grub-flash
  cancel-in-progress: false

jobs:
  flash:
    name: Flash exact authorized SanDisk with verified GRUB ISO and verify raw readback
    runs-on: [self-hosted, Windows, X64, aurum-elevated]
    timeout-minutes: 60
    steps:
      - name: Preflight exact target, flash verified GRUB ISO, verify, publish receipt
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          AURUM_SEED_RUN: '32276897305'
          AURUM_ARTIFACT_ID: '9374953315'
          AURUM_IMAGE: 'Aurum-PC-v0.01-amd64.iso'
          AURUM_CHECKSUM_FILE: 'Aurum-PC-v0.01-amd64.iso.sha256'
          AURUM_EXPECTED_USB_SERIAL: '4C530001061117108440'
          AURUM_EXPECTED_USB_SIZE: '15664676864'
          AURUM_FLASH_AUTHORIZATION: 'bruce-explicit-2026-08-19T18:18-04:00-grub-iso'
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $repo = $env:GITHUB_REPOSITORY
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          function Publish-Receipt([string]$State, [hashtable]$Data) {
            $path = "Projects/AurumBridge/results/pc01-grub-flash-$env:GITHUB_RUN_ID-attempt-$env:GITHUB_RUN_ATTEMPT.json"
            $receipt = [ordered]@{
              schema = 'aurum-pc01-grub-flash-receipt-v1'
              state = $State
              github_workflow_run = [long]$env:GITHUB_RUN_ID
              github_run_attempt = [int]$env:GITHUB_RUN_ATTEMPT
              host = $env:COMPUTERNAME
              runner_name = $env:RUNNER_NAME
              observed_at = (Get-Date).ToUniversalTime().ToString('o')
              data = $Data
            }
            $json = $receipt | ConvertTo-Json -Depth 8
            $body = @{
              message = "Record Aurum PC-01 GRUB flash receipt state=$State [skip ci]"
              content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))
              branch = 'main'
            } | ConvertTo-Json -Depth 4
            Invoke-RestMethod -Method Put -Headers $headers -Uri "https://api.github.com/repos/$repo/contents/$path" -Body $body -ContentType 'application/json' | Out-Null
            Write-Host "AURUM_GRUB_FLASH_RECEIPT_PUBLISHED state=$State path=$path"
          }

          $principal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            Publish-Receipt 'WAITING' @{ reason = 'runner-not-elevated' }
            exit 0
          }

          $expectedSize = [int64]$env:AURUM_EXPECTED_USB_SIZE
          $targets = @(Get-Disk | Where-Object {
            $_.BusType -eq 'USB' -and
            -not $_.IsBoot -and
            -not $_.IsSystem -and
            -not $_.IsReadOnly -and
            ([string]$_.SerialNumber).Trim() -eq $env:AURUM_EXPECTED_USB_SERIAL -and
            [int64]$_.Size -eq $expectedSize
          })
          if ($targets.Count -ne 1) {
            Publish-Receipt 'WAITING' @{ reason = 'exact-authorized-usb-not-unique'; count = $targets.Count }
            Write-Host "AURUM_GRUB_FLASH_WAITING reason=exact-authorized-usb-not-unique count=$($targets.Count)"
            exit 0
          }

          $disk = $targets[0]
          $diskNumber = [int]$disk.Number
          $serial = ([string]$disk.SerialNumber).Trim()
          $physicalPath = "\\.\PhysicalDrive$diskNumber"
          Write-Host "AURUM_GRUB_FLASH_TARGET disk=$diskNumber model=$($disk.FriendlyName) serial=$serial size=$($disk.Size)"

          $actual = $null
          try {
            $cacheRoot = Join-Path $env:ProgramData "Aurum\cache\pc-seed-$env:AURUM_SEED_RUN-$env:AURUM_ARTIFACT_ID"
            $expanded = Join-Path $cacheRoot 'expanded'
            New-Item -ItemType Directory -Path $expanded -Force | Out-Null
            $image = Get-ChildItem -LiteralPath $expanded -Recurse -File -Filter $env:AURUM_IMAGE -ErrorAction SilentlyContinue | Select-Object -First 1
            $checksumFile = Get-ChildItem -LiteralPath $expanded -Recurse -File -Filter $env:AURUM_CHECKSUM_FILE -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $image -or -not $checksumFile) {
              $zip = Join-Path $cacheRoot 'seed.zip'
              if (-not (Test-Path -LiteralPath $zip)) {
                Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/$repo/actions/artifacts/$env:AURUM_ARTIFACT_ID/zip" -OutFile $zip
              }
              Expand-Archive -LiteralPath $zip -DestinationPath $expanded -Force
              $image = Get-ChildItem -LiteralPath $expanded -Recurse -File -Filter $env:AURUM_IMAGE | Select-Object -First 1
              $checksumFile = Get-ChildItem -LiteralPath $expanded -Recurse -File -Filter $env:AURUM_CHECKSUM_FILE | Select-Object -First 1
            }
            if (-not $image) { throw 'AURUM_GRUB_FLASH_INTEGRITY_FAILURE reason=image-missing' }
            if (-not $checksumFile) { throw 'AURUM_GRUB_FLASH_INTEGRITY_FAILURE reason=checksum-file-missing' }

            $checksumText = Get-Content -LiteralPath $checksumFile.FullName -Raw
            $match = [regex]::Match($checksumText, '(?i)\b[0-9a-f]{64}\b')
            if (-not $match.Success) { throw 'AURUM_GRUB_FLASH_INTEGRITY_FAILURE reason=checksum-unparseable' }
            $expectedImageSha = $match.Value.ToLowerInvariant()
            $actual = (Get-FileHash -LiteralPath $image.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expectedImageSha) {
              throw "AURUM_GRUB_FLASH_INTEGRITY_FAILURE reason=image-sha-mismatch expected=$expectedImageSha actual=$actual"
            }

            # Re-prove the exact target immediately before destructive clean.
            $live = Get-Disk -Number $diskNumber -ErrorAction Stop
            if ($live.BusType -ne 'USB' -or [bool]$live.IsBoot -or [bool]$live.IsSystem -or [bool]$live.IsReadOnly -or ([string]$live.SerialNumber).Trim() -ne $serial -or [int64]$live.Size -ne $expectedSize) {
              throw 'AURUM_GRUB_FLASH_PREP_FAILURE reason=target-identity-changed-before-clean'
            }

            $driveLetters = @(Get-Partition -DiskNumber $diskNumber -ErrorAction SilentlyContinue | Where-Object { $_.DriveLetter } | ForEach-Object { [string]$_.DriveLetter })
            foreach ($letter in $driveLetters) {
              & mountvol "$letter`:" /P | Out-Null
            }

            $dp = Join-Path $env:RUNNER_TEMP "aurum-grub-flash-clean-$env:GITHUB_RUN_ID.txt"
            @("select disk $diskNumber", 'clean') | Set-Content -LiteralPath $dp -Encoding ASCII
            try {
              $out = @(& diskpart.exe /s $dp 2>&1)
              $exit = $LASTEXITCODE
            } finally {
              Remove-Item -LiteralPath $dp -Force -ErrorAction SilentlyContinue
            }
            if ($exit -ne 0) { throw "AURUM_GRUB_FLASH_PREP_FAILURE reason=diskpart-clean-failed exit=$exit output=$($out -join ' | ')" }
            if (Get-Command Update-HostStorageCache -ErrorAction SilentlyContinue) { Update-HostStorageCache }
            Start-Sleep -Seconds 2

            $live = Get-Disk -Number $diskNumber -ErrorAction Stop
            $parts = @(Get-Partition -DiskNumber $diskNumber -ErrorAction SilentlyContinue)
            if ($live.BusType -ne 'USB' -or [bool]$live.IsBoot -or [bool]$live.IsSystem -or ([string]$live.SerialNumber).Trim() -ne $serial -or [int64]$live.Size -ne $expectedSize -or $parts.Count -ne 0) {
              throw "AURUM_GRUB_FLASH_PREP_FAILURE reason=clean-not-proven partitions=$($parts.Count)"
            }

            $source = [System.IO.File]::Open($image.FullName,[System.IO.FileMode]::Open,[System.IO.FileAccess]::Read,[System.IO.FileShare]::Read)
            try {
              $target = New-Object System.IO.FileStream($physicalPath,[System.IO.FileMode]::Open,[System.IO.FileAccess]::ReadWrite,[System.IO.FileShare]::ReadWrite,4194304,[System.IO.FileOptions]::WriteThrough)
              try {
                $buffer = New-Object byte[] 4194304
                $written = [int64]0
                while (($read = $source.Read($buffer,0,$buffer.Length)) -gt 0) {
                  $target.Write($buffer,0,$read)
                  $written += $read
                  if (($written % 268435456) -lt $buffer.Length) { Write-Host "AURUM_GRUB_FLASH_PROGRESS bytes=$written total=$($image.Length)" }
                }
                $target.Flush($true)
              } finally { $target.Dispose() }
            } finally { $source.Dispose() }

            $reader = New-Object System.IO.FileStream($physicalPath,[System.IO.FileMode]::Open,[System.IO.FileAccess]::Read,[System.IO.FileShare]::ReadWrite,4194304,[System.IO.FileOptions]::SequentialScan)
            $hasher = [System.Security.Cryptography.IncrementalHash]::CreateHash([System.Security.Cryptography.HashAlgorithmName]::SHA256)
            try {
              $buffer = New-Object byte[] 4194304
              $remaining = [int64]$image.Length
              while ($remaining -gt 0) {
                $want = [int][Math]::Min([int64]$buffer.Length,$remaining)
                $read = $reader.Read($buffer,0,$want)
                if ($read -le 0) { throw 'AURUM_GRUB_FLASH_INTEGRITY_FAILURE reason=short-readback' }
                $hasher.AppendData($buffer,0,$read)
                $remaining -= $read
              }
              $readback = ([BitConverter]::ToString($hasher.GetHashAndReset())).Replace('-','').ToLowerInvariant()
            } finally { $hasher.Dispose(); $reader.Dispose() }
            if ($readback -ne $actual) {
              throw "AURUM_GRUB_FLASH_INTEGRITY_FAILURE reason=raw-readback-hash-mismatch expected=$actual actual=$readback"
            }

            $data = @{
              authorization = $env:AURUM_FLASH_AUTHORIZATION
              seed_run = [long]$env:AURUM_SEED_RUN
              artifact_id = [long]$env:AURUM_ARTIFACT_ID
              image = $env:AURUM_IMAGE
              image_sha256 = $actual
              disk_number = $diskNumber
              disk_model = [string]$disk.FriendlyName
              disk_serial = $serial
              disk_size = $expectedSize
              flashed_at = (Get-Date).ToUniversalTime().ToString('o')
              raw_readback_verified = $true
              boot_path = 'grub-iso-hybrid'
            }
            Publish-Receipt 'GRUB_FLASH_OK' $data
            Write-Host "AURUM_PC01_GRUB_USB_FLASH_OK disk=$diskNumber serial=$serial image_sha256=$actual raw_readback_verified=true"
          } catch {
            $msg = $_.Exception.Message
            $state = if ($msg -match '^AURUM_GRUB_FLASH_INTEGRITY_FAILURE') { 'INTEGRITY_FAILURE' } elseif ($msg -match '^AURUM_GRUB_FLASH_PREP_FAILURE') { 'PREP_FAILURE' } else { 'GRUB_FLASH_FAILURE' }
            Publish-Receipt $state @{ reason=$msg; disk_number=$diskNumber; disk_model=[string]$disk.FriendlyName; disk_serial=$serial; image_sha256=$actual }
            throw
          }
