name: Aurum Chat Tree Plugin

on:
  push:
    branches:
      - main
      - 'codex/chat-tree-plugin-*'
    paths:
      - 'Projects/Aurum/ChatTreePlugin/**'
      - 'Projects/Aurum/Experiments/chat_tree_bridge.py'
      - 'Projects/Aurum/Experiments/chat_process_tree.py'
      - 'Projects/Aurum/Experiments/test_chat_tree_consolidation_bridge.py'
      - 'Projects/Aurum/Experiments/chat_topic_router.py'
      - 'Projects/Aurum/Experiments/shared_state_bus.py'
      - 'Projects/Aurum/Experiments/human_branch.py'
      - 'Projects/Aurum/Experiments/operational_branch.py'
      - 'Projects/Aurum/Experiments/test_chat_tree_future_branch_consumers.py'
      - 'Projects/Aurum/chat-process-tree.json'
      - '.github/workflows/aurum-chat-tree-plugin.yml'
  pull_request:
    paths:
      - 'Projects/Aurum/ChatTreePlugin/**'
      - 'Projects/Aurum/Experiments/chat_tree_bridge.py'
      - 'Projects/Aurum/Experiments/chat_process_tree.py'
      - 'Projects/Aurum/Experiments/test_chat_tree_consolidation_bridge.py'
      - 'Projects/Aurum/Experiments/chat_topic_router.py'
      - 'Projects/Aurum/Experiments/shared_state_bus.py'
      - 'Projects/Aurum/Experiments/human_branch.py'
      - 'Projects/Aurum/Experiments/operational_branch.py'
      - 'Projects/Aurum/Experiments/test_chat_tree_future_branch_consumers.py'
      - 'Projects/Aurum/chat-process-tree.json'
      - '.github/workflows/aurum-chat-tree-plugin.yml'

jobs:
  plugin-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plugin dependencies
        working-directory: Projects/Aurum/ChatTreePlugin
        run: npm install --no-audit --no-fund
      - name: Syntax check
        working-directory: Projects/Aurum/ChatTreePlugin
        run: npm run check
      - name: Verify canonical Chat Tree bridge
        run: |
          printf '%s\n' '{"command":"get_tree","focus_id":"chat-tree"}' | python Projects/Aurum/Experiments/chat_tree_bridge.py > /tmp/tree.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/tree.json', encoding='utf-8'))
          assert p['ok'] is True
          assert p['tree']['schema'] == 'aurum-chat-process-tree-v1'
          PY
      - name: Verify consolidation contract
        working-directory: Projects/Aurum/Experiments
        run: python -m unittest -v test_chat_tree_consolidation_bridge.py
      - name: Verify Future Branch session projections
        run: |
          printf '%s\n' '{"command":"project_human_futures","verified_state":"READY_TO_BOOT","lkg":"slot-a","likely_next":[{"state":"physical-hopper-boot-success","probability":0.7},{"state":"boot-mixed-result","probability":0.25}],"blockers":["physical-hopper-boot-proof"]}' | python Projects/Aurum/Experiments/chat_tree_bridge.py > /tmp/human-futures.json
          printf '%s\n' '{"command":"plan_operational_futures","verified_state":"ci-green","candidates":[{"name":"inspect-ci-logs","domain":"ci-build","probability":0.8,"impact":0.8,"human_time_saved":2,"preparation_leverage":1,"cost":0.2,"read_only":true},{"name":"publish-site","domain":"website-deployment","probability":0.6,"impact":0.8,"human_time_saved":2,"preparation_leverage":0.8,"cost":0.4,"external_side_effect":true,"authorization_required":true,"rollback_prepared":true}]}' | python Projects/Aurum/Experiments/chat_tree_bridge.py > /tmp/operational-futures.json
          python - <<'PY'
          import json
          human=json.load(open('/tmp/human-futures.json', encoding='utf-8'))
          ops=json.load(open('/tmp/operational-futures.json', encoding='utf-8'))
          assert human['ok'] is True
          assert human['authority_granted'] is False
          assert human['physical_proof_inferred'] is False
          assert human['projection']['verified']['state'] == 'READY_TO_BOOT'
          assert human['projection']['likely_next'][0]['state'] == 'physical-hopper-boot-success'
          assert ops['ok'] is True
          assert ops['authority_granted'] is False
          assert ops['plan']['external_action_allowed'] is False
          by_name={item['name']: item for item in ops['plan']['branches']}
          assert by_name['inspect-ci-logs']['disposition'] == 'prepare'
          assert by_name['publish-site']['disposition'] == 'wait-boundary'
          PY
      - name: Start plugin and exercise live MCP tools
        working-directory: Projects/Aurum/ChatTreePlugin
        run: |
          state_root=$(mktemp -d)
          cp ../chat-process-tree.json "$state_root/chat-process-tree.json"
          export CHAT_TREE_TREE_PATH="$state_root/chat-process-tree.json"
          export CHAT_TREE_EVENTS_PATH="$state_root/events.jsonl"
          export CHAT_TREE_PROJECTION_PATH="$state_root/CURRENT_STATE.json"
          node server.js > /tmp/chat-tree-plugin.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; rm -rf "$state_root"' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8788/ > /tmp/health.json; then break; fi
            sleep 0.5
          done
          cat /tmp/health.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/health.json', encoding='utf-8'))
          assert p['ok'] is True
          assert p['mcp'] == '/mcp'
          PY
          if ! node smoke-client.js; then
            echo '--- chat-tree-plugin.log ---' >&2
            cat /tmp/chat-tree-plugin.log >&2 || true
            exit 1
          fi
          cat /tmp/chat-tree-plugin.log
