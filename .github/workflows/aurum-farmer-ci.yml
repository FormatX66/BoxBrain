name: Aurum Farmer CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Projects/AurumFarmer/**'
      - 'Projects/FutureBranchMonitor/**'
      - 'installer/install-aurum-farmer.ps1'
      - 'installer/uninstall-aurum-farmer.ps1'
      - 'installer/aurum-farmer.service'
      - '.github/workflows/aurum-farmer-ci.yml'
  push:
    branches: [main]
    paths:
      - 'Projects/AurumFarmer/**'
      - 'Projects/FutureBranchMonitor/**'
      - 'installer/install-aurum-farmer.ps1'
      - 'installer/uninstall-aurum-farmer.ps1'
      - 'installer/aurum-farmer.service'
      - '.github/workflows/aurum-farmer-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile Farmer runtime
        env:
          PYTHONPATH: Projects/AurumFarmer
        run: python -m compileall -q Projects/AurumFarmer/aurum_farmer
      - name: Verify ledger, watchdog, scheduler, evidence, LKG, and adapters
        env:
          PYTHONPATH: Projects/AurumFarmer
        run: python -m unittest discover -s Projects/AurumFarmer/tests -v
      - name: Verify monitor visibility, freshness and report integrity
        run: python -m unittest discover -s Projects/FutureBranchMonitor -v

  windows-install-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify native Windows workload collection and read-only monitor
        run: python -m unittest discover -s Projects/FutureBranchMonitor -v
      - name: Install, start, and verify Farmer service contract with release-local Python
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          & .\installer\install-aurum-farmer.ps1 -ForceEmbeddedPython
          $receiptPath = Join-Path $env:LOCALAPPDATA 'BoxBrain\AurumFarmer\runtime\install-receipt.json'
          if (-not (Test-Path -LiteralPath $receiptPath -PathType Leaf)) {
            throw "Farmer install receipt missing: $receiptPath"
          }
          $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          if ($receipt.health_verified -ne $true) {
            throw 'Farmer installer did not persist a healthy loopback proof.'
          }
          if ([string]$receipt.source_commit -ne (& git rev-parse HEAD).Trim()) {
            throw 'Farmer install receipt source commit does not match checkout HEAD.'
          }
          if ([string]$receipt.python_runtime -ne 'embedded' -or -not (Test-Path -LiteralPath ([string]$receipt.python_exe) -PathType Leaf)) {
            throw 'Farmer installer did not prove the release-local embedded Python fallback.'
          }
          $task = Get-ScheduledTask -TaskName 'Aurum Farmer' -ErrorAction Stop
          if ([string]$task.State -notin @('Ready','Running')) {
            throw "Unexpected Farmer scheduled-task state: $($task.State)"
          }
          $health = Invoke-RestMethod -Method Get -Uri 'http://127.0.0.1:19466/health' -TimeoutSec 5
          if ($health.status -ne 'healthy' -or $health.event_chain_valid -ne $true) {
            throw 'Farmer loopback health endpoint failed after installation.'
          }
          'AURUM_FARMER_WINDOWS_EMBEDDED_PYTHON_INSTALL_OK'
      - name: Remove ephemeral task while preserving durable-state semantics
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath .\installer\uninstall-aurum-farmer.ps1 -PathType Leaf) {
            & .\installer\uninstall-aurum-farmer.ps1
          }
