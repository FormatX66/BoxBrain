name: Aurum Capability Autonomy Tests

on:
  push:
    branches:
      - aurum/trunk-v0.01
    paths:
      - 'Projects/AurumPC/aurum_capability_graph.py'
      - 'Projects/AurumPC/aurum_capability_mesh.py'
      - 'Projects/AurumPC/aurum_autonomy_runtime.py'
      - 'Projects/AurumPC/aurum_network_capabilities.py'
      - 'Projects/AurumPC/tests/test_aurum_capability_graph.py'
      - 'Projects/AurumPC/tests/test_aurum_capability_mesh.py'
      - 'Projects/AurumPC/tests/test_aurum_autonomy_runtime.py'
      - '.github/workflows/aurum-capability-autonomy-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile capability and autonomy runtime
        run: |
          python -m py_compile \
            Projects/AurumPC/aurum_hardware.py \
            Projects/AurumPC/aurum_capability_graph.py \
            Projects/AurumPC/aurum_capability_mesh.py \
            Projects/AurumPC/aurum_network_capabilities.py \
            Projects/AurumPC/aurum_autonomy_runtime.py
      - name: Run focused autonomy tests
        run: |
          python -m unittest \
            Projects.AurumPC.tests.test_aurum_capability_graph \
            Projects.AurumPC.tests.test_aurum_capability_mesh \
            Projects.AurumPC.tests.test_aurum_autonomy_runtime \
            -v
