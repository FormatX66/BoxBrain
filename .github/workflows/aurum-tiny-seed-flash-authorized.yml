name: Aurum Tiny Seed Authorized USB Flash (legacy disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refuse-legacy-bypass:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse legacy destructive path
        shell: bash
        run: |
          set -euo pipefail
          echo 'AURUM_TINYSEED_FLASH_REFUSED reason=legacy-authorized-workflow-disabled'
          echo 'Use the current guarded one-shot/request or dry-run-first Windows flash path. Destructive writes must pass the canonical low-level flasher, including exact release/media identity, protected-media checks, a fresh terminal Hopper pre-execution recovery receipt, and full raw readback.'
          exit 1
