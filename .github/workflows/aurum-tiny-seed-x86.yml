name: Aurum Tiny Seed x86

on:
  workflow_dispatch:
  push:
    paths:
      - 'Projects/Aurum/Germ/**'
      - 'Projects/Aurum/Recovery/trusted-refs.json'
      - 'Projects/Aurum/Recovery/authority-public.pem'
      - '.github/workflows/aurum-tiny-seed-x86.yml'

permissions:
  contents: read

concurrency:
  group: aurum-tiny-seed-x86-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out genetics
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Compile and unit-test germ
        run: |
          python3 -m py_compile Projects/Aurum/Germ/*.py
          (cd Projects/Aurum/Germ && python3 -m unittest -v test_carrier test_reseed test_guardian test_proof test_rollback_drill test_recovery_control test_recovery_poller test_triage test_tinyseed test_accessibility test_tinyseed_boot_contract)

      - name: Install VM tooling
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y qemu-system-x86 ovmf xorriso squashfs-tools

      - name: Build minimal Tiny Seed ISO
        run: |
          docker run --rm --privileged \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:bookworm \
            sh -lc '
              set -eu
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                live-build debian-archive-keyring debootstrap xorriso isolinux \
                syslinux-common squashfs-tools grub-pc-bin grub-efi-amd64-bin \
                dosfstools mtools ca-certificates git python3
              sh Projects/Aurum/Germ/build-x86-tinyseed.sh
            '
          test -s dist/Aurum-TinySeed-amd64.iso
          sha256sum -c dist/Aurum-TinySeed-amd64.iso.sha256

      - name: UEFI boot smoke
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /usr/share/OVMF/OVMF_CODE_4M.fd ] && [ -f /usr/share/OVMF/OVMF_VARS_4M.fd ]; then
            OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
            OVMF_VARS=/usr/share/OVMF/OVMF_VARS_4M.fd
          elif [ -f /usr/share/OVMF/OVMF_CODE.fd ] && [ -f /usr/share/OVMF/OVMF_VARS.fd ]; then
            OVMF_CODE=/usr/share/OVMF/OVMF_CODE.fd
            OVMF_VARS=/usr/share/OVMF/OVMF_VARS.fd
          else
            echo "No matching OVMF CODE/VARS pair found" >&2
            exit 1
          fi
          cp "$OVMF_VARS" "$RUNNER_TEMP/OVMF_VARS.fd"
          python3 Projects/Aurum/Germ/virtual_x86_gate.py \
            --name uefi-normal --firmware uefi \
            --iso dist/Aurum-TinySeed-amd64.iso \
            --ovmf-code "$OVMF_CODE" --ovmf-vars "$RUNNER_TEMP/OVMF_VARS.fd" \
            --log tinyseed-uefi.log --screenshot tinyseed-uefi.ppm \
            --require AURUM_TINYSEED_READY \
            --require AURUM_BOOT_PROOF_READY \
            --require 'AURUM_TINYSEED_NETWORK_READY resolver=true repository_tcp_443=true repository_https=true repository_sync=true' \
            | tee tinyseed-uefi-proof.json

      - name: Legacy BIOS boot smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 Projects/Aurum/Germ/virtual_x86_gate.py \
            --name bios-normal --firmware bios \
            --iso dist/Aurum-TinySeed-amd64.iso \
            --log tinyseed-bios.log --screenshot tinyseed-bios.ppm \
            --require AURUM_TINYSEED_READY \
            --require AURUM_BOOT_PROOF_READY \
            --require 'AURUM_TINYSEED_NETWORK_READY resolver=true repository_tcp_443=true repository_https=true repository_sync=true' \
            | tee tinyseed-bios-proof.json

      - name: Extract direct-boot kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tinyseed-live"
          xorriso -osirrox on -indev dist/Aurum-TinySeed-amd64.iso \
            -extract /live/vmlinuz "$RUNNER_TEMP/tinyseed-live/vmlinuz"
          xorriso -osirrox on -indev dist/Aurum-TinySeed-amd64.iso \
            -extract /live/initrd.img "$RUNNER_TEMP/tinyseed-live/initrd.img"

      - name: Safe graphics fallback boot proof
        shell: bash
        run: |
          set -euo pipefail
          python3 Projects/Aurum/Germ/virtual_x86_gate.py \
            --name safe-graphics --firmware direct \
            --iso dist/Aurum-TinySeed-amd64.iso \
            --kernel "$RUNNER_TEMP/tinyseed-live/vmlinuz" \
            --initrd "$RUNNER_TEMP/tinyseed-live/initrd.img" \
            --append 'boot=live components edd=off plymouth.enable=0 aurum.ui=plain nomodeset systemd.show_status=yes console=tty0 console=ttyS0,115200n8' \
            --log tinyseed-safe.log --screenshot tinyseed-safe.ppm \
            --min-colors 2 \
            --require AURUM_TINYSEED_READY \
            --require AURUM_BOOT_PROOF_READY \
            --require 'AURUM_TINYSEED_NETWORK_READY resolver=true repository_tcp_443=true repository_https=true repository_sync=true' \
            | tee tinyseed-safe-proof.json

      - name: Spoken and blind startup proof
        shell: bash
        run: |
          set -euo pipefail
          python3 Projects/Aurum/Germ/virtual_x86_gate.py \
            --name spoken-blind --firmware direct --audio \
            --iso dist/Aurum-TinySeed-amd64.iso \
            --kernel "$RUNNER_TEMP/tinyseed-live/vmlinuz" \
            --initrd "$RUNNER_TEMP/tinyseed-live/initrd.img" \
            --append 'boot=live components edd=off plymouth.enable=0 aurum.accessibility=blind aurum.ui=plain speakup.synth=soft systemd.show_status=yes console=tty0 console=ttyS0,115200n8' \
            --log tinyseed-spoken.log --screenshot tinyseed-spoken.ppm \
            --min-colors 2 \
            --require AURUM_TINYSEED_ACCESSIBILITY_READY \
            --require AURUM_TINYSEED_READY \
            --require AURUM_BOOT_PROOF_READY \
            --require 'AURUM_TINYSEED_NETWORK_READY resolver=true repository_tcp_443=true repository_https=true repository_sync=true' \
            | tee tinyseed-spoken-proof.json

      - name: Inspect recovery and failure-prep payload
        shell: bash
        run: |
          set -euo pipefail
          squashfs="$RUNNER_TEMP/tinyseed-filesystem.squashfs"
          xorriso -osirrox on -indev dist/Aurum-TinySeed-amd64.iso \
            -extract /live/filesystem.squashfs "$squashfs"
          unsquashfs -ll "$squashfs" | tee tinyseed-payload.log >/dev/null
          for expected in \
            usr/lib/aurum/germ/triage.py \
            usr/lib/aurum/germ/carrier.py \
            usr/lib/aurum/carrier/carrier.json \
            usr/lib/aurum/carrier/platform/Projects/AurumPC/aurum_console.py \
            usr/lib/aurum/carrier/platform/Projects/Codelation \
            etc/systemd/system/aurum-triage.service \
            usr/lib/aurum/germ/recovery_poller.py \
            etc/systemd/system/aurum-recovery-poll.timer \
            etc/NetworkManager/conf.d/10-aurum-resolved.conf \
            etc/systemd/system/aurum-resolver-link.service \
            etc/systemd/system/multi-user.target.wants/systemd-resolved.service \
            usr/lib/systemd/systemd-resolved \
            usr/sbin/aurum-triage; do
            if ! grep -Fq "$expected" tinyseed-payload.log; then
              echo "Tiny Seed payload missing expected path: $expected" >&2
              exit 1
            fi
          done
          carrier_root="$RUNNER_TEMP/tinyseed-carrier-root"
          unsquashfs -f -d "$carrier_root" "$squashfs" \
            usr/lib/aurum/germ/carrier.py \
            usr/lib/aurum/carrier >/dev/null
          python3 "$carrier_root/usr/lib/aurum/germ/carrier.py" verify \
            --root "$carrier_root/usr/lib/aurum/carrier" \
            --architecture x86_64
          echo 'AURUM_TINYSEED_OFFLINE_CARRIER_OK'
          echo 'AURUM_TINYSEED_X86_FAILURE_PREP_OK'

      - name: Upload boot diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Aurum-TinySeed-amd64-diagnostics
          path: |
            tinyseed-uefi.log
            tinyseed-bios.log
            tinyseed-safe.log
            tinyseed-spoken.log
            tinyseed-*.ppm
            tinyseed-*-proof.json
            tinyseed-payload.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload virtual boot proof
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Aurum-TinySeed-amd64-virtual-proof
          path: |
            tinyseed-uefi.log
            tinyseed-bios.log
            tinyseed-safe.log
            tinyseed-spoken.log
            tinyseed-*.ppm
            tinyseed-*-proof.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish Tiny Seed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Aurum-TinySeed-amd64
          path: |
            dist/Aurum-TinySeed-amd64.iso
            dist/Aurum-TinySeed-amd64.iso.sha256
            tinyseed-uefi.log
            tinyseed-bios.log
            tinyseed-payload.log
          if-no-files-found: error
          retention-days: 30
