name: Aurum Tiny Seed x86

on:
  workflow_dispatch:
  push:
    paths:
      - 'Projects/Aurum/Germ/**'
      - 'Projects/Aurum/Recovery/trusted-refs.json'
      - 'Projects/Aurum/Recovery/authority-public.pem'
      - '.github/workflows/aurum-tiny-seed-x86.yml'

permissions:
  contents: read

concurrency:
  group: aurum-tiny-seed-x86-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out genetics
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Compile and unit-test germ
        run: |
          python3 -m py_compile Projects/Aurum/Germ/*.py
          (cd Projects/Aurum/Germ && python3 -m unittest -v test_reseed test_guardian test_proof test_rollback_drill test_recovery_control test_triage test_tinyseed)

      - name: Install VM tooling
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y qemu-system-x86 ovmf xorriso squashfs-tools

      - name: Build minimal Tiny Seed ISO
        run: |
          docker run --rm --privileged \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:bookworm \
            sh -lc '
              set -eu
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                live-build debian-archive-keyring debootstrap xorriso isolinux \
                syslinux-common squashfs-tools grub-pc-bin grub-efi-amd64-bin \
                dosfstools mtools ca-certificates
              sh Projects/Aurum/Germ/build-x86-tinyseed.sh
            '
          test -s dist/Aurum-TinySeed-amd64.iso
          sha256sum -c dist/Aurum-TinySeed-amd64.iso.sha256

      - name: UEFI boot smoke
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /usr/share/OVMF/OVMF_CODE_4M.fd ] && [ -f /usr/share/OVMF/OVMF_VARS_4M.fd ]; then
            OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
            OVMF_VARS=/usr/share/OVMF/OVMF_VARS_4M.fd
          elif [ -f /usr/share/OVMF/OVMF_CODE.fd ] && [ -f /usr/share/OVMF/OVMF_VARS.fd ]; then
            OVMF_CODE=/usr/share/OVMF/OVMF_CODE.fd
            OVMF_VARS=/usr/share/OVMF/OVMF_VARS.fd
          else
            echo "No matching OVMF CODE/VARS pair found" >&2
            exit 1
          fi
          cp "$OVMF_VARS" "$RUNNER_TEMP/OVMF_VARS.fd"
          set +e
          timeout 120 qemu-system-x86_64 \
            -machine q35 -m 1024 -smp 2 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file="$RUNNER_TEMP/OVMF_VARS.fd" \
            -cdrom dist/Aurum-TinySeed-amd64.iso \
            -boot d -nic user,model=e1000 -display none -serial file:tinyseed-uefi.log -no-reboot
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "UEFI QEMU exited unexpectedly rc=$rc" >&2
            cat tinyseed-uefi.log 2>/dev/null || true
            exit 1
          fi
          missing=0
          grep -q 'AURUM_TINYSEED_READY' tinyseed-uefi.log || missing=1
          grep -q 'AURUM_BOOT_PROOF_READY' tinyseed-uefi.log || missing=1
          grep -q 'AURUM_TINYSEED_NETWORK_READY resolver=true repository_tcp_443=true' tinyseed-uefi.log || missing=1
          if [ "$missing" -ne 0 ]; then
            echo 'UEFI boot smoke markers missing; serial evidence follows' >&2
            cat tinyseed-uefi.log 2>/dev/null || true
            exit 1
          fi

      - name: Legacy BIOS boot smoke
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 120 qemu-system-x86_64 \
            -machine pc -m 1024 -smp 2 \
            -cdrom dist/Aurum-TinySeed-amd64.iso \
            -boot d -nic user,model=e1000 -display none -serial file:tinyseed-bios.log -no-reboot
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "BIOS QEMU exited unexpectedly rc=$rc" >&2
            cat tinyseed-bios.log 2>/dev/null || true
            exit 1
          fi
          missing=0
          grep -q 'AURUM_TINYSEED_READY' tinyseed-bios.log || missing=1
          grep -q 'AURUM_BOOT_PROOF_READY' tinyseed-bios.log || missing=1
          grep -q 'AURUM_TINYSEED_NETWORK_READY resolver=true repository_tcp_443=true' tinyseed-bios.log || missing=1
          if [ "$missing" -ne 0 ]; then
            echo 'BIOS boot smoke markers missing; serial evidence follows' >&2
            cat tinyseed-bios.log 2>/dev/null || true
            exit 1
          fi

      - name: Inspect recovery and failure-prep payload
        shell: bash
        run: |
          set -euo pipefail
          squashfs="$RUNNER_TEMP/tinyseed-filesystem.squashfs"
          xorriso -osirrox on -indev dist/Aurum-TinySeed-amd64.iso \
            -extract /live/filesystem.squashfs "$squashfs"
          unsquashfs -ll "$squashfs" | tee tinyseed-payload.log >/dev/null
          for expected in \
            usr/lib/aurum/germ/triage.py \
            etc/systemd/system/aurum-triage.service \
            usr/lib/aurum/germ/recovery_poller.py \
            etc/systemd/system/aurum-recovery-poll.timer \
            etc/NetworkManager/conf.d/10-aurum-resolved.conf \
            etc/systemd/system/aurum-resolver-link.service \
            etc/systemd/system/multi-user.target.wants/systemd-resolved.service \
            usr/lib/systemd/systemd-resolved \
            usr/sbin/aurum-triage; do
            if ! grep -Fq "$expected" tinyseed-payload.log; then
              echo "Tiny Seed payload missing expected path: $expected" >&2
              exit 1
            fi
          done
          echo 'AURUM_TINYSEED_X86_FAILURE_PREP_OK'

      - name: Upload boot diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Aurum-TinySeed-amd64-diagnostics
          path: |
            tinyseed-uefi.log
            tinyseed-bios.log
            tinyseed-payload.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish Tiny Seed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Aurum-TinySeed-amd64
          path: |
            dist/Aurum-TinySeed-amd64.iso
            dist/Aurum-TinySeed-amd64.iso.sha256
            tinyseed-uefi.log
            tinyseed-bios.log
            tinyseed-payload.log
          if-no-files-found: error
          retention-days: 30
