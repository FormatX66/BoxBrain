name: Aurum LLM Adapter Training

on:
  workflow_dispatch:
  push:
    branches:
      - aurum/trunk-v0.01
    paths:
      - 'Projects/AurumLLM/training/**'
      - 'Projects/AurumLLM/tests/test_training.py'
      - '.github/workflows/aurum-llm-adapter-train.yml'

permissions:
  contents: read

concurrency:
  group: aurum-llm-adapter-train-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate training lane
        run: |
          python -m py_compile Projects/AurumLLM/training/build_corpus.py Projects/AurumLLM/training/train_lora.py
          python -m unittest Projects.AurumLLM.tests.test_training -v
      - name: Build provenance-gated corpus
        run: |
          python Projects/AurumLLM/training/build_corpus.py
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('dist/aurum-llm-training/corpus-manifest.json').read_text(encoding='utf-8'))
          assert manifest['records'] > 0
          assert manifest['contains_openai_output'] is False
          assert manifest['contains_user_conversation'] is False
          assert manifest['promotion_authorized'] is False
          print('AURUM_LLM_CORPUS_READY records=%s sha=%s' % (manifest['records'], manifest['corpus_sha256']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aurum-llm-training-corpus
          path: dist/aurum-llm-training/**
          if-no-files-found: error
          retention-days: 14

  train-adapter:
    needs: prepare-corpus
    runs-on: [self-hosted, Windows, X64, aurum-elevated]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aurum-llm-training-corpus
          path: dist/aurum-llm-training
      - name: Probe training GPU
        id: gpu
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/aurum-llm-adapter0 | Out-Null
          $gpu = Get-Command nvidia-smi -ErrorAction SilentlyContinue
          if ($null -eq $gpu) {
            'ready=false' >> $env:GITHUB_OUTPUT
            '{"schema":"aurum-llm-training-receipt-v1","generation":"adapter-0","status":"deferred-no-gpu","promotion_authorized":false,"openai_training_data":false}' | Set-Content -Encoding utf8 dist/aurum-llm-adapter0/training-receipt.json
            exit 0
          }
          nvidia-smi
          'ready=true' >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        if: steps.gpu.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Prepare training environment
        if: steps.gpu.outputs.ready == 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch transformers peft accelerate
      - name: Verify CUDA training path
        if: steps.gpu.outputs.ready == 'true'
        id: cuda
        shell: pwsh
        run: |
          $ready = python -c "import torch; print('true' if torch.cuda.is_available() else 'false')"
          "ready=$ready" >> $env:GITHUB_OUTPUT
          if ($ready -ne 'true') {
            '{"schema":"aurum-llm-training-receipt-v1","generation":"adapter-0","status":"deferred-cuda-runtime-unavailable","promotion_authorized":false,"openai_training_data":false}' | Set-Content -Encoding utf8 dist/aurum-llm-adapter0/training-receipt.json
          } else {
            python -c "import torch; print('AURUM_LLM_TRAIN_GPU=' + torch.cuda.get_device_name(0))"
          }
      - name: Train adapter-0
        if: steps.gpu.outputs.ready == 'true' && steps.cuda.outputs.ready == 'true'
        shell: pwsh
        run: |
          python Projects/AurumLLM/training/train_lora.py --corpus dist/aurum-llm-training/corpus.jsonl --output dist/aurum-llm-adapter0 --max-steps 20 --max-length 512
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurum-llm-adapter0
          path: dist/aurum-llm-adapter0/**
          if-no-files-found: error
          retention-days: 14
