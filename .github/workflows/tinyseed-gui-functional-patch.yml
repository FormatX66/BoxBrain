name: TinySeed physical GUI functional patch

on:
  push:
    branches:
      - codex/tinyseed-hopper-gui-functional-20260826

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch physical TinySeed GUI
        run: python3 .github/scripts/tinyseed_gui_functional_patch.py

      - name: Verify Python syntax
        run: python3 -m py_compile Projects/AurumPC/aurum_hopper_gui.py Projects/AurumPC/aurum_web_surface.py

      - name: Verify GUI contracts
        run: |
          python3 - <<'PY'
          import importlib.util
          import re
          import shutil
          import subprocess
          from pathlib import Path

          gui = Path('Projects/AurumPC/aurum_hopper_gui.py').read_text(encoding='utf-8')
          assert '<input id="prompt" type="text"' in gui
          assert 'textarea id="prompt"' not in gui
          assert 'data-nav="wifi"' in gui
          assert '/api/wifi' in gui
          assert 'wifiScan' in gui and 'wifiConnect' in gui
          assert "if(e.key==='Enter'){e.preventDefault();ask()}" in gui

          spec = importlib.util.spec_from_file_location('hopper_gui_check', 'Projects/AurumPC/aurum_hopper_gui.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          script = re.search(r'<script nonce="\{\{NONCE\}\}">(.*?)</script>', module.PAGE, re.S)
          assert script
          if shutil.which('node'):
              Path('/tmp/aurum-inline.js').write_text(script.group(1), encoding='utf-8')
              subprocess.check_call(['node', '--check', '/tmp/aurum-inline.js'])

          spec = importlib.util.spec_from_file_location('surface_check', 'Projects/AurumPC/aurum_web_surface.py')
          surface = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(surface)
          sample = 'eDP-1 connected primary 1080x1920+0+0 left (normal left inverted right x axis y axis)\n'
          assert surface._display_geometry(sample) == {
              'output': 'eDP-1', 'width': 1080, 'height': 1920, 'rotation': 'left'
          }
          print('TinySeed GUI contract verification passed')
          PY

      - name: Commit verified carrier change
        run: |
          git config user.name "Aurum Farmer"
          git config user.email "actions@users.noreply.github.com"
          git add Projects/AurumPC/aurum_hopper_gui.py Projects/AurumPC/aurum_web_surface.py
          git commit -m "TinySeed: landscape GUI and functional controls"
          git push origin HEAD:${GITHUB_REF_NAME}
