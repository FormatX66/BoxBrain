name: Aurum PC-01 Stable Proof Dedupe Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aurum-pc01-receipt-dedupe-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-pc01-stable-proof-dedupe-once
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Suppress redundant ALREADY_COMPLETE proof receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/aurum-pc01-flash-authorized.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          if (Test-Path -LiteralPath $sentinel) {
            $previous = $null
            try { $previous = Get-Content -LiteralPath $sentinel -Raw | ConvertFrom-Json } catch { $previous = $null }
            Publish-FlashReceipt 'ALREADY_COMPLETE' @{
              head = $headSha
              image_sha256 = $actual
              sentinel = $sentinel
              raw_readback_verified = if ($previous) { [bool]$previous.raw_readback_verified } else { $true }
            }
            Write-Host "AURUM_FLASH_ALREADY_COMPLETE head=$headSha image_sha256=$actual"
            exit 0
          }
'''
          new = '''          if (Test-Path -LiteralPath $sentinel) {
            $previous = $null
            try { $previous = Get-Content -LiteralPath $sentinel -Raw | ConvertFrom-Json } catch { $previous = $null }

            # Stable proof is durable. Do not create repository churn when an upstream image
            # workflow re-verifies the exact already-flashed seed within the freshness window.
            # A real new flash still publishes FLASH_OK immediately; this only deduplicates
            # idempotent ALREADY_COMPLETE heartbeat receipts.
            $proofFreshnessHours = 6
            $cutoff = [DateTimeOffset]::UtcNow.AddHours(-$proofFreshnessHours)
            $recentCommits = @(Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/commits?per_page=100")
            $recentStableProof = @($recentCommits | Where-Object {
                $_.commit.message -match '^Record Aurum PC-01 flash receipt state=ALREADY_COMPLETE' -and
                [DateTimeOffset]$_.commit.committer.date -ge $cutoff
              } | Select-Object -First 1)
            if ($recentStableProof.Count -gt 0) {
              Write-Host "AURUM_FLASH_ALREADY_COMPLETE_NOOP head=$headSha image_sha256=$actual freshness_window_hours=$proofFreshnessHours latest_receipt=$($recentStableProof[0].sha)"
              exit 0
            }

            Publish-FlashReceipt 'ALREADY_COMPLETE' @{
              head = $headSha
              image_sha256 = $actual
              sentinel = $sentinel
              raw_readback_verified = if ($previous) { [bool]$previous.raw_readback_verified } else { $true }
            }
            Write-Host "AURUM_FLASH_ALREADY_COMPLETE head=$headSha image_sha256=$actual freshness_window_hours=$proofFreshnessHours"
            exit 0
          }
'''
          if old not in text:
              raise SystemExit('Expected PC-01 ALREADY_COMPLETE block not found; refusing to patch')
          if 'AURUM_FLASH_ALREADY_COMPLETE_NOOP' in text:
              raise SystemExit('Dedupe guard already present; refusing duplicate patch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -Fq 'AURUM_FLASH_ALREADY_COMPLETE_NOOP' .github/workflows/aurum-pc01-flash-authorized.yml
          grep -Fq 'proofFreshnessHours = 6' .github/workflows/aurum-pc01-flash-authorized.yml

      - name: Remove one-shot patch carrier
        shell: bash
        run: rm -f .github/workflows/aurum-pc01-receipt-dedupe-once.yml

      - name: Commit guarded workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/aurum-pc01-flash-authorized.yml .github/workflows/aurum-pc01-receipt-dedupe-once.yml
          git commit -m 'Deduplicate stable PC-01 flash proof receipts'
          git pull --rebase origin main
          git push origin HEAD:main
