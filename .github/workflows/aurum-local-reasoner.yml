name: Aurum Local Reasoner

on:
  push:
    branches: [main]
    paths:
      - 'Projects/AurumBridge/reasoning-jobs/**'
      - 'Projects/AurumBridge/AurumLocalReasoner.ps1'
      - '.github/workflows/aurum-local-reasoner.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-local-reasoner-main
  cancel-in-progress: false

jobs:
  reason:
    name: Execute local Aurum reasoning jobs
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Process local reasoning jobs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $root = $env:GITHUB_WORKSPACE
          # SYSTEM owns the elevated process, while the checkout can remain owned
          # by the interactive account. Scope Git trust to this process/workspace.
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'safe.directory'
          $env:GIT_CONFIG_VALUE_0 = $root
          Set-Location -LiteralPath $root

          $jobsDir = Join-Path $root 'Projects/AurumBridge/reasoning-jobs'
          $resultsDir = Join-Path $root 'Projects/AurumBridge/reasoning-results'
          $executor = Join-Path $root 'Projects/AurumBridge/AurumLocalReasoner.ps1'
          New-Item -ItemType Directory -Path $jobsDir -Force | Out-Null
          New-Item -ItemType Directory -Path $resultsDir -Force | Out-Null

          # Restore locally durable evidence before deciding a job is pending.
          # This prevents a failed Git publication from paying for inference twice.
          $durableRoot = if ($env:ProgramData) {
            Join-Path $env:ProgramData 'Aurum\Bridge\reasoning-results'
          } elseif ($env:LOCALAPPDATA) {
            Join-Path $env:LOCALAPPDATA 'Aurum\Bridge\reasoning-results'
          } else { $null }
          if ($durableRoot -and (Test-Path -LiteralPath $durableRoot)) {
            foreach ($cached in @(Get-ChildItem -LiteralPath $durableRoot -File -Filter '*.json' -ErrorAction SilentlyContinue)) {
              $job = Join-Path $jobsDir $cached.Name
              $result = Join-Path $resultsDir $cached.Name
              if ((Test-Path -LiteralPath $job) -and -not (Test-Path -LiteralPath $result)) {
                Copy-Item -LiteralPath $cached.FullName -Destination $result -Force
                Write-Host "AURUM_LOCAL_REASON_RESTORED file=$($cached.Name) source=durable-local-evidence"
              }
            }
          }

          $pending = @()
          foreach ($job in @(Get-ChildItem -LiteralPath $jobsDir -File -Filter '*.json' -ErrorAction SilentlyContinue | Sort-Object Name)) {
            $result = Join-Path $resultsDir $job.Name
            if (-not (Test-Path -LiteralPath $result)) {
              $pending += [pscustomobject]@{ Job = $job.FullName; Result = $result; Name = $job.Name }
            }
          }

          foreach ($item in $pending) {
            Write-Host "AURUM_LOCAL_REASON_START file=$($item.Name) host=$env:COMPUTERNAME"
            & $executor -JobPath $item.Job -OutputPath $item.Result
            if ($LASTEXITCODE -ne 0) { throw "AURUM_LOCAL_REASON_JOB_FAILED file=$($item.Name)" }
          }

          git config user.name 'aurum-local-reasoner[bot]'
          git config user.email 'aurum-local-reasoner@users.noreply.github.com'
          git add -- 'Projects/AurumBridge/reasoning-results'
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            if ($pending.Count -eq 0) {
              Write-Host 'AURUM_LOCAL_REASONER_IDLE reason=no-pending-jobs'
            } else {
              Write-Host 'AURUM_LOCAL_REASONER_NO_NEW_EVIDENCE'
            }
            exit 0
          }

          git commit -m 'Record Aurum local reasoning evidence [skip ci]'
          $pushed = $false
          for ($attempt = 1; $attempt -le 3 -and -not $pushed; $attempt++) {
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) { throw 'AURUM_LOCAL_REASON_PUSH_PREP_FAILED' }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            Start-Sleep -Seconds (2 * $attempt)
          }
          if (-not $pushed) { throw 'AURUM_LOCAL_REASON_PUSH_FAILED' }
          Write-Host "AURUM_LOCAL_REASON_EVIDENCE_COMMITTED executed=$($pending.Count) host=$env:COMPUTERNAME"
