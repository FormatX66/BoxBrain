name: Aurum Cancel Ungated Hopper KVM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aurum-cancel-ungated-kvm.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Cancel only the pre-boundary KVM run if still active
        env:
          GH_TOKEN: ${{ github.token }}
          UNGATED_HEAD_SHA: acd6461b7462cfcaacff177406895ce858f55585
        shell: bash
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow aurum-hopper-pi-kvm-recovery.yml --limit 20 \
            --json databaseId,status,conclusion,headSha,url,event > "$RUNNER_TEMP/kvm-runs.json"
          python3 - "$RUNNER_TEMP/kvm-runs.json" "$UNGATED_HEAD_SHA" > "$RUNNER_TEMP/active-ids.txt" <<'PY'
          import json, sys
          runs=json.load(open(sys.argv[1],encoding='utf-8'))
          target=sys.argv[2].lower()
          for r in runs:
              if str(r.get('headSha') or '').lower()==target and str(r.get('status') or '') in {'queued','in_progress','waiting','requested','pending'}:
                  print(r['databaseId'])
          PY
          cancelled=0
          while read -r id; do
            [ -n "$id" ] || continue
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY"
            cancelled=$((cancelled+1))
          done < "$RUNNER_TEMP/active-ids.txt"
          python3 - "$cancelled" <<'PY'
          import datetime as dt,json,pathlib,sys
          payload={
            'schema':'aurum.hopper.pi-kvm-cancellation.v1',
            'observed_at':dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00','Z'),
            'ungated_head_sha':'acd6461b7462cfcaacff177406895ce858f55585',
            'active_runs_cancelled':int(sys.argv[1]),
            'current_kvm_workflow_requires_explicit_physical_authorization':True,
            'new_authority_granted':False,
          }
          p=pathlib.Path('Projects/AurumBridge/results/hopper-pi-kvm-cancellation.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(payload,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(payload,sort_keys=True))
          PY
          git config user.name 'aurum-kvm-boundary[bot]'
          git config user.email 'aurum-kvm-boundary@users.noreply.github.com'
          git add Projects/AurumBridge/results/hopper-pi-kvm-cancellation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record ungated Hopper KVM cancellation [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
