name: Aurum Hopper Recovery Request Dispatcher

on:
  push:
    branches: [main]
    paths:
      - 'Projects/AurumBridge/requests/hopper-recovery-path-request.json'
      - '.github/workflows/aurum-hopper-recovery-request.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: aurum-hopper-recovery-request-dispatch
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Validate Future Branch recovery request
        shell: bash
        run: |
          set -euo pipefail
          request='Projects/AurumBridge/requests/hopper-recovery-path-request.json'
          test -s "$request"
          python3 - "$request" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1], encoding='utf-8'))
          assert p.get('schema') == 'aurum.hopper.recovery-path-request.v1'
          assert p.get('mode') == 'probe-and-use-existing-authority-only'
          assert p.get('grant_new_authority') is False
          assert p.get('allow_destructive_media_write') is False
          assert p.get('require_terminal_v2_receipt') is True
          assert p.get('physical_hid_authorized') is True
          assert p.get('physical_hid_confirmation') == 'OPEN_HOPPER_KVM_CONSOLE'
          assert str(p.get('request_id') or '').strip()
          print('AURUM_HOPPER_RECOVERY_REQUEST_VALID existing_authority=true physical_hid_authorized=true media_write=false')
          PY
      - name: Dispatch network and Pi KVM recovery branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          request='Projects/AurumBridge/requests/hopper-recovery-path-request.json'
          request_id=$(python3 -c "import json; print(json.load(open('$request'))['request_id'])")
          before=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run aurum-hopper-recovery-path-probe.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run aurum-hopper-pi-kvm-recovery.yml --repo "$GITHUB_REPOSITORY" --ref main -f confirmation=OPEN_HOPPER_KVM_CONSOLE
          echo 'AURUM_HOPPER_RECOVERY_DISPATCHED network=true pi_kvm=true'
          sleep 6
          python3 - "$request_id" "$before" <<'PY'
          import json, pathlib, subprocess, sys, datetime as dt
          request_id,before=sys.argv[1:]
          workflows=['aurum-hopper-recovery-path-probe.yml','aurum-hopper-pi-kvm-recovery.yml']
          runs={}
          for wf in workflows:
              raw=subprocess.check_output(['gh','run','list','--repo',__import__('os').environ['GITHUB_REPOSITORY'],'--workflow',wf,'--limit','10','--json','databaseId,status,conclusion,headSha,createdAt,url,event'],text=True)
              values=json.loads(raw)
              threshold=dt.datetime.fromisoformat(before.replace('Z','+00:00'))-dt.timedelta(seconds=10)
              choices=[]
              for run in values:
                  try: created=dt.datetime.fromisoformat(str(run.get('createdAt')).replace('Z','+00:00'))
                  except Exception: continue
                  if created>=threshold and run.get('event')=='workflow_dispatch': choices.append((created,run))
              runs[wf]=max(choices,key=lambda x:x[0])[1] if choices else None
          payload={
              'schema':'aurum.hopper.recovery-dispatch.v2',
              'request_id':request_id,
              'observed_at':dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00','Z'),
              'branches':runs,
              'new_authority_granted':False,
              'destructive_media_write':False,
              'physical_hid_authorized':True,
          }
          out=pathlib.Path('Projects/AurumBridge/results/hopper-recovery-dispatch-latest.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(payload,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(payload,sort_keys=True))
          PY
          git config user.name 'aurum-recovery-dispatch[bot]'
          git config user.email 'aurum-recovery-dispatch@users.noreply.github.com'
          git add Projects/AurumBridge/results/hopper-recovery-dispatch-latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record Hopper recovery dispatch state [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
