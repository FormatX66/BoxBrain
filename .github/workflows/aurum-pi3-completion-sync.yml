name: Aurum Pi3 Completion Truth Sync

on:
  push:
    branches: [main]
    paths:
      - 'Projects/Aurum/shared-state/CURRENT_STATE.json'
      - 'Projects/Aurum/Experiments/pi3_completion_projection.py'
      - 'Projects/Aurum/Experiments/test_pi3_completion_projection.py'
      - '.github/workflows/aurum-pi3-completion-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-pi3-completion-truth-sync
  cancel-in-progress: true

jobs:
  project:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out current control plane
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify projector before writing
        shell: bash
        run: |
          set -euo pipefail
          cd Projects/Aurum/Experiments
          python3 -m unittest test_pi3_completion_projection -v

      - name: Project current shared evidence into completion truth
        shell: bash
        run: |
          set -euo pipefail
          python3 Projects/Aurum/Experiments/pi3_completion_projection.py --write

      - name: Persist only a material completion-state change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Projects/Aurum/completion-plan.json; then
            echo 'AURUM_PI3_COMPLETION_SYNC changed=false'
            exit 0
          fi
          git config user.name 'aurum-pi3-completion[bot]'
          git config user.email 'aurum-pi3-completion@users.noreply.github.com'
          git add Projects/Aurum/completion-plan.json
          git commit -m 'Project Pi3 kernel prerequisite completion truth [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'AURUM_PI3_COMPLETION_SYNC changed=true'
