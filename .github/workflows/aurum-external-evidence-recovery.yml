name: Aurum External Evidence Recovery

on:
  workflow_dispatch:
  repository_dispatch:
    types: [aurum-external-evidence-recover]
  push:
    branches:
      - aurum/trunk-v0.01
    paths:
      - '.github/workflows/aurum-external-evidence-recovery.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: aurum-external-evidence-recovery-v1
  cancel-in-progress: false

env:
  AURUM_TRUNK: aurum/trunk-v0.01
  AURUM_AUTHORIZATION_REFERENCE: codex-user-minimize-asks-go-more-20260816

jobs:
  validate:
    name: Verify bounded recovery contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out current Aurum trunk
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: aurum/trunk-v0.01
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Verify GUI evidence safety contracts
        shell: bash
        run: >-
          python3 -m unittest
          Projects.Codelation.tests.test_adaptive_shell_gui_deployment
          Projects.Codelation.tests.test_external_evidence_recovery_contract
          -v

  refresh:
    name: Refresh bounded BBPI4 GUI evidence
    needs: validate
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Check out current Aurum trunk
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: aurum/trunk-v0.01
          fetch-depth: 50

      - name: Collect fresh loopback-only GUI evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $keyCandidates = @(
            (Join-Path $env:USERPROFILE '.ssh\boxbrain_pi_ed25519'),
            'C:\Users\Bruce\.ssh\boxbrain_pi_ed25519',
            'C:\Users\bruce\.ssh\boxbrain_pi_ed25519'
          )
          $keyCandidates += @(Get-ChildItem 'C:\Users' -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            Join-Path $_.FullName '.ssh\boxbrain_pi_ed25519'
          })
          $key = $keyCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $key) {
            throw "The dedicated BBPI4 SSH key is unavailable to the authorized Windows runner."
          }

          $keyDirectory = Split-Path -Parent $key
          $knownHostsCandidates = @(
            (Join-Path $keyDirectory 'known_hosts'),
            (Join-Path $env:USERPROFILE '.ssh\known_hosts'),
            'C:\Users\Bruce\.ssh\known_hosts',
            'C:\Users\bruce\.ssh\known_hosts'
          )
          $knownHostsCandidates += @(Get-ChildItem 'C:\Users' -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            Join-Path $_.FullName '.ssh\known_hosts'
          })
          $knownHosts = $knownHostsCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $knownHosts) {
            throw "The pinned SSH known-hosts file is unavailable to the authorized Windows runner."
          }

          # A self-hosted runner may execute under a different Windows identity than the
          # profile that owns the dedicated key. OpenSSH correctly rejects a private key
          # whose ACL is broad for that identity, so use an ephemeral byte-for-byte copy
          # with inheritance removed and read access granted only to the current runner.
          $strictKey = Join-Path $env:RUNNER_TEMP ("boxbrain_pi_ed25519." + [Guid]::NewGuid().ToString('N'))
          [IO.File]::WriteAllBytes($strictKey, [IO.File]::ReadAllBytes($key))
          $runnerIdentity = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          & icacls.exe $strictKey /inheritance:r /grant:r "${runnerIdentity}:(R)" | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Remove-Item -LiteralPath $strictKey -Force -ErrorAction SilentlyContinue
            throw 'Could not establish a runner-local strict ACL for the dedicated BBPI4 SSH key.'
          }
          $key = $strictKey

          $collector = Join-Path $env:GITHUB_WORKSPACE 'installer\collect-adaptive-shell-gui-live-trial.ps1'
          $repairer = Join-Path $env:GITHUB_WORKSPACE 'installer\recover-gui-module-drift.ps1'
          $approvedRoutes = @('10.12.194.1', '10.42.194.1', 'bbpi4.local', '192.168.0.194')
          $selectedRoute = $null

          function Invoke-ChildPowerShell {
            param([Parameter(Mandatory)][string[]]$Arguments)
            $savedErrorActionPreference = $ErrorActionPreference
            try {
              $ErrorActionPreference = 'Continue'
              $lines = @(& powershell.exe @Arguments 2>&1)
              $exitCode = $LASTEXITCODE
            }
            finally {
              $ErrorActionPreference = $savedErrorActionPreference
            }
            foreach ($line in $lines) {
              Write-Host ([string]$line)
            }
            return [pscustomobject]@{
              ExitCode = $exitCode
              Output = @($lines | ForEach-Object { [string]$_ })
            }
          }

          function Invoke-GuiCollector {
            param([Parameter(Mandatory)][string]$Route)
            return Invoke-ChildPowerShell -Arguments @(
              '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $collector,
              '-PiAddress', $Route,
              '-KeyPath', $key,
              '-KnownHostsPath', $knownHosts,
              '-AuthorizationReference', $env:AURUM_AUTHORIZATION_REFERENCE,
              '-TimeToLiveSeconds', '1200'
            )
          }

          try {
            foreach ($route in $approvedRoutes) {
              Write-Host "AURUM_EXTERNAL_EVIDENCE route_probe=$route"
              $trial = Invoke-GuiCollector -Route $route
              if ($trial.ExitCode -eq 0) {
                $selectedRoute = $route
                break
              }

              $escapedRoute = [regex]::Escape($route)
              $repairableModuleDrift = @($trial.Output | Where-Object {
                $_ -match "^AURUM_GUI_CONTRACT_MISMATCH route=$escapedRoute failed=module_hash(?:\s|$)" -and
                $_ -match ' authority=false content_free=true$'
              }).Count -gt 0

              if ($repairableModuleDrift) {
                Write-Host "AURUM_EXTERNAL_EVIDENCE bounded_repair=gui-module-drift route=$route"
                $repair = Invoke-ChildPowerShell -Arguments @(
                  '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $repairer,
                  '-PiAddress', $route,
                  '-KeyPath', $key,
                  '-KnownHostsPath', $knownHosts
                )
                if ($repair.ExitCode -ne 0) {
                  throw 'The exact GUI module-drift repair failed before verification.'
                }
                $repairMarker = $repair.Output | Where-Object {
                  $_ -match '^AURUM_GUI_MODULE_REPAIRED previous_sha=[0-9a-f]{64} installed_sha=[0-9a-f]{64} '
                } | Select-Object -Last 1
                if (-not $repairMarker) {
                  throw 'The GUI module-drift repair did not return bounded rollback provenance.'
                }
                $previousSha = ([regex]::Match(
                  [string]$repairMarker,
                  'previous_sha=([0-9a-f]{64})'
                )).Groups[1].Value

                # The transient GUI intentionally refuses socket reuse. The repair stops
                # the exact unit, but prior loopback HTTP checks can retain :8765 in
                # TIME_WAIT longer than the start helper's 45-second fail-closed probe.
                # One bounded quiescence interval preserves the no-reuse safety contract
                # without broadening the one-module repair or disabling strict checks.
                Write-Host "AURUM_EXTERNAL_EVIDENCE restart_quiescence=65s route=$route"
                Start-Sleep -Seconds 65

                $verifiedTrial = Invoke-GuiCollector -Route $route
                if ($verifiedTrial.ExitCode -eq 0) {
                  Write-Host "AURUM_EXTERNAL_EVIDENCE repair_verified=true route=$route"
                  $selectedRoute = $route
                  break
                }

                Write-Host "AURUM_EXTERNAL_EVIDENCE repair_verified=false rollback=true route=$route"
                $rollback = Invoke-ChildPowerShell -Arguments @(
                  '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $repairer,
                  '-PiAddress', $route,
                  '-KeyPath', $key,
                  '-KnownHostsPath', $knownHosts,
                  '-RollbackSha', $previousSha
                )
                if ($rollback.ExitCode -ne 0) {
                  throw 'GUI module-drift verification failed and the bounded rollback also failed.'
                }
                throw 'GUI module-drift repair was rolled back because fresh evidence did not verify.'
              }

              Write-Host "AURUM_EXTERNAL_EVIDENCE route_failed=$route exit_code=$($trial.ExitCode)"
            }
          }
          finally {
            if (Test-Path -LiteralPath $strictKey -PathType Leaf) {
              # Keep the key strict while it is in use, then grant only this runner enough
              # authority to delete its ephemeral copy. No other identity is added.
              & icacls.exe $strictKey /inheritance:r /grant:r "${runnerIdentity}:(F)" | Out-Null
              if ($LASTEXITCODE -ne 0) {
                throw 'Could not prepare the runner-local BBPI4 SSH key copy for secure deletion.'
              }
              Remove-Item -LiteralPath $strictKey -Force -ErrorAction SilentlyContinue
              if (Test-Path -LiteralPath $strictKey -PathType Leaf) {
                throw 'Could not remove the runner-local BBPI4 SSH key copy.'
              }
            }
          }
          if (-not $selectedRoute) {
            throw 'The bounded GUI evidence collector could not reach BBPI4 on any preapproved strict-SSH route.'
          }

          $path = Join-Path $env:GITHUB_WORKSPACE 'Projects\Codelation\autobuild\external_evidence\adaptive_shell_gui_live_trial.json'
          $evidence = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json -ErrorAction Stop
          $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          if (
            [string]$evidence.schema -ne 'aurum-adaptive-shell-gui-live-trial-evidence-v1' -or
            [string]$evidence.kind -ne 'adaptive-shell-gui-live-trial' -or
            $evidence.verified -ne $true -or
            [string]$evidence.node_id -ne 'cff5511ddbb6bf14' -or
            $approvedRoutes -notcontains [string]$evidence.route -or
            [string]$evidence.route -ne [string]$selectedRoute -or
            $evidence.authority_granted -ne $false -or
            $evidence.persistent_service_enabled -ne $false -or
            [int64]$evidence.observed_at -gt $now -or
            [int64]$evidence.observed_at -lt ($now - 180) -or
            [int64]$evidence.expires_at -le $now
          ) {
            throw 'Fresh GUI evidence failed its identity, freshness, route, or authority contract.'
          }
          foreach ($name in @('packages_installed','persistent_service_enabled','raw_disk_changed','firmware_changed','bootloader_changed','security_reduced')) {
            if ($evidence.safety.$name -ne $false) {
              throw "Fresh GUI evidence crossed the bounded safety contract: $name"
            }
          }
          Write-Host "AURUM_EXTERNAL_EVIDENCE_VERIFIED node_id=$($evidence.node_id) route=$selectedRoute expires_at=$($evidence.expires_at) authority=false"

      - name: Publish only fresh evidence to Aurum trunk
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = 'Projects/Codelation/autobuild/external_evidence/adaptive_shell_gui_live_trial.json'
          git config user.name 'aurum-evidence-recovery[bot]'
          git config user.email 'aurum-evidence-recovery@users.noreply.github.com'
          git add -- $evidence
          $staged = @(git diff --cached --name-only)
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the bounded evidence change.' }
          if ($staged.Count -eq 0) {
            Write-Host 'AURUM_EXTERNAL_EVIDENCE unchanged=true'
            exit 0
          }
          if ($staged.Count -ne 1 -or [string]$staged[0] -ne $evidence) {
            throw "Recovery attempted to stage files outside the bounded evidence path: $($staged -join ', ')"
          }
          git commit -m 'Refresh bounded Aurum GUI live-trial evidence'
          if ($LASTEXITCODE -ne 0) { throw 'Could not checkpoint fresh bounded evidence.' }

          for ($attempt = 1; $attempt -le 4; $attempt++) {
            git fetch origin $env:AURUM_TRUNK
            if ($LASTEXITCODE -ne 0) { throw 'Could not refresh Aurum trunk before evidence publication.' }
            git rebase "origin/$env:AURUM_TRUNK"
            if ($LASTEXITCODE -eq 0) {
              git push origin "HEAD:$env:AURUM_TRUNK"
              if ($LASTEXITCODE -eq 0) {
                Write-Host 'AURUM_EXTERNAL_EVIDENCE published=true continuation=pending-explicit-dispatch'
                exit 0
              }
            }
            git rebase --abort 2>$null
            Start-Sleep -Seconds $attempt
          }
          throw 'Fresh bounded evidence could not be published without overwriting concurrent Aurum work.'

      - name: Continue native growth from recovered evidence
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $body = @{ ref = $env:AURUM_TRUNK } | ConvertTo-Json -Compress
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/aurum-autobuild.yml/dispatches"
          Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -Body $body -ContentType 'application/json' | Out-Null
          Write-Host 'AURUM_EXTERNAL_EVIDENCE continuation_dispatched=true trigger=explicit-workflow-dispatch authority=none'
