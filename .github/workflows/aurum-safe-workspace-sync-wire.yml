name: Aurum Safe Workspace Sync Wiring

on:
  push:
    branches:
      - aurum/trunk-v0.01
    paths:
      - '.github/scripts/patch_aurum_safe_workspace_sync.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aurum/trunk-v0.01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch dirty-workspace sync behavior
        run: python .github/scripts/patch_aurum_safe_workspace_sync.py
      - name: Validate recovery contract
        run: |
          python -m py_compile Projects/AurumPC/aurum_workspace.py Projects/AurumPC/aurum_autonomy.py Projects/AurumPC/aurum_sync_recovery.py Projects/AurumPC/aurum_runtime_update.py
          python -m unittest Projects.AurumPC.tests.test_aurum_sync_recovery
          python - <<'PY'
          from pathlib import Path
          workspace = Path('Projects/AurumPC/aurum_workspace.py').read_text(encoding='utf-8')
          autonomy = Path('Projects/AurumPC/aurum_autonomy.py').read_text(encoding='utf-8')
          runtime = Path('Projects/AurumPC/aurum_runtime_update.py').read_text(encoding='utf-8')
          build = Path('Projects/AurumPC/build-iso.sh').read_text(encoding='utf-8')
          for text in (workspace, autonomy):
              assert 'aurum-auto-checkpoint-' in text
              assert 'last-workspace-checkpoint.json' in text
              assert 'stash' in text
          assert 'refusing to overwrite or merge them' not in workspace
          assert '"reason": "workspace-dirty"' not in autonomy
          assert '"aurum_sync_recovery.py"' in runtime
          assert 'aurum_sync_recovery.py' in build
          PY
      - name: Commit safe sync wiring
        run: |
          if git diff --quiet -- Projects/AurumPC/aurum_workspace.py Projects/AurumPC/aurum_autonomy.py Projects/AurumPC/aurum_runtime_update.py Projects/AurumPC/build-iso.sh; then
            echo 'Safe workspace sync already wired.'
            exit 0
          fi
          git config user.name 'aurum-safe-sync[bot]'
          git config user.email 'aurum-safe-sync[bot]@users.noreply.github.com'
          git add Projects/AurumPC/aurum_workspace.py Projects/AurumPC/aurum_autonomy.py Projects/AurumPC/aurum_runtime_update.py Projects/AurumPC/build-iso.sh
          git commit -m 'Checkpoint dirty Aurum workspaces before sync [skip ci]'
          git push origin HEAD:aurum/trunk-v0.01
