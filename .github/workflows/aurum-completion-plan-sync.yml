name: Aurum Completion Plan Release Sync

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Aurum Tiny Seed Handoff'
      - 'Aurum Read-Only USB Discovery'
      - 'Aurum Tiny Seed One-Shot Flash Request'
      - 'Aurum Pi3 Adaptive Driver Generation 2'
      - 'Aurum Pi3 Kernel Canary Preflight'
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'Projects/Aurum/Release/latest-tinyseed-handoff.json'
      - 'Projects/Aurum/Recovery/latest-usb-discovery.json'
      - 'Projects/Aurum/Recovery/latest-tinyseed-physical-preflight.json'
      - 'Projects/Aurum/Recovery/latest-tinyseed-flash-receipt.json'
      - 'Projects/AurumBridge/results/hopper-recovery-path-latest.json'
      - 'Projects/Aurum/Release/critical-workflows/aurum-tiny-seed-fallback-canonical-provenance.json'
      - 'Projects/Aurum/Release/critical-workflows/aurum-tiny-seed-x86-fallback-carrier-matrix-experiment.json'
      - 'Projects/AdaptiveDrivers/evidence/pi3-generation2-physical.json'
      - 'Projects/AdaptiveDrivers/evidence/pi3-kernel-canary-preflight.json'
      # These files also contain non-canonical planning/calibration fields that
      # are legitimately edited by other lanes. Re-run the projectors after those
      # edits so embedded canonical release/physical truth cannot drift.
      - 'Projects/Aurum/completion-plan.json'
      - 'Projects/Aurum/future-branches.json'
      - 'Prompts/FutureBranchSeed.txt'
      - 'Admin/sync_aurum_release_status.py'
      - 'Admin/sync_aurum_pi3_status.py'
      - 'Admin/sync_aurum_future_branch_evidence.py'
      - 'Admin/sync_aurum_fallback_evidence.py'
      - 'Admin/materialize_aurum_next_interaction.py'
      - '.github/workflows/aurum-usb-discovery.yml'
      - '.github/workflows/aurum-completion-plan-sync.yml'

permissions:
  contents: write

concurrency:
  group: aurum-completion-plan-release-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out canonical state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Project canonical handoff identity into completion plan
        run: python Admin/sync_aurum_release_status.py

      - name: Project verified experimental Pi3 evidence into completion plan
        run: python Admin/sync_aurum_pi3_status.py

      - name: Project canonical release and preflight evidence into Future Branch
        run: python Admin/sync_aurum_future_branch_evidence.py

      - name: Project fallback freshness into Future Branch
        run: python Admin/sync_aurum_fallback_evidence.py

      - name: Materialize next-interaction handoff packet
        run: python Admin/materialize_aurum_next_interaction.py

      - name: Persist synchronized Aurum state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aurum-completion-plan[bot]'
          git config user.email 'aurum-completion-plan@users.noreply.github.com'

          projected_files=(
            Projects/Aurum/completion-plan.json
            Projects/Aurum/future-branches.json
            Projects/Aurum/next-interaction-packet.json
          )

          project_latest_state() {
            python Admin/sync_aurum_release_status.py
            python Admin/sync_aurum_pi3_status.py
            python Admin/sync_aurum_future_branch_evidence.py
            python Admin/sync_aurum_fallback_evidence.py
            python Admin/materialize_aurum_next_interaction.py
          }

          for attempt in 1 2 3; do
            projected_head="$(git rev-parse HEAD)"
            git add "${projected_files[@]}"
            if git diff --cached --quiet; then
              echo "AURUM_STATE_SYNC unchanged=true attempt=${attempt} projected_head=${projected_head}"
              exit 0
            fi

            git commit -m 'Synchronize Aurum canonical evidence and interaction handoff [skip ci]'
            projected_commit="$(git rev-parse HEAD)"
            if git push origin HEAD:main; then
              echo "AURUM_STATE_SYNC persisted=true attempt=${attempt} projected_head=${projected_head} projected_commit=${projected_commit}"
              exit 0
            fi

            git fetch origin main
            remote_head="$(git rev-parse origin/main)"
            if git diff --quiet "${projected_commit}" origin/main -- "${projected_files[@]}"; then
              echo "AURUM_STATE_SYNC converged_after_race=true attempt=${attempt} projected_head=${projected_head} remote_head=${remote_head}"
              exit 0
            fi

            if [[ "${remote_head}" == "${projected_head}" ]]; then
              echo "::error::AURUM_STATE_SYNC deferred_reason=publication-failed projected_head=${projected_head}"
              exit 1
            fi

            if [[ "${attempt}" == 3 ]]; then
              echo "::warning::AURUM_STATE_SYNC waiting_reason=main-advanced retry_exhausted=true projected_head=${projected_head} remote_head=${remote_head}"
              exit 0
            fi

            echo "::notice::AURUM_STATE_SYNC retrying_reason=main-advanced attempt=${attempt} projected_head=${projected_head} remote_head=${remote_head}"
            git checkout --detach origin/main
            project_latest_state
          done
