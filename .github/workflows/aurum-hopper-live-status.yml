name: Aurum Hopper Live Status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aurum-hopper-live-status.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: aurum-hopper-live-status
  cancel-in-progress: true

jobs:
  mirror:
    name: Mirror Hopper read-only status
    # Keep this read-only network probe on the dedicated Hopper evidence lane.
    # Generic Linux runners may not share the required local topology.
    runs-on: [self-hosted, Linux, hopper-status]
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Read Hopper health endpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Web/Aurum-Arkmatx
          out='Web/Aurum-Arkmatx/hopper-status.json'
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          observed="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          runner="$(hostname)"
          endpoint=''
          source_kind=''
          http=''

          for host in hopper.local pc-01.local hopper pc-01; do
            for spec in '8768/status:self-debug' '8767/proof:echo-proof'; do
              path="${spec%%:*}"
              kind="${spec##*:}"
              candidate="http://${host}:${path}"
              code="$(curl -fsS --connect-timeout 2 --max-time 4 -o "$body" -w '%{http_code}' "$candidate" 2>/dev/null || true)"
              if [ "$code" = '200' ] && python3 -m json.tool "$body" >/dev/null 2>&1; then
                endpoint="$candidate"
                source_kind="$kind"
                http="$code"
                break 2
              fi
            done
          done

          python3 - "$out" "$observed" "$runner" "$endpoint" "$source_kind" "$http" "$body" <<'PY'
          import json, sys
          from datetime import datetime, timezone

          out, observed, runner, endpoint, source_kind, http, body = sys.argv[1:]
          report = None
          if endpoint:
              try:
                  report = json.load(open(body, encoding='utf-8'))
              except Exception:
                  report = None
          payload = {
              'schema': 'aurum.hopper.live-status.v2',
              'observed_at': observed,
              'runner_host': runner,
              'reachable': bool(endpoint and report),
              'endpoint': endpoint or None,
              'source_kind': source_kind or None,
              'http_status': int(http) if http.isdigit() else None,
              'report': report,
          }
          if source_kind == 'self-debug' and isinstance(report, dict):
              payload['summary'] = {
                  'machine': report.get('machine') or 'Hopper',
                  'health': report.get('status'),
                  'issue_count': report.get('issue_count'),
                  'issues': [item.get('code') for item in (report.get('issues') or []) if isinstance(item, dict)],
                  'gui_status': (report.get('gui') or {}).get('status'),
                  'physical_desktop': (report.get('gui') or {}).get('physical_desktop'),
                  'touchpads': (report.get('input') or {}).get('touchpads'),
                  'pointers': (report.get('input') or {}).get('pointers'),
                  'libinput': (report.get('input') or {}).get('libinput'),
                  'runtime_changes': (report.get('runtime') or {}).get('changes'),
                  'online': (report.get('network') or {}).get('online'),
              }
          elif source_kind == 'echo-proof' and isinstance(report, dict):
              machine = report.get('machine') or {}
              display = report.get('display') or {}
              echo = report.get('echo') or {}
              input_state = report.get('input') or {}
              payload['summary'] = {
                  'machine': machine.get('display_name') or machine.get('hostname') or 'Hopper',
                  'health': 'legacy-proof',
                  'display_status': display.get('status'),
                  'physical_display': display.get('physical_display'),
                  'echo_status': echo.get('status'),
                  'pointer_path_available': input_state.get('pointer_path_available'),
              }
          else:
              payload['summary'] = {'machine': 'Hopper', 'health': 'unreachable'}

          # The probe may run every five minutes, but durable repository state should
          # change only when the dashboard-visible semantics change or when a bounded
          # freshness heartbeat is due. This keeps reachability responsive without
          # turning timestamps alone into evidence churn.
          previous = None
          try:
              with open(out, encoding='utf-8') as f:
                  previous = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError, OSError):
              previous = None

          semantic_keys = (
              'schema', 'reachable', 'endpoint', 'source_kind', 'http_status', 'summary'
          )
          semantic_changed = previous is None or any(
              previous.get(key) != payload.get(key) for key in semantic_keys
          )

          heartbeat_seconds = 1800
          heartbeat_due = True
          if previous and previous.get('observed_at'):
              try:
                  prior = datetime.fromisoformat(
                      str(previous['observed_at']).replace('Z', '+00:00')
                  )
                  now = datetime.fromisoformat(observed.replace('Z', '+00:00'))
                  if prior.tzinfo is None:
                      prior = prior.replace(tzinfo=timezone.utc)
                  if now.tzinfo is None:
                      now = now.replace(tzinfo=timezone.utc)
                  heartbeat_due = (now - prior).total_seconds() >= heartbeat_seconds
              except (TypeError, ValueError):
                  heartbeat_due = True

          if not semantic_changed and not heartbeat_due:
              print(
                  'Hopper semantic state unchanged; preserving prior durable snapshot '
                  f'until the {heartbeat_seconds // 60}-minute freshness heartbeat.'
              )
              print(json.dumps(previous, indent=2, sort_keys=True))
              raise SystemExit(0)

          with open(out, 'w', encoding='utf-8') as f:
              json.dump(payload, f, indent=2, sort_keys=True)
              f.write('\n')
          if semantic_changed:
              print('Persisting Hopper live status because semantic state changed.')
          else:
              print('Persisting Hopper live status freshness heartbeat.')
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Commit live status snapshot when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aurum-hopper-status[bot]'
          git config user.email 'aurum-hopper-status@users.noreply.github.com'
          git add -- Web/Aurum-Arkmatx/hopper-status.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update Hopper live status [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
