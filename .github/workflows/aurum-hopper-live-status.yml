name: Aurum Hopper Live Status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aurum-hopper-live-status.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: aurum-hopper-live-status
  cancel-in-progress: true

jobs:
  mirror:
    if: github.ref == 'refs/heads/main'
    name: Mirror Hopper read-only status
    # Keep this read-only network probe on the dedicated Hopper evidence lane.
    # Generic Linux runners may not share the required local topology.
    runs-on: [self-hosted, Linux, hopper-status]
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Read Hopper health endpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Web/Aurum-Arkmatx
          out='Web/Aurum-Arkmatx/hopper-status.json'
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          observed="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          runner="$(hostname)"
          endpoint=''
          source_kind=''
          http=''

          for host in hopper.local pc-01.local hopper pc-01; do
            for spec in '8768/status:self-debug' '8767/proof:echo-proof'; do
              path="${spec%%:*}"
              kind="${spec##*:}"
              candidate="http://${host}:${path}"
              code="$(curl -fsS --connect-timeout 2 --max-time 4 -o "$body" -w '%{http_code}' "$candidate" 2>/dev/null || true)"
              if [ "$code" = '200' ] && python3 -m json.tool "$body" >/dev/null 2>&1; then
                endpoint="$candidate"
                source_kind="$kind"
                http="$code"
                break 2
              fi
            done
          done

          python3 - "$out" "$observed" "$runner" "$endpoint" "$source_kind" "$http" "$body" <<'PY'
          import json, sys
          from datetime import datetime, timezone

          out, observed, runner, endpoint, source_kind, http, body = sys.argv[1:]
          report = None
          if endpoint:
              try:
                  report = json.load(open(body, encoding='utf-8'))
              except Exception:
                  report = None
          payload = {
              'schema': 'aurum.hopper.live-status.v2',
              'observed_at': observed,
              'runner_host': runner,
              'reachable': bool(endpoint and report),
              'endpoint': endpoint or None,
              'source_kind': source_kind or None,
              'http_status': int(http) if http.isdigit() else None,
              'report': report,
          }
          if source_kind == 'self-debug' and isinstance(report, dict):
              payload['summary'] = {
                  'machine': report.get('machine') or 'Hopper',
                  'health': report.get('status'),
                  'issue_count': report.get('issue_count'),
                  'issues': [item.get('code') for item in (report.get('issues') or []) if isinstance(item, dict)],
                  'gui_status': (report.get('gui') or {}).get('status'),
                  'physical_desktop': (report.get('gui') or {}).get('physical_desktop'),
                  'touchpads': (report.get('input') or {}).get('touchpads'),
                  'pointers': (report.get('input') or {}).get('pointers'),
                  'libinput': (report.get('input') or {}).get('libinput'),
                  'runtime_changes': (report.get('runtime') or {}).get('changes'),
                  'online': (report.get('network') or {}).get('online'),
              }
          elif source_kind == 'echo-proof' and isinstance(report, dict):
              machine = report.get('machine') or {}
              display = report.get('display') or {}
              echo = report.get('echo') or {}
              input_state = report.get('input') or {}
              payload['summary'] = {
                  'machine': machine.get('display_name') or machine.get('hostname') or 'Hopper',
                  'health': 'legacy-proof',
                  'display_status': display.get('status'),
                  'physical_display': display.get('physical_display'),
                  'echo_status': echo.get('status'),
                  'pointer_path_available': input_state.get('pointer_path_available'),
              }
          else:
              # No endpoint candidate returned HTTP 200 JSON. This is a discovery
              # boundary, not proof that Hopper is powered off, network-down, or
              # otherwise unreachable at a known address.
              payload['summary'] = {'machine': 'Hopper', 'health': 'no-endpoint-candidate'}

          # The probe may run every five minutes, but durable repository state should
          # change only when the dashboard-visible semantics change or when a bounded
          # freshness heartbeat is due. This keeps reachability responsive without
          # turning timestamps alone into evidence churn.
          previous = None
          try:
              with open(out, encoding='utf-8') as f:
                  previous = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError, OSError):
              previous = None

          semantic_keys = (
              'schema', 'reachable', 'endpoint', 'source_kind', 'http_status', 'summary'
          )
          semantic_changed = previous is None or any(
              previous.get(key) != payload.get(key) for key in semantic_keys
          )

          heartbeat_seconds = 1800
          heartbeat_due = True
          if previous and previous.get('observed_at'):
              try:
                  prior = datetime.fromisoformat(
                      str(previous['observed_at']).replace('Z', '+00:00')
                  )
                  now = datetime.fromisoformat(observed.replace('Z', '+00:00'))
                  if prior.tzinfo is None:
                      prior = prior.replace(tzinfo=timezone.utc)
                  if now.tzinfo is None:
                      now = now.replace(tzinfo=timezone.utc)
                  heartbeat_due = (now - prior).total_seconds() >= heartbeat_seconds
              except (TypeError, ValueError):
                  heartbeat_due = True

          if not semantic_changed and not heartbeat_due:
              print(
                  'Hopper semantic state unchanged; preserving prior durable snapshot '
                  f'until the {heartbeat_seconds // 60}-minute freshness heartbeat.'
              )
              print(json.dumps(previous, indent=2, sort_keys=True))
              raise SystemExit(0)

          with open(out, 'w', encoding='utf-8') as f:
              json.dump(payload, f, indent=2, sort_keys=True)
              f.write('\n')
          if semantic_changed:
              print('Persisting Hopper live status because semantic state changed.')
          else:
              print('Persisting Hopper live status freshness heartbeat.')
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Publish verified live status snapshot when changed
        # GITHUB_TOKEN remains subject to the repository rules. No bypass token
        # or locally held signing key is used.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_GRAPHQL_URL: ${{ github.graphql_url }}
          GH_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          git diff --quiet -- Web/Aurum-Arkmatx/hopper-status.json && exit 0
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request
          from pathlib import Path

          path = 'Web/Aurum-Arkmatx/hopper-status.json'
          snapshot = Path(path).read_bytes()
          # Bind publication to the revision actually inspected. If main moves,
          # leave it untouched and let the next scheduled probe inspect fresh state.
          head = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          query = """
          mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit { oid url signature { isValid state } }
            }
          }
          """
          variables = {'input': {
              'branch': {
                  'repositoryNameWithOwner': os.environ['GH_REPOSITORY'],
                  'refName': 'main',
              },
              'expectedHeadOid': head,
              'message': {'headline': 'Update Hopper live status [skip ci]'},
              'fileChanges': {'additions': [{
                  'path': path,
                  'contents': base64.b64encode(snapshot).decode('ascii'),
              }]},
          }}

          def request(url, payload=None):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  # Do not print credentials or the status payload.
                  raise SystemExit(
                      f'Publication API rejected request (HTTP {exc.code}); '
                      'inspect repository rules/token authorization. No retry or bypass.'
                  ) from None
              except (urllib.error.URLError, TimeoutError):
                  raise SystemExit(
                      'Publication transport outcome uncertain; inspect main before '
                      'another attempt. No automatic replay.'
                  ) from None

          result = request(os.environ['GH_GRAPHQL_URL'], {
              'query': query, 'variables': variables,
          })
          if result.get('errors'):
              # GraphQL may return HTTP 200 for rule/authorization/head conflicts.
              print(json.dumps(result['errors']))
              raise SystemExit(
                  'Publication rejected or uncertain. Preserve branch rules; '
                  'inspect authorization/head state before retrying.'
              )
          commit = result['data']['createCommitOnBranch']['commit']
          signature = commit.get('signature') or {}
          if signature.get('isValid') is not True or signature.get('state') != 'VALID':
              raise SystemExit('Publication returned an unverified signature; investigate.')
          # Independently read the immutable commit and file, rather than treating
          # mutation completion as proof of the published bytes.
          api = os.environ['GH_API_URL'].rstrip('/')
          repo = os.environ['GH_REPOSITORY']
          oid = commit['oid']
          verified = request(f'{api}/repos/{repo}/commits/{oid}')
          if verified['commit']['verification'].get('verified') is not True:
              raise SystemExit('REST readback did not verify the published signature.')
          published = request(f'{api}/repos/{repo}/contents/{path}?ref={oid}')
          if base64.b64decode(published['content']) != snapshot:
              raise SystemExit('Published snapshot readback differs from the inspected bytes.')
          print('Verified signed status publication: ' + commit['url'])
          print('Publication does not establish Hopper endpoint discovery or runtime health.')
          PY
