name: Aurum Local Usage Loop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Projects/AurumBridge/UsageLoop.ps1'
      - 'Projects/AurumBridge/usage-events/**'
      - '.github/workflows/aurum-usage-loop.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: aurum-local-usage-loop
  cancel-in-progress: false

jobs:
  usage-loop:
    name: Detect and preserve local usage incidents
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Run local usage loop
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $root = $env:GITHUB_WORKSPACE
          $usageLoop = Join-Path $root 'Projects/AurumBridge/UsageLoop.ps1'
          $eventsDir = Join-Path $root 'Projects/AurumBridge/usage-events'
          $resultsDir = Join-Path $root 'Projects/AurumBridge/usage-results'
          New-Item -ItemType Directory -Path $eventsDir -Force | Out-Null
          New-Item -ItemType Directory -Path $resultsDir -Force | Out-Null
          . $usageLoop

          $newEvidence = $false
          foreach ($eventFile in @(Get-ChildItem -LiteralPath $eventsDir -File -Filter '*.json' -ErrorAction SilentlyContinue | Sort-Object Name)) {
            $resultPath = Join-Path $resultsDir $eventFile.Name
            if (Test-Path -LiteralPath $resultPath) { continue }
            $event = Get-Content -LiteralPath $eventFile.FullName -Raw | ConvertFrom-Json
            if ([string]$event.schema -ne 'aurum-usage-event-v1') { throw "AURUM_USAGE_EVENT_INVALID file=$($eventFile.Name)" }
            $registered = Register-AurumUsageIncident -Event $event
            $registered | ConvertTo-Json -Depth 14 | Set-Content -LiteralPath $resultPath -Encoding UTF8
            $newEvidence = $true
            Write-Host "AURUM_USAGE_EVENT_RECORDED file=$($eventFile.Name) incident=$($registered.incident.incident_id) deduplicated=$($registered.deduplicated)"
          }

          $before = Get-AurumUsageLoopStatus
          $beforeId = [string]$before.state.latest_incident_id
          $scan = Invoke-AurumUsageScan -LookbackMinutes 120
          $after = Get-AurumUsageLoopStatus
          $afterId = [string]$after.state.latest_incident_id

          if ($scan.detections.Count -gt 0 -and $afterId -and $afterId -ne $beforeId) {
            $scanResult = Join-Path $resultsDir "auto-$afterId.json"
            if (-not (Test-Path -LiteralPath $scanResult)) {
              [ordered]@{
                schema = 'aurum-usage-auto-evidence-v1'
                incident_id = $afterId
                observed_at = $after.state.latest_incident_at
                detection_count = $scan.detections.Count
                report_pending = $after.state.report_pending
                local_only_continuation = $after.state.local_only_continuation
                note = 'Sanitized local evidence only; authoritative metered usage quantity requires OpenAI server telemetry.'
              } | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $scanResult -Encoding UTF8
              $newEvidence = $true
              Write-Host "AURUM_USAGE_AUTO_DETECTED incident=$afterId detections=$($scan.detections.Count)"
            }
          }

          if (-not $newEvidence) {
            Write-Host "AURUM_USAGE_LOOP_OK state=$($after.state.model_access) new_incident=false"
            exit 0
          }

          git config user.name 'aurum-usage-loop[bot]'
          git config user.email 'aurum-usage-loop@users.noreply.github.com'
          git add -- 'Projects/AurumBridge/usage-results'
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'AURUM_USAGE_LOOP_NO_REPO_EVIDENCE'
            exit 0
          }

          git commit -m 'Record Aurum usage incident evidence [skip ci]'
          $pushed = $false
          for ($attempt = 1; $attempt -le 3 -and -not $pushed; $attempt++) {
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) { throw 'AURUM_USAGE_LOOP_PUSH_PREP_FAILED' }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            Start-Sleep -Seconds (2 * $attempt)
          }
          if (-not $pushed) { throw 'AURUM_USAGE_LOOP_PUSH_FAILED' }
          Write-Host 'AURUM_USAGE_LOOP_EVIDENCE_COMMITTED'
