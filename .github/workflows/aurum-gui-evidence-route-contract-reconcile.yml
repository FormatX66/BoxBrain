name: Aurum GUI Evidence Route Contract Reconcile

on:
  push:
    branches:
      - aurum/fix-gui-evidence-route-contract-20260828
    paths:
      - '.github/workflows/aurum-gui-evidence-route-contract-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: aurum/fix-gui-evidence-route-contract-20260828
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'

      - name: Reconcile preapproved GUI evidence route contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('Projects/Codelation/field/external_prerequisite_evidence.py')
          text = source.read_text(encoding='utf-8')

          anchor = 'USB_SSH_ROUTE = "10.12.194.1"\n'
          addition = '''USB_SSH_ROUTE = "10.12.194.1"\n# GUI live-trial recovery may fall back only across this preapproved strict-SSH\n# route set. Host-key pinning, dedicated identity, loopback-only runtime binding,\n# freshness, and zero-authority checks remain mandatory on every route.\nGUI_LIVE_TRIAL_APPROVED_ROUTES = frozenset(\n    {USB_SSH_ROUTE, "10.42.194.1", "bbpi4.local", "192.168.0.194"}\n)\n'''
          if text.count(anchor) != 1:
              raise SystemExit('USB route anchor was not unique')
          text = text.replace(anchor, addition, 1)

          old_node = '''    if (\n        not node_id\n        or node_id in WINDOWS_CONTROLLER_NODE_IDS\n        or route != USB_SSH_ROUTE\n        or not re.fullmatch(r"SHA256:[A-Za-z0-9+/]{43}", host_key)\n    ):\n        return ExternalEvidenceApplication(spec, False, "gui-live-trial-node-binding-invalid")\n'''
          new_node = '''    if (\n        not node_id\n        or node_id in WINDOWS_CONTROLLER_NODE_IDS\n        or route not in GUI_LIVE_TRIAL_APPROVED_ROUTES\n        or not re.fullmatch(r"SHA256:[A-Za-z0-9+/]{43}", host_key)\n    ):\n        return ExternalEvidenceApplication(spec, False, "gui-live-trial-node-binding-invalid")\n'''
          if text.count(old_node) != 1:
              raise SystemExit('GUI live-trial node-binding block was not unique')
          text = text.replace(old_node, new_node, 1)

          old_transport = '''    if (\n        not isinstance(transport, Mapping)\n        or transport.get("strict_host_key_checking") is not True\n        or transport.get("dedicated_identity") is not True\n        or transport.get("usb_route") != USB_SSH_ROUTE\n        or transport.get("windows_endpoint_loopback") is not True\n        or transport.get("pi_endpoint_loopback") is not True\n    ):\n        return ExternalEvidenceApplication(spec, False, "gui-live-trial-transport-invalid")\n'''
          new_transport = '''    if (\n        not isinstance(transport, Mapping)\n        or transport.get("strict_host_key_checking") is not True\n        or transport.get("dedicated_identity") is not True\n        or transport.get("usb_route") != route\n        or transport.get("windows_endpoint_loopback") is not True\n        or transport.get("pi_endpoint_loopback") is not True\n    ):\n        return ExternalEvidenceApplication(spec, False, "gui-live-trial-transport-invalid")\n'''
          if text.count(old_transport) != 1:
              raise SystemExit('GUI live-trial transport block was not unique')
          text = text.replace(old_transport, new_transport, 1)
          source.write_text(text, encoding='utf-8')

          tests = Path('Projects/Codelation/tests/test_adaptive_shell_gui_deployment.py')
          test_text = tests.read_text(encoding='utf-8')
          test_anchor = '''        self.assertFalse(applied.evidence["authority_granted"])\n        verified = verify_local_capability_for_gap(\n            applied.spec,\n            "required-condition-classifier",\n        )\n'''
          test_addition = '''        self.assertFalse(applied.evidence["authority_granted"])\n\n        for approved_route in ("10.12.194.1", "10.42.194.1", "bbpi4.local", "192.168.0.194"):\n            routed = copy.deepcopy(evidence)\n            routed["route"] = approved_route\n            routed["transport"]["usb_route"] = approved_route\n            accepted_route = apply_adaptive_shell_gui_live_trial_evidence(\n                spec, routed, now=int(evidence["observed_at"]) + 1\n            )\n            self.assertTrue(accepted_route.applied, approved_route)\n\n        unapproved_route = copy.deepcopy(evidence)\n        unapproved_route["route"] = "203.0.113.10"\n        unapproved_route["transport"]["usb_route"] = "203.0.113.10"\n        rejected_route = apply_adaptive_shell_gui_live_trial_evidence(\n            spec, unapproved_route, now=int(evidence["observed_at"]) + 1\n        )\n        self.assertFalse(rejected_route.applied)\n        self.assertEqual(rejected_route.reason, "gui-live-trial-node-binding-invalid")\n\n        verified = verify_local_capability_for_gap(\n            applied.spec,\n            "required-condition-classifier",\n        )\n'''
          # The same assertion appears in several tests; bind replacement to this live-trial
          # method by splitting at its method header first.
          marker = '    def test_gui_live_trial_preserves_human_constants_and_dialogue_boundary(self) -> None:\n'
          if test_text.count(marker) != 1:
              raise SystemExit('GUI live-trial test marker was not unique')
          before, after = test_text.split(marker, 1)
          if after.count(test_anchor) < 1:
              raise SystemExit('GUI live-trial assertion anchor was not found')
          after = after.replace(test_anchor, test_addition, 1)
          tests.write_text(before + marker + after, encoding='utf-8')
          PY

      - name: Verify reconciled contract
        shell: bash
        run: >-
          python3 -m unittest
          Projects.Codelation.tests.test_adaptive_shell_gui_deployment
          Projects.Codelation.tests.test_external_evidence_recovery_contract
          -v

      - name: Commit bounded reconciliation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aurum-contract-reconcile[bot]'
          git config user.email 'aurum-contract-reconcile@users.noreply.github.com'
          git rm -- '.github/workflows/aurum-gui-evidence-route-contract-reconcile.yml'
          git add -- 'Projects/Codelation/field/external_prerequisite_evidence.py' 'Projects/Codelation/tests/test_adaptive_shell_gui_deployment.py'
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/aurum-gui-evidence-route-contract-reconcile.yml' 'Projects/Codelation/field/external_prerequisite_evidence.py' 'Projects/Codelation/tests/test_adaptive_shell_gui_deployment.py' | sort)"
          test "$staged" = "$expected"
          git commit -m 'Reconcile GUI evidence route contract'
          git push origin HEAD:aurum/fix-gui-evidence-route-contract-20260828
