name: Aurum Parallel Experiments

on:
  workflow_dispatch:
  push:
    paths:
      - 'Projects/Aurum/Experiments/**'
      - '.github/workflows/aurum-experiments.yml'

permissions:
  contents: read

jobs:
  stateweave:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out genetics
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test StateWeave independently
        run: |
          cd Projects/Aurum/Experiments
          python3 -m unittest -v test_experiment_suite.StateWeaveTests

  adaptive-kernel:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out genetics
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test adaptive-kernel policy independently
        run: |
          cd Projects/Aurum/Experiments
          python3 -m unittest -v test_experiment_suite.AdaptiveKernelTests

  stateweave-adaptive-kernel:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out genetics
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test combined hypothesis separately
        run: |
          cd Projects/Aurum/Experiments
          python3 -m unittest -v test_experiment_suite.CombinedExperimentTests

  anticipatory-state:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out genetics
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test anticipatory resource scheduling
        run: |
          cd Projects/Aurum/Experiments
          python3 -m unittest -v test_anticipatory_state

  future-branch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out genetics
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test answer execute prepare and wait decisions
        run: |
          cd Projects/Aurum/Experiments
          python3 -m unittest -v test_future_branch

  future-branch-feasibility:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out genetics
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test speculative information-value gate
        run: |
          cd Projects/Aurum/Experiments
          python3 -m unittest -v test_speculative_feasibility

  future-branch-calibration:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out genetics
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test prediction versus execution calibration
        run: |
          cd Projects/Aurum/Experiments
          python3 -m unittest -v test_future_branch_calibrator

  future-branch-benchmark:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out genetics
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test reactive versus anticipatory human latency
        run: |
          cd Projects/Aurum/Experiments
          python3 -m unittest -v test_future_branch_benchmark

  universal-carrier-plan:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out genetics
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test universal carrier layout invariants
        run: |
          cd Projects/Aurum/Experiments
          python3 -m unittest -v test_universal_carrier

  recovery-control-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out genetics
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test fail-closed remote recovery contract
        run: |
          cd Projects/Aurum/Experiments
          python3 -m unittest -v test_experiment_suite.RecoveryControlTests
