name: Aurum Capacity Mesh (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Retired - use aurum/trunk-v0.01
    if: ${{ false }}
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - name: Superseded branch guard
        run: echo 'aurum/capacity-mesh-v0 is retired; capacity mesh execution is allowed only from aurum/trunk-v0.01.'
