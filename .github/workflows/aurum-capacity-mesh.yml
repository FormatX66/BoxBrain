name: Aurum Capacity Mesh

on:
  workflow_dispatch:
  repository_dispatch:
    types: [aurum-capacity-mesh]
  push:
    branches:
      - aurum/trunk-v0.01
    paths:
      - '.github/workflows/aurum-capacity-mesh.yml'
      - 'Projects/Codelation/autobuild/capacity_mesh_policy.json'
      - 'Projects/Codelation/run_capacity_mesh_cycle.py'
      - 'Projects/Codelation/run_capacity_mesh_lane.py'
      - 'Projects/Codelation/field/mesh_efficiency.py'
      - 'Projects/Codelation/field/capacity_mesh.py'
      - 'Projects/Codelation/field/windows_node_growth.py'
      - 'Projects/Codelation/tests/test_mesh_efficiency.py'
      - 'Projects/Codelation/tests/test_capacity_mesh.py'
      - 'Projects/Codelation/tests/test_windows_node_growth.py'

permissions:
  contents: read

concurrency:
  group: aurum-capacity-mesh-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out Aurum trunk
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: aurum/trunk-v0.01
          fetch-depth: 1
      - name: Refuse inefficient or duplicate fan-out
        shell: bash
        run: |
          set -euo pipefail
          python3 Projects/Codelation/run_capacity_mesh_cycle.py --audit
      - name: Build bounded fan-out matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          MATRIX="$(python3 Projects/Codelation/run_capacity_mesh_cycle.py --github-matrix)"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "${MATRIX}"

  lane:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    continue-on-error: ${{ matrix.posture == 'adventurous' }}
    steps:
      - name: Check out exact Aurum source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: aurum/trunk-v0.01
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Run independent bounded shard
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          mkdir -p mesh-results
          python3 Projects/Codelation/run_capacity_mesh_lane.py \
            --name '${{ matrix.name }}' \
            --posture '${{ matrix.posture }}' \
            --suite '${{ matrix.suite }}' \
            --shard-index '${{ matrix.shard_index }}' \
            --shard-count '${{ matrix.shard_count }}' \
            --result 'mesh-results/${{ matrix.name }}.json'
      - name: Publish lane evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aurum-mesh-${{ matrix.name }}-${{ github.run_id }}
          path: mesh-results/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 7

  fan-in:
    if: always()
    needs: [plan, lane]
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Enforce verified fan-in boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "planner=${{ needs.plan.result }}"
          echo "lanes=${{ needs.lane.result }}"
          if [ '${{ needs.plan.result }}' != 'success' ]; then exit 1; fi
          if [ '${{ needs.lane.result }}' != 'success' ]; then exit 1; fi
          echo 'AURUM_CAPACITY_MESH_VERIFIED_FAN_IN'
