name: Aurum PC v0.01 Image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/aurum-pc-v001.yml'
      - 'Projects/AurumPC/**'
      - 'Projects/AurumVirtualLab/**'
      - 'Projects/Codelation/**'
  push:
    branches:
      - aurum/pc-v0.01
      - aurum/pi3-v0.01
      - aurum/trunk-v0.01
      - 'agent/**'
    paths:
      - '.github/workflows/aurum-pc-v001.yml'
      - 'Projects/AurumPC/**'
      - 'Projects/AurumVirtualLab/**'
      - 'Projects/Codelation/**'

permissions:
  contents: read

concurrency:
  group: aurum-pc-v001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Check out Aurum PC branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Validate bounded runtime sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            Projects/AurumPC/aurum_bootstrap.py \
            Projects/AurumPC/aurum_hardware.py \
            Projects/AurumPC/aurum_network.py \
            Projects/AurumPC/aurum_time.py \
            Projects/AurumPC/aurum_wifi_diag.py \
            Projects/AurumPC/aurum_wifi_recovery.py \
            Projects/AurumPC/aurum_console.py \
            Projects/AurumPC/aurum_workspace.py \
            Projects/AurumPC/aurum_installer.py \
            Projects/AurumPC/aurum_boot_state.py \
            Projects/Codelation/state_space.py
          sh -n Projects/AurumPC/build-iso.sh
          sh -n Projects/AurumPC/build-direct-uefi-image.sh
          bash -n Projects/AurumVirtualLab/qemu-pc-direct-uefi.sh
          bash -n Projects/AurumVirtualLab/qemu-hp-physical-twin.sh
          python3 -m unittest discover -s Projects/AurumPC/tests -v
          grep -q 'git-sync authorize-network' Projects/AurumPC/aurum_console.py
          grep -q 'git-promote authorize-network confirm-push' Projects/AurumPC/aurum_console.py
          grep -q 'install confirm ERASE-CODE' Projects/AurumPC/aurum_console.py
          grep -q 'internal_disk_writes.*False' Projects/AurumPC/aurum_hardware.py
          grep -q 'preserve_current_removable_boot.*True' Projects/AurumPC/aurum_hardware.py
          grep -q 'AURUM_WIFI_DIAG' Projects/AurumPC/aurum_bootstrap.py
          grep -q 'recover_existing_wifi_driver' Projects/AurumPC/aurum_bootstrap.py
          grep -q 'synchronize_clock' Projects/AurumPC/aurum_bootstrap.py

      - name: Install independent VM tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y qemu-system-x86 ovmf parted
          docker info >/dev/null

      - name: Build independent Aurum PC boot artifacts
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:bookworm \
            sh -lc '
              set -eu
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                live-build debian-archive-keyring debootstrap \
                xorriso isolinux syslinux-common squashfs-tools \
                grub-pc-bin grub-efi-amd64-bin dosfstools mtools \
                parted e2fsprogs util-linux systemd-boot-efi binutils
              lb --version
              AURUM_BUILD_DIRECT_UEFI=required sh Projects/AurumPC/build-iso.sh
            '
          test -s dist/Aurum-PC-v0.01-amd64.iso
          test -s dist/Aurum-PC-v0.01-amd64-direct-uefi.img
          sha256sum -c dist/Aurum-PC-v0.01-amd64.iso.sha256
          sha256sum -c dist/Aurum-PC-v0.01-amd64-direct-uefi.img.sha256

      - name: GRUB ISO UEFI boot and install smoke test
        shell: bash
        run: |
          set -euo pipefail
          bash Projects/AurumVirtualLab/qemu-pc-smoke.sh \
            dist/Aurum-PC-v0.01-amd64.iso \
            aurum-pc-qemu.log
          grep -q 'AURUM_HARDWARE_PROFILE status=ready' aurum-pc-qemu.log
          echo 'AURUM_PC_V001_GRUB_UEFI_BOOT_VERIFIED'

      - name: Direct UEFI boot smoke test
        shell: bash
        run: |
          set -euo pipefail
          bash Projects/AurumVirtualLab/qemu-pc-direct-uefi.sh \
            dist/Aurum-PC-v0.01-amd64-direct-uefi.img \
            aurum-pc-direct-uefi.log
          grep -q 'AURUM_DIRECT_UEFI_GRUB_INDEPENDENT_OK' aurum-pc-direct-uefi.log
          echo 'AURUM_PC_V001_DIRECT_UEFI_BOOT_VERIFIED'

      - name: HP physical-topology twin preflight
        shell: bash
        run: |
          set -euo pipefail
          bash Projects/AurumVirtualLab/qemu-hp-physical-twin.sh \
            dist/Aurum-PC-v0.01-amd64.iso \
            aurum-hp-physical-twin.log
          grep -q 'AURUM_HP_TWIN_UEFI_USB_BOOT_OK' aurum-hp-physical-twin.log
          grep -q 'AURUM_HP_TWIN_NVME_PRESERVED_OK' aurum-hp-physical-twin.log
          grep -q 'AURUM_HP_TWIN_WIFI_MISSING_DIAGNOSTIC_OK' aurum-hp-physical-twin.log
          grep -q 'AURUM_HP_TWIN_DETAILED_HARDWARE_OK' aurum-hp-physical-twin.log
          echo 'AURUM_HP_PHYSICAL_TWIN_PREFLIGHT_VERIFIED'

      - name: Record image metadata
        shell: bash
        run: |
          set -euo pipefail
          ls -lh \
            dist/Aurum-PC-v0.01-amd64.iso \
            dist/Aurum-PC-v0.01-amd64-direct-uefi.img
          cat dist/Aurum-PC-v0.01-amd64.iso.sha256
          cat dist/Aurum-PC-v0.01-amd64-direct-uefi.img.sha256

      - name: Publish boot-verified PC seeds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Aurum-PC-v0.01-amd64
          path: |
            dist/Aurum-PC-v0.01-amd64.iso
            dist/Aurum-PC-v0.01-amd64.iso.sha256
            dist/Aurum-PC-v0.01-amd64-direct-uefi.img
            dist/Aurum-PC-v0.01-amd64-direct-uefi.img.sha256
            aurum-pc-qemu.log
            aurum-pc-direct-uefi.log
            aurum-hp-physical-twin.log
            Projects/AurumVirtualLab/hp-physical-twin-v1.json
          if-no-files-found: error
          retention-days: 14
