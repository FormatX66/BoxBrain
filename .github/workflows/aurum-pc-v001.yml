name: Aurum PC v0.01 Image

on:
  workflow_dispatch:
  push:
    branches:
      - aurum/pc-v0.01
      - aurum/pi3-v0.01
      - 'agent/**'
    paths:
      - '.github/workflows/aurum-pc-v001.yml'
      - 'Projects/AurumPC/**'
      - 'Projects/Codelation/**'

permissions:
  contents: read

concurrency:
  group: aurum-pc-v001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out Aurum PC branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Validate bounded runtime sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Projects/AurumPC/aurum_console.py Projects/AurumPC/aurum_workspace.py
          sh -n Projects/AurumPC/build-iso.sh
          python3 -m unittest discover -s Projects/AurumPC/tests -v
          grep -q 'git-sync authorize-network' Projects/AurumPC/aurum_console.py
          grep -q 'git-promote authorize-network confirm-push' Projects/AurumPC/aurum_console.py
          grep -q 'Projects/Codelation' Projects/AurumPC/build-iso.sh
          grep -q 'aurum-self-build-farm.yml' Projects/AurumPC/build-iso.sh
          grep -q 'PYTHONPATH=/var/lib/aurum/workspace/BoxBrain:/opt/aurum' Projects/AurumPC/build-iso.sh

      - name: Install independent VM tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y qemu-system-x86 ovmf expect e2fsprogs
          docker info >/dev/null

      - name: Build Aurum PC live ISO with Debian-native tooling
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:bookworm \
            sh -lc '
              set -eu
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                live-build debian-archive-keyring debootstrap \
                xorriso isolinux syslinux-common squashfs-tools \
                grub-pc-bin grub-efi-amd64-bin dosfstools mtools
              lb --version
              sh Projects/AurumPC/build-iso.sh
            '
          test -s dist/Aurum-PC-v0.01-amd64.iso
          sha256sum -c dist/Aurum-PC-v0.01-amd64.iso.sha256

      - name: Prepare PC-01 persistence and read-only observation targets
        shell: bash
        run: |
          set -euo pipefail
          truncate -s 3G /tmp/aurum-persist.img
          mkfs.ext4 -q -F -L AURUM_PERSIST /tmp/aurum-persist.img
          mkdir -p /tmp/aurum-persist-mnt
          sudo mount -o loop /tmp/aurum-persist.img /tmp/aurum-persist-mnt
          printf '%s\n' '/ union' | sudo tee /tmp/aurum-persist-mnt/persistence.conf >/dev/null
          sudo umount /tmp/aurum-persist-mnt
          truncate -s 64M /tmp/aurum-nvme.img

      - name: UEFI PC-01 runtime and persistence smoke test
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /usr/share/OVMF/OVMF_CODE.fd ] && [ -f /usr/share/OVMF/OVMF_VARS.fd ]; then
            code=/usr/share/OVMF/OVMF_CODE.fd
            vars=/usr/share/OVMF/OVMF_VARS.fd
          elif [ -f /usr/share/OVMF/OVMF_CODE_4M.fd ] && [ -f /usr/share/OVMF/OVMF_VARS_4M.fd ]; then
            code=/usr/share/OVMF/OVMF_CODE_4M.fd
            vars=/usr/share/OVMF/OVMF_VARS_4M.fd
          else
            echo 'No matching OVMF CODE/VARS pair found.' >&2
            exit 1
          fi
          cp "$vars" /tmp/AURUM_OVMF_VARS.fd
          export AURUM_OVMF_CODE="$code"

          cat > /tmp/aurum-first.exp <<'EOF'
          log_user 1
          log_file -noappend aurum-pc-qemu.log
          set timeout 900
          spawn qemu-system-x86_64 \
            -machine q35,accel=tcg \
            -cpu qemu64 \
            -m 2048 \
            -smp 2 \
            -drive if=pflash,format=raw,readonly=on,file=$env(AURUM_OVMF_CODE) \
            -drive if=pflash,format=raw,file=/tmp/AURUM_OVMF_VARS.fd \
            -cdrom dist/Aurum-PC-v0.01-amd64.iso \
            -drive file=/tmp/aurum-persist.img,format=raw,if=virtio \
            -drive file=/tmp/aurum-nvme.img,format=raw,if=none,id=nvme0,readonly=on \
            -device nvme,drive=nvme0,serial=AURUMTESTNVME \
            -netdev user,id=net0 \
            -device virtio-net-pci,netdev=net0 \
            -boot d \
            -display none \
            -serial stdio \
            -monitor none \
            -no-reboot
          expect "AURUM_PC_READY version=0.01 arch=x86_64"
          expect "selftest=ok"
          expect "aurum> "
          send "hardware\r"
          expect "nvme0n1"
          expect "aurum> "
          send "network-status\r"
          expect "\"status\": \"ready\""
          expect "aurum> "
          send "git-status\r"
          expect "\"status\": \"not-initialized\""
          expect "aurum> "
          send "git-sync authorize-network\r"
          expect "\"branch\": \"aurum/pi3-v0.01\""
          expect "\"status\": \"ready\""
          expect "aurum> "
          send "self-build\r"
          expect "\"status\": \"started\""
          expect "AURUM_SELF_BUILD_FINISHED status=passed"
          expect "aurum> "
          send "git-status\r"
          expect "\"status\": \"ready\""
          expect "aurum> "
          send "poweroff\r"
          expect "AURUM_PC_POWEROFF requested=true"
          expect eof
          catch wait result
          set exit_status [lindex $result 3]
          if {$exit_status != 0} {
            exit $exit_status
          }
          EOF
          expect /tmp/aurum-first.exp

          grep -F 'AURUM_PC_READY version=0.01 arch=x86_64' aurum-pc-qemu.log
          grep -F 'selftest=ok' aurum-pc-qemu.log
          grep -F 'nvme0n1' aurum-pc-qemu.log
          grep -F 'AURUM_SELF_BUILD_FINISHED status=passed' aurum-pc-qemu.log
          if grep -F 'ModuleNotFoundError: No module named '\''Projects'\''' aurum-pc-qemu.log; then
            echo 'Installed self-build regressed to flattened Projects layout.' >&2
            exit 1
          fi
          if grep -F '/opt/.github/workflows/aurum-self-build-farm.yml' aurum-pc-qemu.log; then
            echo 'Installed self-build regressed to incorrect repository root.' >&2
            exit 1
          fi

          # Boot the same live image against the same persistence volume a second
          # time. A ready Git workspace proves the first boot's /var/lib/aurum
          # state survived a clean guest poweroff and the overlay was recovered.
          cp "$vars" /tmp/AURUM_OVMF_VARS_SECOND.fd
          cat > /tmp/aurum-second.exp <<'EOF'
          log_user 1
          log_file -noappend aurum-pc-qemu-second.log
          set timeout 240
          spawn qemu-system-x86_64 \
            -machine q35,accel=tcg \
            -cpu qemu64 \
            -m 1536 \
            -smp 2 \
            -drive if=pflash,format=raw,readonly=on,file=$env(AURUM_OVMF_CODE) \
            -drive if=pflash,format=raw,file=/tmp/AURUM_OVMF_VARS_SECOND.fd \
            -cdrom dist/Aurum-PC-v0.01-amd64.iso \
            -drive file=/tmp/aurum-persist.img,format=raw,if=virtio \
            -netdev user,id=net0 \
            -device virtio-net-pci,netdev=net0 \
            -boot d \
            -display none \
            -serial stdio \
            -monitor none \
            -no-reboot
          expect "AURUM_PC_READY version=0.01 arch=x86_64"
          expect "aurum> "
          send "git-status\r"
          expect "\"status\": \"ready\""
          expect "\"branch\": \"aurum/pi3-v0.01\""
          expect "aurum> "
          send "network-status\r"
          expect "\"status\": \"ready\""
          expect "aurum> "
          send "poweroff\r"
          expect "AURUM_PC_POWEROFF requested=true"
          expect eof
          catch wait result
          set exit_status [lindex $result 3]
          if {$exit_status != 0} {
            exit $exit_status
          }
          EOF
          expect /tmp/aurum-second.exp
          grep -F 'AURUM_PC_POWEROFF requested=true' aurum-pc-qemu-second.log
          echo 'AURUM_PC_V001_UEFI_PC01_RUNTIME_VERIFIED'
          echo 'AURUM_PC_V001_PERSISTENCE_VERIFIED'

      - name: Record image metadata
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist/Aurum-PC-v0.01-amd64.iso
          cat dist/Aurum-PC-v0.01-amd64.iso.sha256

      - name: Publish boot-verified ISO
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Aurum-PC-v0.01-amd64
          path: |
            dist/Aurum-PC-v0.01-amd64.iso
            dist/Aurum-PC-v0.01-amd64.iso.sha256
            aurum-pc-qemu.log
            aurum-pc-qemu-second.log
          if-no-files-found: error
          retention-days: 14
