name: Aurum PC v0.01 Image

on:
  workflow_dispatch:
  push:
    branches:
      - aurum/pc-v0.01
      - aurum/pi3-v0.01
      - aurum/trunk-v0.01
      - 'agent/**'
    paths:
      - '.github/workflows/aurum-pc-v001.yml'
      - 'Projects/AurumPC/**'
      - 'Projects/AurumVirtualLab/**'
      - 'Projects/Codelation/**'

permissions:
  contents: read

concurrency:
  group: aurum-pc-v001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact Aurum source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Validate bounded runtime sources before expensive build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            Projects/AurumPC/aurum_arcade.py \
            Projects/AurumPC/aurum_autonomy.py \
            Projects/AurumPC/aurum_bootstrap.py \
            Projects/AurumPC/aurum_console.py \
            Projects/AurumPC/aurum_control_plane.py \
            Projects/AurumPC/aurum_desktop.py \
            Projects/AurumPC/aurum_desktop_runtime.py \
            Projects/AurumPC/aurum_display_runtime.py \
            Projects/AurumPC/aurum_driver_synthesis.py \
            Projects/AurumPC/aurum_echo_native.py \
            Projects/AurumPC/aurum_gpt_trait.py \
            Projects/AurumPC/aurum_gui_runtime.py \
            Projects/AurumPC/aurum_hardware.py \
            Projects/AurumPC/aurum_hopper_gui.py \
            Projects/AurumPC/aurum_installer.py \
            Projects/AurumPC/aurum_network.py \
            Projects/AurumPC/aurum_runtime_update.py \
            Projects/AurumPC/aurum_time.py \
            Projects/AurumPC/aurum_traits.py \
            Projects/AurumPC/aurum_wifi_diag.py \
            Projects/AurumPC/aurum_wifi_recovery.py \
            Projects/AurumPC/aurum_workspace.py \
            Projects/Codelation/seed/codelation_seed.py
          python3 -m json.tool Projects/AurumPC/pc01_autonomy_policy.json >/dev/null
          sh -n Projects/AurumPC/build-iso.sh
          bash -n Projects/AurumVirtualLab/qemu-pc-smoke.sh
          bash -n Projects/AurumVirtualLab/qemu-hp-physical-twin.sh
          python3 -m unittest discover -s Projects/AurumPC/tests -v
          grep -q 'git-sync authorize-network' Projects/AurumPC/aurum_console.py
          grep -q 'git-promote authorize-network confirm-push' Projects/AurumPC/aurum_console.py
          grep -q 'network-status | wifi-setup | wifi-reconnect' Projects/AurumPC/aurum_console.py
          grep -q 'runtime-status | runtime-sync' Projects/AurumPC/aurum_console.py
          grep -q 'autonomy-status | autonomy-cycle' Projects/AurumPC/aurum_console.py
          grep -q 'driver-status | driver-cycle' Projects/AurumPC/aurum_console.py
          grep -q 'gui-status | gui-start | gui-stop' Projects/AurumPC/aurum_console.py
          grep -q 'install confirm ERASE-CODE' Projects/AurumPC/aurum_console.py
          grep -q 'internal_disk_writes.*False' Projects/AurumPC/aurum_hardware.py
          grep -q 'preserve_current_removable_boot.*True' Projects/AurumPC/aurum_hardware.py
          grep -q 'AURUM_WIFI_DIAG' Projects/AurumPC/aurum_bootstrap.py
          grep -q 'recover_existing_wifi_driver' Projects/AurumPC/aurum_bootstrap.py
          grep -q 'synchronize_clock' Projects/AurumPC/aurum_bootstrap.py
          grep -q '_launch_installed_autonomy' Projects/Codelation/seed/codelation_seed.py
          grep -q 'aurum_driver_synthesis.py' Projects/AurumPC/aurum_autonomy.py
          grep -q 'load_synthesized_modules.*false' Projects/AurumPC/pc01_autonomy_policy.json
          grep -q '"machine_display_name": "Hopper"' Projects/AurumPC/pc01_autonomy_policy.json
          grep -q '"auto_local_echo_display": false' Projects/AurumPC/pc01_autonomy_policy.json
          grep -q 'Every fourth return leaves a temporary echo well' Projects/AurumPC/aurum_arcade.py
          grep -q 'aurum_arcade.py' Projects/AurumPC/aurum_gui_runtime.py
          grep -q 'aurum_desktop_runtime.py' Projects/AurumPC/aurum_gui_runtime.py
          grep -q 'aurum_desktop.py' Projects/AurumPC/aurum_runtime_update.py
          grep -q 'aurum_traits.py' Projects/AurumPC/aurum_runtime_update.py
          grep -q 'aurum_gpt_trait.py' Projects/AurumPC/aurum_runtime_update.py
          grep -q 'aurum_control_plane.py' Projects/AurumPC/aurum_runtime_update.py
          grep -q 'SDL_VIDEODRIVER=kmsdrm' Projects/AurumPC/aurum_desktop_runtime.py
          grep -q 'Ctrl+Alt+F1 recovery console' Projects/AurumPC/aurum_desktop.py
          grep -q 'xserver-xorg-input-libinput' Projects/AurumPC/build-iso.sh
          grep -q 'SDL_VIDEODRIVER=kmsdrm' Projects/AurumPC/aurum_display_runtime.py
          grep -q 'EXPECTED_GAME_SCHEMA = "aurum.echo.native.v2"' Projects/AurumPC/aurum_display_runtime.py
          grep -q 'physical_echo_activation' Projects/AurumPC/aurum_runtime_update.py
          grep -q 'PROOF_SCHEMA = "aurum.hopper.echo-proof.v1"' Projects/AurumPC/aurum_echo_native.py
          grep -q 'keyboard_path_available' Projects/AurumPC/aurum_echo_native.py
          grep -q 'pointer_path_available' Projects/AurumPC/aurum_echo_native.py
          grep -q 'host_actuation.*False' Projects/AurumPC/aurum_echo_native.py

  build-image:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact Aurum source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - name: Build Aurum PC live ISO once
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          docker run --rm --privileged \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:bookworm \
            sh -lc '
              set -eu
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                live-build debian-archive-keyring debootstrap \
                xorriso isolinux syslinux-common squashfs-tools \
                grub-pc-bin grub-efi-amd64-bin dosfstools mtools
              lb --version
              sh Projects/AurumPC/build-iso.sh
            '
          test -s dist/Aurum-PC-v0.01-amd64.iso
          sha256sum -c dist/Aurum-PC-v0.01-amd64.iso.sha256
      - name: Publish immutable image for parallel verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aurum-pc-unverified-${{ github.sha }}
          path: |
            dist/Aurum-PC-v0.01-amd64.iso
            dist/Aurum-PC-v0.01-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 2

  generic-uefi-smoke:
    needs: build-image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact Aurum source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - name: Download exact image under test
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aurum-pc-unverified-${{ github.sha }}
          path: dist
      - name: Verify image digest before boot
        shell: bash
        run: sha256sum -c dist/Aurum-PC-v0.01-amd64.iso.sha256
      - name: Install independent VM tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y qemu-system-x86 ovmf parted
      - name: Generic UEFI boot and installed-runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          bash Projects/AurumVirtualLab/qemu-pc-smoke.sh \
            dist/Aurum-PC-v0.01-amd64.iso \
            aurum-pc-qemu.log
          grep -q 'AURUM_HARDWARE_PROFILE status=ready' aurum-pc-qemu.log
          echo 'AURUM_PC_V001_UEFI_BOOT_VERIFIED'
      - name: Publish generic boot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aurum-pc-generic-evidence-${{ github.sha }}
          path: aurum-pc-qemu.log
          if-no-files-found: error
          retention-days: 7

  hp-twin-smoke:
    needs: build-image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact Aurum source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - name: Download exact image under test
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aurum-pc-unverified-${{ github.sha }}
          path: dist
      - name: Verify image digest before topology test
        shell: bash
        run: sha256sum -c dist/Aurum-PC-v0.01-amd64.iso.sha256
      - name: Install independent VM tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y qemu-system-x86 ovmf parted
      - name: HP physical-topology twin preflight
        shell: bash
        run: |
          set -euo pipefail
          bash Projects/AurumVirtualLab/qemu-hp-physical-twin.sh \
            dist/Aurum-PC-v0.01-amd64.iso \
            aurum-hp-physical-twin.log
          grep -q 'AURUM_HP_TWIN_UEFI_USB_BOOT_OK' aurum-hp-physical-twin.log
          grep -q 'AURUM_HP_TWIN_NVME_PRESERVED_OK' aurum-hp-physical-twin.log
          grep -q 'AURUM_HP_TWIN_WIFI_MISSING_DIAGNOSTIC_OK' aurum-hp-physical-twin.log
          grep -q 'AURUM_HP_TWIN_DETAILED_HARDWARE_OK' aurum-hp-physical-twin.log
          echo 'AURUM_HP_PHYSICAL_TWIN_PREFLIGHT_VERIFIED'
      - name: Publish HP twin evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aurum-pc-hp-evidence-${{ github.sha }}
          path: aurum-hp-physical-twin.log
          if-no-files-found: error
          retention-days: 7

  publish-verified-image:
    needs: [build-image, generic-uefi-smoke, hp-twin-smoke]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Check out verification specification
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - name: Download verified image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aurum-pc-unverified-${{ github.sha }}
          path: dist
      - name: Download generic evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aurum-pc-generic-evidence-${{ github.sha }}
          path: evidence/generic
      - name: Download HP evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aurum-pc-hp-evidence-${{ github.sha }}
          path: evidence/hp
      - name: Re-verify immutable image and evidence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c dist/Aurum-PC-v0.01-amd64.iso.sha256
          grep -q 'AURUM_HARDWARE_PROFILE status=ready' evidence/generic/aurum-pc-qemu.log
          grep -q 'AURUM_HP_TWIN_UEFI_USB_BOOT_OK' evidence/hp/aurum-hp-physical-twin.log
          grep -q 'AURUM_HP_TWIN_NVME_PRESERVED_OK' evidence/hp/aurum-hp-physical-twin.log
          grep -q 'AURUM_HP_TWIN_WIFI_MISSING_DIAGNOSTIC_OK' evidence/hp/aurum-hp-physical-twin.log
          grep -q 'AURUM_HP_TWIN_DETAILED_HARDWARE_OK' evidence/hp/aurum-hp-physical-twin.log
          cp evidence/generic/aurum-pc-qemu.log .
          cp evidence/hp/aurum-hp-physical-twin.log .
          echo 'AURUM_PC_IMAGE_ALL_VERIFIERS_CONVERGED'
      - name: Publish boot-verified ISO
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Aurum-PC-v0.01-amd64
          path: |
            dist/Aurum-PC-v0.01-amd64.iso
            dist/Aurum-PC-v0.01-amd64.iso.sha256
            aurum-pc-qemu.log
            aurum-hp-physical-twin.log
            Projects/AurumVirtualLab/hp-physical-twin-v1.json
          if-no-files-found: error
          retention-days: 14
