name: Aurum PC v0.01 Image

on:
  workflow_dispatch:
  push:
    branches:
      - aurum/pc-v0.01
      - aurum/pi3-v0.01
      - aurum/trunk-v0.01
      - 'agent/**'
    paths:
      - '.github/workflows/aurum-pc-v001.yml'
      - 'Projects/AurumPC/**'
      - 'Projects/Codelation/**'

permissions:
  contents: read

concurrency:
  group: aurum-pc-v001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out Aurum PC branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Validate bounded runtime sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            Projects/AurumPC/aurum_bootstrap.py \
            Projects/AurumPC/aurum_hardware.py \
            Projects/AurumPC/aurum_network.py \
            Projects/AurumPC/aurum_console.py \
            Projects/AurumPC/aurum_workspace.py \
            Projects/AurumPC/aurum_installer.py
          sh -n Projects/AurumPC/build-iso.sh
          python3 -m unittest discover -s Projects/AurumPC/tests -v
          grep -q 'ensure_online(interactive=True)' Projects/AurumPC/aurum_bootstrap.py
          grep -q 'BUILDS.start()' Projects/AurumPC/aurum_bootstrap.py
          grep -q 'git-sync authorize-network' Projects/AurumPC/aurum_console.py
          grep -q 'git-promote authorize-network confirm-push' Projects/AurumPC/aurum_console.py
          grep -q 'install confirm ERASE-CODE' Projects/AurumPC/aurum_console.py
          grep -q 'internal_disk_writes.*False' Projects/AurumPC/aurum_hardware.py
          grep -q 'preserve_current_removable_boot.*True' Projects/AurumPC/aurum_hardware.py

      - name: Install independent VM tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y qemu-system-x86 ovmf
          docker info >/dev/null

      - name: Build Aurum PC live ISO with Debian-native tooling
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:bookworm \
            sh -lc '
              set -eu
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                live-build debian-archive-keyring debootstrap \
                xorriso isolinux syslinux-common squashfs-tools \
                grub-pc-bin grub-efi-amd64-bin dosfstools mtools
              lb --version
              sh Projects/AurumPC/build-iso.sh
            '
          test -s dist/Aurum-PC-v0.01-amd64.iso
          sha256sum -c dist/Aurum-PC-v0.01-amd64.iso.sha256

      - name: UEFI boot smoke test
        shell: bash
        run: |
          set -euo pipefail
          bash Projects/AurumVirtualLab/qemu-pc-smoke.sh \
            dist/Aurum-PC-v0.01-amd64.iso \
            aurum-pc-qemu.log
          grep -q 'AURUM_HARDWARE_PROFILE status=ready' aurum-pc-qemu.log
          echo 'AURUM_PC_V001_UEFI_BOOT_VERIFIED'

      - name: Record image metadata
        shell: bash
        run: |
          set -euo pipefail
          ls -lh dist/Aurum-PC-v0.01-amd64.iso
          cat dist/Aurum-PC-v0.01-amd64.iso.sha256

      - name: Publish boot-verified ISO
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Aurum-PC-v0.01-amd64
          path: |
            dist/Aurum-PC-v0.01-amd64.iso
            dist/Aurum-PC-v0.01-amd64.iso.sha256
            aurum-pc-qemu.log
          if-no-files-found: error
          retention-days: 14
