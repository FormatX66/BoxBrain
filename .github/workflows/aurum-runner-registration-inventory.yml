name: Aurum Runner Registration Inventory

on:
  workflow_dispatch:
  push:
    paths:
      - 'Projects/Aurum/Experiments/runner-inventory-request.json'
      - '.github/workflows/aurum-runner-registration-inventory.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: aurum-runner-registration-inventory
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out current control plane
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Read registered self-hosted runner names and labels
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/runners?per_page=100',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'Aurum-Runner-Inventory/1',
              },
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              payload = json.load(response)
          runners = []
          for row in payload.get('runners', []):
              runners.append({
                  'name': str(row.get('name') or ''),
                  'status': str(row.get('status') or ''),
                  'busy': bool(row.get('busy')),
                  'labels': sorted(str(item.get('name') or '') for item in row.get('labels', []) if item.get('name')),
              })
          result = {
              'schema': 'aurum-runner-registration-inventory-v1',
              'observed_at_utc': datetime.now(timezone.utc).isoformat(),
              'runner_count': len(runners),
              'runners': sorted(runners, key=lambda item: item['name'].lower()),
              'secrets_exposed': False,
              'runner_configuration_changed': False,
          }
          path = Path('Projects/Aurum/Experiments/latest-runner-registration-inventory.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(f"AURUM_RUNNER_INVENTORY count={len(runners)} configuration_changed=false")
          PY

      - name: Persist runner registration inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aurum-runner-inventory[bot]'
          git config user.email 'aurum-runner-inventory@users.noreply.github.com'
          git add Projects/Aurum/Experiments/latest-runner-registration-inventory.json
          if git diff --cached --quiet; then
            echo 'AURUM_RUNNER_INVENTORY unchanged=true'
            exit 0
          fi
          git commit -m 'Record Aurum runner registration inventory [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'AURUM_RUNNER_INVENTORY persisted=true'
