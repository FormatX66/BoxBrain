name: Aurum Tiny Seed Pi ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - 'Projects/Aurum/Germ/**'
      - 'Projects/Aurum/Recovery/trusted-refs.json'
      - 'Projects/Aurum/Recovery/authority-public.pem'
      - '.github/workflows/aurum-tiny-seed-pi.yml'

permissions:
  contents: read

concurrency:
  group: aurum-tiny-seed-pi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-static-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out genetics
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Compile and unit-test germ
        run: |
          python3 -m py_compile Projects/Aurum/Germ/*.py
          (cd Projects/Aurum/Germ && python3 -m unittest -v test_reseed test_guardian test_proof test_rollback_drill test_recovery_control test_recovery_poller test_triage test_tinyseed)

      - name: Install ARM image tooling
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            qemu-user-static curl xz-utils rsync util-linux dosfstools e2fsprogs

      - name: Build Pi Tiny Seed
        run: sudo sh Projects/Aurum/Germ/build-pi-tinyseed.sh

      - name: Verify compressed image
        run: |
          test -s dist/Aurum-TinySeed-Pi-arm64.img.xz
          (cd dist && sha256sum -c Aurum-TinySeed-Pi-arm64.img.xz.sha256)
          xz -t dist/Aurum-TinySeed-Pi-arm64.img.xz

      - name: Inspect embedded recovery and failure-prep payload
        shell: bash
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/Aurum-TinySeed-Pi-arm64.img"
          root="$RUNNER_TEMP/pi-root"
          boot="$RUNNER_TEMP/pi-boot"
          mkdir -p "$root" "$boot"
          xz -dc dist/Aurum-TinySeed-Pi-arm64.img.xz > "$raw"
          loop=$(sudo losetup --find --show --partscan "$raw")
          cleanup() {
            set +e
            mountpoint -q "$boot" && sudo umount "$boot"
            mountpoint -q "$root" && sudo umount "$root"
            sudo losetup -d "$loop" 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo udevadm settle
          sudo mount "${loop}p2" "$root"
          sudo mount "${loop}p1" "$boot"
          test -x "$root/usr/lib/aurum/germ/guardian.py"
          test -x "$root/usr/lib/aurum/germ/reseed.py"
          test -x "$root/usr/lib/aurum/germ/proof.py"
          test -x "$root/usr/lib/aurum/germ/rollback_drill.py"
          test -x "$root/usr/lib/aurum/germ/recovery_control.py"
          test -x "$root/usr/lib/aurum/germ/recovery_poller.py"
          test -x "$root/usr/lib/aurum/germ/triage.py"
          test -x "$root/usr/sbin/aurum-rollback-drill"
          test -x "$root/usr/sbin/aurum-recovery-poll"
          test -x "$root/usr/sbin/aurum-triage"
          test -x "$root/usr/bin/openssl"
          test -f "$root/etc/aurum/recovery-trusted-refs.json"
          test -f "$root/etc/systemd/system/aurum-boot-proof.service"
          test -L "$root/etc/systemd/system/multi-user.target.wants/aurum-boot-proof.service"
          test -f "$root/etc/systemd/system/aurum-triage.service"
          grep -q 'OnFailure=aurum-triage.service' "$root/etc/systemd/system/aurum-tinyseed.service"
          test -f "$root/etc/systemd/system/aurum-recovery-poll.timer"
          test -L "$root/etc/systemd/system/timers.target.wants/aurum-recovery-poll.timer"
          grep -q 'aurum.tinyseed=1' "$boot/cmdline.txt"
          grep -q 'systemd.show_status=yes' "$boot/cmdline.aurum-safe.txt"
          echo 'AURUM_TINYSEED_PI_STATIC_OK guardian=reseed proof=embedded rollback=embedded signed-recovery=embedded triage=embedded safe-cmdline=prepared'

      - name: Publish Pi Tiny Seed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Aurum-TinySeed-Pi-arm64
          path: |
            dist/Aurum-TinySeed-Pi-arm64.img.xz
            dist/Aurum-TinySeed-Pi-arm64.img.xz.sha256
          if-no-files-found: error
          retention-days: 30
