name: Aurum Repository Integrity Diagnostic Once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aurum-repository-integrity-diagnostic-once.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture repository validator outcome
        id: validate
        shell: bash
        run: |
          set +e
          python3 Admin/validate_repository.py > /tmp/aurum-repository-integrity.txt 2>&1
          code=$?
          cat /tmp/aurum-repository-integrity.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish diagnostic receipt
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATOR_CODE: ${{ steps.validate.outputs.code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['GITHUB_RUN_ID']
          attempt = os.environ['GITHUB_RUN_ATTEMPT']
          path = f'Projects/AurumBridge/results/repository-integrity-{run_id}-attempt-{attempt}.json'
          output = Path('/tmp/aurum-repository-integrity.txt').read_text(encoding='utf-8', errors='replace')
          payload = {
              'schema': 'aurum-repository-integrity-diagnostic-v1',
              'state': 'OK' if os.environ['VALIDATOR_CODE'] == '0' else 'FAILURE',
              'validator_exit_code': int(os.environ['VALIDATOR_CODE']),
              'github_workflow_run': int(run_id),
              'github_run_attempt': int(attempt),
              'source_commit': os.environ['GITHUB_SHA'],
              'observed_at': datetime.now(timezone.utc).isoformat(),
              'output': output.splitlines(),
          }
          encoded = base64.b64encode((json.dumps(payload, indent=2) + '\n').encode()).decode()
          body = json.dumps({
              'message': f"Record repository integrity diagnostic state={payload['state']} [skip ci]",
              'content': encoded,
              'branch': 'main',
          }).encode()
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/contents/{path}',
              data=body,
              method='PUT',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 201):
                  raise SystemExit(response.status)
          print(f'AURUM_REPOSITORY_INTEGRITY_RECEIPT path={path} state={payload["state"]}')
          PY
      - name: Enforce validator result
        env:
          VALIDATOR_CODE: ${{ steps.validate.outputs.code }}
        run: exit "$VALIDATOR_CODE"
