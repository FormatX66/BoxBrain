name: Aurum Pi3 v0.01 Image

on:
  push:
    branches:
      - aurum/pi3-v0.01
    paths:
      - 'Projects/AurumPi3/**'
      - 'Projects/AurumPC/**'
      - 'Projects/Codelation/**'
      - '.github/workflows/aurum-pi3-v001.yml'
  workflow_dispatch:

concurrency:
  group: aurum-pi3-v001-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Aurum Pi3 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Validate bounded Pi runtime sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            Projects/AurumPi3/aurum_pi3_console.py \
            Projects/AurumPi3/aurum_updater.py \
            Projects/AurumPi3/build-runtime-release.py \
            Projects/AurumPC/aurum_console.py \
            Projects/AurumPC/aurum_workspace.py
          python3 -m unittest discover -s Projects/AurumPi3/tests -v
          python3 -m unittest discover -s Projects/AurumPC/tests -v
          sh -n Projects/AurumPi3/build-image.sh
          sh -n Projects/AurumPi3/bootstrap-updater-v001.sh
          grep -q 'AURUM_PI3_READY' Projects/AurumPi3/aurum_pi3_console.py
          ! grep -R -E 'shell=True|os\.system' \
            Projects/AurumPi3/aurum_pi3_console.py \
            Projects/AurumPi3/aurum_updater.py

      - name: Build pinned application runtime release
        shell: bash
        run: |
          set -euo pipefail
          revision="${GITHUB_SHA::12}"
          python3 Projects/AurumPi3/build-runtime-release.py \
            --version 0.02 \
            --release-id "0.02-$revision"
          artifact="dist/Aurum-Pi3-runtime-0.02-$revision-arm64.tar.gz"
          manifest="dist/Aurum-Pi3-runtime-0.02-$revision-arm64.manifest.json"
          test -s "$artifact"
          test -s "$manifest"
          (cd dist && sha256sum -c "$(basename "$manifest").sha256")
          python3 - "$manifest" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert data['schema'] == 'aurum-application-update-v1'
          assert data['target'] == 'raspberry-pi-3'
          assert data['architecture'] == 'arm64'
          assert data['scope'] == {
              'application_runtime': True,
              'boot_firmware': False,
              'kernel': False,
              'operating_system': False,
          }
          PY
          mkdir -p runtime-verify
          tar -xzf "$artifact" -C runtime-verify
          AURUM_ROOT="$PWD/runtime-verify/payload" \
            python3 runtime-verify/payload/aurum_pi3_console.py --selftest-json \
            | tee runtime-selftest.json
          grep -q '"selftest": "ok"' runtime-selftest.json

      - name: Install image tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            curl xz-utils util-linux fdisk e2fsprogs mount

      - name: Build Aurum Pi3 microSD image
        shell: bash
        run: |
          set -euo pipefail
          sudo sh Projects/AurumPi3/build-image.sh

      - name: Verify raw Pi image structure
        shell: bash
        run: |
          set -euo pipefail
          RAW=Projects/AurumPi3/.build/Aurum-Pi3-v0.01-arm64.img
          ROOT=Projects/AurumPi3/.verify-root
          test -s "$RAW"
          sudo sfdisk -d "$RAW" | tee aurum-pi3-partitions.txt
          LOOP=$(sudo losetup --find --show --partscan "$RAW")
          cleanup() {
            set +e
            mountpoint -q "$ROOT/boot/firmware" && sudo umount "$ROOT/boot/firmware"
            mountpoint -q "$ROOT" && sudo umount "$ROOT"
            sudo losetup -d "$LOOP" 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo udevadm settle
          for _ in $(seq 1 20); do
            [ -b "${LOOP}p1" ] && [ -b "${LOOP}p2" ] && break
            sleep 1
            sudo udevadm settle
          done
          test -b "${LOOP}p1"
          test -b "${LOOP}p2"
          sudo e2fsck -fn "${LOOP}p2"
          mkdir -p "$ROOT"
          sudo mount -o ro "${LOOP}p2" "$ROOT"
          sudo mkdir -p "$ROOT/boot/firmware"
          sudo mount -o ro "${LOOP}p1" "$ROOT/boot/firmware"

          test -s "$ROOT/boot/firmware/start.elf"
          test -s "$ROOT/boot/firmware/fixup.dat"
          test -s "$ROOT/boot/firmware/kernel8.img"
          test -s "$ROOT/boot/firmware/bcm2710-rpi-3-b.dtb"
          test -L "$ROOT/opt/aurum/current"
          test -s "$ROOT/opt/aurum/current/aurum_pi3_console.py"
          test -s "$ROOT/opt/aurum/current/RELEASE.json"
          test -d "$ROOT/opt/aurum/current/codelation/field"
          test -x "$ROOT/opt/aurum/updater/aurum_updater.py"
          test "$(sudo stat -c '%a' "$ROOT/var/lib/aurum-pi3")" = 700
          test "$(sudo stat -c '%a' "$ROOT/var/lib/aurum-updater")" = 700
          test -L "$ROOT/etc/systemd/system/multi-user.target.wants/aurum-pi3-console.service"
          test -L "$ROOT/etc/systemd/system/multi-user.target.wants/aurum-pi3-serial.service"
          test -L "$ROOT/etc/systemd/system/multi-user.target.wants/aurum-pi3-update-recovery.service"
          grep -q '/opt/aurum/current/aurum_pi3_console.py' "$ROOT/etc/systemd/system/aurum-pi3-console.service"
          grep -q 'apply-pending' "$ROOT/etc/systemd/system/aurum-pi3-update.service"
          grep -q 'recover' "$ROOT/etc/systemd/system/aurum-pi3-update-recovery.service"
          grep -q '^arm_64bit=1$' "$ROOT/boot/firmware/config.txt"
          grep -q '^enable_uart=1$' "$ROOT/boot/firmware/config.txt"
          grep -q 'console=serial0,115200' "$ROOT/boot/firmware/cmdline.txt"
          grep -q 'aurum.pi3=1' "$ROOT/boot/firmware/cmdline.txt"
          grep -q '^aurum-pi3$' "$ROOT/etc/hostname"
          python3 - "$ROOT/opt/aurum/current/aurum_pi3_console.py" "$ROOT/opt/aurum/updater/aurum_updater.py" <<'PY'
          import pathlib, sys
          for value in sys.argv[1:]:
              path = pathlib.Path(value)
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          print('AURUM_PI3_STATIC_RUNTIME_OK')
          PY
          echo 'AURUM_PI3_IMAGE_STRUCTURE_OK'
          cleanup
          trap - EXIT

      - name: Verify compressed microSD artifact
        shell: bash
        run: |
          set -euo pipefail
          DIST=dist
          IMAGE=Aurum-Pi3-v0.01-arm64.img.xz
          sudo chown "$USER:$USER" "$DIST/$IMAGE" "$DIST/$IMAGE.sha256" "$DIST/Aurum-Pi3-v0.01-arm64.manifest.json"
          xz -t "$DIST/$IMAGE"
          (cd "$DIST" && sha256sum -c "$IMAGE.sha256")
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('dist/Aurum-Pi3-v0.01-arm64.manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['verification']['partition_structure'] = True
          data['verification']['filesystem_check'] = True
          data['verification']['aurum_payload'] = True
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('AURUM_PI3_COMPRESSED_ARTIFACT_OK')
          PY
          ls -lh "$DIST/$IMAGE" "$DIST/$IMAGE.sha256" "$DIST/Aurum-Pi3-v0.01-arm64.manifest.json"

      - name: Publish microSD-ready Pi3 image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Aurum-Pi3-v0.01-arm64
          path: |
            dist/Aurum-Pi3-v0.01-arm64.img.xz
            dist/Aurum-Pi3-v0.01-arm64.img.xz.sha256
            dist/Aurum-Pi3-v0.01-arm64.manifest.json
            aurum-pi3-partitions.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish pinned application runtime release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Aurum-Pi3-runtime-${{ github.sha }}
          path: |
            dist/Aurum-Pi3-runtime-*.tar.gz
            dist/Aurum-Pi3-runtime-*.manifest.json
            dist/Aurum-Pi3-runtime-*.manifest.json.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
