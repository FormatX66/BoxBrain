name: Aurum Event-Driven Continuation

on:
  workflow_run:
    workflows:
      - Aurum PC v0.01 Image
      - Aurum PC Bridge
      - Aurum Virtual Hardware Lab
      - Validate Aurum Local-Lane Self-Heal
      - Aurum Authorized Windows AP
      - Aurum PC-01 One-Time Verified Reflash
      - Aurum PC-01 Authorized USB Flash
      - Aurum Dual Seed Lanes
      - Aurum Human Capability Traits
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: aurum-event-driven-continuation
  cancel-in-progress: false

jobs:
  continue:
    # workflow_run payloads can legitimately omit head_repository for some
    # repository-local completion paths. Gate on the event's repository and
    # reject PR-origin runs instead of silently skipping trusted push/dispatch
    # completions when head_repository is absent.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.repository.full_name == github.repository &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - name: Capture completion evidence
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = workflow_run ]; then
            echo "AURUM_EVENT source=${{ github.event.workflow_run.name }}"
            echo "AURUM_EVENT run_id=${{ github.event.workflow_run.id }}"
            echo "AURUM_EVENT conclusion=${{ github.event.workflow_run.conclusion }}"
            echo "AURUM_EVENT branch=${{ github.event.workflow_run.head_branch }}"
            echo "AURUM_EVENT sha=${{ github.event.workflow_run.head_sha }}"
          else
            echo 'AURUM_EVENT source=manual-bootstrap'
          fi

      - name: Resume validated Windows local lane after hosted proof
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'Validate Aurum Local-Lane Self-Heal' &&
          github.event.workflow_run.conclusion == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow='aurum-authorized-windows-ap.yml'
          active="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&per_page=20" \
            --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending")] | length')"
          if [ "$active" -gt 0 ]; then
            echo "AURUM_EVENT local_lane_recovery=active count=$active action=deduplicated"
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -f ref=main
            echo 'AURUM_EVENT local_lane_recovery=dispatched ref=main'
          fi

      - name: Resume BBPI4 identity heartbeat after verified seed
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'Aurum Dual Seed Lanes' &&
          github.event.workflow_run.conclusion == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow='aurum-authorized-windows-ap.yml'
          active="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&per_page=20" \
            --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending")] | length')"
          if [ "$active" -gt 0 ]; then
            echo "AURUM_EVENT bbpi4_identity_lane=active count=$active action=deduplicated"
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -f ref=main
            echo 'AURUM_EVENT bbpi4_identity_lane=dispatched ref=main'
          fi

      - name: Resume trunk convergence immediately
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow='aurum-autobuild.yml'
          ref='aurum/trunk-v0.01'
          active="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${ref}&per_page=20" \
            --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending")] | length')"
          if [ "$active" -gt 0 ]; then
            echo "AURUM_EVENT autobuild_ref=$ref active=$active action=deduplicated"
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -f ref="$ref"
            echo "AURUM_EVENT dispatched=$ref"
          fi

      - name: Resume main bounded cycle immediately
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow='aurum-autobuild.yml'
          ref='main'
          active="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${ref}&per_page=20" \
            --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending")] | length')"
          if [ "$active" -gt 0 ]; then
            echo "AURUM_EVENT autobuild_ref=$ref active=$active action=deduplicated"
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -f ref="$ref"
            echo "AURUM_EVENT dispatched=$ref"
          fi

      - name: Explain scheduling role
        shell: bash
        run: |
          echo 'AURUM_EVENT continuity=event-driven'
          echo 'Hourly external scheduling is a watchdog only; it is not the primary build clock.'
