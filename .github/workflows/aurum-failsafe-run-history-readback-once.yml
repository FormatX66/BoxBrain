name: Aurum Failsafe Run History Readback Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aurum-failsafe-run-history-readback-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Record latest Aurum continuation runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, time, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'Aurum-Failsafe-History-Readback/1.0',
          }
          workflows = [
              'aurum-autobuild.yml',
              'aurum-event-bridge.yml',
              'aurum-authorized-windows-ap.yml',
              'aurum-dual-seed-lanes.yml',
              'aurum-pi4-identity-recovery-once.yml',
              'aurum-pi4-enrollment-diagnostic-once.yml',
              'aurum-boxbrain-hopper-route-test.yml',
              'aurum-pc01-flash-authorized.yml',
              'ci.yml',
          ]
          snapshot = {}
          for workflow in workflows:
              url = f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?branch=main&per_page=5'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      runs = json.load(response).get('workflow_runs', [])
              except Exception as exc:
                  snapshot[workflow] = {'error': type(exc).__name__, 'runs': []}
                  continue
              snapshot[workflow] = {'runs': [
                  {
                      'id': int(run.get('id') or 0),
                      'status': run.get('status'),
                      'conclusion': run.get('conclusion'),
                      'event': run.get('event'),
                      'created_at': run.get('created_at'),
                      'updated_at': run.get('updated_at'),
                      'head_sha': run.get('head_sha'),
                      'run_attempt': run.get('run_attempt'),
                  }
                  for run in runs
              ]}
          receipt = {
              'schema': 'aurum-failsafe-run-history-v1',
              'github_workflow_run': int(os.environ['GITHUB_RUN_ID']),
              'source_commit': os.environ['GITHUB_SHA'],
              'observed_at': int(time.time()),
              'workflows': snapshot,
          }
          raw = json.dumps(receipt, indent=2, sort_keys=True).encode('utf-8')
          body = json.dumps({
              'message': 'Record Aurum failsafe workflow history [skip ci]',
              'content': base64.b64encode(raw).decode('ascii'),
              'branch': 'main',
          }).encode('utf-8')
          path = f"Projects/AurumBridge/results/failsafe-run-history-{os.environ['GITHUB_RUN_ID']}.json"
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/contents/{path}',
              data=body,
              method='PUT',
              headers={**headers, 'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(req, timeout=20):
              pass
          print(json.dumps(snapshot, sort_keys=True))
          PY

# Failsafe diagnostic refresh: 2026-08-22T06:22Z
