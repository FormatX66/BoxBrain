name: Aurum Dual Seed Lanes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aurum-dual-seed-lanes.yml'
      - 'Projects/Codelation/**'
      - 'installer/deploy-aurum-live-to-pi.ps1'
      - 'installer/reconcile-existing-aurum-gold-seed-on-pi.ps1'

permissions:
  actions: write
  contents: write

jobs:
  pc01-seed:
    name: Dispatch PC-01 x86_64 seed build
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current PC-01 seed branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          url = f'https://api.github.com/repos/{repo}/actions/workflows/aurum-pc-v001.yml/dispatches'
          data = json.dumps({'ref':'agent/aurum-direct-uefi-seed'}).encode()
          req = urllib.request.Request(url, data=data, method='POST', headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          })
          with urllib.request.urlopen(req, timeout=30) as r:
              if r.status not in (204,):
                  raise SystemExit(f'Unexpected dispatch status {r.status}')
          print('AURUM_PC01_SEED_DISPATCHED ref=agent/aurum-direct-uefi-seed')
          PY

  pi4-seed:
    name: Reconcile and verify Pi4 ARM64 gold seed over USB-C SSH
    runs-on: [self-hosted, Windows, X64, aurum-elevated]
    timeout-minutes: 30
    steps:
      - name: Check out current Aurum control plane
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Preflight USB-C SSH, reconcile seed, verify, and publish receipt
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $repo = $env:GITHUB_REPOSITORY
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          function Publish-PiReceipt([string]$State, [hashtable]$Data) {
            $path = "Projects/AurumBridge/results/pi4-seed-$env:GITHUB_RUN_ID-attempt-$env:GITHUB_RUN_ATTEMPT.json"
            $receipt = [ordered]@{
              schema = 'aurum-pi4-seed-receipt-v1'
              state = $State
              github_workflow_run = [long]$env:GITHUB_RUN_ID
              github_run_attempt = [int]$env:GITHUB_RUN_ATTEMPT
              host = $env:COMPUTERNAME
              runner_name = $env:RUNNER_NAME
              observed_at = (Get-Date).ToUniversalTime().ToString('o')
              data = $Data
            }
            $json = $receipt | ConvertTo-Json -Depth 8
            $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))
            $body = @{
              message = "Record Pi4 Aurum seed receipt state=$State [skip ci]"
              content = $encoded
              branch = 'main'
            } | ConvertTo-Json -Depth 4
            Invoke-RestMethod -Method Put -Headers $headers -Uri "https://api.github.com/repos/$repo/contents/$path" -Body $body -ContentType 'application/json' | Out-Null
          }

          function Get-SshSha256Fingerprint([string]$KeyBlob) {
            try {
              $bytes = [Convert]::FromBase64String($KeyBlob)
              $sha = [Security.Cryptography.SHA256]::Create()
              try { $digest = $sha.ComputeHash($bytes) } finally { $sha.Dispose() }
              return 'SHA256:' + ([Convert]::ToBase64String($digest).TrimEnd('='))
            } catch {
              return 'invalid-key-blob'
            }
          }

          function Get-OpenSshToolchains {
            $directories = New-Object System.Collections.Generic.List[string]
            if ($env:AURUM_OPENSSH_BIN) { $directories.Add($env:AURUM_OPENSSH_BIN) }
            if ($env:ProgramFiles) { $directories.Add((Join-Path $env:ProgramFiles 'Git\usr\bin')) }
            Get-Command ssh-keyscan.exe -All -CommandType Application -ErrorAction SilentlyContinue | ForEach-Object {
              $directories.Add((Split-Path -Parent $_.Source))
            }

            foreach ($directory in ($directories | Select-Object -Unique)) {
              $keyscanPath = Join-Path $directory 'ssh-keyscan.exe'
              $sshPath = Join-Path $directory 'ssh.exe'
              $scpPath = Join-Path $directory 'scp.exe'
              if ((Test-Path -LiteralPath $keyscanPath -PathType Leaf) -and
                  (Test-Path -LiteralPath $sshPath -PathType Leaf) -and
                  (Test-Path -LiteralPath $scpPath -PathType Leaf)) {
                [pscustomobject]@{ Keyscan = $keyscanPath; Ssh = $sshPath; Scp = $scpPath }
              }
            }
          }

          function Invoke-Ed25519Keyscan([string]$KeyscanPath, [string]$Address) {
            $previousErrorActionPreference = $ErrorActionPreference
            $scanLines = @()
            $keyscanExitCode = 1
            try {
              # OpenSSH writes its identification banner to stderr. Windows
              # PowerShell turns native stderr into an ErrorRecord when the
              # workflow-wide preference is Stop, even when keyscan is healthy.
              $ErrorActionPreference = 'Continue'
              $scanLines = @(& $KeyscanPath -T 4 -t ed25519 $Address 2>$null)
              $keyscanExitCode = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $previousErrorActionPreference
            }
            [pscustomobject]@{ Lines = $scanLines; ExitCode = $keyscanExitCode }
          }

          $principal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            Publish-PiReceipt 'WAITING' @{ reason = 'runner-not-elevated'; transport = 'usb-c-ssh' }
            exit 0
          }

          $keyCandidates = New-Object System.Collections.Generic.List[string]
          if ($env:AURUM_PI_SSH_KEY) { $keyCandidates.Add($env:AURUM_PI_SSH_KEY) }
          $keyCandidates.Add((Join-Path $HOME '.ssh\boxbrain_pi_ed25519'))
          if (Test-Path -LiteralPath 'C:\Users' -PathType Container) {
            Get-ChildItem -LiteralPath 'C:\Users' -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              $keyCandidates.Add((Join-Path $_.FullName '.ssh\boxbrain_pi_ed25519'))
            }
          }
          $key = $keyCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $key) {
            Publish-PiReceipt 'WAITING' @{ reason = 'pi-ssh-key-missing'; transport = 'usb-c-ssh'; candidate_key_locations = $keyCandidates.Count }
            Write-Host 'AURUM_PI4_WAITING reason=pi-ssh-key-missing transport=usb-c-ssh'
            exit 0
          }

          $usbAddresses = @('10.12.194.1','10.42.194.1')
          $reachable = @()
          foreach ($address in $usbAddresses) {
            try {
              if (Test-NetConnection -ComputerName $address -Port 22 -InformationLevel Quiet -WarningAction SilentlyContinue) {
                $reachable += $address
              }
            } catch { }
          }
          if ($reachable.Count -eq 0) {
            Publish-PiReceipt 'WAITING' @{ reason = 'usb-c-ssh-unreachable'; transport = 'usb-c-ssh'; addresses = $usbAddresses }
            Write-Host "AURUM_PI4_WAITING reason=usb-c-ssh-unreachable addresses=$($usbAddresses -join ',')"
            exit 0
          }

          $knownHostCandidates = New-Object System.Collections.Generic.List[string]
          $knownHostCandidates.Add((Join-Path $HOME '.ssh\known_hosts'))
          if (Test-Path -LiteralPath 'C:\Users' -PathType Container) {
            Get-ChildItem -LiteralPath 'C:\Users' -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              $knownHostCandidates.Add((Join-Path $_.FullName '.ssh\known_hosts'))
            }
          }
          $knownHostSources = @($knownHostCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -Unique)
          $trustedPiAliases = @(
            'BBPI4',
            'bbpi4',
            'bbpi4.local',
            'kali-raspberrypi',
            'kali-raspberrypi.local',
            'kali-raspberrypi.mshome.net',
            '10.42.194.1',
            '192.168.0.194'
          )
          $sshKeygen = Get-Command ssh-keygen.exe -CommandType Application -ErrorAction SilentlyContinue
          if (-not $sshKeygen) {
            Publish-PiReceipt 'WAITING' @{ reason = 'ssh-keygen-missing'; transport = 'usb-c-ssh' }
            Write-Host 'AURUM_PI4_WAITING reason=ssh-keygen-missing transport=usb-c-ssh'
            exit 0
          }

          $trustedPiKeyBlobs = New-Object 'System.Collections.Generic.HashSet[string]' ([StringComparer]::Ordinal)
          foreach ($knownHostSource in $knownHostSources) {
            foreach ($trustedPiAlias in $trustedPiAliases) {
              $trustedLines = @(& $sshKeygen.Source -F $trustedPiAlias -f $knownHostSource 2>$null)
              foreach ($trustedLine in $trustedLines) {
                if ($trustedLine -match '(?:^|\s)ssh-ed25519\s+([A-Za-z0-9+/=]+)(?:\s|$)') {
                  [void]$trustedPiKeyBlobs.Add($Matches[1])
                }
              }
            }
          }

          $openSshToolchains = @(Get-OpenSshToolchains)
          if ($openSshToolchains.Count -eq 0) {
            Publish-PiReceipt 'WAITING' @{ reason = 'ssh-toolchain-missing'; transport = 'usb-c-ssh' }
            Write-Host 'AURUM_PI4_WAITING reason=ssh-toolchain-missing transport=usb-c-ssh'
            exit 0
          }

          $trustedUsbLines = New-Object System.Collections.Generic.List[string]
          $verifiedAddresses = New-Object System.Collections.Generic.List[string]
          $untrustedFingerprints = [ordered]@{}
          $selectedToolchain = $null
          $verifiedHostKeyFingerprint = $null
          foreach ($address in $reachable) {
            foreach ($toolchain in $openSshToolchains) {
              $scan = Invoke-Ed25519Keyscan $toolchain.Keyscan $address
              if ($scan.ExitCode -ne 0) { continue }
              foreach ($scanLine in $scan.Lines) {
                if ($scanLine -notmatch '^\S+\s+ssh-ed25519\s+([A-Za-z0-9+/=]+)(?:\s|$)') { continue }
                $blob = $Matches[1]
                if ($trustedPiKeyBlobs.Contains($blob)) {
                  $trustedUsbLines.Add("$address ssh-ed25519 $blob")
                  $verifiedAddresses.Add($address)
                  $selectedToolchain = $toolchain
                  $verifiedHostKeyFingerprint = Get-SshSha256Fingerprint $blob
                  break
                }
                if (-not $untrustedFingerprints.Contains($address)) {
                  $untrustedFingerprints[$address] = Get-SshSha256Fingerprint $blob
                }
              }
              if ($selectedToolchain) { break }
            }
            if ($selectedToolchain) { break }
          }

          if ($verifiedAddresses.Count -eq 0) {
            Publish-PiReceipt 'WAITING' @{
              reason = 'usb-c-host-key-not-pretrusted'
              transport = 'usb-c-ssh'
              addresses = $reachable
              fingerprints = $untrustedFingerprints
              trusted_pi_ed25519_key_count = $trustedPiKeyBlobs.Count
              known_hosts_sources = $knownHostSources.Count
            }
            Write-Host "AURUM_PI4_WAITING reason=usb-c-host-key-not-pretrusted addresses=$($reachable -join ',')"
            exit 0
          }

          $systemSshDir = Join-Path $HOME '.ssh'
          $systemKnownHosts = Join-Path $systemSshDir 'known_hosts'
          $systemSshDirExisted = Test-Path -LiteralPath $systemSshDir -PathType Container
          $systemKnownHostsExisted = Test-Path -LiteralPath $systemKnownHosts -PathType Leaf
          $systemKnownHostsBackup = if ($systemKnownHostsExisted) { [IO.File]::ReadAllBytes($systemKnownHosts) } else { $null }
          if (-not $systemSshDirExisted) { New-Item -ItemType Directory -Path $systemSshDir -Force | Out-Null }
          $existingKnownHostsText = if ($systemKnownHostsExisted) { [IO.File]::ReadAllText($systemKnownHosts) } else { '' }
          $separator = if ($existingKnownHostsText.Length -gt 0 -and -not $existingKnownHostsText.EndsWith("`n")) { "`r`n" } else { '' }
          $aliasText = ($trustedUsbLines | Select-Object -Unique) -join "`r`n"
          $utf8NoBom = New-Object Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($systemKnownHosts, $existingKnownHostsText + $separator + $aliasText + "`r`n", $utf8NoBom)

          try {
            $evidence = & .\installer\deploy-aurum-live-to-pi.ps1 `
              -PiAddresses @($verifiedAddresses) `
              -PiUser 'kali' `
              -KeyPath $key `
              -SshExecutable $selectedToolchain.Ssh `
              -ScpExecutable $selectedToolchain.Scp `
              -UserKnownHostsFile $systemKnownHosts 2>&1
            $text = ($evidence | Out-String)
            if ($text -notmatch 'AURUM_GOLD_SEED_RECONCILED') { throw 'AURUM_PI4_VERIFY_FAILURE reason=missing-reconciled-marker' }
            if ($text -notmatch 'AURUM_LIVE_VERIFIED') { throw 'AURUM_PI4_VERIFY_FAILURE reason=missing-live-verified-marker' }
            if ($text -notmatch 'AURUM_PEER_SELF_TEST_OK') { throw 'AURUM_PI4_VERIFY_FAILURE reason=missing-peer-self-test-marker' }
            if ($text -notmatch 'architecture=(aarch64|arm64)') { throw 'AURUM_PI4_VERIFY_FAILURE reason=unexpected-architecture' }

            $address = if ($text -match 'AURUM_GOLD_SEED_RECONCILED address=([^\s]+)') { $Matches[1] } else { $verifiedAddresses[0] }
            $seedSha = if ($text -match 'seed_sha256=([0-9a-fA-F]{64})') { $Matches[1].ToLowerInvariant() } else { 'unknown' }
            Publish-PiReceipt 'PI4_SEED_OK' @{
              address = $address
              transport = 'usb-c-ssh'
              user = 'kali'
              architecture = 'arm64'
              seed_sha256 = $seedSha
              aurum_live_verified = $true
              peer_self_test_verified = $true
              gold_seed_preserved = $true
              host_key_pretrusted = $true
              host_key_fingerprint = $verifiedHostKeyFingerprint
              ssh_executable = $selectedToolchain.Ssh
              source_commit = $env:GITHUB_SHA
            }
            Write-Host "AURUM_PI4_SEED_OK transport=usb-c-ssh address=$address architecture=arm64 seed_sha256=$seedSha host_key_fingerprint=$verifiedHostKeyFingerprint"
          } catch {
            $message = $_.Exception.Message
            Publish-PiReceipt 'PI4_SEED_FAILURE' @{ reason = $message; transport = 'usb-c-ssh'; host_key_pretrusted = $true; source_commit = $env:GITHUB_SHA }
            throw
          } finally {
            if ($systemKnownHostsExisted) {
              [IO.File]::WriteAllBytes($systemKnownHosts, $systemKnownHostsBackup)
            } elseif (Test-Path -LiteralPath $systemKnownHosts -PathType Leaf) {
              Remove-Item -LiteralPath $systemKnownHosts -Force -ErrorAction SilentlyContinue
            }
            if (-not $systemSshDirExisted -and (Test-Path -LiteralPath $systemSshDir -PathType Container)) {
              $remaining = @(Get-ChildItem -LiteralPath $systemSshDir -Force -ErrorAction SilentlyContinue)
              if ($remaining.Count -eq 0) { Remove-Item -LiteralPath $systemSshDir -Force -ErrorAction SilentlyContinue }
            }
          }
