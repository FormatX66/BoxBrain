name: Aurum Pi3 smsc95xx Virtual USB Timing

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aurum-pi3-smsc95xx-virtual-usb-timing.yml'
      - 'Projects/AdaptiveKernel/pi3_smsc95xx_virtual_usb_timing.py'
      - 'Projects/AdaptiveKernel/tests/test_pi3_smsc95xx_virtual_usb_timing.py'
      - 'Projects/AdaptiveKernel/results/pi3-smsc95xx-virtual-usb-fault-harness-latest.json'

permissions:
  contents: write

concurrency:
  group: aurum-pi3-smsc95xx-virtual-usb-timing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-virtual-usb-timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Run fail-closed timing tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            Projects.AdaptiveKernel.tests.test_pi3_smsc95xx_virtual_usb_timing

      - name: Run deterministic timing and concurrency model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p timing-evidence
          python -m Projects.AdaptiveKernel.pi3_smsc95xx_virtual_usb_timing \
            --fault-receipt Projects/AdaptiveKernel/results/pi3-smsc95xx-virtual-usb-fault-harness-latest.json \
            --sequence-seed 0x9514c0de \
            --sequence-steps 32768 \
            --output timing-evidence/virtual-usb-timing.json

      - name: Verify zero-authority timing receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from Projects.AdaptiveKernel.pi3_smsc95xx_virtual_usb_timing import STATE, _verify_sealed

          receipt = json.loads(Path('timing-evidence/virtual-usb-timing.json').read_text(encoding='utf-8'))
          if receipt.get('state') != STATE or not _verify_sealed(receipt):
              raise SystemExit('virtual USB timing receipt is not a sealed pass')
          if receipt.get('matrix_scenarios') != 11 or receipt.get('deterministic_sequence_steps') != 32768:
              raise SystemExit('virtual USB timing coverage is incomplete')
          if receipt.get('scenario_count') != 32779 or receipt.get('mismatch_count') != 0:
              raise SystemExit('virtual USB timing/concurrency model contains mismatches')
          if any(receipt.get('authority', {}).values()) or any(receipt.get('invariants', {}).values()):
              raise SystemExit('virtual USB timing model crossed its zero-authority boundary')
          contract = receipt.get('timing_contract', {})
          required = ('same_endpoint_serialized', 'tx_rx_overlap_allowed', 'early_completion_refused', 'disconnect_invalidates_prior_generation', 'stale_completion_quarantined')
          if any(contract.get(key) is not True for key in required):
              raise SystemExit('virtual USB timing contract is incomplete')
          summary = [
              '# Pi3 smsc95xx Virtual USB Timing/Concurrency',
              '',
              f"- State: {receipt['state']}",
              f"- Scenario count: {receipt['scenario_count']}",
              '- Same endpoint serialization: verified',
              '- TX/RX overlap: modeled',
              '- Early/stale completion refusal: verified',
              '- Disconnect generation invalidation: verified',
              '- Retry backoff: bounded 5–40 ms virtual time',
              '- Live Pi / USB / wall clock / mutation authority: false',
              '',
              receipt['strongest_claim'],
          ]
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as handle:
              handle.write('\n'.join(summary) + '\n')
          PY

      - name: Publish virtual timing evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aurum-pi3-smsc95xx-virtual-usb-timing-${{ github.run_id }}
          path: timing-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Persist verified virtual timing lineage
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cp timing-evidence/virtual-usb-timing.json \
            Projects/AdaptiveKernel/results/pi3-smsc95xx-virtual-usb-timing-latest.json
          git config user.name 'aurum-pi3-virtual-usb-timing[bot]'
          git config user.email 'aurum-pi3-virtual-usb-timing@users.noreply.github.com'
          git add Projects/AdaptiveKernel/results/pi3-smsc95xx-virtual-usb-timing-latest.json
          if git diff --cached --quiet; then
            echo 'AURUM_PI3_SMSC95XX_VIRTUAL_USB_TIMING_RECEIPT unchanged=true'
            exit 0
          fi
          git commit -m 'Record Pi3 virtual USB timing evidence [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'AURUM_PI3_SMSC95XX_VIRTUAL_USB_TIMING_RECEIPT persisted=true'
