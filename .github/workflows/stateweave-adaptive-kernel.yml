name: StateWeave Adaptive Kernel

on:
  push:
    branches:
      - stateweave-adaptive-kernel
    paths:
      - 'stateweave/**'
      - 'stateweave_kernel/**'
      - 'Architecture/StateWeave*.md'
      - '.github/workflows/stateweave-adaptive-kernel.yml'
  pull_request:
    paths:
      - 'stateweave/**'
      - 'stateweave_kernel/**'
      - 'Architecture/StateWeave*.md'
      - '.github/workflows/stateweave-adaptive-kernel.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: StateWeave base tests
        run: python -m unittest discover -s stateweave -p 'test_*.py' -v
      - name: StateWeave adaptive-kernel tests
        run: python -m unittest discover -s stateweave_kernel -p 'test_*.py' -v
