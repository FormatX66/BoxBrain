name: Aurum Critical Workflow Evidence Mirror

on:
  workflow_run:
    workflows:
      - 'Aurum Hopper Recovery Path Probe'
      - 'Aurum Hopper Recovery Request Dispatcher'
      - 'Aurum Tiny Seed Flash Contract'
      - 'Aurum Tiny Seed One-Shot Flash Request'
      - 'Aurum Tiny Seed Auto USB Refresh'
      - 'Aurum Read-Only USB Discovery'
      - 'Aurum Tiny Seed direct UEFI offline-carrier experiment'
      - 'Aurum Tiny Seed x86 fallback carrier matrix experiment'
      - 'Aurum Tiny Seed fallback canonical provenance'
    # Durable main-branch receipts are terminal evidence, not a live progress
    # ticker. Queued/in-progress state is available from Actions/Failsafe
    # readback; committing every lifecycle transition creates evidence churn.
    # Keep both Tiny Seed experiment names while the older draft remains open so
    # either experiment can produce an honest terminal receipt. Mirror the
    # system-owned USB refresh/discovery pair as well so a stalled physical
    # preflight can be distinguished from a completed no-media/error result.
    # The one-shot flash is also critical terminal evidence: authorization and a
    # ready preflight do not prove a write happened, and only the workflow's
    # terminal result plus the raw-readback receipt may advance physical state.
    # Mirror canonical fallback provenance too: a fallback artifact may stay
    # virtually green while the canonical READY_TO_FLASH release rolls forward,
    # so durable evidence must show whether that fallback was re-proven against
    # the current protected Germ/recovery payload rather than only an older one.
    types: [completed]

permissions:
  contents: write

concurrency:
  # Different workflow runs may finish almost simultaneously. They are allowed to
  # race here because the persistence loop below re-reads main and refuses to
  # replace a newer run/attempt with an older one.
  group: aurum-critical-workflow-evidence-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out canonical status branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Persist newest terminal lifecycle evidence monotonically
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aurum-critical-evidence[bot]'
          git config user.email 'aurum-critical-evidence@users.noreply.github.com'

          write_receipt_if_newest() {
            python3 - <<'PY'
          import json, os, pathlib, re, subprocess

          root = pathlib.Path('Projects/Aurum/Release/critical-workflows')
          root.mkdir(parents=True, exist_ok=True)
          name = os.environ['WORKFLOW_NAME']
          slug = re.sub(r'[^a-z0-9]+', '-', name.lower()).strip('-')
          path = root / f'{slug}.json'
          incoming_key = (
              int(os.environ['RUN_NUMBER']),
              int(os.environ.get('RUN_ATTEMPT') or '1'),
          )
          existing = None

          if path.exists():
              try:
                  existing = json.loads(path.read_text(encoding='utf-8'))
                  existing_key = (
                      int(existing.get('run_number') or 0),
                      int(existing.get('run_attempt') or 0),
                  )
              except (OSError, ValueError, TypeError, json.JSONDecodeError) as exc:
                  raise SystemExit(f'refusing to overwrite malformed critical evidence {path}: {exc}')
              if incoming_key < existing_key:
                  print(
                      'AURUM_CRITICAL_EVIDENCE_STALE_EVENT '
                      f'incoming={incoming_key} existing={existing_key} path={path}'
                  )
                  raise SystemExit(3)

          payload = {
              'schema': 'aurum-critical-workflow-evidence-v1',
              'workflow': name,
              'run_id': int(os.environ['WORKFLOW_ID']),
              'run_number': incoming_key[0],
              'run_attempt': incoming_key[1],
              'status': os.environ['RUN_STATUS'],
              'conclusion': os.environ.get('RUN_CONCLUSION') or None,
              'event': os.environ['RUN_EVENT'],
              'head_sha': os.environ['RUN_HEAD_SHA'],
              'head_branch': os.environ.get('RUN_HEAD_BRANCH') or None,
              'html_url': os.environ['RUN_URL'],
              'updated_at': os.environ['UPDATED_AT'],
              'physical_proof_inferred': False,
              'authority_granted': False,
          }

          # Auto USB refresh can finish successfully many times while doing no
          # new work. Preserve a new durable receipt only when its terminal
          # result or release-bound discovery request semantics actually change.
          # This prevents workflow metadata (run id/head/timestamp) from becoming
          # a self-sustaining evidence churn source while still recording a new
          # release, a changed safety mode/authority boundary, or any failure.
          if name == 'Aurum Tiny Seed Auto USB Refresh':
              # The refresh workflow intentionally uses cancel-in-progress=true.
              # A superseded run can therefore end as cancelled before a newer
              # run evaluates the same release. That cancellation is scheduler
              # noise, not durable recovery evidence; live Actions/Failsafe state
              # remains the source for active/queued/cancelled execution detail.
              if payload['conclusion'] == 'cancelled':
                  print('AURUM_CRITICAL_EVIDENCE no-op=auto-usb-refresh-concurrency-cancelled')
                  raise SystemExit(5)

              request_path = pathlib.Path('Projects/Aurum/Recovery/usb-discovery-request.json')
              semantic = {
                  'status': payload['status'],
                  'conclusion': payload['conclusion'],
                  'request_schema': None,
                  'request_mode': None,
                  'required_release_state': None,
                  'required_release_source_commit': None,
                  'write_authority': None,
              }
              if request_path.is_file():
                  try:
                      request = json.loads(request_path.read_text(encoding='utf-8-sig'))
                  except (OSError, ValueError, TypeError, json.JSONDecodeError):
                      request = None
                  if isinstance(request, dict):
                      semantic.update({
                          'request_schema': request.get('schema'),
                          'request_mode': request.get('mode'),
                          'required_release_state': request.get('required_release_state'),
                          'required_release_source_commit': request.get('required_release_source_commit'),
                          'write_authority': request.get('write_authority'),
                      })
              payload['semantic_terminal_state'] = semantic
              if isinstance(existing, dict) and existing.get('semantic_terminal_state') == semantic:
                  print(
                      'AURUM_CRITICAL_EVIDENCE no-op=semantic-terminal-state-unchanged '
                      f'workflow={name} release={semantic.get("required_release_source_commit")}'
                  )
                  raise SystemExit(4)

          # A provenance workflow can be successful and still become stale when a
          # newer canonical Tiny Seed release is published later. Bind its durable
          # receipt to the canonical release visible at persistence time and
          # independently compare the protected payload again. This makes
          # "fallback is warm/current" a reproducible fact rather than a timestamp
          # inference. A mismatch is recorded as evidence; it never grants authority.
          if name == 'Aurum Tiny Seed fallback canonical provenance':
              handoff_path = pathlib.Path('Projects/Aurum/Release/latest-tinyseed-handoff.json')
              handoff = json.loads(handoff_path.read_text(encoding='utf-8-sig'))
              release_source = str(handoff.get('source_commit') or '').strip()
              release_state = str(handoff.get('state') or '').strip()
              if handoff.get('schema') != 'aurum-tinyseed-handoff-v1' or not release_source:
                  raise SystemExit('cannot bind fallback provenance to malformed canonical handoff')

              head_sha = os.environ['RUN_HEAD_SHA']
              subprocess.run(
                  ['git', 'fetch', '--no-tags', 'origin', release_source, head_sha],
                  check=True,
                  stdout=subprocess.DEVNULL,
              )
              protected_paths = [
                  'Projects/Aurum/Germ/build-x86-tinyseed.sh',
                  'Projects/Aurum/Germ/GENETICS.json',
                  'Projects/Aurum/Germ/carrier.py',
                  'Projects/Aurum/Germ/reseed.py',
                  'Projects/Aurum/Germ/guardian.py',
                  'Projects/Aurum/Germ/recovery_ledger.py',
                  'Projects/Aurum/Germ/bridge.py',
                  'Projects/Aurum/Germ/germ_console.py',
                  'Projects/Aurum/Germ/machine.py',
                  'Projects/Aurum/Germ/network.py',
                  'Projects/Aurum/Germ/installer.py',
                  'Projects/Aurum/Germ/tinyseed.py',
                  'Projects/Aurum/Germ/bootstrap_console.py',
                  'Projects/Aurum/Germ/proof.py',
                  'Projects/Aurum/Germ/rollback_drill.py',
                  'Projects/Aurum/Germ/recovery_control.py',
                  'Projects/Aurum/Germ/recovery_poller.py',
                  'Projects/Aurum/Germ/triage.py',
                  'Projects/Aurum/Recovery/trusted-refs.json',
                  'Projects/Aurum/Recovery/authority-public.pem',
              ]
              comparison = subprocess.run(
                  ['git', 'diff', '--quiet', release_source, head_sha, '--', *protected_paths],
                  check=False,
              )
              if comparison.returncode not in (0, 1):
                  raise SystemExit(f'fallback provenance comparison failed rc={comparison.returncode}')
              payload['canonical_release_source_commit'] = release_source
              payload['canonical_release_state'] = release_state
              payload['canonical_payload_match'] = comparison.returncode == 0

          path.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, sort_keys=True))
          PY
          }

          # Rebase-and-push is insufficient here: a lower-numbered run can finish
          # later, rebase its stale receipt on top of a newer receipt, and silently
          # regress canonical evidence. Re-evaluate the monotonic key from fresh
          # origin/main before every push attempt instead.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            set +e
            write_receipt_if_newest
            rc=$?
            set -e
            if [ "$rc" -eq 3 ]; then
              echo 'AURUM_CRITICAL_EVIDENCE no-op=stale-terminal-event'
              exit 0
            fi
            if [ "$rc" -eq 4 ]; then
              echo 'AURUM_CRITICAL_EVIDENCE no-op=semantic-terminal-state-unchanged'
              exit 0
            fi
            if [ "$rc" -eq 5 ]; then
              echo 'AURUM_CRITICAL_EVIDENCE no-op=auto-usb-refresh-concurrency-cancelled'
              exit 0
            fi
            if [ "$rc" -ne 0 ]; then
              exit "$rc"
            fi
            git add Projects/Aurum/Release/critical-workflows
            if git diff --cached --quiet; then
              echo 'AURUM_CRITICAL_EVIDENCE no-op=unchanged'
              exit 0
            fi
            git commit -m "Record critical workflow evidence: ${WORKFLOW_NAME}=${RUN_STATUS}/${RUN_CONCLUSION:-none} [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'failed to persist monotonic critical workflow evidence after retries' >&2
          exit 1