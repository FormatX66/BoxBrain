name: Evolution Harness Experimental

on:
  push:
    branches:
      - aurum/evolution-harness-experimental
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run evolution harness tests
        run: python -m unittest discover -s evolution_harness -p 'test_*.py' -v
