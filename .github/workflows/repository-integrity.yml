name: Repository Integrity Mirror

on:
  workflow_dispatch:
  push:
    paths:
      - 'Admin/validate_repository.py'
      - 'Admin/sync_aurum_release_status.py'
      - 'Admin/sync_aurum_future_branch_evidence.py'
      - 'Admin/sync_aurum_fallback_evidence.py'
      - 'Admin/materialize_aurum_next_interaction.py'
      - 'Admin/tests/test_sync_aurum_release_status.py'
      - 'Admin/tests/test_sync_aurum_future_branch_evidence.py'
      - 'Admin/tests/test_sync_aurum_fallback_evidence.py'
      - 'Admin/tests/test_materialize_aurum_next_interaction.py'
      - 'Projects/**'
      - 'Prompts/FutureBranchSeed.txt'
      - 'README.md'
      - 'START_HERE.md'
      - 'PROJECTS.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - '.github/workflows/repository-integrity.yml'

permissions:
  contents: read

concurrency:
  group: repository-integrity-mirror
  cancel-in-progress: true

jobs:
  repository-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run canonical repository validator and state-sync tests
        id: validate
        shell: bash
        run: |
          set +e
          python3 Admin/validate_repository.py > "$RUNNER_TEMP/integrity.txt" 2>&1
          validator_rc=$?
          python3 -m unittest \
            Admin.tests.test_validate_repository \
            Admin.tests.test_sync_aurum_release_status \
            Admin.tests.test_sync_aurum_future_branch_evidence \
            Admin.tests.test_sync_aurum_fallback_evidence \
            Admin.tests.test_materialize_aurum_next_interaction \
            > "$RUNNER_TEMP/sync-tests.txt" 2>&1
          tests_rc=$?
          set -e

          {
            echo 'Repository Integrity Mirror'
            echo
            echo '== repository validator =='
            cat "$RUNNER_TEMP/integrity.txt"
            echo
            echo '== canonical Aurum state-sync tests =='
            cat "$RUNNER_TEMP/sync-tests.txt"
          } | tee "$RUNNER_TEMP/repository-integrity.txt"

          cat "$RUNNER_TEMP/repository-integrity.txt" >> "$GITHUB_STEP_SUMMARY"

          if [ "$validator_rc" -eq 0 ] && [ "$tests_rc" -eq 0 ]; then
            rc=0
          else
            rc=1
          fi
          echo "validator_rc=$validator_rc" >> "$GITHUB_OUTPUT"
          echo "tests_rc=$tests_rc" >> "$GITHUB_OUTPUT"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Preserve repository integrity report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-integrity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repository-integrity.txt
          retention-days: 14

      - name: Enforce validator result
        if: always()
        shell: bash
        run: |
          test '${{ steps.validate.outputs.rc }}' = '0'
