name: Repository Integrity Mirror

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Admin/validate_repository.py'
      - 'Admin/sync_aurum_release_status.py'
      - 'Admin/sync_aurum_future_branch_evidence.py'
      - 'Admin/sync_aurum_fallback_evidence.py'
      - 'Admin/materialize_aurum_next_interaction.py'
      - 'Admin/reconstruct_aurum_state.py'
      - 'Admin/checkpoint_aurum_runtime.py'
      - 'Admin/checkpoint_farmer_runtime.py'
      - 'Admin/resume_aurum_runtime.py'
      - 'Admin/tinyseed_refresh_policy.py'
      - 'Admin/tests/test_validate_repository.py'
      - 'Admin/tests/test_sync_aurum_release_status.py'
      - 'Admin/tests/test_sync_aurum_future_branch_evidence.py'
      - 'Admin/tests/test_sync_aurum_fallback_evidence.py'
      - 'Admin/tests/test_materialize_aurum_next_interaction.py'
      - 'Admin/tests/test_reconstruct_aurum_state.py'
      - 'Admin/tests/test_checkpoint_aurum_runtime.py'
      - 'Admin/tests/test_checkpoint_farmer_runtime.py'
      - 'Admin/tests/test_resume_aurum_runtime.py'
      - 'Admin/tests/test_tinyseed_refresh_policy.py'
      - 'Projects/**'
      - 'Prompts/FutureBranchSeed.txt'
      - 'README.md'
      - 'START_HERE.md'
      - 'PROJECTS.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - '.github/workflows/repository-integrity.yml'
      - '.circleci/config.yml'

permissions:
  contents: write

concurrency:
  group: repository-integrity-mirror
  cancel-in-progress: true

jobs:
  repository-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Run canonical repository validator and state-sync tests
        id: validate
        shell: bash
        run: |
          set +e
          python3 Admin/validate_repository.py > "$RUNNER_TEMP/integrity.txt" 2>&1
          validator_rc=$?
          python3 -m unittest \
            Admin.tests.test_validate_repository \
            Admin.tests.test_sync_aurum_release_status \
            Admin.tests.test_sync_aurum_future_branch_evidence \
            Admin.tests.test_sync_aurum_fallback_evidence \
            Admin.tests.test_materialize_aurum_next_interaction \
            Admin.tests.test_reconstruct_aurum_state \
            Admin.tests.test_checkpoint_aurum_runtime \
            Admin.tests.test_checkpoint_farmer_runtime \
            Admin.tests.test_resume_aurum_runtime \
            Admin.tests.test_tinyseed_refresh_policy \
            > "$RUNNER_TEMP/sync-tests.txt" 2>&1
          tests_rc=$?
          set -e

          # Elapsed test time is diagnostic noise, not repository state. Normalize it
          # before persistence so repeated green runs do not create new commits solely
          # because one runner took a few milliseconds longer than another.
          sed -E -i 's/^(Ran [0-9]+ tests) in [0-9.]+s$/\1/' "$RUNNER_TEMP/sync-tests.txt"

          {
            echo 'Repository Integrity Mirror'
            echo
            echo '== repository validator =='
            cat "$RUNNER_TEMP/integrity.txt"
            echo
            echo '== canonical Aurum state-sync tests =='
            cat "$RUNNER_TEMP/sync-tests.txt"
          } | tee Admin/repository-integrity-latest.txt

          if [ "$validator_rc" -eq 0 ] && [ "$tests_rc" -eq 0 ]; then
            rc=0
          else
            rc=1
          fi
          echo "validator_rc=$validator_rc" >> "$GITHUB_OUTPUT"
          echo "tests_rc=$tests_rc" >> "$GITHUB_OUTPUT"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Publish changed diagnostic receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'repository-integrity-mirror[bot]'
          git config user.email 'repository-integrity-mirror@users.noreply.github.com'
          git add Admin/repository-integrity-latest.txt
          if git diff --cached --quiet; then
            echo 'REPOSITORY_INTEGRITY_RECEIPT unchanged=true'
            exit 0
          fi
          git commit -m 'Record repository integrity diagnostic [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'REPOSITORY_INTEGRITY_RECEIPT published=true'

      - name: Enforce validator result
        if: always()
        shell: bash
        run: |
          test '${{ steps.validate.outputs.rc }}' = '0'
