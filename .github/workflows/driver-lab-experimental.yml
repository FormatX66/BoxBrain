name: Driver Lab Experimental

on:
  push:
    branches:
      - aurum/driver-lab-experimental
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run driver lab tests
        run: python -m unittest discover -s driver_lab -p 'test_*.py' -v
