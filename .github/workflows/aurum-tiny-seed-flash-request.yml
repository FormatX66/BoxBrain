name: Aurum Tiny Seed One-Shot Flash Request

on:
  push:
    branches: [main]
    paths:
      - 'Projects/Aurum/Recovery/tinyseed-flash-request.json'

permissions:
  actions: read
  contents: write

concurrency:
  group: aurum-tinyseed-one-shot-flash-request
  cancel-in-progress: false

jobs:
  flash:
    runs-on: [self-hosted, Windows, X64, aurum-elevated]
    timeout-minutes: 60
    steps:
      - name: Check out guarded flash tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate authorization, resolve exact local target, flash, and verify
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $requestPath = 'Projects/Aurum/Recovery/tinyseed-flash-request.json'
          $preflightPath = 'Projects/Aurum/Recovery/latest-tinyseed-physical-preflight.json'
          $protectedPath = 'Projects/Aurum/Recovery/protected-media.json'
          $request = Get-Content -LiteralPath $requestPath -Raw | ConvertFrom-Json
          $preflight = Get-Content -LiteralPath $preflightPath -Raw | ConvertFrom-Json
          $protected = Get-Content -LiteralPath $protectedPath -Raw | ConvertFrom-Json

          if ([string]$request.schema -ne 'aurum-tinyseed-flash-request-v1') { throw 'AURUM_TINYSEED_FLASH_REFUSED reason=request-schema' }
          if ([string]$request.state -ne 'AUTHORIZED_ONCE') { throw 'AURUM_TINYSEED_FLASH_REFUSED reason=request-not-authorized' }
          if (-not [bool]$request.write_authority) { throw 'AURUM_TINYSEED_FLASH_REFUSED reason=write-authority-false' }
          if ([string]$request.confirmation -ne 'FLASH_TINY_SEED_TEST_USB') { throw 'AURUM_TINYSEED_FLASH_REFUSED reason=confirmation' }
          if ([string]$preflight.schema -ne 'aurum-tinyseed-physical-preflight-v2') { throw 'AURUM_TINYSEED_FLASH_REFUSED reason=preflight-schema' }
          if ([string]$preflight.state -ne 'READY_FOR_GUARDED_FLASH_PREFLIGHT' -or [string]$preflight.preflight_state -ne [string]$preflight.state) { throw 'AURUM_TINYSEED_FLASH_REFUSED reason=preflight-not-ready' }
          if ([bool]$preflight.write_authority -or [bool]$preflight.destructive_action_allowed -or [bool]$preflight.usb_discovery.write_authority) { throw 'AURUM_TINYSEED_FLASH_REFUSED reason=preflight-smuggled-authority' }
          if ([string]$preflight.release.state -ne 'READY_TO_FLASH' -or [int]$preflight.usb_discovery.eligible_count -ne 1 -or [string]$preflight.usb_discovery.selection_state -ne 'UNIQUE_SAFE_TO_PREFLIGHT_ONLY') { throw 'AURUM_TINYSEED_FLASH_REFUSED reason=preflight-invariants' }
          if ([string]$preflight.preexecution_recovery.required_schema -ne 'aurum.hopper.recovery-path-probe.v2' -or -not [bool]$preflight.preexecution_recovery.manual_handoff_released) { throw 'AURUM_TINYSEED_FLASH_REFUSED reason=preexecution-recovery-not-released' }

          $expires = [DateTime]::Parse([string]$request.expires_at_utc).ToUniversalTime()
          if ([DateTime]::UtcNow -gt $expires) { throw 'AURUM_TINYSEED_FLASH_REFUSED reason=request-expired' }

          $seedSha = ([string]$request.seed_sha).Trim().ToLowerInvariant()
          $imageSha = ([string]$request.image_sha256).Trim().ToLowerInvariant()
          $handoffRunId = [long]$request.handoff_run_id
          $serialHashWanted = ([string]$request.usb.serial_sha256).Trim().ToLowerInvariant()
          $modelWanted = [string]$request.usb.model
          $sizeWanted = [int64]$request.usb.size_bytes
          $discoveryId = [string]$request.discovery_request_id
          $requestId = [string]$request.request_id

          if ($seedSha -notmatch '^[0-9a-f]{40}$' -or $imageSha -notmatch '^[0-9a-f]{64}$' -or $handoffRunId -le 0 -or $serialHashWanted -notmatch '^[0-9a-f]{64}$') {
            throw 'AURUM_TINYSEED_FLASH_REFUSED reason=request-identity-format'
          }
          if ($requestId -notmatch '^[A-Za-z0-9._-]{1,96}$') { throw 'AURUM_TINYSEED_FLASH_REFUSED reason=request-id' }
          if (([string]$preflight.release.source_commit).ToLowerInvariant() -ne $seedSha -or ([string]$preflight.release.x86_sha256).ToLowerInvariant() -ne $imageSha) {
            throw 'AURUM_TINYSEED_FLASH_REFUSED reason=release-does-not-match-preflight'
          }
          if (-not [bool]$preflight.usb_discovery.release_request_match -or ([string]$preflight.usb_discovery.release_source_commit).ToLowerInvariant() -ne $seedSha -or -not [bool]$preflight.usb_discovery.candidate.eligible_for_preflight_only) {
            throw 'AURUM_TINYSEED_FLASH_REFUSED reason=discovery-release-binding'
          }
          if ([string]$preflight.usb_discovery.request_id -ne $discoveryId -or [string]$preflight.usb_discovery.candidate.model -ne $modelWanted -or [int64]$preflight.usb_discovery.candidate.size_bytes -ne $sizeWanted -or ([string]$preflight.usb_discovery.candidate.serial_sha256).ToLowerInvariant() -ne $serialHashWanted) {
            throw 'AURUM_TINYSEED_FLASH_REFUSED reason=usb-does-not-match-preflight'
          }
          if ([bool]$preflight.usb_discovery.candidate.is_boot -or [bool]$preflight.usb_discovery.candidate.is_system -or [bool]$preflight.usb_discovery.candidate.is_read_only -or [bool]$preflight.usb_discovery.candidate.protected) {
            throw 'AURUM_TINYSEED_FLASH_REFUSED reason=preflight-candidate-unsafe'
          }

          function Get-SerialHash([string]$Serial) {
            $bytes = [Text.Encoding]::UTF8.GetBytes($Serial)
            $sha = [Security.Cryptography.SHA256]::Create()
            try { return ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant() }
            finally { $sha.Dispose() }
          }

          function Assert-VerifiedPacket(
            [string]$ImagePath,
            [string]$ChecksumPath,
            [string]$ManifestPath,
            [string]$ExpectedSeed,
            [string]$ExpectedImage
          ) {
            if (-not (Test-Path -LiteralPath $ImagePath -PathType Leaf) -or -not (Test-Path -LiteralPath $ChecksumPath -PathType Leaf) -or -not (Test-Path -LiteralPath $ManifestPath -PathType Leaf)) {
              throw 'AURUM_TINYSEED_FLASH_INTEGRITY_FAILURE reason=packet-files-missing'
            }
            $manifest = Get-Content -LiteralPath $ManifestPath -Raw | ConvertFrom-Json
            if ([string]$manifest.state -ne 'READY_TO_FLASH' -or ([string]$manifest.source_commit).ToLowerInvariant() -ne $ExpectedSeed) {
              throw 'AURUM_TINYSEED_FLASH_INTEGRITY_FAILURE reason=manifest'
            }
            foreach ($gate in @('x86_build','x86_uefi_boot_smoke','x86_bios_boot_smoke','x86_boot_proof_marker','published_artifacts','combined_hash_reverification')) {
              if ([string]$manifest.gates.$gate -ne 'passed') { throw "AURUM_TINYSEED_FLASH_INTEGRITY_FAILURE reason=gate-$gate" }
            }
            $expected = ((Get-Content -LiteralPath $ChecksumPath -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
            $actual = (Get-FileHash -LiteralPath $ImagePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expected -ne $ExpectedImage -or $actual -ne $ExpectedImage -or ([string]$manifest.artifacts.x86.sha256).ToLowerInvariant() -ne $ExpectedImage) {
              throw 'AURUM_TINYSEED_FLASH_INTEGRITY_FAILURE reason=image-sha'
            }
          }

          $candidateRows = @()
          foreach ($diskItem in @(Get-Disk | Where-Object { $_.BusType -eq 'USB' })) {
            $raw = ([string]$diskItem.SerialNumber).Trim()
            if (-not $raw) { continue }
            $candidateRows += [pscustomobject]@{ disk = $diskItem; raw_serial = $raw; serial_sha256 = Get-SerialHash $raw }
          }
          $matches = @($candidateRows | Where-Object { $_.serial_sha256 -eq $serialHashWanted })
          if ($matches.Count -ne 1) { throw "AURUM_TINYSEED_FLASH_REFUSED reason=hashed-target-not-unique count=$($matches.Count)" }
          $row = $matches[0]
          $disk = $row.disk
          $rawSerial = [string]$row.raw_serial
          if ([string]$disk.FriendlyName -ne $modelWanted -or [int64]$disk.Size -ne $sizeWanted -or [bool]$disk.IsBoot -or [bool]$disk.IsSystem -or [bool]$disk.IsReadOnly) {
            throw 'AURUM_TINYSEED_FLASH_REFUSED reason=live-target-does-not-match-authorized-device'
          }
          if (@($protected.devices | Where-Object { [bool]$_.protected -and ([string]$_.serial).Trim() -eq $rawSerial }).Count -gt 0) {
            throw 'AURUM_TINYSEED_FLASH_REFUSED reason=target-protected'
          }

          $sentinelRoot = Join-Path $env:ProgramData 'Aurum\TinySeedFlash\consumed'
          New-Item -ItemType Directory -Path $sentinelRoot -Force | Out-Null
          $sentinel = Join-Path $sentinelRoot "$requestId.json"
          if (Test-Path -LiteralPath $sentinel) {
            try { $existing = Get-Content -LiteralPath $sentinel -Raw | ConvertFrom-Json }
            catch { throw 'AURUM_TINYSEED_FLASH_REFUSED reason=consumed-sentinel-invalid' }
            if (
              [string]$existing.schema -eq 'aurum-tinyseed-flash-request-receipt-v1' -and
              [string]$existing.state -eq 'READY_TO_BOOT' -and
              [string]$existing.request_id -eq $requestId -and
              ([string]$existing.source_commit).ToLowerInvariant() -eq $seedSha -and
              ([string]$existing.image_sha256).ToLowerInvariant() -eq $imageSha -and
              [bool]$existing.raw_readback_verified -and
              [bool]$existing.write_authority_consumed
            ) {
              Write-Host "AURUM_TINYSEED_FLASH_ALREADY_COMPLETE request_id=$requestId state=READY_TO_BOOT"
              exit 0
            }
            throw 'AURUM_TINYSEED_FLASH_REFUSED reason=request-already-consumed-without-ready-proof'
          }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $repo = $env:GITHUB_REPOSITORY
          $run = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/actions/runs/$handoffRunId"
          if ([string]$run.path -ne '.github/workflows/aurum-tiny-seed-handoff.yml' -or [string]$run.conclusion -ne 'success') {
            throw 'AURUM_TINYSEED_FLASH_WAITING reason=bound-handoff-run-not-successful'
          }
          $artifacts = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/actions/runs/$handoffRunId/artifacts?per_page=100"
          $artifact = @($artifacts.artifacts | Where-Object { $_.name -eq 'Aurum-TinySeed-Handoff' -and -not $_.expired } | Select-Object -First 1)
          if ($artifact.Count -ne 1) { throw 'AURUM_TINYSEED_FLASH_INTEGRITY_FAILURE reason=handoff-artifact-missing' }
          $artifactId = [long]$artifact[0].id

          # Prefer a packet that was fully downloaded and hash-verified before
          # destructive authority existed. Cache state is deliberately
          # non-authoritative and is reverified here before use.
          $persistentCache = Join-Path $env:ProgramData "Aurum\TinySeedFlash\cache\$imageSha"
          $imagePath = Join-Path $persistentCache 'Aurum-TinySeed-amd64.iso'
          $shaPath = Join-Path $persistentCache 'Aurum-TinySeed-amd64.iso.sha256'
          $manifestPath = Join-Path $persistentCache 'AURUM-TINYSEED-RELEASE.json'
          $metaPath = Join-Path $persistentCache 'cache-metadata.json'
          $cacheUsable = $false
          if ((Test-Path $imagePath) -and (Test-Path $shaPath) -and (Test-Path $manifestPath) -and (Test-Path $metaPath)) {
            try {
              $meta = Get-Content -LiteralPath $metaPath -Raw | ConvertFrom-Json
              if (
                [string]$meta.schema -eq 'aurum-tinyseed-windows-cache-v1' -and
                ([string]$meta.source_commit).ToLowerInvariant() -eq $seedSha -and
                ([string]$meta.image_sha256).ToLowerInvariant() -eq $imageSha -and
                [long]$meta.handoff_run_id -eq $handoffRunId -and
                [long]$meta.handoff_artifact_id -eq $artifactId -and
                [bool]$meta.hash_verified -and
                -not [bool]$meta.destructive_media_write -and
                -not [bool]$meta.write_authority
              ) {
                Assert-VerifiedPacket $imagePath $shaPath $manifestPath $seedSha $imageSha
                $cacheUsable = $true
              }
            } catch {
              Write-Host "AURUM_TINYSEED_FLASH_CACHE_REJECTED reason=$($_.Exception.Message)"
              $cacheUsable = $false
            }
          }

          if ($cacheUsable) {
            Write-Host "AURUM_TINYSEED_FLASH_CACHE_HIT source=$seedSha image_sha256=$imageSha handoff_run_id=$handoffRunId write_authority=false"
          } else {
            Write-Host 'AURUM_TINYSEED_FLASH_CACHE_MISS action=download-and-verify-before-write-boundary'
            $tempRoot = Join-Path $env:RUNNER_TEMP "aurum-tinyseed-request-$requestId"
            if (Test-Path -LiteralPath $tempRoot) { Remove-Item -LiteralPath $tempRoot -Recurse -Force }
            New-Item -ItemType Directory -Path $tempRoot -Force | Out-Null
            try {
              $zip = Join-Path $tempRoot 'handoff.zip'
              Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/$repo/actions/artifacts/$artifactId/zip" -OutFile $zip
              $expanded = Join-Path $tempRoot 'expanded'
              Expand-Archive -LiteralPath $zip -DestinationPath $expanded -Force
              $manifestFile = Get-ChildItem -LiteralPath $expanded -Recurse -File -Filter 'AURUM-TINYSEED-RELEASE.json' | Select-Object -First 1
              $imageFile = Get-ChildItem -LiteralPath $expanded -Recurse -File -Filter 'Aurum-TinySeed-amd64.iso' | Select-Object -First 1
              $checksumFile = Get-ChildItem -LiteralPath $expanded -Recurse -File -Filter 'Aurum-TinySeed-amd64.iso.sha256' | Select-Object -First 1
              if (-not $manifestFile -or -not $imageFile -or -not $checksumFile) { throw 'AURUM_TINYSEED_FLASH_INTEGRITY_FAILURE reason=handoff-packet-incomplete' }
              Assert-VerifiedPacket $imageFile.FullName $checksumFile.FullName $manifestFile.FullName $seedSha $imageSha

              $staging = $persistentCache + '.staging-' + [Guid]::NewGuid().ToString('N')
              New-Item -ItemType Directory -Path $staging -Force | Out-Null
              try {
                Copy-Item $imageFile.FullName (Join-Path $staging 'Aurum-TinySeed-amd64.iso')
                Copy-Item $checksumFile.FullName (Join-Path $staging 'Aurum-TinySeed-amd64.iso.sha256')
                Copy-Item $manifestFile.FullName (Join-Path $staging 'AURUM-TINYSEED-RELEASE.json')
                $meta = [ordered]@{
                  schema = 'aurum-tinyseed-windows-cache-v1'
                  source_commit = $seedSha
                  image_sha256 = $imageSha
                  handoff_run_id = $handoffRunId
                  handoff_artifact_id = $artifactId
                  hash_verified = $true
                  destructive_media_write = $false
                  write_authority = $false
                  cached_at_utc = [DateTime]::UtcNow.ToString('o')
                }
                [IO.File]::WriteAllText((Join-Path $staging 'cache-metadata.json'), (($meta | ConvertTo-Json -Depth 5) + [Environment]::NewLine), (New-Object Text.UTF8Encoding($false)))
                if (Test-Path $persistentCache) { Remove-Item $persistentCache -Recurse -Force }
                Move-Item $staging $persistentCache
              } finally {
                if (Test-Path $staging) { Remove-Item $staging -Recurse -Force -ErrorAction SilentlyContinue }
              }
            } finally {
              Remove-Item $tempRoot -Recurse -Force -ErrorAction SilentlyContinue
            }
            $imagePath = Join-Path $persistentCache 'Aurum-TinySeed-amd64.iso'
            $shaPath = Join-Path $persistentCache 'Aurum-TinySeed-amd64.iso.sha256'
            $manifestPath = Join-Path $persistentCache 'AURUM-TINYSEED-RELEASE.json'
            Assert-VerifiedPacket $imagePath $shaPath $manifestPath $seedSha $imageSha
            Write-Host "AURUM_TINYSEED_FLASH_CACHE_STAGED source=$seedSha image_sha256=$imageSha write_authority=false"
          }

          $shellExe = (Get-Process -Id $PID -ErrorAction Stop).Path
          if ((Split-Path -Leaf $shellExe) -notin @('powershell.exe', 'pwsh.exe')) {
            throw 'AURUM_TINYSEED_FLASH_REFUSED reason=untrusted-powershell-host'
          }

          # Refresh recovery only after potentially slow packet preparation. This
          # makes destructive proof fresh at the point where it actually matters.
          $recoveryScript = 'Projects/AurumBridge/Refresh-HopperRecoveryReadOnly.ps1'
          $recoveryReceipt = 'Projects/AurumBridge/results/hopper-recovery-path-latest.json'
          & $shellExe -NoProfile -File $recoveryScript -OutputPath $recoveryReceipt
          if ($LASTEXITCODE -ne 0) { throw "AURUM_TINYSEED_FLASH_REFUSED reason=preexecution-recovery-refresh-failed exit=$LASTEXITCODE" }

          if ([DateTime]::UtcNow -gt $expires) { throw 'AURUM_TINYSEED_FLASH_REFUSED reason=request-expired-before-write' }

          # Re-prove exact target immediately before consuming the one-shot.
          $live = Get-Disk -Number ([int]$disk.Number) -ErrorAction Stop
          if ($live.BusType -ne 'USB' -or [bool]$live.IsBoot -or [bool]$live.IsSystem -or [bool]$live.IsReadOnly -or [int64]$live.Size -ne $sizeWanted -or (Get-SerialHash (([string]$live.SerialNumber).Trim())) -ne $serialHashWanted) {
            throw 'AURUM_TINYSEED_FLASH_REFUSED reason=target-identity-changed-before-helper'
          }
          if (@($protected.devices | Where-Object { [bool]$_.protected -and ([string]$_.serial).Trim() -eq (([string]$live.SerialNumber).Trim()) }).Count -gt 0) {
            throw 'AURUM_TINYSEED_FLASH_REFUSED reason=target-became-protected-before-helper'
          }

          # Consume authority at the last safe moment. Any subsequent failure
          # requires new explicit authority; no automatic destructive retry.
          $claim = [ordered]@{
            schema = 'aurum-tinyseed-flash-claim-v1'
            state = 'CLAIMED'
            request_id = $requestId
            source_commit = $seedSha
            image_sha256 = $imageSha
            write_authority_consumed = $true
            claimed_at_utc = [DateTime]::UtcNow.ToString('o')
          }
          [IO.File]::WriteAllText($sentinel, ((($claim | ConvertTo-Json -Depth 5)) + [Environment]::NewLine), (New-Object Text.UTF8Encoding($false)))

          $confirm = "FLASH_TINYSEED_$($imageSha.Substring(0,8).ToUpperInvariant())"
          $script = 'Projects/Aurum/Germ/handoff/Flash-TinySeed-Windows.ps1'
          $childOutput = & $shellExe -NoProfile -File $script -ImagePath $imagePath -ChecksumPath $shaPath -DiskSerial $rawSerial -ConfirmText $confirm -Write 2>&1
          $childExit = $LASTEXITCODE
          foreach ($line in @($childOutput)) { Write-Host (([string]$line).Replace($rawSerial, '<redacted-serial>')) }
          if ($childExit -ne 0) { throw "AURUM_TINYSEED_FLASH_FAILED helper_exit=$childExit" }
          $childText = @($childOutput) -join "`n"
          if ($childText -notmatch 'AURUM_TINYSEED_FLASH_OK' -or $childText -notmatch 'raw_readback_verified=true') {
            throw 'AURUM_TINYSEED_FLASH_INTEGRITY_FAILURE reason=helper-did-not-prove-raw-readback'
          }

          $proof = [ordered]@{
            schema = 'aurum-tinyseed-flash-request-receipt-v1'
            state = 'READY_TO_BOOT'
            request_id = $requestId
            source_commit = $seedSha
            image_sha256 = $imageSha
            handoff_run_id = $handoffRunId
            device = [ordered]@{
              disk_number = [int]$disk.Number
              model = $modelWanted
              size_bytes = $sizeWanted
              serial_sha256 = $serialHashWanted
            }
            raw_readback_verified = $true
            write_authority_consumed = $true
            observed_at_utc = [DateTime]::UtcNow.ToString('o')
          }
          $proofJson = $proof | ConvertTo-Json -Depth 8
          [IO.File]::WriteAllText($sentinel, $proofJson + [Environment]::NewLine, (New-Object Text.UTF8Encoding($false)))
          $receiptPath = 'Projects/Aurum/Recovery/latest-tinyseed-flash-receipt.json'
          [IO.File]::WriteAllText($receiptPath, $proofJson + [Environment]::NewLine, (New-Object Text.UTF8Encoding($false)))
          git config user.name 'aurum-tinyseed-flash[bot]'
          git config user.email 'aurum-tinyseed-flash@users.noreply.github.com'
          git add -- $receiptPath
          git commit -m 'Record verified Tiny Seed flash receipt [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          Write-Host "AURUM_TINYSEED_FLASH_REQUEST_OK request_id=$requestId state=READY_TO_BOOT raw_readback_verified=true"
