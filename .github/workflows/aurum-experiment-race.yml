name: Aurum Experiment Race

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - StateWeave Experimental
      - Adaptive Kernel Experimental
      - StateWeave Adaptive Kernel
    types:
      - completed
  repository_dispatch:
    types:
      - aurum-experiment-frontier
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurum-experiment-race
  cancel-in-progress: true

jobs:
  lane:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: conventional-aurum
            ref: main
            install: cd controller && python -m pip install -e ../Projects/AurumFarmer -e '.[dev]'
            command: cd controller && python -m pytest -q
            loc_paths: controller/src ui/lib
          - name: stateweave
            ref: stateweave-experimental
            install: ':'
            command: python -m unittest discover -s stateweave -p 'test_*.py' -v
            loc_paths: stateweave
          - name: adaptive-kernel
            ref: adaptive-kernel-experimental
            install: ':'
            command: python -m unittest discover -s adaptive_kernel -p 'test_*.py' -v
            loc_paths: adaptive_kernel
          - name: stateweave-adaptive-kernel
            ref: stateweave-adaptive-kernel
            install: ':'
            command: python -m unittest discover -s stateweave -p 'test_*.py' -v && python -m unittest discover -s stateweave_kernel -p 'test_*.py' -v
            loc_paths: stateweave stateweave_kernel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run native tests and shared benchmark
        shell: bash
        env:
          LANE_NAME: ${{ matrix.name }}
          LANE_REF: ${{ matrix.ref }}
          INSTALL_COMMAND: ${{ matrix.install }}
          LANE_COMMAND: ${{ matrix.command }}
          LOC_PATHS: ${{ matrix.loc_paths }}
        run: |
          set +e
          started=$(date +%s)
          : > lane-test.log

          bash -lc "$INSTALL_COMMAND" >> lane-test.log 2>&1
          install_code=$?

          if [ "$install_code" -eq 0 ]; then
            bash -lc "$LANE_COMMAND" >> lane-test.log 2>&1
            native_code=$?
          else
            native_code=$install_code
          fi

          python experiments/benchmark.py >> lane-test.log 2>&1
          benchmark_code=$?

          if [ ! -f benchmark-result.json ]; then
            python - <<PY
          import json
          with open('benchmark-result.json','w',encoding='utf-8') as f:
              json.dump({
                  'benchmark': 'bounded_recovery_v1',
                  'lane': '${LANE_NAME}',
                  'success': False,
                  'invariant_preserved': False,
                  'first_attempts': None,
                  'second_attempts': None,
                  'rollback_count': None,
                  'learned_avoidance': False,
                  'machine_native_representation': False,
                  'semantic_planner': False,
                  'adaptive_hardware': False,
              }, f, indent=2, sort_keys=True)
          PY
          fi

          cat lane-test.log
          finished=$(date +%s)
          duration=$((finished-started))
          sha=$(git rev-parse HEAD)

          loc=0
          for path in $LOC_PATHS; do
            if [ -e "$path" ]; then
              subtotal=$(find "$path" -type f \( -name '*.py' -o -name '*.dart' -o -name '*.c' -o -name '*.h' -o -name '*.rs' -o -name '*.S' -o -name '*.s' \) -print0 | xargs -0 -r cat | wc -l)
              loc=$((loc+subtotal))
            fi
          done

          if [ "$native_code" -eq 0 ]; then native_status=pass; else native_status=fail; fi
          if [ "$benchmark_code" -eq 0 ]; then benchmark_status=pass; else benchmark_status=fail; fi

          python - <<PY
          import json
          record = {
              'lane': '${LANE_NAME}',
              'ref': '${LANE_REF}',
              'sha': '${sha}',
              'native_status': '${native_status}',
              'native_exit_code': ${native_code},
              'benchmark_status': '${benchmark_status}',
              'benchmark_exit_code': ${benchmark_code},
              'duration_seconds': ${duration},
              'targeted_loc': ${loc},
          }
          with open('lane-result.json','w',encoding='utf-8') as f:
              json.dump(record, f, indent=2, sort_keys=True)
          PY

          # Red lanes remain evidence; they do not stop the other racers.
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: race-${{ matrix.name }}
          path: |
            lane-result.json
            benchmark-result.json
            lane-test.log
          retention-days: 30

  scoreboard:
    name: Scoreboard
    needs: lane
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: race-*
          path: race-results

      - name: Build scorecard
        shell: bash
        run: |
          python - <<'PY'
          import glob, json, os
          lanes={}
          for path in glob.glob('race-results/**/lane-result.json', recursive=True):
              with open(path, encoding='utf-8') as f:
                  r=json.load(f)
              lanes.setdefault(r['lane'], {})['lane']=r
          for path in glob.glob('race-results/**/benchmark-result.json', recursive=True):
              with open(path, encoding='utf-8') as f:
                  r=json.load(f)
              lanes.setdefault(r['lane'], {})['bench']=r

          lines=[
              '# Aurum Experiment Race',
              '',
              'Every lane runs its native tests plus the same `bounded_recovery_v1` semantic benchmark.',
              'This scorecard is evidence only; no lane is promoted automatically.',
              '',
              '| Lane | Native | Common benchmark | Attempts 1st→2nd | Learned avoidance | Machine-native | Adaptive HW | LOC |',
              '|---|---:|---:|---:|---:|---:|---:|---:|',
          ]
          for name in sorted(lanes):
              lr=lanes[name].get('lane', {})
              b=lanes[name].get('bench', {})
              first=b.get('first_attempts')
              second=b.get('second_attempts')
              attempts=f'{first}→{second}' if first is not None and second is not None else 'n/a'
              lines.append(
                  f"| {name} | {lr.get('native_status','?')} | {lr.get('benchmark_status','?')} | "
                  f"{attempts} | {str(b.get('learned_avoidance',False)).lower()} | "
                  f"{str(b.get('machine_native_representation',False)).lower()} | "
                  f"{str(b.get('adaptive_hardware',False)).lower()} | {lr.get('targeted_loc','?')} |"
              )

          lines += [
              '',
              '## Guardrails',
              '',
              '- A benchmark pass requires the desired state and the safety invariant.',
              '- Unit-test success alone does not declare a winner.',
              '- Lower LOC is descriptive, not automatically better.',
              '- Promotion requires a shared real-world Aurum capability with equal or better verified outcome, safety, recoverability, and resource cost.',
          ]
          text='\n'.join(lines)+'\n'
          open('AURUM_EXPERIMENT_SCORECARD.md','w',encoding='utf-8').write(text)
          summary=os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary,'a',encoding='utf-8') as f:
                  f.write(text)
          print(text)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: aurum-experiment-scorecard
          path: AURUM_EXPERIMENT_SCORECARD.md
          retention-days: 30
