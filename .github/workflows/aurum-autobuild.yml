name: Aurum Autonomous Build Loop

on:
  workflow_dispatch:
  repository_dispatch:
    types: [aurum-self-build-continue]
  push:
    branches:
      - aurum/trunk-v0.01
    paths:
      - '.github/workflows/aurum-autobuild.yml'
      - 'Projects/Codelation/run_native_autonomous_chain.py'
      - 'Projects/Codelation/field/**'
      - 'Projects/Codelation/interface/**'
      - 'Projects/Codelation/seed/aurum_console.py'
      - 'Projects/Codelation/seed/aurum_gui.py'
      - 'Projects/Codelation/autobuild/capacity_mesh_policy.json'
      - 'Projects/Codelation/autobuild/continuous_build_policy.json'
      - 'Projects/Codelation/autobuild/native_gap_specs/**'
      - 'Projects/Codelation/autobuild/external_evidence/**'
      - 'Projects/Codelation/tests/test_native*.py'
      - 'Projects/Codelation/tests/test_field_native*.py'
      - 'Projects/Codelation/tests/test_local_capability_verification.py'
      - 'Projects/Codelation/tests/test_bounded_adaptive_shell_live_trial.py'
      - 'Projects/Codelation/tests/test_adaptive_shell_live_trial_collector.py'
      - 'Projects/Codelation/tests/test_adaptive_shell_iteration_observation_collector.py'
      - 'Projects/Codelation/tests/test_aurum_console.py'
      - 'Projects/Codelation/tests/test_aurum_gui.py'
      - 'Projects/Codelation/tests/test_adaptive_shell_gui_deployment.py'
      - 'Projects/Codelation/tests/test_aurum_dialogue.py'
      - 'Projects/Codelation/tests/test_aurum_live.py'
      - 'Projects/Codelation/tests/test_local_lane_contract.py'
      - 'installer/aurum-console.sh'
      - 'installer/open-aurum-console-on-pi.ps1'
      - 'installer/reconcile-existing-aurum-gold-seed-on-pi.ps1'
      - 'installer/*aurum-gui*'

permissions:
  contents: write
  actions: write

concurrency:
  group: aurum-autonomous-trunk-v001
  cancel-in-progress: false

env:
  AURUM_TRUNK: aurum/trunk-v0.01

jobs:
  grow:
    name: Resume verified native growth
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.checkpoint.outputs.changed }}
      blocked_reason: ${{ steps.state.outputs.blocked_reason }}
      reasoning_required: ${{ steps.state.outputs.reasoning_required }}
    steps:
      - name: Check out current Aurum trunk
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: aurum/trunk-v0.01
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Verify native self-build contracts
        shell: bash
        run: >-
          python3 -m unittest
          Projects.Codelation.tests.test_native_program_synthesis
          Projects.Codelation.tests.test_local_capability_verification
          Projects.Codelation.tests.test_field_native_vm
          Projects.Codelation.tests.test_bottleneck_mesh
          Projects.Codelation.tests.test_bounded_adaptive_shell_live_trial
          Projects.Codelation.tests.test_adaptive_shell_live_trial_collector
          Projects.Codelation.tests.test_adaptive_shell_iteration_observation_collector
          Projects.Codelation.tests.test_aurum_console
          Projects.Codelation.tests.test_aurum_gui
          Projects.Codelation.tests.test_adaptive_shell_gui_deployment
          Projects.Codelation.tests.test_external_evidence_recovery_contract
          Projects.Codelation.tests.test_aurum_dialogue
          Projects.Codelation.tests.test_aurum_live
          Projects.Codelation.tests.test_local_lane_contract
          -v

      - name: Bind successful same-commit virtual convergence proof
        id: virtual_proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          spec='Projects/Codelation/autobuild/native_gap_specs/adaptive_shell_gui_context_virtual_convergence.json'
          state='Projects/Codelation/autobuild/native_chain_state.json'
          echo 'applied=false' >> "$GITHUB_OUTPUT"

          next_gap="$(python3 - "$state" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(data.get('next_gap') or '')
          PY
          )"
          if [ "$next_gap" != 'adaptive_shell_gui_context_virtual_convergence' ]; then
            echo "AURUM_VIRTUAL_PROOF skipped-next-gap=$next_gap"
            exit 0
          fi

          source_commit="$(git rev-parse HEAD)"
          runs="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/aurum-virtual-lab.yml/runs?branch=${AURUM_TRUNK}&status=success&per_page=50")"
          run_id="$(printf '%s' "$runs" | jq -r --arg sha "$source_commit" \
            '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")][0].id // empty')"
          if [ -z "$run_id" ]; then
            echo "AURUM_VIRTUAL_PROOF pending source_commit=$source_commit"
            exit 0
          fi

          artifact="Aurum-VirtualLab-Convergence-${source_commit}"
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
          artifact_id="$(printf '%s' "$artifacts" | jq -r --arg name "$artifact" \
            '[.artifacts[] | select(.name == $name and .expired == false)][0].id // empty')"
          if [ -z "$artifact_id" ]; then
            echo "AURUM_VIRTUAL_PROOF run-without-convergence-artifact run_id=$run_id source_commit=$source_commit" >&2
            exit 1
          fi

          python3 - "$spec" "$source_commit" "$run_id" "$artifact" "$artifact_id" <<'PY'
          import json, pathlib, sys
          spec_path = pathlib.Path(sys.argv[1])
          source_commit, run_id, artifact, artifact_id = sys.argv[2:]
          data = json.loads(spec_path.read_text(encoding='utf-8'))
          if data.get('name') != 'adaptive_shell_gui_context_virtual_convergence':
              raise SystemExit('virtual convergence spec identity mismatch')
          invocation = data.get('invocation_arguments')
          if not isinstance(invocation, dict):
              raise SystemExit('virtual convergence invocation missing')
          required = {
              'surface_integration_verified': 'yes',
              'physical_hardware_not_claimed': 'yes',
              'no_credential_persistence': 'yes',
              'no_host_authority': 'yes',
          }
          for key, expected in required.items():
              if invocation.get(key) != expected:
                  raise SystemExit(f'virtual convergence prerequisite not satisfied: {key}')
          invocation['same_commit_virtual_lab_verified'] = 'yes'
          spec_path.write_text(json.dumps(data, indent=2, sort_keys=False) + '\n', encoding='utf-8')
          proof = {
              'schema': 'aurum.same-commit.virtual-lab-proof.v1',
              'verified': True,
              'source_commit': source_commit,
              'workflow': 'aurum-virtual-lab.yml',
              'workflow_run_id': int(run_id),
              'proof_artifact': artifact,
              'proof_artifact_id': int(artifact_id),
              'physical_hardware': 'not-proven-or-implied',
              'credential_content_captured': False,
              'authority_granted': False,
          }
          pathlib.Path('/tmp/aurum-virtual-convergence-proof.json').write_text(
              json.dumps(proof, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          echo 'applied=true' >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "AURUM_VIRTUAL_PROOF applied source_commit=$source_commit run_id=$run_id"

      - name: Resume bounded native growth
        shell: bash
        run: |
          set -euo pipefail
          state='Projects/Codelation/autobuild/native_chain_state.json'
          completed="$(python3 - "$state" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          if not path.is_file():
              print(0)
          else:
              data = json.loads(path.read_text(encoding='utf-8'))
              print(int(data.get('completed_generations') or 0))
          PY
          )"
          epoch_size=64
          generation_ceiling=$((completed + epoch_size))
          echo "AURUM_AUTOBUILD_EPOCH start_generation=$completed epoch_size=$epoch_size ceiling=$generation_ceiling"
          python3 Projects/Codelation/run_native_autonomous_chain.py \
            --resume \
            --max-generations "$generation_ceiling" \
            --state-path "$state" \
            | tee /tmp/aurum-native-chain.json

      - name: Restore transient convergence override and retain provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          spec='Projects/Codelation/autobuild/native_gap_specs/adaptive_shell_gui_context_virtual_convergence.json'
          git checkout -- "$spec"
          if [ ! -s /tmp/aurum-virtual-convergence-proof.json ]; then
            exit 0
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          state_path = Path('Projects/Codelation/autobuild/native_chain_state.json')
          proof_path = Path('/tmp/aurum-virtual-convergence-proof.json')
          if not state_path.is_file():
              raise SystemExit('native state missing after virtual proof application')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          proof = json.loads(proof_path.read_text(encoding='utf-8'))
          matched = False
          for generation in reversed(state.get('generations') or []):
              if generation.get('gap') != 'adaptive_shell_gui_context_virtual_convergence':
                  continue
              if generation.get('invocation_output') != 'gui-context-virtual-convergence-ready':
                  continue
              generation['external_evidence'] = proof
              matched = True
              break
          if not matched:
              raise SystemExit('verified virtual proof did not produce a ready convergence generation')
          state['virtual_convergence_evidence'] = proof
          state_path.write_text(json.dumps(state, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Read verified growth state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          state = json.loads(Path('Projects/Codelation/autobuild/native_chain_state.json').read_text(encoding='utf-8'))
          print('blocked_reason=' + str(state.get('blocked_reason') or 'none'))
          print('reasoning_required=' + ('true' if state.get('reasoning_required') else 'false'))
          print('completed_generations=' + str(state.get('completed_generations') or 0))
          print('next_gap=' + str(state.get('next_gap') or 'none'))
          PY

      - name: Commit only changed verified state
        id: checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aurum-autonomous[bot]'
          git config user.email 'aurum-autonomous@users.noreply.github.com'
          git add Projects/Codelation/autobuild/native_chain_state.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'AURUM_AUTOBUILD stable=true'
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          git commit -m 'Advance Aurum native trunk state [skip ci]'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin "$AURUM_TRUNK"
            if git rebase "origin/$AURUM_TRUNK" && git push origin "HEAD:$AURUM_TRUNK"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          echo 'Unable to publish verified Aurum native state.' >&2
          exit 1

      - name: Recover bounded external evidence when deterministic lane is waiting
        if: >-
          steps.state.outputs.blocked_reason == 'external-prerequisite-blocked' &&
          steps.state.outputs.next_gap == 'adaptive_shell_gui_live_trial'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow='aurum-external-evidence-recovery.yml'
          active="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${AURUM_TRUNK}&per_page=20" \
            --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending")] | length')"
          if [ "$active" -gt 0 ]; then
            echo "AURUM_EVIDENCE_RECOVERY active=true count=$active action=deduplicated"
            exit 0
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
            -f ref="$AURUM_TRUNK"
          echo 'AURUM_EVIDENCE_RECOVERY requested=true event=aurum-external-evidence-recover'

      - name: Continue deterministic growth when state advanced
        if: >-
          steps.checkpoint.outputs.changed == 'true' &&
          steps.state.outputs.blocked_reason != 'external-prerequisite-blocked' &&
          steps.state.outputs.reasoning_required != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/aurum-autobuild.yml/dispatches" \
            -f ref="$AURUM_TRUNK"
          echo 'AURUM_AUTOBUILD continued=true trigger=verified-state-advanced'

      - name: Report bounded stop without global stall
        if: always()
        shell: bash
        run: |
          echo "AURUM_AUTOBUILD_STATE changed=${{ steps.checkpoint.outputs.changed }} blocked=${{ steps.state.outputs.blocked_reason }} reasoning=${{ steps.state.outputs.reasoning_required }}"
          echo "AURUM_VIRTUAL_PROOF_STATE applied=${{ steps.virtual_proof.outputs.applied }} source_commit=${{ steps.virtual_proof.outputs.source_commit }} run_id=${{ steps.virtual_proof.outputs.run_id }}"
          echo 'Generation ceilings are per-run epochs, not a global build stop. A dependent physical or reasoning boundary stops only that lane; independent Aurum build lanes continue.'
