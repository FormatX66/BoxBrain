name: Aurum Autonomous Build Loop

on:
  workflow_dispatch:
  repository_dispatch:
    types: [aurum-self-build-continue]
  push:
    branches:
      - aurum/capacity-mesh-v0
    paths:
      - '.github/workflows/aurum-autobuild.yml'
      - 'Projects/Codelation/run_native_autonomous_chain.py'
      - 'Projects/Codelation/field/native_program_synthesis.py'
      - 'Projects/Codelation/field/native_gap_catalog.py'
      - 'Projects/Codelation/autobuild/native_gap_specs/**'
      - 'Projects/Codelation/tests/test_native_program_synthesis.py'

permissions:
  contents: write

concurrency:
  group: aurum-autonomous-self-build-${{ github.ref || 'dispatch' }}
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Aurum self-build branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: aurum/capacity-mesh-v0
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Run Aurum until a real boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 Projects/Codelation/run_native_autonomous_chain.py | tee /tmp/aurum-native-chain.json

      - name: Verify native self-build contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest \
            Projects.Codelation.tests.test_native_program_synthesis \
            Projects.Codelation.tests.test_field_native_vm \
            Projects.Codelation.tests.test_field_native_batch \
            Projects.Codelation.tests.test_field_native_cache \
            -v

      - name: Commit durable chain state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aurum-autobuild[bot]'
          git config user.email 'aurum-autobuild@users.noreply.github.com'
          git add Projects/Codelation/autobuild/native_chain_state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Aurum event-driven self-build checkpoint'
          git push origin HEAD:aurum/capacity-mesh-v0

      - name: Report continuation boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('Projects/Codelation/autobuild/native_chain_state.json')
          state = json.loads(p.read_text())
          print('completed_generations=', state.get('completed_generations'))
          print('latest_completed_gap=', state.get('latest_completed_gap'))
          print('next_gap=', state.get('next_gap'))
          print('blocked_reason=', state.get('blocked_reason'))
          print('reasoning_required=', state.get('reasoning_required'))
          PY
