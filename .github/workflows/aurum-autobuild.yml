name: Aurum Autonomous Build Loop

on:
  workflow_dispatch:
  repository_dispatch:
    types: [aurum-self-build-continue]
  push:
    branches: [main]
    paths:
      - '.github/workflows/aurum-autobuild.yml'
      - '.github/workflows/aurum-event-bridge.yml'
      - 'Projects/Codelation/autobuild_cycle.py'
      - 'Projects/Codelation/tests/test_autobuild_cycle.py'
      - 'Projects/Codelation/tests/test_arkmatx_node_heartbeat.py'
      - 'Projects/Codelation/tests/test_local_lane_contract.py'
      - 'Web/Aurum-Arkmatx/index.php'
      - 'Web/Aurum-Arkmatx/bootstrap.sh'
      - 'Web/Aurum-Arkmatx/bootstrap.ps1'

permissions:
  contents: write
  actions: write

concurrency:
  group: aurum-autobuild
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.checkpoint.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      # WATCHDOG_RECEIPT_RECOVERY_BEGIN
      - name: One-shot recovery of verified Pi4 receipt frontier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          state_path = Path('Projects/Codelation/autobuild/state.json')
          results = Path('Projects/AurumBridge/results')
          state = json.loads(state_path.read_text())
          receipts = []
          for path in results.glob('pi4-seed-*-attempt-*.json'):
              try:
                  receipt = json.loads(path.read_text(encoding='utf-8-sig'))
              except Exception:
                  continue
              if receipt.get('schema') != 'aurum-pi4-seed-receipt-v1':
                  continue
              receipts.append((int(receipt.get('github_workflow_run') or 0), int(receipt.get('github_run_attempt') or 0), receipt))
          latest = max(receipts, key=lambda item: (item[0], item[1]))[2] if receipts else None
          data = (latest or {}).get('data') or {}
          verified = bool(
              latest
              and latest.get('state') == 'PI4_SEED_OK'
              and data.get('aurum_live_verified') is True
              and data.get('peer_self_test_verified') is True
              and data.get('gold_seed_preserved') is True
              and data.get('host_key_pretrusted') is True
              and data.get('architecture') == 'arm64'
              and data.get('transport') == 'usb-c-ssh'
              and data.get('address') in {'10.12.194.1', '10.42.194.1'}
          )
          bb = state.get('targets', {}).get('BBPI4', {})
          stale = bool(
              verified
              and bb.get('status') != 'confirmed'
              and not bb.get('physical_seed_verified')
              and state.get('next') == 'bootstrap-bbpi4-via-usb-ap-mdns-or-rdp-then-enroll-arkmatx'
          )
          if not stale:
              raise SystemExit('AURUM_WATCHDOG no stale verified Pi4 receipt frontier; refusing repair')

          path = Path('Projects/Codelation/autobuild_cycle.py')
          text = path.read_text()
          constant_anchor = "EVENTS = STATE_DIR / 'events.jsonl'\n"
          constant_addition = "REPO_ROOT = ROOT.parents[1]\nPI4_RESULTS = REPO_ROOT / 'Projects' / 'AurumBridge' / 'results'\n"
          if 'PI4_RESULTS =' not in text:
              if constant_anchor not in text:
                  raise SystemExit('missing EVENTS anchor')
              text = text.replace(constant_anchor, constant_anchor + constant_addition, 1)

          function_anchor = "\ndef choose_next(state):\n"
          functions = r'''
def _latest_pi4_seed_receipt():
    receipts = []
    if not PI4_RESULTS.exists():
        return None
    for path in PI4_RESULTS.glob('pi4-seed-*-attempt-*.json'):
        try:
            receipt = json.loads(path.read_text(encoding='utf-8-sig'))
        except (OSError, ValueError, TypeError):
            continue
        if receipt.get('schema') != 'aurum-pi4-seed-receipt-v1':
            continue
        try:
            run_id = int(receipt.get('github_workflow_run') or 0)
            attempt = int(receipt.get('github_run_attempt') or 0)
        except (TypeError, ValueError):
            continue
        receipts.append((run_id, attempt, path.name, receipt))
    if not receipts:
        return None
    return max(receipts, key=lambda item: (item[0], item[1], item[2]))[3]


def apply_pi4_seed_receipt(state):
    receipt = _latest_pi4_seed_receipt()
    if not receipt or receipt.get('state') != 'PI4_SEED_OK':
        return False
    data = receipt.get('data') or {}
    if not (
        data.get('aurum_live_verified') is True
        and data.get('peer_self_test_verified') is True
        and data.get('gold_seed_preserved') is True
        and data.get('host_key_pretrusted') is True
        and data.get('architecture') == 'arm64'
        and data.get('transport') == 'usb-c-ssh'
        and data.get('address') in {'10.12.194.1', '10.42.194.1'}
    ):
        return False
    bb = state['targets']['BBPI4']
    changed = bb.get('physical_seed_verified') is not True
    bb['physical_seed_verified'] = True
    bb['physical_seed_transport'] = 'usb-c-ssh'
    bb['physical_seed_architecture'] = 'arm64'
    state.setdefault('observations', {})['pi4_seed_receipt'] = {
        'state': receipt.get('state'),
        'workflow_run': int(receipt.get('github_workflow_run') or 0),
        'run_attempt': int(receipt.get('github_run_attempt') or 0),
        'observed_at': receipt.get('observed_at'),
        'address': data.get('address'),
        'seed_sha256': data.get('seed_sha256'),
        'source_commit': data.get('source_commit'),
    }
    return changed
'''
          if 'def _latest_pi4_seed_receipt()' not in text:
              if function_anchor not in text:
                  raise SystemExit('missing choose_next anchor')
              text = text.replace(function_anchor, functions + function_anchor, 1)

          old_next = "    if bb['status'] != 'confirmed':\n        return 'bootstrap-bbpi4-via-usb-ap-mdns-or-rdp-then-enroll-arkmatx'\n"
          new_next = "    if bb['status'] != 'confirmed':\n        if bb.get('physical_seed_verified'):\n            return 'enroll-bbpi4-arkmatx-and-verify-heartbeat'\n        return 'bootstrap-bbpi4-via-usb-ap-mdns-or-rdp-then-enroll-arkmatx'\n"
          if "return 'enroll-bbpi4-arkmatx-and-verify-heartbeat'" not in text:
              if old_next not in text:
                  raise SystemExit('missing BBPI4 next-state anchor')
              text = text.replace(old_next, new_next, 1)

          old_main = "    state = load_state()\n    previous_fingerprint = _stored_fingerprint(state)\n\n    observed_at = int(time.time())\n"
          new_main = "    state = load_state()\n    previous_fingerprint = _stored_fingerprint(state)\n    apply_pi4_seed_receipt(state)\n\n    observed_at = int(time.time())\n"
          if '    apply_pi4_seed_receipt(state)\n' not in text:
              if old_main not in text:
                  raise SystemExit('missing main receipt-ingestion anchor')
              text = text.replace(old_main, new_main, 1)
          path.write_text(text)

          test = Path('Projects/Codelation/tests/test_physical_receipt_progress.py')
          test.write_text(r'''import importlib.util
import json
import tempfile
import unittest
from pathlib import Path

MODULE_PATH = Path(__file__).resolve().parents[1] / 'autobuild_cycle.py'
spec = importlib.util.spec_from_file_location('aurum_autobuild_cycle_receipt_test', MODULE_PATH)
autobuild = importlib.util.module_from_spec(spec)
spec.loader.exec_module(autobuild)

class PhysicalReceiptProgressTests(unittest.TestCase):
    def setUp(self):
        self.original_results = autobuild.PI4_RESULTS
        self.tempdir = tempfile.TemporaryDirectory()
        autobuild.PI4_RESULTS = Path(self.tempdir.name)

    def tearDown(self):
        autobuild.PI4_RESULTS = self.original_results
        self.tempdir.cleanup()

    def _state(self):
        state = json.loads(json.dumps(autobuild.DEFAULT))
        state['targets']['Aurum-Morris']['outbound_enrollment_ready'] = True
        state['targets']['BBPI4']['outbound_enrollment_ready'] = True
        state['targets']['Aurum-Morris']['status'] = 'confirmed'
        return state

    def _receipt(self, state='PI4_SEED_OK', run_id=100):
        payload = {
            'schema': 'aurum-pi4-seed-receipt-v1',
            'state': state,
            'github_workflow_run': run_id,
            'github_run_attempt': 1,
            'observed_at': '2026-08-20T12:18:19Z',
            'data': {
                'aurum_live_verified': True,
                'peer_self_test_verified': True,
                'gold_seed_preserved': True,
                'host_key_pretrusted': True,
                'architecture': 'arm64',
                'transport': 'usb-c-ssh',
                'address': '10.12.194.1',
                'seed_sha256': 'a' * 64,
                'source_commit': 'b' * 40,
            },
        }
        (autobuild.PI4_RESULTS / f'pi4-seed-{run_id}-attempt-1.json').write_text(json.dumps(payload))
        return payload

    def test_verified_seed_advances_only_to_enrollment(self):
        state = self._state()
        self._receipt()
        self.assertTrue(autobuild.apply_pi4_seed_receipt(state))
        self.assertTrue(state['targets']['BBPI4']['physical_seed_verified'])
        self.assertEqual(autobuild.choose_next(state), 'enroll-bbpi4-arkmatx-and-verify-heartbeat')
        self.assertNotEqual(state['targets']['BBPI4']['status'], 'confirmed')

    def test_receipt_metadata_is_observation_not_semantic_progress(self):
        state = self._state()
        self._receipt(run_id=100)
        autobuild.apply_pi4_seed_receipt(state)
        first = autobuild.semantic_fingerprint(state)
        self._receipt(run_id=101)
        autobuild.apply_pi4_seed_receipt(state)
        second = autobuild.semantic_fingerprint(state)
        self.assertEqual(first, second)

    def test_newest_failure_does_not_manufacture_success(self):
        state = self._state()
        self._receipt(state='PI4_SEED_OK', run_id=100)
        self._receipt(state='PI4_SEED_FAILURE', run_id=101)
        self.assertFalse(autobuild.apply_pi4_seed_receipt(state))
        self.assertFalse(state['targets']['BBPI4'].get('physical_seed_verified', False))
        self.assertEqual(autobuild.choose_next(state), 'bootstrap-bbpi4-via-usb-ap-mdns-or-rdp-then-enroll-arkmatx')

    def test_untrusted_transport_cannot_advance_frontier(self):
        state = self._state()
        receipt = self._receipt(run_id=102)
        receipt['data']['transport'] = 'wifi'
        (autobuild.PI4_RESULTS / 'pi4-seed-102-attempt-1.json').write_text(json.dumps(receipt))
        self.assertFalse(autobuild.apply_pi4_seed_receipt(state))
        self.assertEqual(autobuild.choose_next(state), 'bootstrap-bbpi4-via-usb-ap-mdns-or-rdp-then-enroll-arkmatx')

if __name__ == '__main__':
    unittest.main()
''')

          workflow = Path('.github/workflows/aurum-autobuild.yml')
          workflow_text = workflow.read_text()
          begin = "      # WATCHDOG_RECEIPT_RECOVERY_BEGIN\n"
          end = "      # WATCHDOG_RECEIPT_RECOVERY_END\n"
          start = workflow_text.find(begin)
          finish = workflow_text.find(end)
          if start < 0 or finish < 0 or finish < start:
              raise SystemExit('one-shot recovery markers missing')
          finish += len(end)
          workflow.write_text(workflow_text[:start] + workflow_text[finish:])
          PY

          python3 -m unittest discover -s Projects/Codelation/tests -p 'test_physical_receipt_progress.py' -v
          python3 -m unittest discover -s Projects/Codelation/tests -p 'test_autobuild_cycle.py' -v

          git config user.name 'aurum-watchdog[bot]'
          git config user.email 'aurum-watchdog@users.noreply.github.com'
          git add .github/workflows/aurum-autobuild.yml Projects/Codelation/autobuild_cycle.py Projects/Codelation/tests/test_physical_receipt_progress.py
          git commit -m 'Teach Aurum autobuild to consume verified Pi4 seed receipts'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo 'AURUM_WATCHDOG receipt_frontier_repair=published'
              break
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -eq 5 ]; then
              echo 'AURUM_WATCHDOG receipt_frontier_repair=publish-failed' >&2
              exit 1
            fi
            sleep "$attempt"
          done
      # WATCHDOG_RECEIPT_RECOVERY_END

      - name: Run bounded Aurum cycle
        shell: bash
        env:
          AURUM_CONTROLLER_PRIMARY: ${{ vars.AURUM_CONTROLLER_PRIMARY }}
          AURUM_CONTROLLER_FALLBACKS: ${{ vars.AURUM_CONTROLLER_FALLBACKS || 'https://madmorrigan.com/aurum-failover/index.php' }}
        run: |
          set -euo pipefail
          python3 Projects/Codelation/autobuild_cycle.py

      - name: Run Codelation tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s Projects/Codelation/tests -v

      - name: Commit state checkpoint
        id: checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aurum-autobuild[bot]'
          git config user.email 'aurum-autobuild@users.noreply.github.com'
          git add Projects/Codelation/autobuild/state.json Projects/Codelation/autobuild/events.jsonl
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'AURUM_AUTOBUILD stable=true'
            exit 0
          fi
          git commit -m 'Aurum autonomous checkpoint [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          echo 'Unable to publish Aurum checkpoint.' >&2
          exit 1

      - name: Continue immediately while useful state advances
        if: steps.checkpoint.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/aurum-autobuild.yml/dispatches" \
            -f ref=main
          echo 'AURUM_AUTOBUILD continued=true trigger=state-advanced'

      - name: Report stable convergence point
        if: steps.checkpoint.outputs.changed != 'true'
        shell: bash
        run: |
          echo 'AURUM_AUTOBUILD continued=false reason=no-new-deterministic-state'
          echo 'Aurum waits here only for a new event, external evidence, or a reasoning-required gap.'
