name: Aurum Autonomous Build Loop

on:
  workflow_dispatch:
  repository_dispatch:
    types: [aurum-self-build-continue]
  push:
    branches:
      - aurum/capacity-mesh-v0
    paths:
      - '.github/workflows/aurum-autobuild.yml'
      - 'Projects/Codelation/run_native_autonomous_chain.py'
      - 'Projects/Codelation/field/native_program_synthesis.py'
      - 'Projects/Codelation/field/native_self_debug.py'
      - 'Projects/Codelation/field/native_failure_diagnosis.py'
      - 'Projects/Codelation/field/builder_capability_catalog.py'
      - 'Projects/Codelation/field/local_capability_verification.py'
      - 'Projects/Codelation/field/external_prerequisite_evidence.py'
      - 'Projects/Codelation/field/structured_projection.py'
      - 'Projects/Codelation/field/constraint_classification.py'
      - 'Projects/Codelation/field/score_selection.py'
      - 'Projects/Codelation/field/set_constraints.py'
      - 'Projects/Codelation/field/reversible_state_delta.py'
      - 'Projects/Codelation/field/preference_evidence.py'
      - 'Projects/Codelation/field/categorical_policy.py'
      - 'Projects/Codelation/field/io_fabric.py'
      - 'Projects/Codelation/field/native_gap_catalog.py'
      - 'Projects/Codelation/autobuild/native_gap_specs/**'
      - 'Projects/Codelation/autobuild/external_evidence/**'
      - 'Projects/Codelation/tests/test_native_program_synthesis.py'
      - 'Projects/Codelation/tests/test_local_capability_verification.py'

permissions:
  contents: write

concurrency:
  group: aurum-autonomous-self-build-${{ github.ref || 'dispatch' }}
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Aurum self-build branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: aurum/capacity-mesh-v0
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Run Aurum until a real boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 Projects/Codelation/run_native_autonomous_chain.py | tee /tmp/aurum-native-chain.json
      - name: Verify native self-build contracts
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest \
            Projects.Codelation.tests.test_native_program_synthesis \
            Projects.Codelation.tests.test_local_capability_verification \
            Projects.Codelation.tests.test_field_native_vm \
            Projects.Codelation.tests.test_field_native_batch \
            Projects.Codelation.tests.test_field_native_cache -v
      - name: Record verification outcome
        shell: bash
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('Projects/Codelation/autobuild/native_chain_state.json');s=json.loads(p.read_text());s['workflow_verification']={'outcome':os.environ['VERIFY_OUTCOME'],'trusted_for_continuation':os.environ['VERIFY_OUTCOME']=='success'};p.write_text(json.dumps(s,indent=2,sort_keys=True)+'\n')
          PY
      - name: Commit durable chain state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aurum-autobuild[bot]'; git config user.email 'aurum-autobuild@users.noreply.github.com'
          git add Projects/Codelation/autobuild/native_chain_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Aurum event-driven self-build checkpoint'; git push origin HEAD:aurum/capacity-mesh-v0
      - name: Report continuation boundary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('Projects/Codelation/autobuild/native_chain_state.json')
          if not p.is_file(): print('native_chain_state=missing'); raise SystemExit(0)
          s=json.loads(p.read_text())
          for k in ('completed_generations','latest_completed_gap','next_gap','blocked_reason','blocked_output','external_evidence','self_debug_revision','local_verification_revision','internal_next_action','reasoning_required','workflow_verification'): print(f'{k}=',s.get(k))
          PY
      - name: Fail closed on verification failure
        if: steps.verify.outcome != 'success'
        shell: bash
        run: |
          echo 'Aurum state was checkpointed, but verification failed; continuation is not trusted.'
          exit 1
