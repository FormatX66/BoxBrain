name: Aurum PC-01 Authorized USB Flash

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aurum-pc01-flash-authorized.yml'
  workflow_run:
    workflows: ['Aurum PC v0.01 Image']
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: aurum-pc01-authorized-usb-flash
  cancel-in-progress: false

env:
  AURUM_FLASH_AUTHORIZATION: 'bruce-explicit-2026-08-18T07:42-04:00'
  AURUM_PR: '44'
  AURUM_SEED_BRANCH: 'agent/aurum-direct-uefi-seed'
  AURUM_ARTIFACT: 'Aurum-PC-v0.01-amd64'
  AURUM_IMAGE: 'Aurum-PC-v0.01-amd64-direct-uefi.img'

jobs:
  flash:
    name: Flash explicitly authorized PC-01 USB seed
    runs-on: [self-hosted, Windows, X64, aurum-elevated]
    timeout-minutes: 25
    steps:
      - name: Preflight, flash exactly one safe USB disk, verify, and publish receipt
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          # This destructive action is scoped to the user's explicit instruction in ChatGPT:
          # "the usb drive is plugged into my pc go ahead and flash it."
          # Preflight must resolve machine identity, current seed, artifact integrity,
          # elevation and an unambiguous removable target before any raw write occurs.
          $repo = $env:GITHUB_REPOSITORY
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          function Publish-FlashReceipt([string]$State, [hashtable]$Data) {
            $attempt = if ($env:GITHUB_RUN_ATTEMPT) { $env:GITHUB_RUN_ATTEMPT } else { '1' }
            $path = "Projects/AurumBridge/results/pc01-flash-$env:GITHUB_RUN_ID-attempt-$attempt.json"
            $receipt = [ordered]@{
              schema = 'aurum-pc01-flash-receipt-v1'
              state = $State
              github_workflow_run = [long]$env:GITHUB_RUN_ID
              github_run_attempt = [int]$attempt
              host = $env:COMPUTERNAME
              runner_name = $env:RUNNER_NAME
              observed_at = (Get-Date).ToUniversalTime().ToString('o')
              data = $Data
            }
            $json = $receipt | ConvertTo-Json -Depth 8
            $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))
            $body = @{
              message = "Record Aurum PC-01 flash receipt state=$State [skip ci]"
              content = $encoded
              branch = 'main'
            } | ConvertTo-Json -Depth 4
            try {
              Invoke-RestMethod -Method Put -Headers $headers -Uri "https://api.github.com/repos/$repo/contents/$path" -Body $body -ContentType 'application/json' | Out-Null
              Write-Host "AURUM_FLASH_RECEIPT_PUBLISHED state=$State path=$path"
            }
            catch {
              Write-Warning "AURUM_FLASH_RECEIPT_PUBLISH_FAILED state=$State error=$($_.Exception.Message)"
            }
          }

          $principal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            Publish-FlashReceipt 'WAITING' @{ reason = 'runner-not-elevated' }
            Write-Host 'AURUM_FLASH_WAITING reason=runner-not-elevated'
            exit 0
          }

          $pr = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/pulls/$env:AURUM_PR"
          if ($pr.state -ne 'open' -or $pr.head.ref -ne $env:AURUM_SEED_BRANCH) {
            Publish-FlashReceipt 'REFUSED' @{ reason = 'seed-pr-not-current'; state = [string]$pr.state; head = [string]$pr.head.ref }
            Write-Host "AURUM_FLASH_REFUSED reason=seed-pr-not-current state=$($pr.state) head=$($pr.head.ref)"
            exit 0
          }
          $headSha = [string]$pr.head.sha

          $runs = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/actions/workflows/aurum-pc-v001.yml/runs?branch=$env:AURUM_SEED_BRANCH&status=success&per_page=50"
          $run = @($runs.workflow_runs | Where-Object {
              $_.conclusion -eq 'success' -and
              $_.pull_requests.Count -gt 0 -and
              $_.pull_requests[0].number -eq [int]$env:AURUM_PR -and
              $_.pull_requests[0].head.sha -eq $headSha
            } | Sort-Object id -Descending | Select-Object -First 1)
          if ($run.Count -ne 1) {
            Publish-FlashReceipt 'WAITING' @{ reason = 'no-successful-current-pc-seed'; head = $headSha }
            Write-Host "AURUM_FLASH_WAITING head=$headSha reason=no-successful-current-pc-seed"
            exit 0
          }
          $seedRunId = [long]$run[0].id

          $artifacts = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/actions/runs/$seedRunId/artifacts?per_page=100"
          $artifact = @($artifacts.artifacts | Where-Object { $_.name -eq $env:AURUM_ARTIFACT -and -not $_.expired } | Select-Object -First 1)
          if ($artifact.Count -ne 1) {
            Publish-FlashReceipt 'INTEGRITY_FAILURE' @{ reason = 'boot-verified-artifact-missing'; seed_run = $seedRunId; head = $headSha }
            throw "AURUM_FLASH_INTEGRITY_FAILURE run=$seedRunId reason=boot-verified-artifact-missing"
          }

          $work = Join-Path $env:RUNNER_TEMP "aurum-pc01-flash-$seedRunId"
          if (Test-Path -LiteralPath $work) { Remove-Item -LiteralPath $work -Recurse -Force }
          New-Item -ItemType Directory -Path $work | Out-Null
          $zip = Join-Path $work 'seed.zip'
          Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/$repo/actions/artifacts/$($artifact[0].id)/zip" -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $work -Force

          $image = Get-ChildItem -LiteralPath $work -Recurse -File -Filter $env:AURUM_IMAGE | Select-Object -First 1
          if (-not $image) {
            Publish-FlashReceipt 'INTEGRITY_FAILURE' @{ reason = 'direct-uefi-image-not-in-artifact'; seed_run = $seedRunId; head = $headSha }
            throw 'AURUM_FLASH_INTEGRITY_FAILURE reason=direct-uefi-image-not-in-artifact'
          }
          $shaFile = Get-ChildItem -LiteralPath $work -Recurse -File -Filter "$env:AURUM_IMAGE.sha256" | Select-Object -First 1
          if (-not $shaFile) {
            Publish-FlashReceipt 'INTEGRITY_FAILURE' @{ reason = 'direct-uefi-checksum-not-in-artifact'; seed_run = $seedRunId; head = $headSha }
            throw 'AURUM_FLASH_INTEGRITY_FAILURE reason=direct-uefi-checksum-not-in-artifact'
          }

          $expected = ((Get-Content -LiteralPath $shaFile.FullName -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $image.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            Publish-FlashReceipt 'INTEGRITY_FAILURE' @{ reason = 'artifact-checksum-mismatch'; expected = $expected; actual = $actual; head = $headSha }
            throw "AURUM_FLASH_INTEGRITY_FAILURE reason=artifact-checksum-mismatch expected=$expected actual=$actual"
          }

          $sentinelRoot = Join-Path $env:ProgramData 'Aurum'
          New-Item -ItemType Directory -Path $sentinelRoot -Force | Out-Null
          $sentinel = Join-Path $sentinelRoot "pc01-flash-$headSha-$actual.done"
          if (Test-Path -LiteralPath $sentinel) {
            $previous = $null
            try { $previous = Get-Content -LiteralPath $sentinel -Raw | ConvertFrom-Json } catch { $previous = $null }
            Publish-FlashReceipt 'ALREADY_COMPLETE' @{
              head = $headSha
              image_sha256 = $actual
              sentinel = $sentinel
              raw_readback_verified = if ($previous) { [bool]$previous.raw_readback_verified } else { $true }
            }
            Write-Host "AURUM_FLASH_ALREADY_COMPLETE head=$headSha image_sha256=$actual"
            exit 0
          }

          $usb = @(Get-Disk | Where-Object {
              $_.BusType -eq 'USB' -and
              -not $_.IsBoot -and
              -not $_.IsSystem -and
              $_.Size -gt $image.Length
            })
          if ($usb.Count -ne 1) {
            $summary = @($usb | ForEach-Object { "disk=$($_.Number),model=$($_.FriendlyName),size=$($_.Size)" }) -join ';'
            Publish-FlashReceipt 'WAITING' @{ reason = 'expected-exactly-one-safe-usb'; count = $usb.Count; candidates = $summary; head = $headSha }
            Write-Host "AURUM_FLASH_WAITING reason=expected-exactly-one-safe-usb count=$($usb.Count) candidates=$summary"
            exit 0
          }

          $disk = $usb[0]
          $diskNumber = [int]$disk.Number
          $physicalPath = "\\.\PhysicalDrive$diskNumber"
          Write-Host "AURUM_FLASH_TARGET runner=$env:COMPUTERNAME disk=$diskNumber model=$($disk.FriendlyName) serial=$($disk.SerialNumber) size=$($disk.Size) image_bytes=$($image.Length) run=$seedRunId head=$headSha"

          $wasOffline = [bool]$disk.IsOffline
          try {
            if (-not $wasOffline) {
              Set-Disk -Number $diskNumber -IsOffline $true -ErrorAction Stop
            }

            $source = [System.IO.File]::Open($image.FullName, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::Read)
            try {
              $target = New-Object System.IO.FileStream($physicalPath, [System.IO.FileMode]::Open, [System.IO.FileAccess]::ReadWrite, [System.IO.FileShare]::ReadWrite, 4194304, [System.IO.FileOptions]::WriteThrough)
              try {
                $buffer = New-Object byte[] 4194304
                $written = [int64]0
                while (($read = $source.Read($buffer, 0, $buffer.Length)) -gt 0) {
                  $target.Write($buffer, 0, $read)
                  $written += $read
                  if (($written % 268435456) -lt $buffer.Length) {
                    Write-Host "AURUM_FLASH_PROGRESS bytes=$written total=$($image.Length)"
                  }
                }
                $target.Flush($true)
              }
              finally { $target.Dispose() }
            }
            finally { $source.Dispose() }

            $reader = New-Object System.IO.FileStream($physicalPath, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::ReadWrite, 4194304, [System.IO.FileOptions]::SequentialScan)
            $hasher = [System.Security.Cryptography.IncrementalHash]::CreateHash([System.Security.Cryptography.HashAlgorithmName]::SHA256)
            try {
              $buffer = New-Object byte[] 4194304
              $remaining = [int64]$image.Length
              while ($remaining -gt 0) {
                $want = [int][Math]::Min([int64]$buffer.Length, $remaining)
                $read = $reader.Read($buffer, 0, $want)
                if ($read -le 0) { throw 'AURUM_FLASH_INTEGRITY_FAILURE reason=short-readback' }
                $hasher.AppendData($buffer, 0, $read)
                $remaining -= $read
              }
              $readback = ([BitConverter]::ToString($hasher.GetHashAndReset())).Replace('-', '').ToLowerInvariant()
            }
            finally {
              $hasher.Dispose()
              $reader.Dispose()
            }
            if ($readback -ne $actual) {
              throw "AURUM_FLASH_INTEGRITY_FAILURE reason=raw-readback-hash-mismatch expected=$actual actual=$readback"
            }
          }
          catch {
            Publish-FlashReceipt 'INTEGRITY_FAILURE' @{
              reason = $_.Exception.Message
              head = $headSha
              disk_number = $diskNumber
              disk_model = [string]$disk.FriendlyName
              disk_serial = [string]$disk.SerialNumber
              image_sha256 = $actual
            }
            throw
          }
          finally {
            if (-not $wasOffline) {
              Set-Disk -Number $diskNumber -IsOffline $false -ErrorAction SilentlyContinue
            }
          }

          $sentinelData = @{
            authorization = $env:AURUM_FLASH_AUTHORIZATION
            repository = $repo
            seed_head = $headSha
            workflow_run = $seedRunId
            artifact_id = [long]$artifact[0].id
            image = $env:AURUM_IMAGE
            image_sha256 = $actual
            disk_number = $diskNumber
            disk_model = [string]$disk.FriendlyName
            disk_serial = [string]$disk.SerialNumber
            disk_size = [int64]$disk.Size
            flashed_at = (Get-Date).ToUniversalTime().ToString('o')
            raw_readback_verified = $true
          }
          $sentinelData | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $sentinel -Encoding UTF8

          Publish-FlashReceipt 'FLASH_OK' $sentinelData
          Write-Host "AURUM_PC01_USB_FLASH_OK run=$seedRunId head=$headSha disk=$diskNumber image_sha256=$actual raw_readback_verified=true"
