name: Aurum PC-01 Authorized USB Flash (Retired)

# This legacy destructive workflow is intentionally retired.
#
# It previously carried a static August 18 authorization string and could be
# re-triggered automatically by a successful image workflow. That violates the
# current Aurum rule that every destructive media write must be bound to fresh,
# one-shot authorization plus current-release/current-device evidence.
#
# Historical flash receipts remain in Projects/AurumBridge/results for evidence.
# Use the canonical Tiny Seed guarded-flash/preflight path for any future write.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurum-pc01-authorized-usb-flash-retired
  cancel-in-progress: true

jobs:
  retired:
    name: Refuse legacy persistent flash authority
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed
        shell: bash
        run: |
          set -euo pipefail
          echo 'AURUM_LEGACY_PC01_FLASH_RETIRED'
          echo 'reason=static-destructive-authority-is-not-valid'
          echo 'next=use-current-release-one-shot-guarded-flash-preflight'
          exit 1
