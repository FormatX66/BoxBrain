name: Deploy Aurum Arkmatx

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Web/Aurum-Arkmatx/**'
      - '.github/workflows/deploy-aurum-arkmatx.yml'

permissions:
  contents: write

concurrency:
  group: aurum-arkmatx-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: arkmatx
    steps:
      - uses: actions/checkout@v4

      - name: Require deployment configuration
        env:
          HOST: ${{ secrets.ARKMATX_SSH_HOST }}
          USER: ${{ secrets.ARKMATX_SSH_USER }}
          KEY: ${{ secrets.ARKMATX_SSH_KEY }}
          HOST_KEY: ${{ secrets.ARKMATX_SSH_HOST_KEY }}
          REMOTE_PATH: ${{ secrets.ARKMATX_REMOTE_PATH }}
        run: |
          set -euo pipefail
          for name in HOST USER KEY HOST_KEY REMOTE_PATH; do
            test -n "${!name:-}" || { echo "Missing $name" >&2; exit 2; }
          done

      - name: Configure pinned SSH identity
        env:
          KEY: ${{ secrets.ARKMATX_SSH_KEY }}
          HOST_KEY: ${{ secrets.ARKMATX_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify host and PHP
        env:
          HOST: ${{ secrets.ARKMATX_SSH_HOST }}
          USER: ${{ secrets.ARKMATX_SSH_USER }}
          PORT: ${{ secrets.ARKMATX_SSH_PORT }}
          REMOTE_PATH: ${{ secrets.ARKMATX_REMOTE_PATH }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes "$USER@$HOST" \
            "php -v >/dev/null && mkdir -p -- '$REMOTE_PATH'"

      - name: Upload web node
        env:
          HOST: ${{ secrets.ARKMATX_SSH_HOST }}
          USER: ${{ secrets.ARKMATX_SSH_USER }}
          PORT: ${{ secrets.ARKMATX_SSH_PORT }}
          REMOTE_PATH: ${{ secrets.ARKMATX_REMOTE_PATH }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          tar -C Web/Aurum-Arkmatx -czf /tmp/aurum-arkmatx.tgz .
          scp -P "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes /tmp/aurum-arkmatx.tgz "$USER@$HOST:/tmp/aurum-arkmatx.tgz"
          ssh -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes "$USER@$HOST" \
            "set -eu; mkdir -p -- '$REMOTE_PATH'; tar -xzf /tmp/aurum-arkmatx.tgz -C '$REMOTE_PATH'; rm -f /tmp/aurum-arkmatx.tgz; php -l '$REMOTE_PATH/index.php'; php -l '$REMOTE_PATH/voice-status.php'"

      - name: Verify public node, dashboard, and voice mirror
        env:
          URL: ${{ secrets.ARKMATX_PUBLIC_URL }}
        run: |
          set -euo pipefail
          test -n "$URL"
          base="${URL%/}"

          body="$(curl --fail --silent --show-error --max-time 10 "$base/status")"
          printf '%s' "$body" | grep -F 'Aurum-Arkmatx' >/dev/null
          printf '%s' "$body" | grep -F 'active-edge-web-node' >/dev/null

          dashboard="$(curl --fail --silent --show-error --max-time 10 "$base/dashboard")"
          printf '%s' "$dashboard" | grep -F 'Progress is proof, not activity.' >/dev/null
          printf '%s' "$dashboard" | grep -F 'voice-status.json' >/dev/null

          voice="$(curl --fail --silent --show-error --max-time 15 "$base/voice-status")"
          printf '%s' "$voice" | grep -F 'AURUM VOICE STATUS' >/dev/null
          printf '%s' "$voice" | grep -F 'Human capabilities:' >/dev/null

          curl --fail --silent --show-error --max-time 15 "$base/voice-status.json" > /tmp/aurum-voice-status.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/aurum-voice-status.json').read_text())
          assert payload['schema'] == 'aurum-voice-status-v1'
          capabilities = payload['human_capabilities']
          assert len(capabilities) == 7
          expected = {'defined', 'executable', 'tested', 'seeded', 'booted', 'used'}
          for capability in capabilities:
              assert set(capability['stages']) == expected
          print(
              'AURUM_VOICE_MIRROR_OK '
              f"source={payload.get('source')} "
              f"capabilities={len(capabilities)}"
          )
          PY

      - name: Observe bounded BBPI4 AP probes
        env:
          URL: ${{ secrets.ARKMATX_PUBLIC_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          base = os.environ["URL"].rstrip("/")
          work_ids = (
              "bbpi4-ap-probe-morris-v1",
              "bbpi4-ap-probe-bruce-v1",
          )
          latest = {}
          deadline = time.time() + 90
          while time.time() < deadline:
              for work_id in work_ids:
                  url = base + "/work/status?id=" + urllib.parse.quote(work_id)
                  try:
                      with urllib.request.urlopen(url, timeout=10) as response:
                          latest[work_id] = json.load(response)
                  except Exception as exc:
                      latest[work_id] = {
                          "work_id": work_id,
                          "status": "unavailable",
                          "attempts": 0,
                          "ap_ssh_open": False,
                          "error_type": type(exc).__name__,
                      }
              if all(latest.get(work_id, {}).get("status") == "completed" for work_id in work_ids):
                  break
              time.sleep(5)

          for work_id in work_ids:
              item = latest.get(work_id, {})
              print(
                  "AURUM_AP_PROBE "
                  f"work_id={work_id} "
                  f"status={item.get('status', 'missing')} "
                  f"attempts={int(item.get('attempts') or 0)} "
                  f"ap_ssh_open={str(bool(item.get('ap_ssh_open'))).lower()} "
                  f"result={item.get('last_result_status') or 'none'}"
              )
          PY

      - name: Publish dashboard and voice mirror deployment receipt
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_URL: ${{ secrets.ARKMATX_PUBLIC_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          repo = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['GITHUB_RUN_ID']
          attempt = os.environ['GITHUB_RUN_ATTEMPT']
          path = f'Projects/AurumBridge/results/web-mirror-{run_id}-attempt-{attempt}.json'
          payload = {
              'schema': 'aurum-web-mirror-receipt-v1',
              'state': 'WEB_MIRROR_OK',
              'github_workflow_run': int(run_id),
              'github_run_attempt': int(attempt),
              'source_commit': os.environ['GITHUB_SHA'],
              'observed_at': datetime.now(timezone.utc).isoformat(),
              'public_base': os.environ['PUBLIC_URL'].rstrip('/'),
              'verified': {
                  'dashboard_truth_banner': True,
                  'dashboard_reads_voice_mirror': True,
                  'plain_text_voice_status': True,
                  'json_voice_status': True,
                  'seven_human_capabilities': True,
                  'six_evidence_gates': True,
                  'php_lint': True,
              },
          }
          encoded = base64.b64encode(
              (json.dumps(payload, indent=2) + '\n').encode('utf-8')
          ).decode('ascii')
          body = json.dumps({
              'message': 'Record Aurum dashboard voice mirror deploy state=WEB_MIRROR_OK [skip ci]',
              'content': encoded,
              'branch': 'main',
          }).encode('utf-8')
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/contents/{path}',
              data=body,
              method='PUT',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f'unexpected receipt status {response.status}')
          print(f'AURUM_WEB_MIRROR_RECEIPT path={path} state=WEB_MIRROR_OK')
          PY
