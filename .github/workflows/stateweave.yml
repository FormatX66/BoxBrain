name: StateWeave Experimental

on:
  push:
    branches:
      - stateweave-experimental
    paths:
      - 'stateweave/**'
      - 'experiments/**'
      - 'Architecture/StateWeave.md'
      - '.github/workflows/stateweave.yml'
  pull_request:
    paths:
      - 'stateweave/**'
      - 'experiments/**'
      - 'Architecture/StateWeave.md'
      - '.github/workflows/stateweave.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stateweave-v0:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run StateWeave v0 tests
        run: python -m unittest discover -s stateweave -p 'test_*.py' -v

      - name: Run shared Aurum race benchmark
        run: python experiments/benchmark.py
