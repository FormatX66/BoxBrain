name: Aurum Work Readback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aurum-work-readback.yml'

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read bounded AP observation evidence without leasing work
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          controller = "https://arkmatx.com/aurum/index.php"
          work_items = (
              ("morris", "bbpi4-ap-probe-morris-v1"),
              ("bruce", "bbpi4-ap-probe-bruce-v1"),
              ("bbpi4-bootstrap", "bbpi4-bootstrap-v1"),
          )
          headers = {
              "Accept": "application/json",
              "User-Agent": "Mozilla/5.0 BoxBrain-Aurum-Readback/2.0",
          }

          for label, work_id in work_items:
              query = urllib.parse.urlencode({"id": work_id})
              request = urllib.request.Request(
                  controller + "/work/status?" + query,
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      status = json.load(response)
              except Exception as exc:
                  print(
                      "AURUM_WORK_READBACK "
                      f"label={label} work_id={work_id} read_error={type(exc).__name__}"
                  )
                  continue

              print(
                  "AURUM_WORK_READBACK "
                  f"label={label} "
                  f"work_id={status.get('work_id') or work_id} "
                  f"capability={status.get('capability') or 'unknown'} "
                  f"status={status.get('status') or 'unknown'} "
                  f"attempts={int(status.get('attempts') or 0)} "
                  f"last_result={status.get('last_result_status') or 'none'} "
                  f"ap_ssh_open={bool(status.get('ap_ssh_open'))} "
                  "probe_mode=read-only"
              )
          PY
