name: Aurum Failsafe Active Readback Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aurum-failsafe-active-readback-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Record active Aurum continuation lanes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, time, urllib.parse, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'Aurum-Failsafe-Active-Readback/1.1',
          }
          lanes = [
              ('aurum-autobuild.yml', 'main'),
              ('aurum-autobuild.yml', 'aurum/trunk-v0.01'),
              ('aurum-external-evidence-recovery.yml', 'aurum/trunk-v0.01'),
              ('aurum-event-bridge.yml', 'main'),
              ('aurum-continuous-controller.yml', 'main'),
              ('aurum-authorized-windows-ap.yml', 'main'),
              ('aurum-dual-seed-lanes.yml', 'main'),
              ('aurum-pi4-identity-recovery-once.yml', 'main'),
              ('aurum-pi4-enrollment-diagnostic-once.yml', 'main'),
          ]
          active_statuses = {'queued','in_progress','waiting','requested','pending'}
          snapshot = {}
          for workflow, branch in lanes:
              encoded_branch = urllib.parse.quote(branch, safe='')
              url = f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?branch={encoded_branch}&per_page=20'
              req = urllib.request.Request(url, headers=headers)
              key = f'{workflow}@{branch}'
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      runs = json.load(response).get('workflow_runs', [])
              except Exception as exc:
                  snapshot[key] = {'error': type(exc).__name__, 'active': []}
                  continue
              active = [
                  {
                      'id': int(run.get('id') or 0),
                      'status': run.get('status'),
                      'event': run.get('event'),
                      'created_at': run.get('created_at'),
                      'updated_at': run.get('updated_at'),
                      'head_sha': run.get('head_sha'),
                  }
                  for run in runs if run.get('status') in active_statuses
              ]
              snapshot[key] = {'active': active}
          receipt = {
              'schema': 'aurum-failsafe-active-readback-v2',
              'github_workflow_run': int(os.environ['GITHUB_RUN_ID']),
              'source_commit': os.environ['GITHUB_SHA'],
              'observed_at': int(time.time()),
              'workflows': snapshot,
          }
          raw = json.dumps(receipt, indent=2, sort_keys=True).encode('utf-8')
          body = json.dumps({
              'message': 'Record Aurum failsafe active workflow readback [skip ci]',
              'content': base64.b64encode(raw).decode('ascii'),
              'branch': 'main',
          }).encode('utf-8')
          path = f"Projects/AurumBridge/results/failsafe-active-readback-{os.environ['GITHUB_RUN_ID']}.json"
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/contents/{path}',
              data=body,
              method='PUT',
              headers={**headers, 'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(req, timeout=20):
              pass
          print(json.dumps(snapshot, sort_keys=True))
          PY

# Failsafe diagnostic refresh: 2026-08-22T13:16Z
