name: Aurum Pi3 smsc95xx USBNet Event Emulator

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aurum-pi3-smsc95xx-usbnet-event-emulator.yml'
      - 'Projects/AdaptiveKernel/pi3_smsc95xx_usbnet_event_emulator.py'
      - 'Projects/AdaptiveKernel/tests/test_pi3_smsc95xx_usbnet_event_emulator.py'
      - 'Projects/AdaptiveKernel/pi3_smsc95xx_packet_transfer_model.py'
      - 'Projects/AdaptiveKernel/pi3_smsc95xx_usbnet_lifecycle_model.py'
      - 'Projects/AdaptiveKernel/results/pi3-smsc95xx-usbnet-lifecycle-shadow-latest.json'
      - 'Projects/AdaptiveKernel/results/pi3-smsc95xx-usbnet-lifecycle-candidate-latest.json'
      - 'Projects/AdaptiveKernel/results/pi3-smsc95xx-usbnet-lifecycle-differential-latest.json'
      - 'Projects/AdaptiveKernel/results/pi3-smsc95xx-packet-transfer-differential-latest.json'

permissions:
  contents: write

concurrency:
  group: aurum-pi3-smsc95xx-usbnet-event-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-event-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact event-emulator revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Run fail-closed event-emulator tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            Projects.AdaptiveKernel.tests.test_pi3_smsc95xx_usbnet_event_emulator

      - name: Run deterministic integrated event matrix
        shell: bash
        run: |
          set -euo pipefail
          python -m Projects.AdaptiveKernel.pi3_smsc95xx_usbnet_event_emulator \
            --lifecycle-shadow Projects/AdaptiveKernel/results/pi3-smsc95xx-usbnet-lifecycle-shadow-latest.json \
            --lifecycle-candidate Projects/AdaptiveKernel/results/pi3-smsc95xx-usbnet-lifecycle-candidate-latest.json \
            --lifecycle-differential Projects/AdaptiveKernel/results/pi3-smsc95xx-usbnet-lifecycle-differential-latest.json \
            --packet-differential Projects/AdaptiveKernel/results/pi3-smsc95xx-packet-transfer-differential-latest.json \
            --sequence-seed 0x9514e770 \
            --sequence-steps 32768 \
            --output event-emulator-evidence/pi3-smsc95xx-usbnet-event-emulator.json

      - name: Verify zero-authority integrated receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from Projects.AdaptiveKernel.pi3_smsc95xx_usbnet_event_emulator import _verify_sealed

          path = Path('event-emulator-evidence/pi3-smsc95xx-usbnet-event-emulator.json')
          receipt = json.loads(path.read_text())
          if receipt.get('state') != 'controlled-userspace-usbnet-event-emulator-passed':
              raise SystemExit('event emulator did not reach verified state')
          if not _verify_sealed(receipt):
              raise SystemExit('event emulator receipt seal failed')
          if receipt.get('canonical_scenario_count') != 4 or receipt.get('deterministic_sequence_steps') != 32768:
              raise SystemExit('event emulator coverage is incomplete')
          if receipt.get('mismatch_count') != 0:
              raise SystemExit('event emulator recorded mismatches')
          if receipt['qpu']['used'] or receipt['qpu']['hardware_submission_performed']:
              raise SystemExit('finite event matrix unexpectedly used QPU hardware')
          if receipt['invariants']['live_pi_contacted'] or receipt['invariants']['usb_transfer_submitted']:
              raise SystemExit('event emulator crossed its no-hardware boundary')
          if any(receipt['authority'].values()):
              raise SystemExit('event emulator gained authority')
          summary = [
              '# Pi3 smsc95xx USBNet Event Emulator',
              '',
              f"- State: {receipt['state']}",
              '- Canonical integrated scenarios: 4',
              '- Deterministic mixed events: 32,768',
              '- Mismatches: 0',
              '- Live Pi / USB transfer: false',
              '- Mutation / promotion / write authority: false',
              '',
              receipt['strongest_claim'],
          ]
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as handle:
              handle.write('\n'.join(summary) + '\n')
          PY

      - name: Publish sealed event-emulator artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aurum-pi3-smsc95xx-usbnet-event-emulator-${{ github.run_id }}
          path: event-emulator-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Persist verified event-emulator lineage
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cp event-emulator-evidence/pi3-smsc95xx-usbnet-event-emulator.json \
            Projects/AdaptiveKernel/results/pi3-smsc95xx-usbnet-event-emulator-latest.json
          git config user.name 'aurum-pi3-usbnet-event-emulator[bot]'
          git config user.email 'aurum-pi3-usbnet-event-emulator@users.noreply.github.com'
          git add Projects/AdaptiveKernel/results/pi3-smsc95xx-usbnet-event-emulator-latest.json
          if git diff --cached --quiet; then
            echo 'AURUM_PI3_SMSC95XX_USBNET_EVENT_EMULATOR_RECEIPT unchanged=true'
            exit 0
          fi
          git commit -m 'Record Pi3 smsc95xx USBNet event emulator [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'AURUM_PI3_SMSC95XX_USBNET_EVENT_EMULATOR_RECEIPT persisted=true'
