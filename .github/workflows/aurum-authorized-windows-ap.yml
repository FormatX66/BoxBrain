name: Aurum Authorized Windows AP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aurum-authorized-windows-ap.yml'
      - '.github/receipts/aurum-local-lane-repair-validation.json'
      - 'installer/repair-aurum-local-lane.ps1'

permissions:
  contents: read

concurrency:
  group: aurum-authorized-windows-ap
  cancel-in-progress: false

jobs:
  connect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Check out current recovery logic
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Run only validated bounded local-lane self-heal
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $receiptPath = Join-Path $env:GITHUB_WORKSPACE '.github\receipts\aurum-local-lane-repair-validation.json'
          $repairPath = Join-Path $env:GITHUB_WORKSPACE 'installer\repair-aurum-local-lane.ps1'
          if (-not (Test-Path -LiteralPath $receiptPath -PathType Leaf)) {
            Write-Host 'AURUM_LOCAL_LANE_RECOVERY skipped=no-validation-receipt'
            exit 0
          }
          $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          if ([string]$receipt.status -ne 'success') {
            Write-Host "AURUM_LOCAL_LANE_RECOVERY skipped=validation-not-green status=$($receipt.status)"
            exit 0
          }
          $testedCommit = [string]$receipt.tested_commit
          if ([string]::IsNullOrWhiteSpace($testedCommit)) {
            Write-Host 'AURUM_LOCAL_LANE_RECOVERY skipped=validation-missing-tested-commit'
            exit 0
          }
          & git -C $env:GITHUB_WORKSPACE cat-file -e "$testedCommit^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            & git -C $env:GITHUB_WORKSPACE fetch --depth=100 origin main
          }
          & git -C $env:GITHUB_WORKSPACE diff --quiet "$testedCommit..HEAD" -- 'installer/repair-aurum-local-lane.ps1'
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'AURUM_LOCAL_LANE_RECOVERY skipped=repair-script-newer-than-green-validation'
            exit 0
          }

          $old = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $output = @(& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $repairPath -StartNow 2>&1)
            $code = $LASTEXITCODE
          }
          finally { $ErrorActionPreference = $old }
          $output | ForEach-Object { Write-Host $_ }
          switch ($code) {
            0 { Write-Host 'AURUM_LOCAL_LANE_RECOVERY bounded-repair=applied-or-already-approved' }
            2 { Write-Host 'AURUM_LOCAL_LANE_RECOVERY bounded-repair=skipped reason=no-existing-approval' }
            3 { Write-Host 'AURUM_LOCAL_LANE_RECOVERY bounded-repair=skipped reason=broader-drift-review-required' }
            default { throw "Bounded Aurum local-lane repair failed with exit code $code" }
          }

      - name: Locate authorized checkout and self-heal Aurum worker
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            $env:GITHUB_WORKSPACE,
            'C:\Users\bruce\Documents\GitHub\BoxBrain',
            'C:\Users\bruce\BoxBrain'
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }

          $root = $candidates |
            Where-Object {
              (Test-Path -LiteralPath (Join-Path $_ 'Aurum.ps1') -PathType Leaf) -and
              (Test-Path -LiteralPath (Join-Path $_ '.git') -PathType Container)
            } |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($root)) {
            throw 'No authorized BoxBrain checkout was found on this Windows runner.'
          }

          $aurumHome = if ($env:AURUM_HOME) { $env:AURUM_HOME } else { Join-Path $env:USERPROFILE '.aurum' }
          New-Item -ItemType Directory -Path $aurumHome -Force | Out-Null
          $workerPath = Join-Path $aurumHome 'worker.ps1'
          $watchdogPath = Join-Path $aurumHome 'worker-watchdog.ps1'
          $sourceWorker = Join-Path $root 'Web\Aurum-Arkmatx\worker.ps1'
          $sourceWatchdog = Join-Path $root 'Web\Aurum-Arkmatx\worker-watchdog.ps1'
          $bootstrap = Join-Path $root 'Web\Aurum-Arkmatx\bootstrap.ps1'
          $configPath = Join-Path $aurumHome 'node.json'

          foreach ($required in @($sourceWorker,$sourceWatchdog)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Current Aurum runtime source missing: $required"
            }
          }

          if (-not (Test-Path -LiteralPath $configPath -PathType Leaf)) {
            if (-not (Test-Path -LiteralPath $bootstrap -PathType Leaf)) {
              throw "Aurum node config and bootstrap are both missing: $configPath"
            }
            Write-Host 'AURUM_WORKER_RECOVERY enrollment-required'
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $bootstrap
            if ($LASTEXITCODE -ne 0) { throw "Aurum bootstrap returned exit code $LASTEXITCODE" }
          }

          Copy-Item -LiteralPath $sourceWorker -Destination $workerPath -Force
          Copy-Item -LiteralPath $sourceWatchdog -Destination $watchdogPath -Force

          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          New-Item -Path $runKey -Force | Out-Null
          $watchdogCmd = 'powershell.exe -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "{0}"' -f $watchdogPath
          Set-ItemProperty -Path $runKey -Name 'AurumWorkerWatchdog' -Value $watchdogCmd
          Remove-ItemProperty -Path $runKey -Name 'AurumWorker' -ErrorAction SilentlyContinue

          $workerExisting = @(Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -like "*$workerPath*" })
          if ($workerExisting.Count -eq 0) {
            Start-Process powershell.exe -WindowStyle Hidden -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',$workerPath)
            Write-Host 'AURUM_WORKER_RECOVERY worker-restarted=true'
          } else {
            Write-Host "AURUM_WORKER_RECOVERY worker-already-running=true count=$($workerExisting.Count)"
          }

          $watchdogExisting = @(Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -like "*$watchdogPath*" })
          if ($watchdogExisting.Count -eq 0) {
            Start-Process powershell.exe -WindowStyle Hidden -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',$watchdogPath)
            Write-Host 'AURUM_WORKER_RECOVERY watchdog-started=true'
          } else {
            Write-Host "AURUM_WORKER_RECOVERY watchdog-already-running=true count=$($watchdogExisting.Count)"
          }

          $cfg = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          $controller = if ($cfg.controller) { [string]$cfg.controller } else { 'https://arkmatx.com/aurum/index.php' }
          $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $heartbeat = [ordered]@{
            schema='aurum.uaf.v0'
            frame_id="heartbeat-$($cfg.node_id)-$now-recovery"
            origin="Aurum-Node-$($cfg.node_id)"
            target='Aurum-Arkmatx'
            intent='node_heartbeat'
            state_delta=@{node_id=[string]$cfg.node_id;carrier='https-outbound';worker_recovered=$true;watchdog=$true}
            provenance=@{node="Aurum-Node-$($cfg.node_id)";created=$now}
            verification=@{content_addressed=$true;reversible=$true}
          }
          Invoke-RestMethod -Method Post -Uri $controller -ContentType 'application/json' -Body ($heartbeat | ConvertTo-Json -Depth 8 -Compress) | Out-Null
          Write-Host "AURUM_WORKER_RECOVERY heartbeat=true node=$($cfg.node_id) controller=$controller"

          $keyPath = Join-Path $HOME '.ssh\boxbrain_pi_ed25519'
          if (-not (Test-Path -LiteralPath $keyPath -PathType Leaf)) {
            throw "The dedicated BoxBrain Pi key is not available to this Windows runner account: $keyPath"
          }

          Write-Host "AURUM_WINDOWS_RUNNER computer=$env:COMPUTERNAME root=$root"
          & (Join-Path $root 'Aurum.ps1') -UsePiAp
          if ($LASTEXITCODE -ne 0) {
            throw "Aurum AP entry point returned exit code $LASTEXITCODE."
          }
          Write-Host 'AURUM_AUTHORIZED_WINDOWS_AP_COMPLETE'
