name: Sync canonical Command Center v1.15 projection

on:
  push:
    branches: [aurum-command-center-v1-15-projection]
    paths:
      - '.github/workflows/_sync-command-center-v1-15.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aurum-command-center-v1-15-projection
          fetch-depth: 0
      - name: Assemble exact canonical component and remove one-shot staging
        shell: bash
        run: |
          set -euo pipefail
          expected_blob='965c546cd0e166e037a38c3c0b693efd5a7895cc'
          target='Web/Aurum-Arkmatx/generation-seed-ladder-v1.js'
          cat \
            .tmp/aurum-command-center-v1-15/part00 \
            .tmp/aurum-command-center-v1-15/part01 \
            .tmp/aurum-command-center-v1-15/part02 \
            .tmp/aurum-command-center-v1-15/part03 > "$RUNNER_TEMP/generation-seed-ladder-v1.js"
          test "$(wc -c < "$RUNNER_TEMP/generation-seed-ladder-v1.js")" -eq 25934
          node --check "$RUNNER_TEMP/generation-seed-ladder-v1.js"
          test "$(git hash-object "$RUNNER_TEMP/generation-seed-ladder-v1.js")" = "$expected_blob"
          cp "$RUNNER_TEMP/generation-seed-ladder-v1.js" "$target"
          test "$(git hash-object "$target")" = "$expected_blob"
          git rm -r '.tmp/aurum-command-center-v1-15' '.github/workflows/_sync-command-center-v1-15.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'Project canonical Generation Seed Ladder v1.15'
          git push origin HEAD:aurum-command-center-v1-15-projection
