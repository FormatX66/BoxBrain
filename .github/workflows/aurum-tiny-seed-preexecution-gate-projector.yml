name: Aurum Tiny Seed Pre-execution Gate Projector

on:
  push:
    branches: [main]
    paths:
      - 'Projects/AurumBridge/results/hopper-recovery-path-latest.json'
      - 'Projects/Aurum/Release/latest-tinyseed-handoff.json'
      - 'Projects/Aurum/Recovery/latest-usb-discovery.json'
      - 'Projects/Aurum/Recovery/usb-discovery-request.json'
      - 'Projects/Aurum/Germ/physical_handoff_preflight.py'
      - '.github/workflows/aurum-tiny-seed-preexecution-gate-projector.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-tiny-seed-preexecution-gate-projector
  cancel-in-progress: true

jobs:
  project:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out canonical evidence
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Project evidence without granting authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys

          root = Path('.')
          sys.path.insert(0, str((root / 'Projects/Aurum/Germ').resolve()))
          from physical_handoff_preflight import evaluate_physical_preflight

          def load(path):
              return json.loads(path.read_text(encoding='utf-8-sig')) if path.is_file() else None

          release = load(root / 'Projects/Aurum/Release/latest-tinyseed-handoff.json')
          discovery = load(root / 'Projects/Aurum/Recovery/latest-usb-discovery.json')
          flash_request = load(root / 'Projects/Aurum/Recovery/tinyseed-flash-request.json')
          recovery = load(root / 'Projects/AurumBridge/results/hopper-recovery-path-latest.json')
          if release is None:
              raise SystemExit('AURUM_TINYSEED_PREEXECUTION_REFUSED reason=release-missing')

          payload = evaluate_physical_preflight(release, discovery, flash_request, recovery)
          if payload.get('write_authority') is not False or payload.get('destructive_action_allowed') is not False:
              raise SystemExit('AURUM_TINYSEED_PREEXECUTION_REFUSED reason=evaluator-granted-authority')
          out_path = root / 'Projects/Aurum/Recovery/latest-tinyseed-physical-preflight.json'
          out_path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({
              'state': payload.get('preflight_state'),
              'next_gate': payload.get('next_gate'),
              'write_authority': False,
              'destructive_action_allowed': False,
          }, sort_keys=True))
          PY

          git config user.name 'aurum-preexecution-gate[bot]'
          git config user.email 'aurum-preexecution-gate@users.noreply.github.com'
          git add Projects/Aurum/Recovery/latest-tinyseed-physical-preflight.json
          if git diff --cached --quiet; then
            exit 0
          fi
          state=$(python3 -c "import json; print(json.load(open('Projects/Aurum/Recovery/latest-tinyseed-physical-preflight.json'))['preflight_state'])")
          git commit -m "Project Tiny Seed pre-execution state=$state [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
