name: Aurum Pi3 smsc95xx Integrated Packet Control Loop

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aurum-pi3-smsc95xx-integrated-packet-control-loop.yml'
      - 'Projects/AdaptiveKernel/pi3_smsc95xx_integrated_packet_control_loop.py'
      - 'Projects/AdaptiveKernel/tests/test_pi3_smsc95xx_integrated_packet_control_loop.py'
      - 'Projects/AdaptiveKernel/driver_candidates/generated/pi3-smsc95xx-usbnet-control-loop-candidate.c'
      - 'Projects/AdaptiveKernel/driver_candidates/generated/pi3-smsc95xx-packet-transfer-candidate.c'
      - 'Projects/AdaptiveKernel/results/pi3-smsc95xx-usbnet-control-loop-candidate-latest.json'
      - 'Projects/AdaptiveKernel/results/pi3-smsc95xx-usbnet-control-loop-differential-latest.json'
      - 'Projects/AdaptiveKernel/results/pi3-smsc95xx-packet-transfer-candidate-latest.json'
      - 'Projects/AdaptiveKernel/results/pi3-smsc95xx-packet-transfer-differential-latest.json'

permissions:
  contents: write

concurrency:
  group: aurum-pi3-smsc95xx-integrated-packet-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-integrated-packet-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact integrated revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Run integrated fail-closed tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            Projects.AdaptiveKernel.tests.test_pi3_smsc95xx_integrated_packet_control_loop

      - name: Compile and run integrated packet/control matrix
        shell: bash
        run: |
          set -euo pipefail
          python -m Projects.AdaptiveKernel.pi3_smsc95xx_integrated_packet_control_loop \
            --control-candidate Projects/AdaptiveKernel/results/pi3-smsc95xx-usbnet-control-loop-candidate-latest.json \
            --control-differential Projects/AdaptiveKernel/results/pi3-smsc95xx-usbnet-control-loop-differential-latest.json \
            --packet-candidate Projects/AdaptiveKernel/results/pi3-smsc95xx-packet-transfer-candidate-latest.json \
            --packet-differential Projects/AdaptiveKernel/results/pi3-smsc95xx-packet-transfer-differential-latest.json \
            --control-source Projects/AdaptiveKernel/driver_candidates/generated/pi3-smsc95xx-usbnet-control-loop-candidate.c \
            --packet-source Projects/AdaptiveKernel/driver_candidates/generated/pi3-smsc95xx-packet-transfer-candidate.c \
            --sequence-seed 0x9514a11e \
            --sequence-steps 32768 \
            --output-dir integrated-evidence

      - name: Verify integrated zero-authority receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from Projects.AdaptiveKernel.pi3_smsc95xx_integrated_packet_control_loop import _verify_sealed

          receipt = json.loads(Path('integrated-evidence/integrated-packet-control-loop.json').read_text())
          if receipt.get('state') != 'controlled-integrated-host-packet-control-loop-passed':
              raise SystemExit('integrated packet/control loop did not pass')
          if not _verify_sealed(receipt):
              raise SystemExit('integrated receipt seal failed')
          if receipt.get('complete_integrated_scenarios') != 455:
              raise SystemExit('integrated scenario matrix is incomplete')
          if receipt.get('deterministic_sequence_steps') != 32768 or receipt.get('scenario_count') != 33223:
              raise SystemExit('integrated deterministic coverage is incomplete')
          if receipt.get('mismatch_count') != 0:
              raise SystemExit('integrated packet/control loop contains mismatches')
          if receipt['qpu']['used'] or receipt['qpu']['hardware_submission_performed']:
              raise SystemExit('bounded integrated verification unexpectedly used QPU hardware')
          if receipt['invariants']['live_pi_contacted'] or receipt['invariants']['usb_transfer_submitted']:
              raise SystemExit('integrated candidate crossed its no-hardware boundary')
          if any(receipt['authority'].values()):
              raise SystemExit('integrated candidate gained authority')
          summary = [
              '# Pi3 smsc95xx Integrated Packet Control Loop',
              '',
              f"- State: {receipt['state']}",
              '- Complete integrated scenarios: 455',
              '- Deterministic mixed sequence: 32,768',
              '- Mismatches: 0',
              '- Live Pi / USB / register access: false',
              '- Mutation / promotion / write authority: false',
              '',
              receipt['strongest_claim'],
          ]
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as handle:
              handle.write('\n'.join(summary) + '\n')
          PY

      - name: Publish integrated evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aurum-pi3-smsc95xx-integrated-packet-control-${{ github.run_id }}
          path: integrated-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Persist verified integrated lineage
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cp integrated-evidence/integrated-packet-control-loop.json \
            Projects/AdaptiveKernel/results/pi3-smsc95xx-integrated-packet-control-loop-latest.json
          git config user.name 'aurum-pi3-integrated-packet-control[bot]'
          git config user.email 'aurum-pi3-integrated-packet-control@users.noreply.github.com'
          git add Projects/AdaptiveKernel/results/pi3-smsc95xx-integrated-packet-control-loop-latest.json
          if git diff --cached --quiet; then
            echo 'AURUM_PI3_SMSC95XX_INTEGRATED_PACKET_CONTROL_RECEIPT unchanged=true'
            exit 0
          fi
          git commit -m 'Record Pi3 integrated packet control-loop evidence [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'AURUM_PI3_SMSC95XX_INTEGRATED_PACKET_CONTROL_RECEIPT persisted=true'
