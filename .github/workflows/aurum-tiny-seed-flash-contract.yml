name: Aurum Tiny Seed Flash Contract
# Changes to this contract intentionally self-trigger so destructive-route safety is re-proven.

on:
  workflow_dispatch:
  push:
    paths:
      - 'Projects/Aurum/Germ/handoff/Flash-TinySeed-Windows.ps1'
      - 'Projects/AurumBridge/Refresh-HopperRecoveryReadOnly.ps1'
      - 'Projects/Aurum/Recovery/protected-media.json'
      - '.github/workflows/aurum-tiny-seed-flash-windows.yml'
      - '.github/workflows/aurum-tiny-seed-flash-authorized.yml'
      - '.github/workflows/aurum-tiny-seed-flash-request.yml'
      - '.github/workflows/aurum-tiny-seed-windows-cache-stage.yml'
      - '.github/workflows/aurum-tiny-seed-flash-contract.yml'

permissions:
  contents: read

jobs:
  windows-contract:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - name: Check out flash tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Parse guarded flash scripts without executing them
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($relative in @(
            'Projects/Aurum/Germ/handoff/Flash-TinySeed-Windows.ps1',
            'Projects/AurumBridge/Refresh-HopperRecoveryReadOnly.ps1'
          )) {
            $path = (Resolve-Path $relative).Path
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$relative : $($_.Message)" }
              throw "PowerShell parser rejected $relative"
            }
          }

      - name: Assert destructive gates remain explicit
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Get-Content 'Projects/Aurum/Germ/handoff/Flash-TinySeed-Windows.ps1' -Raw
          $recovery = Get-Content 'Projects/AurumBridge/Refresh-HopperRecoveryReadOnly.ps1' -Raw
          $workflow = Get-Content '.github/workflows/aurum-tiny-seed-flash-windows.yml' -Raw
          $requestWorkflow = Get-Content '.github/workflows/aurum-tiny-seed-flash-request.yml' -Raw
          $cacheWorkflow = Get-Content '.github/workflows/aurum-tiny-seed-windows-cache-stage.yml' -Raw
          $legacy = Get-Content '.github/workflows/aurum-tiny-seed-flash-authorized.yml' -Raw

          $requiredScript = @(
            '[switch]$Write',
            'AURUM_TINYSEED_FLASH_DRY_RUN',
            'disk-serial-not-unique',
            'target-is-boot-or-system',
            'target-is-protected-recovery-media',
            'target-became-protected-before-write',
            'protected-media.json',
            'target-identity-changed-before-write',
            'preexecution-recovery-receipt-missing',
            'aurum.hopper.recovery-path-probe.v2',
            'preexecution-recovery-receipt-stale',
            'preexecution-remote-repair-completed-recheck-hopper',
            'AURUM_TINYSEED_PREEXECUTION_RECOVERY_GATE_OK',
            'raw-readback-mismatch',
            'raw_readback_verified=true'
          )
          foreach ($needle in $requiredScript) {
            if (-not $script.Contains($needle)) { throw "missing flasher safety invariant: $needle" }
          }

          $requiredRecovery = @(
            'aurum.hopper.recovery-path-probe.v2',
            'read_only_probe = $true',
            "mutation_if_authorized = 'none-read-only-refresh'",
            'StrictHostKeyChecking=yes',
            'AURUM_HOPPER_RECOVERY_REFRESH_OK'
          )
          foreach ($needle in $requiredRecovery) {
            if (-not $recovery.Contains($needle)) { throw "missing recovery refresh invariant: $needle" }
          }

          if (-not $workflow.Contains('default: false')) { throw 'flash workflow must default write=false' }
          if (-not $workflow.Contains('READY_TO_FLASH')) { throw 'flash workflow must require READY_TO_FLASH manifest' }
          if (-not $workflow.Contains('source-commit-mismatch')) { throw 'flash workflow must pin source commit' }

          $requiredCacheWorkflow = @(
            'aurum-tinyseed-windows-cache-v1',
            'hash_verified = $true',
            'destructive_media_write = $false',
            'write_authority = $false',
            'AURUM_TINYSEED_CACHE_STAGED',
            'AURUM_TINYSEED_CACHE_HIT',
            'handoff_run_id',
            'handoff_artifact_id'
          )
          foreach ($needle in $requiredCacheWorkflow) {
            if (-not $cacheWorkflow.Contains($needle)) { throw "missing zero-authority cache invariant: $needle" }
          }
          if ($cacheWorkflow.Contains('PhysicalDrive') -or $cacheWorkflow.Contains('IO.FileStream') -or $cacheWorkflow.Contains('-ConfirmText $confirm -Write')) {
            throw 'cache preparation must not contain a destructive media-write implementation'
          }

          $requiredRequestWorkflow = @(
            'Refresh-HopperRecoveryReadOnly.ps1',
            'request-expired-before-write',
            "state = 'CLAIMED'",
            'request-already-consumed-without-ready-proof',
            '-ConfirmText $confirm -Write',
            'AURUM_TINYSEED_FLASH_OK',
            'helper-did-not-prove-raw-readback',
            "state = 'READY_TO_BOOT'",
            'raw_readback_verified = $true',
            'write_authority_consumed = $true',
            'aurum-tinyseed-windows-cache-v1',
            'AURUM_TINYSEED_FLASH_CACHE_HIT',
            '-not [bool]$meta.destructive_media_write',
            '-not [bool]$meta.write_authority',
            '[long]$meta.handoff_run_id -eq $handoffRunId',
            '[long]$meta.handoff_artifact_id -eq $artifactId'
          )
          foreach ($needle in $requiredRequestWorkflow) {
            if (-not $requestWorkflow.Contains($needle)) { throw "missing one-shot flash invariant: $needle" }
          }
          $claimIndex = $requestWorkflow.IndexOf("state = 'CLAIMED'")
          $writeIndex = $requestWorkflow.IndexOf('-ConfirmText $confirm -Write')
          $proofIndex = $requestWorkflow.IndexOf("state = 'READY_TO_BOOT'")
          if ($claimIndex -lt 0 -or $writeIndex -lt 0 -or $proofIndex -lt 0 -or -not ($claimIndex -lt $writeIndex -and $writeIndex -lt $proofIndex)) {
            throw 'one-shot authority must be claimed before raw write and READY_TO_BOOT proof must follow the verified write'
          }

          if (-not $legacy.Contains('AURUM_TINYSEED_FLASH_REFUSED reason=legacy-authorized-workflow-disabled')) { throw 'legacy raw-write workflow must remain fail-closed' }
          if ($legacy.Contains('PhysicalDrive') -or $legacy.Contains('IO.FileStream')) { throw 'legacy workflow must not contain an independent raw-write implementation' }
          Write-Host 'AURUM_TINYSEED_FLASH_CONTRACT_OK destructive_default=false exact_identity=true protected_media_fail_closed=true recovery_refreshed_at_write_boundary=true zero_authority_cache=true one_shot_claim_ordered=true raw_readback_required=true legacy_bypass_disabled=true'
