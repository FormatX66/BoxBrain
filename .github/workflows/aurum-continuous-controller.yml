name: Aurum Continuous Build Controller

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aurum-continuous-controller.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: aurum-continuous-build-controller
  cancel-in-progress: false

env:
  AURUM_TRUNK: aurum/trunk-v0.01

jobs:
  keep-building:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current Aurum trunk
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: aurum/trunk-v0.01
          fetch-depth: 20

      - name: Decide whether native growth needs a watchdog dispatch
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          active="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/aurum-autobuild.yml/runs?branch=${AURUM_TRUNK}&per_page=20" \
            --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')"
          if [ "$active" -gt 0 ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'AURUM_CONTINUOUS_DECISION active-autobuild-already-running'
            exit 0
          fi

          python3 - <<'PY' > /tmp/aurum-watchdog-state
          import json
          import time
          from pathlib import Path

          state_path = Path('Projects/Codelation/autobuild/native_chain_state.json')
          if not state_path.is_file():
              print('dispatch:state-missing')
              raise SystemExit(0)
          state = json.loads(state_path.read_text(encoding='utf-8'))
          blocked = state.get('blocked_reason')
          evidence = state.get('external_evidence') or {}
          evidence_payload = evidence.get('evidence') if isinstance(evidence, dict) else None
          if blocked != 'external-prerequisite-blocked':
              print('dispatch:not-physical-block')
              raise SystemExit(0)
          if isinstance(evidence_payload, dict):
              expires_at = int(evidence_payload.get('expires_at') or 0)
              if evidence.get('applied') and expires_at >= int(time.time()):
                  print('dispatch:fresh-physical-evidence')
                  raise SystemExit(0)
          print('stable:physical-evidence-pending')
          PY

          decision="$(cat /tmp/aurum-watchdog-state)"
          case "$decision" in
            dispatch:*)
              echo 'run=true' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'run=false' >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "AURUM_CONTINUOUS_DECISION $decision"

      - name: Dispatch native growth watchdog
        if: steps.decide.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/aurum-autobuild.yml/dispatches" \
            -f ref="$AURUM_TRUNK"
          echo 'AURUM_CONTINUOUS_DISPATCH ref=aurum/trunk-v0.01'

      - name: Report continuous-build state
        if: always()
        shell: bash
        run: |
          echo "AURUM_CONTINUOUS_STATE trunk=$AURUM_TRUNK dispatch=${{ steps.decide.outputs.run }}"
          echo 'Independent kernel, GUI, LLM, image, lab, mesh, and physical lanes remain event-driven and do not wait on this native lane.'
