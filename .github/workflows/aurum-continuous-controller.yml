name: Aurum Continuous Build Controller

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aurum-continuous-controller.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: aurum-continuous-build-controller
  cancel-in-progress: false

env:
  AURUM_TRUNK: aurum/trunk-v0.01

jobs:
  keep-building:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current Aurum trunk
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: aurum/trunk-v0.01
          fetch-depth: 100

      - name: Decide whether native growth needs a watchdog dispatch
        id: native
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          active="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/aurum-autobuild.yml/runs?branch=${AURUM_TRUNK}&per_page=20" \
            --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')"
          if [ "$active" -gt 0 ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'AURUM_CONTINUOUS_NATIVE active-autobuild-already-running'
            exit 0
          fi

          state_path='Projects/Codelation/autobuild/native_chain_state.json'
          if [ ! -f "$state_path" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'AURUM_CONTINUOUS_NATIVE dispatch:state-missing'
            exit 0
          fi

          blocked="$(jq -r '.blocked_reason // ""' "$state_path")"
          next_gap="$(jq -r '.next_gap // ""' "$state_path")"
          blocked_output="$(jq -r '.blocked_output // ""' "$state_path")"

          if [ "$blocked" != 'external-prerequisite-blocked' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'AURUM_CONTINUOUS_NATIVE dispatch:not-external-prerequisite-block'
            exit 0
          fi

          if [ "$next_gap" = 'adaptive_shell_gui_context_virtual_convergence' ] || \
             [ "$blocked_output" = 'blocked-same-commit-virtual-lab-verified' ]; then
            source_commit="$(git rev-parse HEAD)"
            runs="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/aurum-virtual-lab.yml/runs?branch=${AURUM_TRUNK}&status=success&per_page=50")"
            run_id="$(printf '%s' "$runs" | jq -r --arg sha "$source_commit" \
              '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")][0].id // empty')"
            if [ -z "$run_id" ]; then
              echo 'run=false' >> "$GITHUB_OUTPUT"
              echo "AURUM_CONTINUOUS_NATIVE stable:virtual-convergence-proof-pending source_commit=$source_commit"
              exit 0
            fi
            artifact="Aurum-VirtualLab-Convergence-${source_commit}"
            artifact_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.name == \"${artifact}\" and .expired == false) | .id" \
              | head -n1)"
            if [ -z "$artifact_id" ]; then
              echo 'run=false' >> "$GITHUB_OUTPUT"
              echo "AURUM_CONTINUOUS_NATIVE stable:virtual-convergence-artifact-pending run_id=$run_id"
              exit 0
            fi
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo "AURUM_CONTINUOUS_NATIVE dispatch:virtual-convergence-proof-ready source_commit=$source_commit run_id=$run_id artifact_id=$artifact_id"
            exit 0
          fi

          python3 - <<'PY' > /tmp/aurum-watchdog-state
          import json
          import time
          from pathlib import Path

          state_path = Path('Projects/Codelation/autobuild/native_chain_state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          evidence = state.get('external_evidence') or {}
          evidence_payload = evidence.get('evidence') if isinstance(evidence, dict) else None
          if isinstance(evidence_payload, dict):
              expires_at = int(evidence_payload.get('expires_at') or 0)
              if evidence.get('applied') and expires_at >= int(time.time()):
                  print('dispatch:fresh-external-evidence')
                  raise SystemExit(0)
          print('stable:external-evidence-pending')
          PY

          decision="$(cat /tmp/aurum-watchdog-state)"
          case "$decision" in
            dispatch:*) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
            *) echo 'run=false' >> "$GITHUB_OUTPUT" ;;
          esac
          echo "AURUM_CONTINUOUS_NATIVE $decision"

      - name: Dispatch native growth watchdog
        if: steps.native.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/aurum-autobuild.yml/dispatches" \
            -f ref="$AURUM_TRUNK"
          echo 'AURUM_CONTINUOUS_NATIVE_DISPATCH ref=aurum/trunk-v0.01'

      - name: Decide whether virtual hardware convergence needs verification
        id: lab
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow='aurum-virtual-lab.yml'
          active="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${AURUM_TRUNK}&per_page=20" \
            --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')"
          if [ "$active" -gt 0 ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'AURUM_CONTINUOUS_LAB active-virtual-lab-already-running'
            exit 0
          fi

          last_success="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${AURUM_TRUNK}&status=success&per_page=20" \
            --jq '.workflow_runs[0].head_sha // empty')"
          if [ -z "$last_success" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'AURUM_CONTINUOUS_LAB no-successful-trunk-convergence'
            exit 0
          fi

          if ! git cat-file -e "${last_success}^{commit}" 2>/dev/null; then
            git fetch --depth=200 origin "$AURUM_TRUNK"
          fi
          if ! git merge-base --is-ancestor "$last_success" HEAD 2>/dev/null; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'AURUM_CONTINUOUS_LAB previous-proof-not-on-current-trunk'
            exit 0
          fi

          state_path='Projects/Codelation/autobuild/native_chain_state.json'
          current_sha="$(git rev-parse HEAD)"
          next_gap=''
          blocked_output=''
          if [ -f "$state_path" ]; then
            next_gap="$(jq -r '.next_gap // ""' "$state_path")"
            blocked_output="$(jq -r '.blocked_output // ""' "$state_path")"
          fi
          if { [ "$next_gap" = 'adaptive_shell_gui_context_virtual_convergence' ] || \
               [ "$blocked_output" = 'blocked-same-commit-virtual-lab-verified' ]; } && \
             [ "$last_success" != "$current_sha" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'AURUM_CONTINUOUS_LAB native-state-requires-same-commit-proof'
            exit 0
          fi

          relevant=(
            '.github/workflows/aurum-virtual-lab.yml'
            'Projects/AurumVirtualLab'
            'Projects/AurumPC'
            'Projects/AurumPi3'
            'Projects/Codelation'
            '.github/workflows/aurum-autobuild.yml'
            ':(exclude)Projects/Codelation/autobuild/native_chain_state.json'
          )
          if git diff --quiet "$last_success"..HEAD -- "${relevant[@]}"; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'AURUM_CONTINUOUS_LAB current-runtime-relevant-state-already-converged'
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'AURUM_CONTINUOUS_LAB runtime-relevant-state-changed'
          fi

      - name: Dispatch virtual hardware convergence
        if: steps.lab.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -nc --arg ref "$AURUM_TRUNK" \
            '{ref:$ref,inputs:{publish_runtime:"false"}}' \
            | gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/aurum-virtual-lab.yml/dispatches" \
                --input -
          echo 'AURUM_CONTINUOUS_LAB_DISPATCH ref=aurum/trunk-v0.01 publish_runtime=false'

      - name: Report continuous-build state
        if: always()
        shell: bash
        run: |
          echo "AURUM_CONTINUOUS_STATE trunk=$AURUM_TRUNK native_dispatch=${{ steps.native.outputs.run }} lab_dispatch=${{ steps.lab.outputs.run }}"
          echo 'Independent kernel, GUI, LLM, image, lab, mesh, farm, and physical lanes do not globally wait on one another.'
