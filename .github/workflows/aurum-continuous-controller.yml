name: Aurum Continuous Build Controller

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aurum-continuous-controller.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: aurum-continuous-build-controller
  cancel-in-progress: false

env:
  AURUM_TRUNK: aurum/trunk-v0.01

jobs:
  keep-building:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current Aurum trunk
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: aurum/trunk-v0.01
          fetch-depth: 50

      - name: Repair continuous trunk routing idempotently
        id: rewire
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          trunk = 'aurum/trunk-v0.01'
          changed = []

          def replace_all(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              updated = text.replace(old, new)
              if updated != text:
                  p.write_text(updated, encoding='utf-8')
                  changed.append(path)

          def ensure_branch(path, anchor):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              needle = f'      - {trunk}\n'
              if needle in text:
                  return
              anchor_line = f'      - {anchor}\n'
              if anchor_line not in text:
                  raise SystemExit(f'branch anchor missing in {path}: {anchor}')
              updated = text.replace(anchor_line, anchor_line + needle, 1)
              p.write_text(updated, encoding='utf-8')
              changed.append(path)

          replace_all('.github/workflows/aurum-autobuild.yml', 'aurum/capacity-mesh-v0', trunk)
          replace_all('.github/workflows/aurum-capacity-mesh.yml', 'aurum/capacity-mesh-v0', trunk)
          replace_all('.github/workflows/aurum-parallel-buildout.yml', 'aurum/capacity-mesh-v0', trunk)

          ensure_branch('.github/workflows/aurum-self-kernel-compiler.yml', 'aurum/self-kernel-compiler-v0')
          ensure_branch('.github/workflows/aurum-llm-core.yml', 'aurum/llm-core-v0')
          ensure_branch('.github/workflows/aurum-pc-v001.yml', 'aurum/pc-v0.01')
          ensure_branch('.github/workflows/aurum-pi3-v001.yml', 'aurum/pi3-v0.01')
          ensure_branch('.github/workflows/aurum-virtual-lab.yml', 'aurum/virtual-lab-v0')

          Path('/tmp/aurum-rewired.txt').write_text('\n'.join(changed) + ('\n' if changed else ''), encoding='utf-8')
          print('AURUM_CONTINUOUS_REWIRE changed=' + (','.join(changed) if changed else 'none'))
          PY

          if [ -s /tmp/aurum-rewired.txt ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish repaired trunk routing
        if: steps.rewire.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aurum-continuous[bot]'
          git config user.email 'aurum-continuous@users.noreply.github.com'
          git add .github/workflows/aurum-autobuild.yml \
                  .github/workflows/aurum-capacity-mesh.yml \
                  .github/workflows/aurum-parallel-buildout.yml \
                  .github/workflows/aurum-self-kernel-compiler.yml \
                  .github/workflows/aurum-llm-core.yml \
                  .github/workflows/aurum-pc-v001.yml \
                  .github/workflows/aurum-pi3-v001.yml \
                  .github/workflows/aurum-virtual-lab.yml
          git commit -m 'Wire continuous Aurum build lanes to trunk [skip ci]'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin "$AURUM_TRUNK"
            if git rebase "origin/$AURUM_TRUNK" && git push origin "HEAD:$AURUM_TRUNK"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          echo 'Unable to publish continuous trunk routing after retries.' >&2
          exit 1

      - name: Refresh trunk after any routing repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$AURUM_TRUNK"
          git reset --hard "origin/$AURUM_TRUNK"

      - name: Decide whether autonomous work should run
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          active="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/aurum-autobuild.yml/runs?branch=${AURUM_TRUNK}&per_page=20" \
            --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')"
          if [ "$active" -gt 0 ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'AURUM_CONTINUOUS_DECISION active-autobuild-already-running'
            exit 0
          fi

          if [ "${{ steps.rewire.outputs.changed }}" = 'true' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'AURUM_CONTINUOUS_DECISION routing-changed'
            exit 0
          fi

          last_success="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/aurum-autobuild.yml/runs?branch=${AURUM_TRUNK}&status=success&per_page=20" \
            --jq '.workflow_runs[0].head_sha // empty')"

          if [ -z "$last_success" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'AURUM_CONTINUOUS_DECISION no-successful-trunk-autobuild'
            exit 0
          fi

          if ! git cat-file -e "${last_success}^{commit}" 2>/dev/null; then
            git fetch --depth=100 origin "$AURUM_TRUNK"
          fi

          if ! git merge-base --is-ancestor "$last_success" HEAD 2>/dev/null; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'AURUM_CONTINUOUS_DECISION last-success-not-ancestor'
            exit 0
          fi

          relevant=(
            '.github/workflows/aurum-autobuild.yml'
            'Projects/Codelation/run_native_autonomous_chain.py'
            'Projects/Codelation/run_native_frontier_gap.py'
            'Projects/Codelation/run_bottleneck_split_lane.py'
            'Projects/Codelation/run_capacity_mesh_cycle.py'
            'Projects/Codelation/run_capacity_mesh_lane.py'
            'Projects/Codelation/field'
            'Projects/Codelation/interface'
            'Projects/Codelation/autobuild/capacity_mesh_policy.json'
            'Projects/Codelation/autobuild/continuous_build_policy.json'
            'Projects/Codelation/autobuild/native_gap_specs'
            'Projects/Codelation/autobuild/external_evidence'
            'Projects/Codelation/tests'
          )

          if git diff --quiet "$last_success"..HEAD -- "${relevant[@]}"; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'AURUM_CONTINUOUS_DECISION unchanged-verified-autonomous-frontier'
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'AURUM_CONTINUOUS_DECISION new-deterministic-autonomous-work'
          fi

      - name: Dispatch next Aurum autonomous growth wave
        if: steps.decide.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/aurum-autobuild.yml/dispatches" \
            -f ref="$AURUM_TRUNK"
          echo 'AURUM_CONTINUOUS_DISPATCH ref=aurum/trunk-v0.01'

      - name: Report continuous-build state
        if: always()
        shell: bash
        run: |
          echo "AURUM_CONTINUOUS_STATE trunk=$AURUM_TRUNK rewired=${{ steps.rewire.outputs.changed }} dispatch=${{ steps.decide.outputs.run }}"
