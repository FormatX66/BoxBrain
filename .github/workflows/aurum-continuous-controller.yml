name: Aurum Continuous Build Controller

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aurum-continuous-controller.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: aurum-continuous-build-controller
  cancel-in-progress: false

env:
  AURUM_TRUNK: aurum/trunk-v0.01

jobs:
  keep-building:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current Aurum trunk
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: aurum/trunk-v0.01
          fetch-depth: 100

      - name: Decide whether native growth needs a watchdog dispatch
        id: native
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          active="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/aurum-autobuild.yml/runs?branch=${AURUM_TRUNK}&per_page=20" \
            --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')"
          if [ "$active" -gt 0 ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'AURUM_CONTINUOUS_NATIVE active-autobuild-already-running'
            exit 0
          fi

          python3 - <<'PY' > /tmp/aurum-watchdog-state
          import json
          import time
          from pathlib import Path

          state_path = Path('Projects/Codelation/autobuild/native_chain_state.json')
          if not state_path.is_file():
              print('dispatch:state-missing')
              raise SystemExit(0)
          state = json.loads(state_path.read_text(encoding='utf-8'))
          blocked = state.get('blocked_reason')
          evidence = state.get('external_evidence') or {}
          evidence_payload = evidence.get('evidence') if isinstance(evidence, dict) else None
          if blocked != 'external-prerequisite-blocked':
              print('dispatch:not-physical-block')
              raise SystemExit(0)
          if isinstance(evidence_payload, dict):
              expires_at = int(evidence_payload.get('expires_at') or 0)
              if evidence.get('applied') and expires_at >= int(time.time()):
                  print('dispatch:fresh-physical-evidence')
                  raise SystemExit(0)
          print('stable:physical-evidence-pending')
          PY

          decision="$(cat /tmp/aurum-watchdog-state)"
          case "$decision" in
            dispatch:*) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
            *) echo 'run=false' >> "$GITHUB_OUTPUT" ;;
          esac
          echo "AURUM_CONTINUOUS_NATIVE $decision"

      - name: Dispatch native growth watchdog
        if: steps.native.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/aurum-autobuild.yml/dispatches" \
            -f ref="$AURUM_TRUNK"
          echo 'AURUM_CONTINUOUS_NATIVE_DISPATCH ref=aurum/trunk-v0.01'

      - name: Decide whether virtual hardware convergence needs verification
        id: lab
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow='aurum-virtual-lab.yml'
          active="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${AURUM_TRUNK}&per_page=20" \
            --jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')"
          if [ "$active" -gt 0 ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'AURUM_CONTINUOUS_LAB active-virtual-lab-already-running'
            exit 0
          fi

          last_success="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${AURUM_TRUNK}&status=success&per_page=20" \
            --jq '.workflow_runs[0].head_sha // empty')"
          if [ -z "$last_success" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'AURUM_CONTINUOUS_LAB no-successful-trunk-convergence'
            exit 0
          fi

          if ! git cat-file -e "${last_success}^{commit}" 2>/dev/null; then
            git fetch --depth=200 origin "$AURUM_TRUNK"
          fi
          if ! git merge-base --is-ancestor "$last_success" HEAD 2>/dev/null; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'AURUM_CONTINUOUS_LAB previous-proof-not-on-current-trunk'
            exit 0
          fi

          relevant=(
            '.github/workflows/aurum-virtual-lab.yml'
            'Projects/AurumVirtualLab'
            'Projects/AurumPC'
            'Projects/AurumPi3'
            'Projects/Codelation'
          )
          if git diff --quiet "$last_success"..HEAD -- "${relevant[@]}"; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'AURUM_CONTINUOUS_LAB current-relevant-state-already-converged'
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'AURUM_CONTINUOUS_LAB relevant-state-changed'
          fi

      - name: Dispatch virtual hardware convergence
        if: steps.lab.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -nc --arg ref "$AURUM_TRUNK" \
            '{ref:$ref,inputs:{publish_runtime:"false"}}' \
            | gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/aurum-virtual-lab.yml/dispatches" \
                --input -
          echo 'AURUM_CONTINUOUS_LAB_DISPATCH ref=aurum/trunk-v0.01 publish_runtime=false'

      - name: Report continuous-build state
        if: always()
        shell: bash
        run: |
          echo "AURUM_CONTINUOUS_STATE trunk=$AURUM_TRUNK native_dispatch=${{ steps.native.outputs.run }} lab_dispatch=${{ steps.lab.outputs.run }}"
          echo 'Independent kernel, GUI, LLM, image, lab, mesh, farm, and physical lanes do not globally wait on one another.'
