name: Aurum PC-01 One-Time Verified Reflash (Retired)

# Historical direct PC-01 media writer retained only as a fail-closed tombstone.
# Its August 19 static authorization and push-triggered raw-write path are not
# compatible with the current release/device-bound one-shot authority contract.
# Historical receipts remain evidence; future writes must use the canonical
# Tiny Seed guarded-flash/preflight path.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse retired destructive path
        shell: bash
        run: |
          set -euo pipefail
          echo 'AURUM_LEGACY_PC01_REFLASH_RETIRED'
          echo 'reason=stale-static-destructive-authority-is-not-valid'
          echo 'next=use-current-release-one-shot-guarded-flash-preflight'
          exit 1
