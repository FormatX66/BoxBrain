# trigger-retry-3
name: Aurum Direct Pi PC-01 Visibility Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aurum-pi-direct-pc01-visibility-once.yml'
      - 'Projects/AurumBridge/requests/pi-pc01-visibility/**'

permissions:
  contents: write

concurrency:
  group: aurum-direct-pi-pc01-visibility-once
  cancel-in-progress: false

jobs:
  probe:
    name: Probe PC-01, Hopper Echo, and HDMI capture from self-hosted Linux node
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Run read-only visibility, Echo, and capture proof probe and commit receipt
        shell: bash
        run: |
          set -u
          echo AURUM_DIRECT_PI_PC01_HOPPER_PROBE
          host="$(hostname)"
          observed="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          addresses="$(ip -brief addr 2>&1 || true)"
          pingout="$(ping -c 3 pc-01.local 2>&1 || true)"
          hopper_resolve="$(getent ahostsv4 hopper.local 2>&1; getent ahostsv4 hopper 2>&1)"
          hopper_ping="$(ping -c 2 hopper 2>&1 || true)"
          neigh="$(ip neigh 2>&1 || true)"
          usb_inventory="$(lsusb 2>&1 || true)"
          video_devices="$(ls -l /dev/video* 2>&1 || true)"
          if command -v v4l2-ctl >/dev/null 2>&1; then
            v4l2_devices="$(v4l2-ctl --list-devices 2>&1 || true)"
          else
            v4l2_devices="v4l2-ctl unavailable"
          fi

          proof1=""
          proof1_host=""
          for candidate in hopper.local hopper; do
            candidate_proof="$(curl -sS --connect-timeout 3 --max-time 6 "http://${candidate}:8767/proof" 2>/dev/null || true)"
            if [ -n "$candidate_proof" ]; then
              proof1="$candidate_proof"
              proof1_host="$candidate"
              break
            fi
          done

          sleep 3

          proof2=""
          proof2_host=""
          for candidate in hopper.local hopper; do
            candidate_proof="$(curl -sS --connect-timeout 3 --max-time 6 "http://${candidate}:8767/proof" 2>/dev/null || true)"
            if [ -n "$candidate_proof" ]; then
              proof2="$candidate_proof"
              proof2_host="$candidate"
              break
            fi
          done

          port_state=""
          for port in 8765 8766 8767 8768; do
            if timeout 4 bash -c "</dev/tcp/hopper/$port" 2>/dev/null; then
              port_state+="hopper:${port}=open\n"
            else
              port_state+="hopper:${port}=closed-or-unreachable\n"
            fi
          done

          mkdir -p Projects/AurumBridge/results
          capture_file="Projects/AurumBridge/results/hopper-hdmi-capture-${GITHUB_RUN_ID}.jpg"
          capture_state="not-attempted"
          capture_device=""
          if command -v ffmpeg >/dev/null 2>&1; then
            for candidate in /dev/video0 /dev/video1 /dev/video2 /dev/video3; do
              [ -e "$candidate" ] || continue
              if timeout 12 ffmpeg -hide_banner -loglevel error -f v4l2 -i "$candidate" -frames:v 1 -q:v 3 -y "$capture_file" >/tmp/aurum-capture.out 2>&1; then
                capture_state="frame-captured"
                capture_device="$candidate"
                break
              else
                capture_state="video-device-present-frame-failed"
                capture_device="$candidate"
              fi
            done
          elif compgen -G '/dev/video*' >/dev/null; then
            capture_state="video-device-present-ffmpeg-unavailable"
          else
            capture_state="no-video-device"
          fi

          out="Projects/AurumBridge/results/direct-pi-pc01-hopper-visibility-${GITHUB_RUN_ID}.txt"
          {
            echo "schema=aurum-direct-pi-pc01-hopper-visibility-v3"
            echo "host=$host"
            echo "observed_at=$observed"
            echo "capture_state=$capture_state"
            echo "capture_device=$capture_device"
            echo "--- addresses ---"
            printf '%s\n' "$addresses"
            echo "--- ping pc-01.local ---"
            printf '%s\n' "$pingout"
            echo "--- hopper resolution ---"
            printf '%s\n' "$hopper_resolve"
            echo "--- ping hopper ---"
            printf '%s\n' "$hopper_ping"
            echo "--- hopper proof sample 1 host=$proof1_host ---"
            printf '%s\n' "$proof1"
            echo "--- hopper proof sample 2 host=$proof2_host ---"
            printf '%s\n' "$proof2"
            echo "--- bounded hopper service ports ---"
            printf '%b' "$port_state"
            echo "--- usb inventory ---"
            printf '%s\n' "$usb_inventory"
            echo "--- video devices ---"
            printf '%s\n' "$video_devices"
            echo "--- v4l2 devices ---"
            printf '%s\n' "$v4l2_devices"
            echo "--- ip neigh ---"
            printf '%s\n' "$neigh"
          } | tee "$out"

          git config user.name 'aurum-direct-pi-probe[bot]'
          git config user.email 'aurum-direct-pi-probe@users.noreply.github.com'
          git add -- "$out"
          if [ -s "$capture_file" ]; then
            git add -- "$capture_file"
          fi
          git commit -m "Record direct Pi Hopper visibility and capture probe [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
