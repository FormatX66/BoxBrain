name: Aurum Physical Prerequisite Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aurum-physical-prerequisite-watch.yml'

permissions:
  contents: write

concurrency:
  group: aurum-physical-prerequisite-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out the live Aurum self-build branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: aurum/capacity-mesh-v0
          fetch-depth: 1

      - name: Resolve fresh BBPI4 physical-presence evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          controller = "https://arkmatx.com/aurum/index.php"
          windows_nodes = ("825e5a7b7d4a7aed", "85404f41d5507372")
          capability = "bbpi4-bootstrap"
          freshness_seconds = 300
          evidence_lifetime = 900
          headers = {
              "Accept": "application/json",
              "User-Agent": "Mozilla/5.0 BoxBrain-Aurum-Prerequisite-Watch/1.0",
          }

          state_path = Path("Projects/Codelation/autobuild/native_chain_state.json")
          if not state_path.is_file():
              print("AURUM_PREREQUISITE_WAIT reason=native-state-missing")
              raise SystemExit(0)
          state = json.loads(state_path.read_text(encoding="utf-8"))
          if not (
              state.get("blocked_reason") == "external-prerequisite-blocked"
              and state.get("next_gap") == "adaptive_shell_live_trial_readiness"
              and state.get("blocked_output") == "blocked-physical-node"
          ):
              print(
                  "AURUM_PREREQUISITE_WAIT "
                  f"reason=physical-presence-not-current-blocker "
                  f"blocked_reason={state.get('blocked_reason')} "
                  f"blocked_output={state.get('blocked_output')}"
              )
              raise SystemExit(0)

          def request_json(path, *, data=None, method="GET"):
              body = None
              request_headers = dict(headers)
              if data is not None:
                  request_headers["Content-Type"] = "application/json"
                  body = json.dumps(data, separators=(",", ":")).encode("utf-8")
              request = urllib.request.Request(
                  controller + path,
                  data=body,
                  headers=request_headers,
                  method=method,
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          before = request_json("/nodes")
          now = int(before.get("time") or time.time())
          by_id = {str(item.get("node_id") or ""): item for item in before.get("nodes", [])}
          fresh_windows = []
          for node_id in windows_nodes:
              item = by_id.get(node_id)
              if not item:
                  continue
              last_seen = int(item.get("last_seen") or 0)
              if now - last_seen <= freshness_seconds:
                  fresh_windows.append((last_seen, node_id, item))
          if not fresh_windows:
              ages = []
              for node_id in windows_nodes:
                  item = by_id.get(node_id)
                  if item:
                      ages.append(f"{node_id}:{max(0, now-int(item.get('last_seen') or 0))}")
              print(
                  "AURUM_PREREQUISITE_WAIT reason=authorized-windows-worker-offline "
                  f"ages_seconds={','.join(ages) or 'unenrolled'}"
              )
              raise SystemExit(0)

          fresh_windows.sort(reverse=True)
          baseline = {
              str(item.get("node_id") or ""): int(item.get("last_seen") or 0)
              for item in before.get("nodes", [])
          }
          requeued_at = int(time.time())
          selected_worker = None
          for _, node_id, _ in fresh_windows:
              query = urllib.parse.urlencode({"node_id": node_id, "capabilities": capability})
              work = request_json("/work/lease?" + query).get("work")
              if work is None:
                  selected_worker = node_id
                  print(f"AURUM_PREREQUISITE_WORK worker={node_id} state=already-leased-or-unavailable")
                  break
              expected_work_id = f"bbpi4-swarm-{node_id}"
              if work.get("work_id") != expected_work_id or work.get("capability") != capability:
                  print(
                      "AURUM_PREREQUISITE_WAIT reason=unexpected-work "
                      f"worker={node_id} work_id={work.get('work_id')} capability={work.get('capability')}"
                  )
                  continue
              request_json(
                  "/work/result",
                  data={
                      "node_id": node_id,
                      "work_id": expected_work_id,
                      "status": "failed",
                      "detail": {
                          "reason": "aurum-physical-prerequisite-watch-requeue",
                          "prerequisite_watch": True,
                      },
                      "completed_at": int(time.time()),
                  },
                  method="POST",
              )
              selected_worker = node_id
              requeued_at = int(time.time())
              print(f"AURUM_PREREQUISITE_WORK worker={node_id} state=requeued")
              break

          if selected_worker is None:
              print("AURUM_PREREQUISITE_WAIT reason=no-bounded-bootstrap-work")
              raise SystemExit(0)

          candidate = None
          deadline = time.time() + 90
          while time.time() < deadline:
              payload = request_json("/nodes")
              observed_at = int(payload.get("time") or time.time())
              candidates = []
              for item in payload.get("nodes", []):
                  node_id = str(item.get("node_id") or "")
                  if not node_id or node_id in windows_nodes:
                      continue
                  last_seen = int(item.get("last_seen") or 0)
                  if last_seen < requeued_at or last_seen <= baseline.get(node_id, 0):
                      continue
                  if observed_at - last_seen > freshness_seconds:
                      continue
                  name = str(item.get("name") or "")
                  carrier = str(item.get("carrier") or "")
                  if not name or not carrier:
                      continue
                  candidates.append((last_seen, node_id, name, carrier, observed_at))
              if candidates:
                  candidates.sort(reverse=True)
                  candidate = candidates[0]
                  break
              time.sleep(6)

          if candidate is None:
              print(
                  "AURUM_PREREQUISITE_WAIT reason=no-causally-fresh-bbpi4-heartbeat "
                  f"worker={selected_worker}"
              )
              raise SystemExit(0)

          last_seen, node_id, name, carrier, observed_at = candidate
          evidence = {
              "schema": "aurum-external-prerequisite-evidence-v0",
              "kind": "bbpi4-physical-presence",
              "source": "aurum-public-controller-fresh-node",
              "verified": True,
              "node_id": node_id,
              "name": name[:128],
              "carrier": carrier[:64],
              "last_seen": int(last_seen),
              "observed_at": int(observed_at),
              "expires_at": int(observed_at) + evidence_lifetime,
          }
          path = Path("Projects/Codelation/autobuild/external_evidence/bbpi4_presence.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(
              "AURUM_PREREQUISITE_EVIDENCE "
              f"worker={selected_worker} node_id={node_id} name={name.replace(' ', '_')} "
              f"carrier={carrier} last_seen={last_seen}"
          )
          PY

      - name: Publish fresh evidence to the Aurum branch
        shell: bash
        run: |
          set -euo pipefail
          relative='Projects/Codelation/autobuild/external_evidence/bbpi4_presence.json'
          if [ ! -f "$relative" ]; then
            echo 'AURUM_PREREQUISITE_PUBLISH skipped=no-fresh-evidence'
            exit 0
          fi
          git config user.name 'aurum-prerequisite-watch[bot]'
          git config user.email 'aurum-prerequisite-watch@users.noreply.github.com'
          git add -- "$relative"
          if git diff --cached --quiet; then
            echo 'AURUM_PREREQUISITE_PUBLISH skipped=unchanged'
            exit 0
          fi
          git commit -m 'Record fresh BBPI4 prerequisite evidence'
          git push origin HEAD:aurum/capacity-mesh-v0
          echo 'AURUM_PREREQUISITE_PUBLISH pushed=true'
