name: Aurum Evidence Continuation Reconcile

on:
  push:
    branches:
      - aurum/fix-evidence-continuation-20260828
    paths:
      - '.github/workflows/aurum-evidence-continuation-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: aurum/fix-evidence-continuation-20260828
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'

      - name: Add explicit recovered-evidence continuation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/aurum-external-evidence-recovery.yml')
          text = workflow.read_text(encoding='utf-8')

          old_permissions = '''permissions:\n  contents: write\n'''
          new_permissions = '''permissions:\n  contents: write\n  actions: write\n'''
          if text.count(old_permissions) != 1:
              raise SystemExit('recovery permissions block was not unique')
          text = text.replace(old_permissions, new_permissions, 1)

          old_marker = "Write-Host 'AURUM_EXTERNAL_EVIDENCE published=true autobuild_trigger=push'"
          new_marker = "Write-Host 'AURUM_EXTERNAL_EVIDENCE published=true continuation=pending-explicit-dispatch'"
          if text.count(old_marker) != 1:
              raise SystemExit('recovery publication marker was not unique')
          text = text.replace(old_marker, new_marker, 1)

          publish_end = '''          throw 'Fresh bounded evidence could not be published without overwriting concurrent Aurum work.'\n'''
          continuation = '''          throw 'Fresh bounded evidence could not be published without overwriting concurrent Aurum work.'\n\n      - name: Continue native growth from recovered evidence\n        shell: powershell\n        env:\n          GH_TOKEN: ${{ github.token }}\n        run: |\n          $ErrorActionPreference = 'Stop'\n          $headers = @{\n            Authorization = "Bearer $env:GH_TOKEN"\n            Accept = 'application/vnd.github+json'\n            'X-GitHub-Api-Version' = '2022-11-28'\n          }\n          $body = @{ ref = $env:AURUM_TRUNK } | ConvertTo-Json -Compress\n          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/aurum-autobuild.yml/dispatches"\n          Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -Body $body -ContentType 'application/json' | Out-Null\n          Write-Host 'AURUM_EXTERNAL_EVIDENCE continuation_dispatched=true trigger=explicit-workflow-dispatch authority=none'\n'''
          if text.count(publish_end) != 1:
              raise SystemExit('recovery publication tail was not unique')
          text = text.replace(publish_end, continuation, 1)
          workflow.write_text(text, encoding='utf-8')

          tests = Path('Projects/Codelation/tests/test_external_evidence_recovery_contract.py')
          test_text = tests.read_text(encoding='utf-8')
          insertion = '''\n    def test_recovery_explicitly_continues_autobuild_after_evidence_publication(self) -> None:\n        workflow = RECOVERY.read_text(encoding="utf-8")\n\n        self.assertIn("actions: write", workflow)\n        self.assertIn("Continue native growth from recovered evidence", workflow)\n        self.assertIn("actions/workflows/aurum-autobuild.yml/dispatches", workflow)\n        self.assertIn("continuation_dispatched=true", workflow)\n        self.assertIn("trigger=explicit-workflow-dispatch", workflow)\n        self.assertNotIn("autobuild_trigger=push", workflow)\n\n'''
          anchor = '''\n    def test_autobuild_recovery_dispatch_is_gap_specific_and_deduplicated(self) -> None:\n'''
          if test_text.count(anchor) != 1:
              raise SystemExit('recovery contract test insertion point was not unique')
          test_text = test_text.replace(anchor, insertion + anchor, 1)
          tests.write_text(test_text, encoding='utf-8')
          PY

      - name: Verify bounded continuation contract
        shell: bash
        run: >-
          python3 -m unittest
          Projects.Codelation.tests.test_external_evidence_recovery_contract
          Projects.Codelation.tests.test_adaptive_shell_gui_deployment
          -v

      - name: Commit bounded reconciliation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aurum-continuation-reconcile[bot]'
          git config user.email 'aurum-continuation-reconcile@users.noreply.github.com'
          git rm -- '.github/workflows/aurum-evidence-continuation-reconcile.yml'
          git add -- '.github/workflows/aurum-external-evidence-recovery.yml' 'Projects/Codelation/tests/test_external_evidence_recovery_contract.py'
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/aurum-evidence-continuation-reconcile.yml' '.github/workflows/aurum-external-evidence-recovery.yml' 'Projects/Codelation/tests/test_external_evidence_recovery_contract.py' | sort)"
          test "$staged" = "$expected"
          git commit -m 'Continue native growth after recovered evidence'
          git push origin HEAD:aurum/fix-evidence-continuation-20260828
