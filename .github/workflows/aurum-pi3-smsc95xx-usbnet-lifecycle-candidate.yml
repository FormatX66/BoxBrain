name: Aurum Pi3 smsc95xx USBNet Lifecycle Candidate

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aurum-pi3-smsc95xx-usbnet-lifecycle-candidate.yml'
      - 'Projects/AdaptiveKernel/pi3_smsc95xx_usbnet_lifecycle_candidate.py'
      - 'Projects/AdaptiveKernel/tests/test_pi3_smsc95xx_usbnet_lifecycle_candidate.py'
      - 'Projects/AdaptiveKernel/results/pi3-smsc95xx-usbnet-lifecycle-shadow-latest.json'

permissions:
  contents: write

concurrency:
  group: aurum-pi3-smsc95xx-usbnet-lifecycle-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-lifecycle-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact lifecycle-candidate revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Run fail-closed lifecycle candidate tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            Projects.AdaptiveKernel.tests.test_pi3_smsc95xx_usbnet_lifecycle_model \
            Projects.AdaptiveKernel.tests.test_pi3_smsc95xx_usbnet_lifecycle_candidate

      - name: Compile and run complete lifecycle differential
        shell: bash
        run: |
          set -euo pipefail
          python -m Projects.AdaptiveKernel.pi3_smsc95xx_usbnet_lifecycle_candidate \
            --lifecycle Projects/AdaptiveKernel/results/pi3-smsc95xx-usbnet-lifecycle-shadow-latest.json \
            --output-dir lifecycle-candidate-evidence/results \
            --sequence-seed 0x95146e7 \
            --sequence-steps 65536

      - name: Verify zero-authority semantic receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from Projects.AdaptiveKernel.pi3_smsc95xx_usbnet_lifecycle_candidate import _verify_sealed

          path = Path('lifecycle-candidate-evidence/results/usbnet-lifecycle-differential.json')
          receipt = json.loads(path.read_text())
          if receipt.get('state') != 'controlled-usbnet-lifecycle-candidate-differential-passed':
              raise SystemExit('lifecycle candidate did not reach the verified state')
          if not _verify_sealed(receipt):
              raise SystemExit('lifecycle differential receipt seal failed')
          if receipt['complete_transition_scenarios'] != 169:
              raise SystemExit('complete lifecycle transition coverage is missing')
          if receipt['deterministic_sequence_steps'] != 65536 or receipt['scenario_count'] != 65705:
              raise SystemExit('deterministic lifecycle sequence coverage is incomplete')
          if receipt['mismatch_count'] != 0:
              raise SystemExit('lifecycle candidate has mismatches')
          if receipt['qpu']['used'] or receipt['qpu']['hardware_submission_performed']:
              raise SystemExit('finite lifecycle candidate unexpectedly used QPU hardware')
          if receipt['invariants']['live_pi_contacted'] or receipt['invariants']['driver_binding_changed']:
              raise SystemExit('lifecycle candidate crossed its no-hardware boundary')
          if receipt['authority']['mutation_allowed'] or receipt['authority']['write_authority']:
              raise SystemExit('lifecycle candidate gained authority')
          summary = [
              '# Pi3 smsc95xx USBNet Lifecycle Candidate',
              '',
              f"- State: {receipt['state']}",
              '- Complete state/action transitions: 169',
              '- Deterministic sequence steps: 65,536',
              '- Mismatches: 0',
              '- Live Pi / USB device contacted: false',
              '- QPU hardware used: false',
              '- Mutation or promotion authority: false',
              '',
              receipt['strongest_claim'],
          ]
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as handle:
              handle.write('\n'.join(summary) + '\n')
          PY

      - name: Publish sealed lifecycle-candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aurum-pi3-smsc95xx-usbnet-lifecycle-candidate-${{ github.run_id }}
          path: lifecycle-candidate-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Persist verified lifecycle-candidate lineage
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Projects/AdaptiveKernel/driver_candidates/generated
          cp lifecycle-candidate-evidence/results/usbnet-lifecycle-candidate.c \
            Projects/AdaptiveKernel/driver_candidates/generated/pi3-smsc95xx-usbnet-lifecycle-candidate.c
          cp lifecycle-candidate-evidence/results/usbnet-lifecycle-candidate.json \
            Projects/AdaptiveKernel/results/pi3-smsc95xx-usbnet-lifecycle-candidate-latest.json
          cp lifecycle-candidate-evidence/results/usbnet-lifecycle-differential.json \
            Projects/AdaptiveKernel/results/pi3-smsc95xx-usbnet-lifecycle-differential-latest.json
          git config user.name 'aurum-pi3-usbnet-lifecycle-candidate[bot]'
          git config user.email 'aurum-pi3-usbnet-lifecycle-candidate@users.noreply.github.com'
          git add \
            Projects/AdaptiveKernel/driver_candidates/generated/pi3-smsc95xx-usbnet-lifecycle-candidate.c \
            Projects/AdaptiveKernel/results/pi3-smsc95xx-usbnet-lifecycle-candidate-latest.json \
            Projects/AdaptiveKernel/results/pi3-smsc95xx-usbnet-lifecycle-differential-latest.json
          if git diff --cached --quiet; then
            echo 'AURUM_PI3_SMSC95XX_USBNET_LIFECYCLE_CANDIDATE_RECEIPT unchanged=true'
            exit 0
          fi
          git commit -m 'Record Pi3 smsc95xx USBNet lifecycle candidate [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'AURUM_PI3_SMSC95XX_USBNET_LIFECYCLE_CANDIDATE_RECEIPT persisted=true'
