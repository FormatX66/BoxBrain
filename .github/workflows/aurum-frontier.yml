name: Aurum Capability Frontier

on:
  workflow_dispatch:
  repository_dispatch:
    types: [aurum-frontier-continue]
  pull_request:
    paths:
      - '.github/workflows/aurum-frontier.yml'
      - 'Projects/Codelation/run_native_frontier.py'
      - 'Projects/Codelation/run_native_autonomous_chain.py'
      - 'Projects/Codelation/field/**'
      - 'Projects/Codelation/autobuild/native_gap_specs/**'
      - 'Projects/Codelation/autobuild/external_evidence/**'
      - 'Projects/Codelation/tests/test_native_frontier.py'
  push:
    branches:
      - agent/aurum-frontier-no-generations
      - aurum/trunk-v0.01
    paths:
      - '.github/workflows/aurum-frontier.yml'
      - 'Projects/Codelation/run_native_frontier.py'
      - 'Projects/Codelation/run_native_autonomous_chain.py'
      - 'Projects/Codelation/field/**'
      - 'Projects/Codelation/autobuild/native_gap_specs/**'
      - 'Projects/Codelation/autobuild/external_evidence/**'
      - 'Projects/Codelation/tests/test_native_frontier.py'

permissions:
  contents: write
  actions: write

concurrency:
  group: aurum-capability-frontier-${{ github.ref }}
  cancel-in-progress: false

env:
  FRONTIER_STATE: Projects/Codelation/autobuild/native_frontier_state.json
  LEGACY_BOOTSTRAP: Projects/Codelation/autobuild/native_chain_state.json

jobs:
  advance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      yield_reason: ${{ steps.state.outputs.yield_reason }}
      blocked_reason: ${{ steps.state.outputs.blocked_reason }}
      work_done: ${{ steps.state.outputs.work_done }}
      frontier_nonempty: ${{ steps.state.outputs.frontier_nonempty }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 50

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Verify frontier semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Projects/Codelation/run_native_frontier.py
          python3 -m unittest Projects.Codelation.tests.test_native_frontier -v

      - name: Advance capability frontier
        shell: bash
        run: |
          set -euo pipefail
          python3 Projects/Codelation/run_native_frontier.py \
            --state-path "$FRONTIER_STATE" \
            --bootstrap-state "$LEGACY_BOOTSTRAP" \
            --work-budget 32 \
            | tee /tmp/aurum-frontier.json

      - name: Read frontier state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          state = json.loads(Path('Projects/Codelation/autobuild/native_frontier_state.json').read_text(encoding='utf-8'))
          serialized = json.dumps(state, sort_keys=True).lower()
          if 'generation' in serialized:
              raise SystemExit('obsolete sequence semantics leaked into authoritative frontier state')
          frontier = state.get('frontier') or []
          print('yield_reason=' + str(state.get('yield_reason') or 'none'))
          print('blocked_reason=' + str(state.get('blocked_reason') or 'none'))
          print('work_done=' + str(state.get('work_done_this_burst') or 0))
          print('frontier_nonempty=' + ('true' if frontier else 'false'))
          PY

      - name: Commit verified frontier state
        if: github.event_name != 'pull_request'
        id: checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aurum-frontier[bot]'
          git config user.email 'aurum-frontier@users.noreply.github.com'
          git add "$FRONTIER_STATE"
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'Advance Aurum capability frontier [skip ci]'
          for attempt in 1 2 3 4 5; do
            branch="${GITHUB_REF_NAME}"
            git fetch origin "$branch"
            if git rebase "origin/$branch" && git push origin "HEAD:$branch"; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          echo 'Unable to publish frontier checkpoint.' >&2
          exit 1

      - name: Continue immediately while frontier can move
        if: >-
          github.event_name != 'pull_request' &&
          steps.state.outputs.frontier_nonempty == 'true' &&
          steps.state.outputs.blocked_reason == 'none' &&
          steps.checkpoint.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/aurum-frontier.yml/dispatches" \
            -f ref="$branch"
          echo "AURUM_FRONTIER_CONTINUE branch=$branch trigger=frontier-moved"

      - name: Report frontier state
        if: always()
        shell: bash
        run: |
          echo "AURUM_FRONTIER yield=${{ steps.state.outputs.yield_reason }} blocked=${{ steps.state.outputs.blocked_reason }} work=${{ steps.state.outputs.work_done }} frontier=${{ steps.state.outputs.frontier_nonempty }}"
          echo 'Aurum has no lifecycle generation counter. Compute budgets only bound one worker burst.'
