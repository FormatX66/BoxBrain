name: Aurum Gate-Native Capability Frontier

on:
  workflow_dispatch:
  repository_dispatch:
    types: [aurum-frontier-continue]
  pull_request:
    paths:
      - '.github/workflows/aurum-frontier.yml'
      - 'Projects/Codelation/gate_native.py'
      - 'Projects/Codelation/run_gate_frontier.py'
      - 'Projects/Codelation/run_native_frontier.py'
      - 'Projects/Codelation/run_native_autonomous_chain.py'
      - 'Projects/Codelation/field/**'
      - 'Projects/Codelation/autobuild/native_gap_specs/**'
      - 'Projects/Codelation/autobuild/external_evidence/**'
      - 'Projects/Codelation/tests/test_gate_native.py'
      - 'Projects/Codelation/tests/test_gate_event_chain.py'
      - 'Projects/Codelation/tests/test_native_frontier.py'
  push:
    branches:
      - agent/aurum-frontier-no-generations
      - aurum/trunk-v0.01
    paths:
      - '.github/workflows/aurum-frontier.yml'
      - 'Projects/Codelation/gate_native.py'
      - 'Projects/Codelation/run_gate_frontier.py'
      - 'Projects/Codelation/run_native_frontier.py'
      - 'Projects/Codelation/run_native_autonomous_chain.py'
      - 'Projects/Codelation/field/**'
      - 'Projects/Codelation/autobuild/native_gap_specs/**'
      - 'Projects/Codelation/autobuild/external_evidence/**'
      - 'Projects/Codelation/tests/test_gate_native.py'
      - 'Projects/Codelation/tests/test_gate_event_chain.py'
      - 'Projects/Codelation/tests/test_native_frontier.py'

permissions:
  contents: write
  actions: write

concurrency:
  group: aurum-gate-frontier-${{ github.ref }}
  cancel-in-progress: false

env:
  MACHINE_STATE: Projects/Codelation/autobuild/native_gate_state.bin
  PROJECTION: Projects/Codelation/autobuild/native_gate_projection.json
  LEGACY_BOOTSTRAP: Projects/Codelation/autobuild/native_chain_state.json

jobs:
  advance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      yield_reason: ${{ steps.state.outputs.yield_reason }}
      blocked_reason: ${{ steps.state.outputs.blocked_reason }}
      work_done: ${{ steps.state.outputs.work_done }}
      focus_active: ${{ steps.state.outputs.focus_active }}
      virtual_waiting: ${{ steps.state.outputs.virtual_waiting }}
      proof_commit: ${{ steps.proof_source.outputs.proof_commit }}
      branch_ref: ${{ steps.proof_source.outputs.branch_ref }}
      virtual_requested: ${{ steps.request_virtual.outputs.requested }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 100

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Verify gate-native semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            Projects/Codelation/gate_native.py \
            Projects/Codelation/run_gate_frontier.py \
            Projects/Codelation/run_native_frontier.py
          python3 -m unittest \
            Projects.Codelation.tests.test_gate_native \
            Projects.Codelation.tests.test_gate_event_chain \
            Projects.Codelation.tests.test_native_frontier \
            -v

      - name: Resolve semantic proof commit
        id: proof_source
        shell: bash
        run: |
          set -euo pipefail
          branch_ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          proof_commit="$(git rev-list -1 HEAD -- . \
            ':(exclude)Projects/Codelation/autobuild/native_gate_state.bin' \
            ':(exclude)Projects/Codelation/autobuild/native_gate_projection.json')"
          test -n "$proof_commit"
          git diff --quiet "$proof_commit"..HEAD -- . \
            ':(exclude)Projects/Codelation/autobuild/native_gate_state.bin' \
            ':(exclude)Projects/Codelation/autobuild/native_gate_projection.json'
          echo "branch_ref=$branch_ref" >> "$GITHUB_OUTPUT"
          echo "proof_commit=$proof_commit" >> "$GITHUB_OUTPUT"
          echo "AURUM_PROOF_SOURCE branch=$branch_ref semantic_commit=$proof_commit head=$(git rev-parse HEAD)"

      - name: Bind successful same-commit virtual convergence proof
        id: virtual_proof
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_COMMIT: ${{ steps.proof_source.outputs.proof_commit }}
        run: |
          set -euo pipefail
          spec='Projects/Codelation/autobuild/native_gap_specs/adaptive_shell_gui_context_virtual_convergence.json'
          projection="$PROJECTION"
          echo 'applied=false' >> "$GITHUB_OUTPUT"

          waiting="$(python3 - "$projection" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          labels = data.get('labels') or {}
          states = set(data.get('pending') or ()) | set(data.get('parked') or ())
          print('true' if any(labels.get(state) == 'adaptive_shell_gui_context_virtual_convergence' for state in states) else 'false')
          PY
          )"
          if [ "$waiting" != true ]; then
            echo 'AURUM_VIRTUAL_PROOF skipped=no-unresolved-virtual-convergence-state'
            exit 0
          fi

          runs="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/aurum-virtual-lab.yml/runs?status=success&per_page=100")"
          run_id="$(printf '%s' "$runs" | jq -r --arg sha "$PROOF_COMMIT" \
            '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")][0].id // empty')"
          if [ -z "$run_id" ]; then
            echo "AURUM_VIRTUAL_PROOF pending semantic_commit=$PROOF_COMMIT"
            exit 0
          fi

          artifact="Aurum-VirtualLab-Convergence-${PROOF_COMMIT}"
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
          artifact_id="$(printf '%s' "$artifacts" | jq -r --arg name "$artifact" \
            '[.artifacts[] | select(.name == $name and .expired == false)][0].id // empty')"
          if [ -z "$artifact_id" ]; then
            echo "AURUM_VIRTUAL_PROOF successful-run-without-exact-artifact run_id=$run_id semantic_commit=$PROOF_COMMIT" >&2
            exit 1
          fi

          python3 - "$spec" "$PROOF_COMMIT" "$run_id" "$artifact" "$artifact_id" <<'PY'
          import json, pathlib, sys
          spec_path = pathlib.Path(sys.argv[1])
          source_commit, run_id, artifact, artifact_id = sys.argv[2:]
          data = json.loads(spec_path.read_text(encoding='utf-8'))
          if data.get('name') != 'adaptive_shell_gui_context_virtual_convergence':
              raise SystemExit('virtual convergence spec identity mismatch')
          invocation = data.get('invocation_arguments')
          if not isinstance(invocation, dict):
              raise SystemExit('virtual convergence invocation missing')
          required = {
              'surface_integration_verified': 'yes',
              'physical_hardware_not_claimed': 'yes',
              'no_credential_persistence': 'yes',
              'no_host_authority': 'yes',
          }
          for key, expected in required.items():
              if invocation.get(key) != expected:
                  raise SystemExit(f'virtual convergence prerequisite not satisfied: {key}')
          invocation['same_commit_virtual_lab_verified'] = 'yes'
          spec_path.write_text(json.dumps(data, indent=2, sort_keys=False) + '\n', encoding='utf-8')
          proof = {
              'schema': 'aurum.same-commit.virtual-lab-proof.v1',
              'verified': True,
              'source_commit': source_commit,
              'workflow': 'aurum-virtual-lab.yml',
              'workflow_run_id': int(run_id),
              'proof_artifact': artifact,
              'proof_artifact_id': int(artifact_id),
              'physical_hardware': 'not-proven-or-implied',
              'credential_content_captured': False,
              'authority_granted': False,
          }
          pathlib.Path('/tmp/aurum-virtual-convergence-proof.json').write_text(
              json.dumps(proof, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          echo 'applied=true' >> "$GITHUB_OUTPUT"
          echo "source_commit=$PROOF_COMMIT" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "AURUM_VIRTUAL_PROOF applied semantic_commit=$PROOF_COMMIT run_id=$run_id"

      - name: Advance binary capability gate field
        shell: bash
        run: |
          set -euo pipefail
          python3 Projects/Codelation/run_gate_frontier.py \
            --machine-state "$MACHINE_STATE" \
            --projection "$PROJECTION" \
            --bootstrap-state "$LEGACY_BOOTSTRAP" \
            --work-budget 32 \
            | tee /tmp/aurum-gate-frontier.json

      - name: Restore transient virtual proof override and retain Codelation provenance
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          spec='Projects/Codelation/autobuild/native_gap_specs/adaptive_shell_gui_context_virtual_convergence.json'
          git checkout -- "$spec"
          if [ ! -s /tmp/aurum-virtual-convergence-proof.json ] || [ ! -s "$PROJECTION" ]; then
            exit 0
          fi
          python3 - "$PROJECTION" /tmp/aurum-virtual-convergence-proof.json <<'PY'
          import json, pathlib, sys
          projection_path = pathlib.Path(sys.argv[1])
          proof_path = pathlib.Path(sys.argv[2])
          projection = json.loads(projection_path.read_text(encoding='utf-8'))
          proof = json.loads(proof_path.read_text(encoding='utf-8'))
          labels = projection.get('labels') or {}
          resolved = set(projection.get('resolved') or ())
          matches = [state for state, label in labels.items() if label == 'adaptive_shell_gui_context_virtual_convergence']
          if len(matches) != 1:
              raise SystemExit('virtual convergence state identity is ambiguous')
          state = matches[0]
          if state not in resolved:
              raise SystemExit('same-commit proof did not resolve virtual convergence state')
          evidence = projection.get('external_evidence')
          if not isinstance(evidence, dict):
              evidence = {}
          evidence[state] = proof
          projection['external_evidence'] = evidence
          projection['virtual_convergence_evidence'] = proof
          projection_path.write_text(json.dumps(projection, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Verify machine authority and read Codelation projection
        id: state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          from pathlib import Path

          binary = Path('Projects/Codelation/autobuild/native_gate_state.bin').read_bytes()
          projection = json.loads(Path('Projects/Codelation/autobuild/native_gate_projection.json').read_text(encoding='utf-8'))
          identity = hashlib.sha256(binary).hexdigest()
          if projection.get('machine_state_sha256') != identity:
              raise SystemExit('human Codelation projection is not bound to authoritative machine state')
          if projection.get('role') != 'codelation-only-not-authoritative':
              raise SystemExit('projection incorrectly claims machine authority')
          lowered = binary.lower()
          for forbidden in (b'generation', b'python', b'json', b'frontier', b'capability', b'learning_delta_score'):
              if forbidden in lowered:
                  raise SystemExit(f'human representation leaked into machine state: {forbidden!r}')
          labels = projection.get('labels') or {}
          unresolved = set(projection.get('pending') or ()) | set(projection.get('parked') or ())
          virtual_waiting = any(labels.get(state) == 'adaptive_shell_gui_context_virtual_convergence' for state in unresolved)
          focus = projection.get('focus')
          print('yield_reason=' + str(projection.get('yield_reason') or 'none'))
          print('blocked_reason=' + str(projection.get('blocked_reason') or 'none'))
          print('work_done=' + str(projection.get('work_done_this_burst') or 0))
          print('focus_active=' + ('true' if focus else 'false'))
          print('virtual_waiting=' + ('true' if virtual_waiting else 'false'))
          print('machine_state_sha256=' + identity)
          PY

      - name: Request exact-commit virtual convergence when missing
        id: request_virtual
        if: >-
          github.event_name != 'pull_request' &&
          steps.state.outputs.virtual_waiting == 'true' &&
          steps.virtual_proof.outputs.applied != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_REF: ${{ steps.proof_source.outputs.branch_ref }}
        run: |
          set -euo pipefail
          echo 'requested=false' >> "$GITHUB_OUTPUT"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/aurum-virtual-lab.yml/dispatches" \
            -f ref="$BRANCH_REF" \
            -f 'inputs[publish_runtime]=false'
          echo 'requested=true' >> "$GITHUB_OUTPUT"
          echo "AURUM_VIRTUAL_PROOF requested=true branch=$BRANCH_REF semantic_commit=${{ steps.proof_source.outputs.proof_commit }}"

      - name: Commit machine state and derived human projection
        if: github.event_name != 'pull_request'
        id: checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aurum-gate[bot]'
          git config user.email 'aurum-gate@users.noreply.github.com'
          git add "$MACHINE_STATE" "$PROJECTION"
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'Advance Aurum gate-native state [skip ci]'
          branch="${{ steps.proof_source.outputs.branch_ref }}"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            if git rebase "origin/$branch" && git push origin "HEAD:$branch"; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          echo 'Unable to publish gate-native checkpoint.' >&2
          exit 1

      - name: Continue immediately while machine focus can move
        if: >-
          github.event_name != 'pull_request' &&
          steps.state.outputs.focus_active == 'true' &&
          steps.state.outputs.blocked_reason == 'none' &&
          steps.checkpoint.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_REF: ${{ steps.proof_source.outputs.branch_ref }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/aurum-frontier.yml/dispatches" \
            -f ref="$BRANCH_REF"
          echo "AURUM_GATE_CONTINUE branch=$BRANCH_REF trigger=machine-state-changed"

      - name: Report Codelation view
        if: always()
        shell: bash
        run: |
          echo "AURUM_GATE yield=${{ steps.state.outputs.yield_reason }} blocked=${{ steps.state.outputs.blocked_reason }} work=${{ steps.state.outputs.work_done }} focus=${{ steps.state.outputs.focus_active }} virtual_waiting=${{ steps.state.outputs.virtual_waiting }}"
          echo "AURUM_GATE machine_state_sha256=${{ steps.state.outputs.machine_state_sha256 }}"
          echo 'Binary gate state is authoritative. ASCII names, JSON, Python, files, and workflow labels are Codelation carriers only.'

  wait-for-virtual-convergence:
    name: Wake gate frontier from exact-commit virtual convergence
    needs: advance
    if: >-
      needs.advance.outputs.virtual_waiting == 'true' &&
      needs.advance.outputs.virtual_requested == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Wait for exact semantic commit proof, then wake the gate event chain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_COMMIT: ${{ needs.advance.outputs.proof_commit }}
          BRANCH_REF: ${{ needs.advance.outputs.branch_ref }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            runs="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/aurum-virtual-lab.yml/runs?per_page=100")"
            run_id="$(printf '%s' "$runs" | jq -r --arg sha "$PROOF_COMMIT" \
              '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")][0].id // empty')"
            if [ -n "$run_id" ]; then
              artifact="Aurum-VirtualLab-Convergence-${PROOF_COMMIT}"
              artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
              artifact_id="$(printf '%s' "$artifacts" | jq -r --arg name "$artifact" \
                '[.artifacts[] | select(.name == $name and .expired == false)][0].id // empty')"
              if [ -n "$artifact_id" ]; then
                gh api --method POST \
                  "repos/${GITHUB_REPOSITORY}/actions/workflows/aurum-frontier.yml/dispatches" \
                  -f ref="$BRANCH_REF"
                echo "AURUM_GATE_WAKE verified_virtual_run=$run_id artifact_id=$artifact_id semantic_commit=$PROOF_COMMIT branch=$BRANCH_REF"
                exit 0
              fi
            fi
            sleep 30
          done
          echo "Exact-commit virtual convergence did not arrive before the bounded dependency wait ended: $PROOF_COMMIT" >&2
          exit 1
