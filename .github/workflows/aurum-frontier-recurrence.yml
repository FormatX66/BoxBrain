name: Aurum Frontier Recurrence

on:
  push:
    branches:
      - aurum/capacity-mesh-v0
    paths:
      - 'Projects/Codelation/autobuild/native_frontier_state.json'

permissions:
  contents: write

concurrency:
  group: aurum-frontier-recurrence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  continue-on-change:
    name: Continue changed Aurum frontier
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Check out converged branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: aurum/capacity-mesh-v0
          fetch-depth: 0
      - name: Materialize convergence identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          state = Path('Projects/Codelation/autobuild/native_frontier_state.json')
          marker = Path('Projects/Codelation/field/.aurum_frontier_recurrence')
          identity = hashlib.sha256(state.read_bytes()).hexdigest()
          marker.write_text(identity + '\n', encoding='utf-8')
          print('frontier_identity=' + identity)
          PY
      - name: Trigger the next parallel wave only for a new convergence identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'aurum-recurrence[bot]'
          git config user.email 'aurum-recurrence@users.noreply.github.com'
          git add Projects/Codelation/field/.aurum_frontier_recurrence
          if git diff --cached --quiet; then
            echo 'Convergence identity already launched; stopping naturally.'
            exit 0
          fi
          git commit -m 'Aurum continue changed frontier'
          git push origin HEAD:aurum/capacity-mesh-v0
