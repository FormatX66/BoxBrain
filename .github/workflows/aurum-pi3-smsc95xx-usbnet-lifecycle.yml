name: Aurum Pi3 smsc95xx USBNet Lifecycle Shadow

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aurum-pi3-smsc95xx-usbnet-lifecycle.yml'
      - 'Projects/AdaptiveKernel/pi3_smsc95xx_usbnet_lifecycle_model.py'
      - 'Projects/AdaptiveKernel/tests/test_pi3_smsc95xx_usbnet_lifecycle_model.py'
      - 'Projects/AdaptiveKernel/references/pi3_hardware/reference-manifest.json'
      - 'Projects/AdaptiveKernel/references/pi3_hardware/qpu-routing-model-32924126448.json'
      - 'Projects/AdaptiveKernel/results/pi3-smsc95xx-packet-transfer-differential-latest.json'

permissions:
  contents: write

concurrency:
  group: aurum-pi3-smsc95xx-usbnet-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-lifecycle-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact lifecycle revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Resolve and verify hash-pinned lifecycle sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lifecycle-evidence/reference lifecycle-evidence/results
          python - <<'PY' > lifecycle-evidence/reference/manifest.env
          import json
          from pathlib import Path

          manifest = json.loads(
              Path('Projects/AdaptiveKernel/references/pi3_hardware/reference-manifest.json').read_text()
          )
          wanted = {
              'raspberry-pi-linux-smsc95xx-c': ('RPI_SMSC_URL', 'RPI_SMSC_SHA'),
              'upstream-linux-v6.18-smsc95xx-c': ('UP_SMSC_URL', 'UP_SMSC_SHA'),
              'raspberry-pi-linux-usbnet-c': ('RPI_USBNET_URL', 'RPI_USBNET_SHA'),
              'upstream-linux-v6.18-usbnet-c': ('UP_USBNET_URL', 'UP_USBNET_SHA'),
          }
          found = {}
          for item in manifest['sources']:
              if item.get('id') in wanted:
                  url_name, sha_name = wanted[item['id']]
                  found[url_name] = item['url']
                  found[sha_name] = item['sha256']
          missing = [name for pair in wanted.values() for name in pair if name not in found]
          if missing:
              raise SystemExit('missing pinned lifecycle source metadata: ' + ','.join(missing))
          for key in (
              'RPI_SMSC_URL', 'RPI_SMSC_SHA', 'UP_SMSC_URL', 'UP_SMSC_SHA',
              'RPI_USBNET_URL', 'RPI_USBNET_SHA', 'UP_USBNET_URL', 'UP_USBNET_SHA',
          ):
              value = found[key]
              if "'" in value or '\n' in value:
                  raise SystemExit('unsafe manifest value')
              print(f"{key}='{value}'")
          PY
          source lifecycle-evidence/reference/manifest.env
          curl --fail --location --retry 3 --retry-delay 2 --output lifecycle-evidence/reference/rpi-smsc95xx.c "$RPI_SMSC_URL"
          curl --fail --location --retry 3 --retry-delay 2 --output lifecycle-evidence/reference/upstream-smsc95xx.c "$UP_SMSC_URL"
          curl --fail --location --retry 3 --retry-delay 2 --output lifecycle-evidence/reference/rpi-usbnet.c "$RPI_USBNET_URL"
          curl --fail --location --retry 3 --retry-delay 2 --output lifecycle-evidence/reference/upstream-usbnet.c "$UP_USBNET_URL"
          printf '%s  %s\n' "$RPI_SMSC_SHA" 'lifecycle-evidence/reference/rpi-smsc95xx.c' | sha256sum --check --strict
          printf '%s  %s\n' "$UP_SMSC_SHA" 'lifecycle-evidence/reference/upstream-smsc95xx.c' | sha256sum --check --strict
          printf '%s  %s\n' "$RPI_USBNET_SHA" 'lifecycle-evidence/reference/rpi-usbnet.c' | sha256sum --check --strict
          printf '%s  %s\n' "$UP_USBNET_SHA" 'lifecycle-evidence/reference/upstream-usbnet.c' | sha256sum --check --strict

      - name: Run fail-closed lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v Projects.AdaptiveKernel.tests.test_pi3_smsc95xx_usbnet_lifecycle_model

      - name: Explore complete lifecycle and fault graph
        shell: bash
        run: |
          set -euo pipefail
          python -m Projects.AdaptiveKernel.pi3_smsc95xx_usbnet_lifecycle_model \
            --packet-differential Projects/AdaptiveKernel/results/pi3-smsc95xx-packet-transfer-differential-latest.json \
            --qpu-router Projects/AdaptiveKernel/references/pi3_hardware/qpu-routing-model-32924126448.json \
            --manifest Projects/AdaptiveKernel/references/pi3_hardware/reference-manifest.json \
            --rpi-smsc95xx lifecycle-evidence/reference/rpi-smsc95xx.c \
            --upstream-smsc95xx lifecycle-evidence/reference/upstream-smsc95xx.c \
            --rpi-usbnet lifecycle-evidence/reference/rpi-usbnet.c \
            --upstream-usbnet lifecycle-evidence/reference/upstream-usbnet.c \
            --output lifecycle-evidence/results/usbnet-lifecycle-shadow.json

      - name: Verify zero-authority semantic receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from Projects.AdaptiveKernel.pi3_smsc95xx_usbnet_lifecycle_model import ACTIONS, _verify_sealed

          path = Path('lifecycle-evidence/results/usbnet-lifecycle-shadow.json')
          receipt = json.loads(path.read_text())
          if receipt.get('state') != 'verified-offline-usbnet-lifecycle-fault-model':
              raise SystemExit('lifecycle shadow did not reach the verified state')
          if not _verify_sealed(receipt):
              raise SystemExit('lifecycle shadow receipt seal failed')
          graph = receipt['graph']
          if graph['state_count'] < 10 or graph['transition_count'] != graph['state_count'] * len(ACTIONS):
              raise SystemExit('lifecycle graph coverage is incomplete')
          if graph['accepted_transition_count'] + graph['refused_transition_count'] != graph['transition_count']:
              raise SystemExit('lifecycle transition accounting is inconsistent')
          if not all(graph['invariants'].values()):
              raise SystemExit('lifecycle graph invariant failed')
          if receipt['source_verification']['rpi_upstream_semantic_token_mismatches'] != 0:
              raise SystemExit('Raspberry Pi and upstream lifecycle semantics diverged')
          if receipt['qpu']['used'] or receipt['qpu']['hardware_submission_performed']:
              raise SystemExit('finite lifecycle graph unexpectedly used QPU hardware')
          if receipt['invariants']['live_pi_contacted'] or receipt['invariants']['driver_binding_changed']:
              raise SystemExit('lifecycle shadow crossed its no-hardware boundary')
          if receipt['authority']['mutation_allowed'] or receipt['authority']['write_authority']:
              raise SystemExit('lifecycle shadow gained authority')
          summary = [
              '# Pi3 smsc95xx USBNet Lifecycle Shadow',
              '',
              f"- State: {receipt['state']}",
              f"- Reachable states: {graph['state_count']}",
              f"- Evaluated transitions: {graph['transition_count']}",
              '- Graph invariants: all passed',
              '- Raspberry Pi / upstream lifecycle tokens: matched',
              '- Live Pi / USB device contacted: false',
              '- QPU hardware used: false',
              '- Mutation or promotion authority: false',
              '',
              receipt['strongest_claim'],
          ]
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as handle:
              handle.write('\n'.join(summary) + '\n')
          PY

      - name: Publish sealed lifecycle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aurum-pi3-smsc95xx-usbnet-lifecycle-${{ github.run_id }}
          path: lifecycle-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Persist verified lifecycle lineage
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cp lifecycle-evidence/results/usbnet-lifecycle-shadow.json \
            Projects/AdaptiveKernel/results/pi3-smsc95xx-usbnet-lifecycle-shadow-latest.json
          git config user.name 'aurum-pi3-usbnet-lifecycle[bot]'
          git config user.email 'aurum-pi3-usbnet-lifecycle@users.noreply.github.com'
          git add Projects/AdaptiveKernel/results/pi3-smsc95xx-usbnet-lifecycle-shadow-latest.json
          if git diff --cached --quiet; then
            echo 'AURUM_PI3_SMSC95XX_USBNET_LIFECYCLE_RECEIPT unchanged=true'
            exit 0
          fi
          git commit -m 'Record Pi3 smsc95xx USBNet lifecycle shadow [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'AURUM_PI3_SMSC95XX_USBNET_LIFECYCLE_RECEIPT persisted=true'
