name: Aurum Hopper GUI and Input Test

on:
  workflow_dispatch:
  push:
    branches:
      - aurum/hopper-gui-input-test-20260821
    paths:
      - '.github/workflows/aurum-hopper-gui-input-test.yml'
      - 'Projects/AurumPC/**'
      - 'installer/prepare-hopper-gui-input-test.sh'

permissions:
  contents: read

concurrency:
  group: aurum-hopper-gui-input-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out Hopper test lane
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Keep combined kernel experiments out of this image
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only origin/aurum/trunk-v0.01...HEAD)
          if grep -Eiq '(^|/)(stateweave|adaptive[-_]kernel)(/|$)' <<<"$changed"; then
            echo "Combined StateWeave/adaptive-kernel content entered the standalone Hopper lane." >&2
            exit 1
          fi

      - name: Validate Hopper runtime and packaging contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            Projects/AurumPC/aurum_boot_screen.py \
            Projects/AurumPC/aurum_bootstrap.py \
            Projects/AurumPC/aurum_desktop.py \
            Projects/AurumPC/aurum_hopper_gui.py \
            Projects/AurumPC/aurum_input.py \
            Projects/AurumPC/aurum_runtime_update.py
          sh -n Projects/AurumPC/build-iso.sh
          sh -n installer/prepare-hopper-gui-input-test.sh
          python3 -m unittest discover -s Projects/AurumPC/tests -p 'test_*.py' -v

  build-image:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out Hopper test lane
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build guarded Hopper test image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:bookworm \
            sh -lc '
              set -eu
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                live-build debian-archive-keyring debootstrap \
                xorriso isolinux syslinux-common squashfs-tools \
                grub-pc-bin grub-efi-amd64-bin dosfstools mtools rsync
              sh Projects/AurumPC/build-iso.sh
            '
          sha256sum -c dist/Aurum-PC-v0.01-amd64.iso.sha256

      - name: Verify GUI, boot, and wake payloads in image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          xorriso -osirrox on -indev dist/Aurum-PC-v0.01-amd64.iso \
            -extract /live/filesystem.squashfs extracted/filesystem.squashfs
          unsquashfs -cat extracted/filesystem.squashfs /opt/aurum/aurum_boot_screen.py | grep -q 'aurum.boot-screen.v1'
          unsquashfs -cat extracted/filesystem.squashfs /opt/aurum/aurum_hopper_gui.py | grep -q 'data-hopper-profile'
          unsquashfs -cat extracted/filesystem.squashfs /opt/aurum/aurum_input.py | grep -q 'aurum.input.v2'
          unsquashfs -cat extracted/filesystem.squashfs /etc/systemd/system/aurum-input-bootstrap.service | grep -q -- '--apply-wake-policy'
          unsquashfs -cat extracted/filesystem.squashfs /etc/X11/xorg.conf.d/40-aurum-libinput.conf | grep -q 'MatchIsTouchpad'
          unsquashfs -cat extracted/filesystem.squashfs /usr/lib/systemd/system-sleep/aurum-input-wake | grep -q 'if.*post'

      - name: Publish Hopper test image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Aurum-Hopper-GUI-Input-Test-20260821
          path: |
            dist/Aurum-PC-v0.01-amd64.iso
            dist/Aurum-PC-v0.01-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 7
