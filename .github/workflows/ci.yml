name: BoxBrain CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Validation depth
        required: true
        default: quick
        type: choice
        options:
          - quick
          - full

permissions:
  contents: read

concurrency:
  group: boxbrain-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate repository structure and links
        run: python Admin/validate_repository.py
      - name: Test the repository validator
        run: python -m unittest Admin.tests.test_validate_repository

  codelation:
    name: Codelation tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Run Codelation seed suite
        run: python -m unittest discover -s Projects/Codelation/tests -v

  future-branch-projects:
    name: Future Branch project consumers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Test StateWeave branch records
        run: python -m unittest discover -s Projects/StateWeave/tests -v
      - name: Test Adaptive Kernel branch proposals and safety lanes
        run: |
          python -m unittest discover -s Projects/AdaptiveKernel/tests -v
          python -m unittest Projects.AdaptiveKernel.recovery.test_out_of_band_controller -v
          python -m unittest discover -s Projects/AdaptiveKernel/driver_candidates/tests -p 'test_*.py' -v
          python Projects/AdaptiveKernel/driver_candidates/verify_contract.py
      - name: Test combined StateWeave + kernel bridge
        run: python -m unittest discover -s Projects/StateWeaveKernel/tests -v
      - name: Test all Aurum Future Branch experiments
        run: |
          cd Projects/Aurum/Experiments
          python -m unittest discover -p 'test_*.py' -v
      - name: Test seed recovery branch manifest
        run: python -m unittest discover -s installer/tests -p 'test_future_branch_recovery.py' -v
      - name: Test Tiny Seed physical preflight states
        run: |
          cd Projects/Aurum/Germ
          python -m unittest test_physical_handoff_preflight -v

  aurum-windows-worker:
    name: Aurum Windows worker
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Parse Aurum PowerShell
        shell: pwsh
        run: |
          $paths = @(
            'Web/Aurum-Arkmatx/worker.ps1',
            'Aurum.ps1',
            'installer/deploy-aurum-live-to-pi.ps1',
            'installer/reconcile-existing-aurum-gold-seed-on-pi.ps1',
            'installer/invoke-aurum-via-bbpi4-ap.ps1',
            'installer/ask-aurum-on-pi.ps1'
          )
          foreach($path in $paths){
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell parse failed: $path"
            }
          }
      - name: Run deterministic carrier-discovery self-test
        shell: pwsh
        env:
          AURUM_WORKER_SELFTEST: "1"
        run: |
          $raw=& ./Web/Aurum-Arkmatx/worker.ps1
          $result=$raw | ConvertFrom-Json
          if(-not $result.ok){throw 'worker self-test did not return ok'}
          if($result.execution_scope -ne 'seed-routes-only'){throw "unsafe execution scope: $($result.execution_scope)"}
          foreach($port in @(22,80,443,5985,5986,3389)){if($result.probe_ports -notcontains $port){throw "missing probe port $port"}}
          if([int]$result.discovery_limit -gt 32){throw "discovery limit too broad: $($result.discovery_limit)"}

  aurum-farmer-v3:
    name: Aurum Farmer v3.2 and Chat Tree actuator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify reviewed host package and core behavior
        working-directory: Projects/Aurum/Core/Farmer-v3
        run: |
          sha256sum --check SHA256SUMS
          python -m unittest -v test_aurum_farmer_core.py
          node --test ChatGPT-Actuator-v1/tests/farmer-actuator.test.mjs
      - name: Verify Node Chat Tree actuator integration
        working-directory: Projects/Aurum/ChatTreePlugin
        run: |
          npm test
          npm run check
      - name: Verify canonical Python MCP integration
        working-directory: Projects/Aurum/ChatTreeMCP
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m unittest -v test_server.py

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: controller
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: controller/pyproject.toml
      - name: Install controller
        run: python -m pip install -e ../Projects/AurumFarmer -e ".[dev]"
      - name: Run backend suite
        run: python -m pytest -q
      - name: Run Kali Pi edge-agent suite
        working-directory: edge/kali-pi-agent
        run: python -m unittest discover -s tests -v

  flutter:
    name: Flutter checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Run widget tests
        run: flutter test --no-pub
      - name: Build web
        if: inputs.mode == 'full'
        run: >-
          flutter build web --release --no-pub
          --dart-define=BOXBRAIN_API_URL=http://127.0.0.1:8000
