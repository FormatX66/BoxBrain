name: BoxBrain CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Validation depth
        required: true
        default: quick
        type: choice
        options:
          - quick
          - full

permissions:
  contents: read

concurrency:
  group: boxbrain-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate repository structure and links
        run: python Admin/validate_repository.py
      - name: Test the repository validator
        run: python -m unittest Admin.tests.test_validate_repository

  codelation:
    name: Codelation tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Run Codelation seed suite
        run: python -m unittest discover -s Projects/Codelation/tests -v

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: controller
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: controller/pyproject.toml
      - name: Install controller
        run: python -m pip install -e ".[dev]"
      - name: Run backend suite
        run: python -m pytest -q
      - name: Run Kali Pi edge-agent suite
        working-directory: edge/kali-pi-agent
        run: python -m unittest discover -s tests -v

  flutter:
    name: Flutter checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4fa41551a30e30af803 # v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Run widget tests
        run: flutter test --no-pub
      - name: Build web
        if: inputs.mode == 'full'
        run: >-
          flutter build web --release --no-pub
          --dart-define=BOXBRAIN_API_URL=http://127.0.0.1:8000
