name: Aurum BBPI4 Driver Build Channel

on:
  workflow_dispatch:
  push:
    branches:
      - aurum/trunk-v0.01
    paths:
      - '.github/workflows/aurum-bbpi4-driver-native.yml'
      - 'installer/run-bbpi4-driver-frontier.ps1'
      - 'installer/run-bbpi4-driver-frontier-extended.ps1'
      - 'installer/aurum-pi4-driver-gen11-extension.ps1'
      - 'installer/run-bbpi4-single-driver-trial.ps1'
      - 'Projects/Codelation/driver_evidence/pi4_driver_frontier.json'
      - 'Projects/Codelation/pi4_driver_synthesizer.py'
      - 'Projects/Codelation/run_pi4_single_driver_trial.sh'

permissions:
  contents: read

concurrency:
  group: aurum-bbpi4-driver-build-channel
  cancel-in-progress: false

jobs:
  git-controlled-driver-frontier:
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 18
    steps:
      - name: Check out Aurum trunk
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: aurum/trunk-v0.01
          fetch-depth: 1

      - name: Execute Git-controlled Pi4 driver frontier
        shell: powershell
        run: |
          .\installer\run-bbpi4-driver-frontier-extended.ps1 -OutputDirectory evidence -RunTag '${{ github.run_id }}'

      - name: Publish driver build-channel evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aurum-bbpi4-driver-frontier-${{ github.run_id }}
          path: evidence/**
          if-no-files-found: warn
          retention-days: 7
