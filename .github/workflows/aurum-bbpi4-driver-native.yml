name: Aurum BBPI4 Single Driver Trial

on:
  workflow_dispatch:
  push:
    branches:
      - aurum/trunk-v0.01
    paths:
      - '.github/workflows/aurum-bbpi4-driver-native.yml'
      - 'installer/run-bbpi4-single-driver-trial.ps1'
      - 'Projects/Codelation/pi4_driver_synthesizer.py'
      - 'Projects/Codelation/run_pi4_single_driver_trial.sh'

permissions:
  contents: read

concurrency:
  group: aurum-bbpi4-single-driver
  cancel-in-progress: false

jobs:
  gpio-leds-generation-1:
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 18
    steps:
      - name: Check out Aurum trunk
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: aurum/trunk-v0.01
          fetch-depth: 1

      - name: Back up, synthesize, bind, and restore one Pi4 driver
        shell: powershell
        run: |
          .\installer\run-bbpi4-single-driver-trial.ps1 -OutputDirectory evidence -RunTag '${{ github.run_id }}'

      - name: Publish trial log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aurum-bbpi4-single-driver-${{ github.run_id }}
          path: evidence/**
          if-no-files-found: warn
          retention-days: 7
