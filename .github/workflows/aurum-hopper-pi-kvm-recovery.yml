name: Aurum Hopper Pi KVM Recovery

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type OPEN_HOPPER_KVM_CONSOLE to authorize physical HID interaction with Hopper'
        required: true
        type: string

permissions:
  contents: read

jobs:
  physical-boundary:
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce explicit physical boundary
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != 'OPEN_HOPPER_KVM_CONSOLE' ]; then
            echo 'AURUM_HOPPER_PI_KVM_REFUSED reason=explicit-physical-authorization-required'
            exit 1
          fi
          echo 'AURUM_HOPPER_PI_KVM_BOUNDARY_CONFIRMED'
          echo 'The prior auto-triggered HID implementation has been removed. A future authorized implementation must re-prove the BoxBrain Pi path and preserve this explicit physical boundary before sending any HID input.'
