name: Aurum Pi3 Strict Identity Continuity Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'Projects/Aurum/Experiments/pi3-identity-request.json'
      - '.github/workflows/aurum-pi3-identity-continuity.yml'

permissions:
  contents: write

concurrency:
  group: aurum-pi3-identity-continuity
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: [self-hosted, Windows, X64, aurum-elevated]
    timeout-minutes: 10
    steps:
      - name: Check out current control plane
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Reconcile passive USB endpoint to an already-trusted Pi3 alias
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $aliases = @('aurum-pi3.local', 'aurum-pi3', 'raspberrypi.local', 'raspberrypi')
          $ssh = Get-Command ssh -ErrorAction SilentlyContinue
          if (-not $ssh) { throw 'OpenSSH client is required for strict identity continuity proof.' }

          $remoteScript = @'
          model="$(tr -d '\000' </proc/device-tree/model 2>/dev/null || true)"
          arch="$(uname -m 2>/dev/null || true)"
          kernel="$(uname -r 2>/dev/null || true)"
          cores="$(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc 2>/dev/null || echo 0)"
          ram_kb="$(awk '/^MemTotal:/ {print $2; exit}' /proc/meminfo 2>/dev/null || echo 0)"
          boot_id="$(cat /proc/sys/kernel/random/boot_id 2>/dev/null || true)"
          interfaces="$(ls -1 /sys/class/net 2>/dev/null | sort | paste -sd, -)"
          printf '%s\n' "$model" "$arch" "$kernel" "$cores" "$ram_kb" "$boot_id" "$interfaces"
          '@
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($remoteScript))
          $remoteCommand = "printf '%s' '$encoded' | base64 -d | sh"

          $candidates = @()
          $adapters = @(
            Get-NetAdapter -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Status -ne 'Disabled' -and (
                  $_.Name -match '(?i)(usb|rndis|gadget|raspberry|cdc)' -or
                  $_.InterfaceDescription -match '(?i)(usb|rndis|gadget|raspberry|cdc)'
                )
              }
          )
          foreach ($adapter in $adapters) {
            $neighbors = @(
              Get-NetNeighbor -InterfaceIndex $adapter.ifIndex -AddressFamily IPv4 -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.State -notin @('Unreachable', 'Incomplete') -and
                  $_.IPAddress -and
                  $_.IPAddress -notmatch '^(0\.0\.0\.0|169\.254\.255\.255|224\.|239\.|255\.)'
                }
            )
            foreach ($neighbor in $neighbors) {
              $endpoint = [string]$neighbor.IPAddress
              if (-not $endpoint) { continue }
              $reachable = $false
              try {
                $reachable = [bool](Test-NetConnection -ComputerName $endpoint -Port 22 -InformationLevel Quiet -WarningAction SilentlyContinue)
              } catch { $reachable = $false }
              if (-not $reachable) { continue }

              $hasher = [Security.Cryptography.SHA256]::Create()
              try {
                $bytes = [Text.Encoding]::UTF8.GetBytes($endpoint)
                $digest = ([BitConverter]::ToString($hasher.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
              } finally { $hasher.Dispose() }
              $label = "usb-neighbor:$($digest.Substring(0,12))"
              if (-not ($candidates | Where-Object { $_.endpoint -eq $endpoint })) {
                $candidates += [pscustomobject]@{ endpoint = $endpoint; label = $label }
              }
            }
          }

          $attempts = @()
          $receipt = $null
          foreach ($candidate in $candidates) {
            foreach ($alias in $aliases) {
              $previousPreference = $ErrorActionPreference
              $ErrorActionPreference = 'Continue'
              $lines = @()
              $exitCode = 255
              try {
                # Destination remains the historical alias so its saved User/key config is reused.
                # HostName points transport at the passive USB endpoint; HostKeyAlias forces
                # strict verification against the already-trusted alias key. Nothing is added
                # to known_hosts and trust is never weakened.
                $lines = @(& $ssh.Source -o BatchMode=yes -o ConnectTimeout=5 -o ConnectionAttempts=1 -o "HostName=$($candidate.endpoint)" -o "HostKeyAlias=$alias" $alias $remoteCommand 2>$null)
                $exitCode = $LASTEXITCODE
              } catch {
                $lines = @()
                if ($null -ne $LASTEXITCODE) { $exitCode = $LASTEXITCODE }
              } finally {
                $ErrorActionPreference = $previousPreference
              }

              $attempt = [ordered]@{
                endpoint_label = [string]$candidate.label
                trusted_alias = $alias
                strict_ssh_exit = $exitCode
                strict_identity_verified = $false
                pi3_model_match = $false
              }
              if ($exitCode -eq 0 -and $lines.Count -ge 7) {
                $attempt.strict_identity_verified = $true
                $model = [string]$lines[0]
                $attempt.pi3_model_match = $model.Contains('Raspberry Pi 3')
                if ($attempt.pi3_model_match) {
                  $cores = 0
                  [void][int]::TryParse(([string]$lines[3]).Trim(), [ref]$cores)
                  $ramKb = 0L
                  [void][long]::TryParse(([string]$lines[4]).Trim(), [ref]$ramKb)
                  $receipt = [ordered]@{
                    schema = 'aurum-pi3-physical-receipt-v1'
                    captured_at = [DateTime]::UtcNow.ToString('o')
                    hostname = $alias
                    discovery_source = 'passive-usb-neighbor-plus-trusted-alias-continuity'
                    endpoint_label = [string]$candidate.label
                    identity_verification = 'strict-ssh-existing-alias-host-key-and-auth'
                    model = $model
                    arch = ([string]$lines[1]).Trim().ToLowerInvariant()
                    kernel = [string]$lines[2]
                    cores = $cores
                    ram_mb = [int]([math]::Floor($ramKb / 1024.0))
                    boot_id = ([string]$lines[5]).Trim()
                    interfaces = @(([string]$lines[6]).Split(',') | Where-Object { $_ })
                  }
                  $attempts += $attempt
                  break
                }
              }
              $attempts += $attempt
            }
            if ($receipt) { break }
          }

          $requestId = $null
          if (Test-Path 'Projects/Aurum/Experiments/pi3-identity-request.json') {
            try { $requestId = [string]((Get-Content 'Projects/Aurum/Experiments/pi3-identity-request.json' -Raw | ConvertFrom-Json).request_id) } catch {}
          }
          $result = [ordered]@{
            schema = 'aurum-pi3-identity-continuity-result-v1'
            observed_at_utc = [DateTime]::UtcNow.ToString('o')
            runner_name = $env:RUNNER_NAME
            request_id = $requestId
            state = if ($receipt) { 'PHYSICAL_RECEIPT_CAPTURED' } elseif ($candidates.Count -gt 0) { 'REACHABLE_BUT_NO_TRUST_CONTINUITY' } else { 'NO_REACHABLE_PASSIVE_USB_ENDPOINT' }
            active_network_scan = $false
            persistent_trust_changed = $false
            mutation_allowed = $false
            promotion_allowed = $false
            write_authority = $false
            candidate_count = $candidates.Count
            attempts = $attempts
            receipt = $receipt
          }
          New-Item -ItemType Directory -Force -Path 'Projects/Aurum/Experiments' | Out-Null
          $result | ConvertTo-Json -Depth 10 | Set-Content 'Projects/Aurum/Experiments/latest-pi3-identity-continuity.json' -Encoding utf8
          Write-Host "AURUM_PI3_IDENTITY_CONTINUITY state=$($result.state) candidates=$($candidates.Count) persistent_trust_changed=false write_authority=false"

      - name: Persist identity-continuity evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'aurum-pi3-identity[bot]'
          git config user.email 'aurum-pi3-identity@users.noreply.github.com'
          git add Projects/Aurum/Experiments/latest-pi3-identity-continuity.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'AURUM_PI3_IDENTITY_RECEIPT unchanged=true'; exit 0 }
          if ($LASTEXITCODE -ne 1) { throw 'Failed to compare staged Pi3 identity evidence.' }
          git commit -m 'Record Pi3 strict identity continuity [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          Write-Host 'AURUM_PI3_IDENTITY_RECEIPT persisted=true'
