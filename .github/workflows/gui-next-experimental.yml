name: GUI Next Experimental

on:
  push:
    branches:
      - aurum/gui-next-experimental
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run GUI projection tests
        run: python -m unittest discover -s gui_experiment -p 'test_*.py' -v
