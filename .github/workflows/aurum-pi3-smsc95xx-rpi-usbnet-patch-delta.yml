name: Aurum Pi3 Raspberry Pi USBNet Patch Delta

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aurum-pi3-smsc95xx-rpi-usbnet-patch-delta.yml'
      - 'Projects/AdaptiveKernel/pi3_smsc95xx_rpi_usbnet_patch_delta.py'
      - 'Projects/AdaptiveKernel/tests/test_pi3_smsc95xx_rpi_usbnet_patch_delta.py'
      - 'Projects/AdaptiveKernel/references/pi3_hardware/rpi-usbnet-patch-delta-manifest.json'
      - 'Projects/AdaptiveKernel/results/pi3-smsc95xx-linux-usbnet-urb-reference-latest.json'
      - 'Projects/AdaptiveKernel/results/pi3-source-equivalence-latest.json'

permissions:
  contents: write

concurrency:
  group: aurum-pi3-rpi-usbnet-patch-delta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact experiment revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Stage Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Run fail-closed unit tests
        shell: bash
        env:
          PYTHONPATH: Projects/AdaptiveKernel
        run: |
          set -euo pipefail
          python -m unittest -v Projects/AdaptiveKernel/tests/test_pi3_smsc95xx_rpi_usbnet_patch_delta.py

      - name: Verify Raspberry Pi commit and fetch immutable source pairs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence='pi3-rpi-usbnet-patch-delta'
          mkdir -p "$evidence/rpi" "$evidence/stable"
          manifest='Projects/AdaptiveKernel/references/pi3_hardware/rpi-usbnet-patch-delta-manifest.json'

          python - "$manifest" "$evidence/refs.env" <<'PY'
          import json, shlex, sys
          value = json.load(open(sys.argv[1], encoding='utf-8'))
          rpi = value['raspberry_pi']
          stable = value['signed_stable']
          fields = {
              'RPI_COMMIT': rpi['commit'],
              'STABLE_COMMIT': stable['commit'],
              'RPI_USBNET_SHA': value['files'][0]['raspberry_pi_sha256'],
              'STABLE_USBNET_SHA': value['files'][0]['signed_stable_sha256'],
              'RPI_URB_SHA': value['files'][1]['raspberry_pi_sha256'],
              'STABLE_URB_SHA': value['files'][1]['signed_stable_sha256'],
          }
          with open(sys.argv[2], 'w', encoding='utf-8') as out:
              for key, item in fields.items():
                  out.write(f'{key}={shlex.quote(item)}\n')
          PY
          source "$evidence/refs.env"

          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/raspberrypi/linux/commits/$RPI_COMMIT" \
            > "$evidence/rpi-commit-api.json"
          python - "$manifest" "$evidence/rpi-commit-api.json" "$evidence/rpi-commit-verification.json" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1], encoding='utf-8'))
          source = json.load(open(sys.argv[2], encoding='utf-8'))
          expected = manifest['raspberry_pi']
          actual_parents = [item.get('sha') for item in source.get('parents', [])]
          actual_message = (source.get('commit') or {}).get('message')
          if source.get('sha') != expected['commit']:
              raise SystemExit('Raspberry Pi commit API object changed')
          if actual_message != expected['expected_commit_message']:
              raise SystemExit('Raspberry Pi commit message changed')
          if actual_parents != expected['parents']:
              raise SystemExit('Raspberry Pi commit parent set/order changed')
          result = {
              'schema': 'aurum.raspberry-pi-linux-commit-verification.v1',
              'repository': expected['repository'],
              'commit': expected['commit'],
              'message': actual_message,
              'parents': actual_parents,
              'api_object_present': True,
          }
          with open(sys.argv[3], 'w', encoding='utf-8') as out:
              json.dump(result, out, indent=2, sort_keys=True)
              out.write('\n')
          PY

          rpi_raw="https://raw.githubusercontent.com/raspberrypi/linux/$RPI_COMMIT"
          stable_raw="https://raw.githubusercontent.com/gregkh/linux/$STABLE_COMMIT"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$evidence/rpi/usbnet.c" "$rpi_raw/drivers/net/usb/usbnet.c"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$evidence/rpi/urb.c" "$rpi_raw/drivers/usb/core/urb.c"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$evidence/stable/usbnet.c" "$stable_raw/drivers/net/usb/usbnet.c"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$evidence/stable/urb.c" "$stable_raw/drivers/usb/core/urb.c"
          printf '%s  %s\n' "$RPI_USBNET_SHA" "$evidence/rpi/usbnet.c" \
            "$RPI_URB_SHA" "$evidence/rpi/urb.c" \
            "$STABLE_USBNET_SHA" "$evidence/stable/usbnet.c" \
            "$STABLE_URB_SHA" "$evidence/stable/urb.c" | sha256sum --check --strict

      - name: Produce sealed zero-authority patch-delta receipt
        shell: bash
        run: |
          set -euo pipefail
          evidence='pi3-rpi-usbnet-patch-delta'
          python Projects/AdaptiveKernel/pi3_smsc95xx_rpi_usbnet_patch_delta.py \
            --reference-receipt Projects/AdaptiveKernel/results/pi3-smsc95xx-linux-usbnet-urb-reference-latest.json \
            --source-equivalence Projects/AdaptiveKernel/results/pi3-source-equivalence-latest.json \
            --manifest Projects/AdaptiveKernel/references/pi3_hardware/rpi-usbnet-patch-delta-manifest.json \
            --rpi-commit-verification "$evidence/rpi-commit-verification.json" \
            --rpi-usbnet-source "$evidence/rpi/usbnet.c" \
            --rpi-urb-source "$evidence/rpi/urb.c" \
            --stable-usbnet-source "$evidence/stable/usbnet.c" \
            --stable-urb-source "$evidence/stable/urb.c" \
            --output "$evidence/receipt.json"
          python - "$evidence/receipt.json" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding='utf-8'))
          if value.get('state') != 'raspberry-pi-usbnet-urb-no-patch-delta':
              raise SystemExit('Raspberry Pi USBNet/URB patch delta did not pass')
          if value.get('mismatch_count') != 0:
              raise SystemExit('Raspberry Pi USBNet/URB patch delta contains mismatches')
          if value.get('running_source_package_to_rpi_git_commit_binding_proven') is not False:
              raise SystemExit('receipt overclaims source-package-to-git binding')
          if any(v is not False for v in (value.get('authority') or {}).values()):
              raise SystemExit('patch-delta receipt unexpectedly grants authority')
          if any(v is not False for v in (value.get('invariants') or {}).values()):
              raise SystemExit('patch-delta zero-authority invariant failed')
          comparisons = value.get('comparisons') or {}
          if len(comparisons) != 2 or not all(item.get('byte_identical') is True for item in comparisons.values()):
              raise SystemExit('both exact source files must be byte-identical')
          print(
              'AURUM_PI3_RPI_USBNET_PATCH_DELTA '
              f"state={value['state']} mismatches=0 receipt_sha256={value['receipt_sha256']} "
              'source_package_git_binding=false write_authority=false'
          )
          PY

      - name: Publish sealed patch-delta evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aurum-pi3-rpi-usbnet-patch-delta
          path: |
            pi3-rpi-usbnet-patch-delta/rpi-commit-verification.json
            pi3-rpi-usbnet-patch-delta/receipt.json
            Projects/AdaptiveKernel/references/pi3_hardware/rpi-usbnet-patch-delta-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Persist patch-delta receipt into durable lineage
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Projects/AdaptiveKernel/results
          cp pi3-rpi-usbnet-patch-delta/receipt.json \
            Projects/AdaptiveKernel/results/pi3-smsc95xx-rpi-usbnet-patch-delta-latest.json
          git config user.name 'aurum-pi3-rpi-patch-delta[bot]'
          git config user.email 'aurum-pi3-rpi-patch-delta@users.noreply.github.com'
          git add Projects/AdaptiveKernel/results/pi3-smsc95xx-rpi-usbnet-patch-delta-latest.json
          if git diff --cached --quiet; then
            echo 'AURUM_PI3_RPI_PATCH_DELTA_RECEIPT unchanged=true'
            exit 0
          fi
          git commit -m 'Record Pi3 Raspberry Pi USBNet patch delta [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo 'AURUM_PI3_RPI_PATCH_DELTA_RECEIPT persisted=true'
